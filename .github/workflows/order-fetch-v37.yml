name: Single order fetch V37
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/order-fetch-v37.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply single-order fetch
        run: python .github/scripts/order-fetch-v37.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('test/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'mobile-v37' in html
          assert 'const firebaseOrderUrl = (orderId)' in html
          assert 'firebaseOrdersUrl.replace("orders.json"' not in html
          assert 'fetch(`${firebaseOrderUrl(safeOrderId)}?ts=${Date.now()}`' in html
          # Whole /orders endpoint may remain for POSTing a new order, but it must not be used as a GET.
          assert not re.search(r'fetch\(firebaseOrdersUrl\s*,\s*\{\s*(?!method:\s*["\']POST)', html)
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html
          git commit -m "Use explicit single-order endpoint for status polling"
          git push
