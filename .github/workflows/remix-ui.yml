body.kol-customer .category-tab,body.kol-customer .search-tab{height:35px!important;border:1px solid #e2e5e8!important;border-radius:8px!important;background:#fff!important;color:#5c6570!important;font-size:11px!important;font-weight:650!important;box-shadow:none!important}
body.kol-customer .category-tab.active{background:var(--remix-orange)!important;border-color:var(--remix-orange)!important;color:white!important}
body.kol-customer #menuShell.menu-shell{background:#f5f6f7!important}
