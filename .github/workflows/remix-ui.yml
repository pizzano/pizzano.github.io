body:not(.kol-customer) .editor-card-body{padding:10px!important}
body:not(.kol-customer) .editor-card[data-section="choices"],body:not(.kol-customer) .admin-section-card[data-section="choices"]{border-color:#efc3aa!important;background:#fffaf7!important}
body:not(.kol-customer) .editor-card[data-section="choices"] .editor-card-head,body:not(.kol-customer) .admin-section-card[data-section="choices"] .editor-card-head{background:#fff2e9!important;border-bottom-color:#f2d0bd!important}
body:not(.kol-customer) .field input,body:not(.kol-customer) .field textarea,body:not(.kol-customer) .size-row input,body:not(.kol-customer) .choice-row input{border:1px solid var(--remix-line2)!important;border-radius:8px!important;background:#fff!important;box-shadow:none!important}
body:not(.kol-customer) .field input:focus,body:not(.kol-customer) .field textarea:focus,body:not(.kol-customer) .size-row input:focus,body:not(.kol-customer) .choice-row input:focus{outline:0!important;border-color:#e79b6c!important;box-shadow:0 0 0 3px rgba(232,98,15,.08)!important}
body:not(.kol-customer) .product-section-nav{background:linear-gradient(#f7f8f9 82%,rgba(247,248,249,0))!important;padding:6px 1px 8px!important;gap:5px!important}
body:not(.kol-customer) .product-section-nav button{height:29px!important;border:1px solid #d9dde1!important;border-radius:999px!important;background:#fff!important;color:#68717b!important;font-size:9px!important;padding:0 9px!important}
body:not(.kol-customer) .product-section-nav button.active{background:var(--remix-orange)!important;border-color:var(--remix-orange)!important;color:#fff!important;font-weight:700!important}
body:not(.kol-customer) .attached-group{border:1px solid #ead9cf!important;border-radius:9px!important;background:#fff!important}
body:not(.kol-customer) .choice-preview-option{background:#fbfbfc!important;border-color:#e5e7e9!important}
body:not(.kol-customer) .choice-preview-option.default{background:#fff7f1!important;border-color:#eab28f!important}
body:not(.kol-customer) .library-card{background:#fff!important;border:1px solid var(--remix-line)!important;border-radius:10px!important;box-shadow:var(--remix-shadow)!important;padding:12px!important}
body:not(.kol-customer) .modal-card{border-radius:12px!important;border:1px solid var(--remix-line)!important;box-shadow:0 18px 60px rgba(20,24,30,.24)!important}

/* ---------- CUSTOMER REMIX ---------- */
body.kol-customer{background:#f5f6f7!important;color:#202428!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important}
body.kol-customer .customer-app{background:#f5f6f7!important}
body.kol-customer .appbar{background:#fff!important;box-shadow:0 1px 0 #e6e8ea!important}
body.kol-customer .appbar-main{height:58px!important;background:#fff!important;padding:0 10px!important}
body.kol-customer .brand-logo b{font-size:22px!important;letter-spacing:-.04em!important;color:#202428!important}
body.kol-customer .brand-logo small{font-size:7px!important;color:#7e8790!important}
body.kol-customer .icon-button{width:37px!important;height:37px!important;border:1px solid #e3e6e9!important;border-radius:9px!important;background:#fff!important;color:#4f5861!important}
body.kol-customer .cart-toggle #cartCount{background:var(--remix-orange)!important;color:white!important}
body.kol-customer .category-tabs-wrap{height:49px!important;flex-basis:49px!important;background:#fff!important;border-bottom:1px solid #e7e9eb!important;box-shadow:none!important}
