name: Apply KOL remix UI
on:
  push:
    paths:
      - '.github/workflows/remix-ui.yml'
permissions:
  contents: write
jobs:
  remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply remix visual layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('demo/kol.css')
          css=p.read_text(encoding='utf-8')
          start='/* ===== KOL ATOMS REMIX 2026-08-25 ===== */'
          if start in css:
              css=css.split(start)[0].rstrip()+'\n'
          remix=r'''
/* ===== KOL ATOMS REMIX 2026-08-25 ===== */
:root{
  --remix-bg:#f4f5f6;--remix-surface:#fff;--remix-ink:#1d2024;--remix-muted:#69727d;
  --remix-line:#e2e5e8;--remix-line2:#d2d6db;--remix-orange:#e8620f;--remix-orange2:#c94f06;
  --remix-orange-soft:#fdf0e7;--remix-green:#1f8a4c;--remix-green-soft:#e8f6ec;
  --remix-sidebar:#20252a;--remix-shadow:0 2px 8px rgba(24,30,38,.07);--remix-r:10px;
}

/* ---------- ADMIN REMIX ---------- */
body:not(.kol-customer){background:var(--remix-bg)!important;color:var(--remix-ink)!important;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif!important}
body:not(.kol-customer) .app{grid-template-columns:230px minmax(0,1fr) 410px!important;background:var(--remix-bg)!important}
body:not(.kol-customer) .sidebar{background:var(--remix-sidebar)!important;color:#e8ebef!important;border-right:0!important;padding:14px 12px!important}
body:not(.kol-customer) .brand{padding:3px 5px 15px!important;margin-bottom:12px!important;border-bottom:1px solid rgba(255,255,255,.09)!important;gap:10px!important}
body:not(.kol-customer) .brand-mark{width:34px!important;height:34px!important;border-radius:9px!important;background:var(--remix-orange)!important;color:white!important;box-shadow:none!important;font-size:14px!important}
body:not(.kol-customer) .brand strong{color:#fff!important;font-size:14px!important;letter-spacing:.01em!important}
body:not(.kol-customer) .brand small{color:#9ba4ae!important;font-size:10px!important;text-transform:uppercase!important;letter-spacing:.05em!important}
body:not(.kol-customer) .nav-title{color:#7f8994!important;font-size:10px!important;font-weight:700!important;letter-spacing:.08em!important;margin:0 8px 6px!important}
body:not(.kol-customer) .nav-btn{min-height:42px!important;border-radius:8px!important;padding:9px 10px!important;margin:2px 0!important;color:#c8ced5!important;background:transparent!important;font-size:13px!important;font-weight:550!important;text-align:left!important}
body:not(.kol-customer) .nav-btn:hover{background:rgba(255,255,255,.07)!important;color:white!important}
body:not(.kol-customer) .nav-btn.active{background:var(--remix-orange)!important;color:#fff!important;box-shadow:none!important}
body:not(.kol-customer) .nav-note{margin-top:auto!important;color:#8d97a2!important;border-top:1px solid rgba(255,255,255,.09)!important;border-radius:0!important;background:transparent!important;padding:13px 5px 0!important;font-size:10.5px!important;line-height:1.45!important}
body:not(.kol-customer) .workspace{background:var(--remix-bg)!important}
body:not(.kol-customer) .topbar{height:62px!important;background:#fff!important;border-bottom:1px solid var(--remix-line)!important;padding:0 18px!important;box-shadow:none!important}
body:not(.kol-customer) .preview{height:38px!important;border:0!important;border-radius:8px!important;background:#2e9c61!important;color:#fff!important;font-size:12.5px!important;font-weight:700!important;padding:0 14px!important}
body:not(.kol-customer) .save{height:38px!important;border-radius:8px!important;background:var(--remix-orange)!important;color:white!important;border:0!important;padding:0 14px!important;font-weight:700!important}
body:not(.kol-customer) .save:disabled{opacity:.45!important}
body:not(.kol-customer) .save-state{font-size:11px!important;color:#7e8790!important;background:transparent!important;padding:0!important}
body:not(.kol-customer) .content{padding:20px 18px 30px!important;max-width:none!important;background:var(--remix-bg)!important}
body:not(.kol-customer) .page-head{margin:0 0 14px!important;align-items:center!important}
body:not(.kol-customer) .page-head h1{font-size:22px!important;letter-spacing:-.025em!important;color:#1d2024!important;margin:0 0 2px!important}
body:not(.kol-customer) .page-head p{font-size:11.5px!important;color:#79828c!important;margin:0!important}
body:not(.kol-customer) .tools{gap:7px!important;align-items:center!important}
body:not(.kol-customer) .search{height:38px!important;min-width:230px!important;border:1px solid var(--remix-line2)!important;border-radius:8px!important;background:#fff!important;padding:0 11px!important;font-size:12px!important;box-shadow:none!important}
body:not(.kol-customer) .ghost,body:not(.kol-customer) .add-category,body:not(.kol-customer) .add-item{height:36px!important;border:1px solid var(--remix-line2)!important;border-radius:8px!important;background:#fff!important;color:#4f5862!important;font-size:11.5px!important;font-weight:650!important;box-shadow:none!important}
body:not(.kol-customer) .ghost:hover,body:not(.kol-customer) .add-category:hover,body:not(.kol-customer) .add-item:hover{border-color:#e7a57d!important;background:#fff8f3!important;color:#bf520f!important}
body:not(.kol-customer) #menuRoot{padding-right:3px!important}
body:not(.kol-customer) .category{margin:0 0 9px!important;border:0!important;background:transparent!important;box-shadow:none!important}
body:not(.kol-customer) .category-head{min-height:70px!important;background:#fff!important;border:1px solid var(--remix-line)!important;border-radius:10px!important;box-shadow:var(--remix-shadow)!important;padding:9px 11px!important;gap:10px!important}
body:not(.kol-customer) .category-head:hover{border-color:#cdd2d7!important}
body:not(.kol-customer) .cat-image{width:50px!important;height:50px!important;border-radius:8px!important;background-color:#eef0f2!important}
body:not(.kol-customer) .cat-copy strong{font-size:13px!important;color:#22262a!important}
body:not(.kol-customer) .cat-copy small{font-size:10.5px!important;color:#7e8791!important;margin-top:2px!important}
body:not(.kol-customer) .count{background:#f2f4f5!important;color:#707984!important;border:0!important;border-radius:999px!important;font-size:9px!important;padding:4px 8px!important}
body:not(.kol-customer) .category-body{padding:7px 0 1px 22px!important}
body:not(.kol-customer) .item{min-height:66px!important;margin:0 0 6px!important;padding:7px 9px!important;border:1px solid var(--remix-line)!important;border-radius:9px!important;background:#fff!important;box-shadow:0 1px 3px rgba(24,30,38,.045)!important;gap:8px!important}
body:not(.kol-customer) .item:hover{border-color:#cfd4d9!important;box-shadow:0 2px 7px rgba(24,30,38,.07)!important}
body:not(.kol-customer) .item-img{width:48px!important;height:48px!important;border-radius:7px!important;background-color:#eef0f2!important}
body:not(.kol-customer) .item-copy strong{font-size:12.5px!important;color:#25292d!important}
body:not(.kol-customer) .item-copy small{font-size:10px!important;color:#828a93!important;line-height:1.3!important}
body:not(.kol-customer) .badges{gap:4px!important;margin-bottom:2px!important}
body:not(.kol-customer) .badge{font-size:8px!important;padding:2px 5px!important;border-radius:999px!important;font-weight:700!important}
body:not(.kol-customer) .badge.green{background:var(--remix-green-soft)!important;color:#25764a!important}
body:not(.kol-customer) .badge.orange{background:var(--remix-orange-soft)!important;color:#bd510e!important}
body:not(.kol-customer) .item-price{font-size:11px!important;color:#3c434a!important;font-weight:700!important}
body:not(.kol-customer) .mini-action{height:31px!important;border-radius:7px!important;border:1px solid #efb38e!important;background:#fff7f1!important;color:#c4520d!important;font-size:10px!important;font-weight:700!important;padding:0 9px!important}
body:not(.kol-customer) .icon-btn{width:31px!important;height:31px!important;border-radius:7px!important;border:1px solid var(--remix-line)!important;background:#fff!important;color:#68717a!important}
body:not(.kol-customer) .editor{background:#fff!important;border-left:1px solid var(--remix-line)!important;box-shadow:-5px 0 18px rgba(20,24,30,.04)!important}
body:not(.kol-customer) .editor-head{height:62px!important;border-bottom:1px solid var(--remix-line)!important;background:#fff!important;padding:0 14px!important}
body:not(.kol-customer) .editor-head small{font-size:9px!important;color:#929aa3!important;letter-spacing:.07em!important}
body:not(.kol-customer) .editor-head h3{font-size:14px!important;color:#202428!important;margin-top:1px!important}
body:not(.kol-customer) .editor-body{padding:11px!important;background:#f7f8f9!important;scrollbar-width:auto!important;scrollbar-color:#7b858f #e5e8eb!important}
body:not(.kol-customer) .editor-body::-webkit-scrollbar,body:not(.kol-customer) .content::-webkit-scrollbar{width:12px!important;height:12px!important}
body:not(.kol-customer) .editor-body::-webkit-scrollbar-track,body:not(.kol-customer) .content::-webkit-scrollbar-track{background:#e7eaed!important}
body:not(.kol-customer) .editor-body::-webkit-scrollbar-thumb,body:not(.kol-customer) .content::-webkit-scrollbar-thumb{background:#7d8791!important;border:3px solid #e7eaed!important;border-radius:999px!important}
body:not(.kol-customer) .editor-card{border:1px solid var(--remix-line)!important;border-radius:10px!important;background:#fff!important;box-shadow:none!important;margin-bottom:8px!important;overflow:hidden!important}
body:not(.kol-customer) .editor-card-head{min-height:42px!important;padding:0 11px!important;background:#fafbfb!important;border-bottom:1px solid #eceef0!important}
