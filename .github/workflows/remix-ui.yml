'''
          p.write_text(css.rstrip()+'\n\n'+remix.strip()+'\n',encoding='utf-8')
          # cache bump only; keep three-file structure
          for name in ['admin.html','index.html']:
              q=Path('demo')/name
              t=q.read_text(encoding='utf-8')
              t=re.sub(r'kol\.css\?v=[^"\']+','kol.css?v=20260825-remix1',t)
              q.write_text(t,encoding='utf-8')
          PY
      - name: Commit remix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/admin.html demo/index.html demo/kol.css
          git commit -m 'Apply Atoms-inspired remix to KOL three-file app' || exit 0
          git push