name: Diagnose order hardening
on:
  push:
    branches:
      - fix/order-system-hardening-20260817
    paths:
      - .github/workflows/order-system-hardening-diagnose.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/fix-hardening-normalizer.py
      - run: python .github/scripts/order-system-hardening-20260817.py
      - name: Diagnose invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index=Path('test/index.html').read_text(encoding='utf-8')
          admin=Path('test/admin-panel.html').read_text(encoding='utf-8')
          css=Path('test/kol-core.css').read_text(encoding='utf-8')
          checks = {
            'public most ordered': '/publicStats/mostOrdered.json' in index,
            'no customer all-orders GET': 'fetch(`${firebaseOrdersUrl}?ts=' not in index,
            'old customer aggregation gone': 'buildMostOrderedFromOrders' not in index,
            'old 4s poll gone': 'syncRecentOrdersFromFirebase, 4000' not in index,
            '10s poll present': '}, 10000);' in index,
            'rounding fixed': 'result.getSeconds() > 0 || result.getMilliseconds() > 0' in index,
            'customer snake client count gone': 'client_order_count:' not in index,
            'customer confirmed snake gone': 'confirmed_at:' not in index,
            'customer fulfill snake gone': 'fulfill_time:' not in index,
            'customer order type snake gone': 'order_type:' not in index,
            'admin split menu refs': 'const MENU_CONFIG_KEYS' in admin,
            'admin per-field listeners': 'menuFieldRefs[key].on("value"' in admin,
            'admin no root menuRef listener': 'const menuRef = firebase.database().ref("/")' not in admin,
            'admin child order listeners': 'ordersRef.on("child_added"' in admin,
            'admin public most ordered publisher': 'publicMostOrderedRef' in admin,
            'sms pending queue write': 'iceSmsPendingRef.child(job.id).set(job)' in admin,
            'sms promotion': 'promoteNextIceSmsJob' in admin,
            'no direct current set': 'iceSmsCurrentRef.set(job)' not in admin,
            'admin confirmed snake gone': 'confirmed_at:' not in admin,
            'admin fulfill snake gone': 'fulfill_time:' not in admin,
            'admin order type snake gone': 'order_type:' not in admin,
            'embedded catalog gone': 'id="kol-embedded-menu-catalog"' not in admin,
            'catalog JS gone': 'KOLMenuCatalog' not in admin,
            'css import gone': '@import url(' not in css,
            'css layer gone': '@layer mobile' not in css,
            'css pinned CDN gone': 'cdn.jsdelivr.net/gh/pizzano/pizzano.github.io@' not in css,
            'css consolidated marker': 'Customer/mobile overrides (formerly @layer mobile)' in css,
          }
          for name, ok in checks.items(): print(('PASS' if ok else 'FAIL'), name)
          if not all(checks.values()):
              print('\nRelevant leftovers:')
              for needle in ('iceSmsCurrentRef.set', 'confirmed_at:', 'fulfill_time:', 'order_type:', 'KOLMenuCatalog', '@layer mobile', '@import url('):
                  hits=[(i,l.strip()) for i,l in enumerate((admin if needle not in ('@layer mobile','@import url(') else css).splitlines(),1) if needle in l]
                  if hits: print(needle, hits[:10])
              raise SystemExit(1)
          scripts=[]
          for prefix, html in [('index', index), ('admin', admin)]:
              for i, script in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S|re.I),1):
                  p=Path('/tmp')/f'{prefix}-{i}.js'; p.write_text(script,encoding='utf-8'); scripts.append(str(p))
          Path('/tmp/jsfiles').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          while IFS= read -r f; do node --check "$f"; done < /tmp/jsfiles
          git diff --check
