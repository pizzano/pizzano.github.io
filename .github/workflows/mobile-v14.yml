name: Mobile v14
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-v14.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fix_v14_pickup.py
      - run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html
          git commit -m 'Fix v14 pickup helper logic' || exit 0
          git push origin HEAD:main
