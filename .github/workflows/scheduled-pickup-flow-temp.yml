name: Scheduled pickup flow patch
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/scheduled-pickup-flow-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 tools/scheduled_pickup_patch.py
      - name: Validate
        run: |
          node --check demo/js/data.js
          node --check demo/js/customer.js
          node --check demo/js/admin.js
      - name: Commit
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/scheduled-pickup-flow-temp.yml tools/scheduled_pickup_patch.py
          git add demo/js/data.js demo/js/customer.js demo/js/admin.js demo/admin.html demo/css/admin.css demo/index.html demo/service-worker.js .github/workflows/scheduled-pickup-flow-temp.yml tools/scheduled_pickup_patch.py
          git commit -m 'Handle scheduled pickup orders by selected time'
          git push origin HEAD:main
