name: Scheduled pickup flow patch
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/scheduled-pickup-flow-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply scheduled pickup flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260915-scheduled-pickup1'

          # ---------------- data.js ----------------
          p = Path('demo/js/data.js')
          s = p.read_text(encoding='utf-8')

          pickup_line = "        pickup: String(order.pickup || ''),\n"
          pickup_fields = pickup_line + "        pickupMode: order.pickupMode === 'scheduled' || /^\\d{1,2}:\\d{2}$/.test(String(order.pickup || '')) ? 'scheduled' : 'asap',\n        scheduledPickupAt: Number(order.scheduledPickupAt) || null,\n"
          if 'scheduledPickupAt: Number(order.scheduledPickupAt)' not in s:
              if pickup_line not in s:
                  raise SystemExit('normalize pickup line not found')
              s = s.replace(pickup_line, pickup_fields, 1)

          marker = "\n\n/** Avviser en ordre og lagrer årsaken. */"
          if 'export async function acceptScheduledOrder' not in s:
              if marker not in s:
                  raise SystemExit('reject marker not found')
              scheduled_fn = r'''

/** Godtar en tidsbestilt ordre og bruker kundens valgte hentetid som klar-tid. */
export async function acceptScheduledOrder(orderId) {
  const order = store.orders.find((entry) => entry.id === orderId);
  if (!order) return false;

  const now = Date.now();
  let readyAt = Number(order.scheduledPickupAt) || 0;
  if (!readyAt) {
    const match = /^(\d{1,2}):(\d{2})$/.exec(String(order.pickup || '').trim());
    if (!match) return false;
    const target = new Date(now);
    target.setHours(Number(match[1]), Number(match[2]), 0, 0);
    if (target.getTime() <= now) target.setDate(target.getDate() + 1);
    readyAt = target.getTime();
  }

  const previous = {
    status: order.status,
    statusUpdatedAt: order.statusUpdatedAt,
    pickupMode: order.pickupMode,
    scheduledPickupAt: order.scheduledPickupAt,
    estimatedMinutes: order.estimatedMinutes,
    estimatedAt: order.estimatedAt,
    estimatedReadyAt: order.estimatedReadyAt,
  };

  const minutes = Math.max(1, Math.ceil((readyAt - now) / 60000));
  order.status = 'bekreftet';
  order.statusUpdatedAt = now;
  order.pickupMode = 'scheduled';
  order.scheduledPickupAt = readyAt;
  order.estimatedMinutes = minutes;
  order.estimatedAt = now;
  order.estimatedReadyAt = readyAt;
  emitData('local');
  setSaveState('saving');

  try {
    if (remoteEnabled) {
      await restPatch(`${ORDERS_PATH}/${orderId}`, {
        status: 'bekreftet',
        statusUpdatedAt: now,
        pickupMode: 'scheduled',
        scheduledPickupAt: readyAt,
        estimatedMinutes: minutes,
        estimatedAt: now,
        estimatedReadyAt: readyAt,
      });
      remoteOnline = true;
    }
    setSaveState('saved');
    return true;
  } catch (err) {
    Object.assign(order, previous);
    emitData('local');
    setSaveState('error', err && err.message ? err.message : 'Ukjent feil');
    return false;
  }
}
'''
              s = s.replace(marker, scheduled_fn + marker, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- customer.js ----------------
          p = Path('demo/js/customer.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"from './data\.js(?:\?v=[^']+)?';", f"from './data.js?v={VERSION}';", s)

          valid_phone = """function validPhone(value) {
  return /^[49]\\d{7}$/.test(String(value).replace(/\\s/g, ''));
}
"""
          if 'function resolveScheduledPickupAt' not in s:
              if valid_phone not in s:
                  raise SystemExit('validPhone block not found')
              helper = valid_phone + r'''

function resolveScheduledPickupAt(value) {
  const match = /^(\d{1,2}):(\d{2})$/.exec(String(value || '').trim());
  if (!match) return null;
  const now = new Date();
  const target = new Date(now);
  target.setHours(Number(match[1]), Number(match[2]), 0, 0);
  if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
  return target.getTime();
}
'''
              s = s.replace(valid_phone, helper, 1)

          payload_needle = """      pickup: ui.pickup === 'asap' ? 'Snarest' : ui.pickup,
      type: 'henting',
"""
          payload_repl = """      pickup: ui.pickup === 'asap' ? 'Snarest' : ui.pickup,
      pickupMode: ui.pickupMode === 'scheduled' ? 'scheduled' : 'asap',
      scheduledPickupAt: ui.pickupMode === 'scheduled' ? resolveScheduledPickupAt(ui.pickup) : null,
      type: 'henting',
"""
          if 'scheduledPickupAt: ui.pickupMode' not in s:
              if payload_needle not in s:
                  raise SystemExit('submit order pickup payload not found')
              s = s.replace(payload_needle, payload_repl, 1)
          p.write_text(s, encoding='utf-8')

          # ---------------- admin.html ----------------
          p = Path('demo/admin.html')
          s = p.read_text(encoding='utf-8')
          old_intro = '''            <span class="order-action-eyebrow">FORVENTET TID</span>
            <p class="order-action-lead">Velg hvor mange minutter kunden skal se.</p>
            <div class="accept-quick-times" id="acceptQuickTimes">'''
          new_intro = '''            <span class="order-action-eyebrow" id="acceptTimeEyebrow">FORVENTET TID</span>
            <p class="order-action-lead" id="acceptTimeLead">Velg hvor mange minutter kunden skal se.</p>
            <div class="scheduled-accept-card" id="scheduledAcceptCard" hidden>
                <span>PLANLAGT HENTING</span>
                <strong id="scheduledAcceptTime">--:--</strong>
                <small>Bestillingen blir automatisk «Klar for henting» på dette tidspunktet.</small>
            </div>
            <div class="accept-quick-times" id="acceptQuickTimes">'''
          if 'id="scheduledAcceptCard"' not in s:
              if old_intro not in s:
                  raise SystemExit('accept modal intro not found')
              s = s.replace(old_intro, new_intro, 1)
              s = s.replace('<label class="accept-manual-time">', '<label class="accept-manual-time" id="acceptManualTime">', 1)
          s = re.sub(r'/demo/js/admin\.js\?v=[^\"\']+', f'/demo/js/admin.js?v={VERSION}', s)
          s = re.sub(r'/demo/css/admin\.css\?v=[^\"\']+', f'/demo/css/admin.css?v={VERSION}', s)
          p.write_text(s, encoding='utf-8')

          # ---------------- admin.js ----------------
          p = Path('demo/js/admin.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"from './data\.js(?:\?v=[^']+)?';", f"from './data.js?v={VERSION}';", s)
          if 'acceptScheduledOrder,' not in s:
              s = s.replace('  acceptOrderWithEstimate,\n', '  acceptOrderWithEstimate,\n  acceptScheduledOrder,\n', 1)

          if "scheduledAcceptCard: $('scheduledAcceptCard')" not in s:
              s = s.replace("  acceptMinutes: $('acceptMinutes'),\n", "  acceptMinutes: $('acceptMinutes'),\n  acceptManualTime: $('acceptManualTime'),\n  acceptTimeEyebrow: $('acceptTimeEyebrow'),\n  acceptTimeLead: $('acceptTimeLead'),\n  scheduledAcceptCard: $('scheduledAcceptCard'),\n  scheduledAcceptTime: $('scheduledAcceptTime'),\n", 1)

          # helper before openAcceptOrder
          helper_marker = 'function openAcceptOrder(orderId) {'
          if 'function isScheduledPickupOrder(order)' not in s:
              helper = r'''function isScheduledPickupOrder(order) {
  if (!order) return false;
  if (order.pickupMode === 'scheduled') return true;
  return /^(\d{1,2}):(\d{2})$/.test(String(order.pickup || '').trim());
}

'''
              if helper_marker not in s:
                  raise SystemExit('openAcceptOrder marker not found')
              s = s.replace(helper_marker, helper + helper_marker, 1)

          start = s.index('function openAcceptOrder(orderId) {')
          end = s.index('\nfunction openRejectOrder(orderId) {', start)
          open_accept = r'''function openAcceptOrder(orderId) {
  const order = getOrders().find((entry) => entry.id === orderId);
  if (!order) return;
  actionOrderId = order.id;
  const shortId = String(order.id).slice(-6).toUpperCase();
  const scheduled = isScheduledPickupOrder(order);
  el.acceptOrderTitle.textContent = `Godta #${shortId}`;

  el.scheduledAcceptCard.hidden = !scheduled;
  el.acceptQuickTimes.hidden = scheduled;
  el.acceptManualTime.hidden = scheduled;

  if (scheduled) {
    const pickupTime = String(order.pickup || '').trim();
    el.acceptTimeEyebrow.textContent = 'HENTETID';
    el.acceptTimeLead.textContent = 'Kunden har allerede valgt hentetid. Godta bestillingen uten å sette ekstra minutter.';
    el.scheduledAcceptTime.textContent = pickupTime || 'Planlagt';
    el.btnAcceptConfirm.textContent = pickupTime ? `Godta · henting ${pickupTime}` : 'Godta bestilling';
  } else {
    el.acceptTimeEyebrow.textContent = 'FORVENTET TID';
    el.acceptTimeLead.textContent = 'Velg hvor mange minutter kunden skal se.';
    el.btnAcceptConfirm.textContent = 'Godta bestilling';
    const minutes = Math.max(1, Number(order.estimatedMinutes) || 15);
    el.acceptMinutes.value = String(minutes);
    el.acceptQuickTimes.querySelectorAll('[data-accept-minutes]').forEach((button) => {
      button.classList.toggle('is-active', Number(button.dataset.acceptMinutes) === minutes);
    });
  }
  openModal(el.modalAcceptOrder);
}
'''
          s = s[:start] + open_accept + s[end:]

          # Detail: identify scheduled mode, label accept button, show pickup info instead of editable minute editor.
          s = s.replace("  const isPending = order.status === 'mottatt';\n", "  const isPending = order.status === 'mottatt';\n  const scheduledPickup = isScheduledPickupOrder(order);\n", 1)
          old_button = "<button class=\"pos-accept-btn\" data-open-accept=\"${escapeHtml(order.id)}\" type=\"button\">GODTA${estimated ? ` (${estimated} MIN)` : ''}</button>"
          new_button = "<button class=\"pos-accept-btn\" data-open-accept=\"${escapeHtml(order.id)}\" type=\"button\">${scheduledPickup ? `GODTA · ${escapeHtml(order.pickup || '')}` : `GODTA${estimated ? ` (${estimated} MIN)` : ''}`}</button>"
          if old_button not in s:
              raise SystemExit('detail accept button not found')
          s = s.replace(old_button, new_button, 1)

          old_meta = "${!isPending && estimated ? `<div><span>Gitt tid</span><strong>${estimated} min</strong></div>` : ''}"
          new_meta = "${!isPending && scheduledPickup ? `<div><span>Planlagt henting</span><strong>${escapeHtml(order.pickup || '—')}</strong></div>` : (!isPending && estimated ? `<div><span>Gitt tid</span><strong>${estimated} min</strong></div>` : '')}"
          if old_meta not in s:
              raise SystemExit('detail estimate meta not found')
          s = s.replace(old_meta, new_meta, 1)

          old_editor = '''        ${!isPending && !['avvist', 'fullfort'].includes(order.status) ? `
          <section class="pos-estimate-editor">
            <div><strong>Forventet tid</strong><span>Kunden ser denne tiden live.</span></div>
            <label><input data-detail-estimate autocomplete="off" type="number" min="1" max="180" step="1" value="${estimated || ''}" placeholder="15"><b>min</b></label>
            <button data-save-detail-estimate="${escapeHtml(order.id)}" type="button">Oppdater</button>
          </section>` : ''}'''
          new_editor = '''        ${!isPending && !['avvist', 'fullfort'].includes(order.status) ? (scheduledPickup ? `
          <section class="pos-scheduled-pickup-summary">
            <div><span>Planlagt henting</span><strong>${escapeHtml(order.pickup || '—')}</strong></div>
            <small>Blir automatisk «Klar for henting» når hentetiden kommer.</small>
          </section>` : `
          <section class="pos-estimate-editor">
            <div><strong>Forventet tid</strong><span>Kunden ser denne tiden live.</span></div>
            <label><input data-detail-estimate autocomplete="off" type="number" min="1" max="180" step="1" value="${estimated || ''}" placeholder="15"><b>min</b></label>
            <button data-save-detail-estimate="${escapeHtml(order.id)}" type="button">Oppdater</button>
          </section>`) : ''}'''
          if old_editor not in s:
              raise SystemExit('estimate editor block not found')
          s = s.replace(old_editor, new_editor, 1)

          # Replace acceptance handler with scheduled/manual branch.
          hstart = s.index("el.btnAcceptConfirm.addEventListener('click', async () => {")
          hend = s.index("\nel.btnRejectConfirm.addEventListener('click'", hstart)
          handler = r'''el.btnAcceptConfirm.addEventListener('click', async () => {
  if (!actionOrderId) return;
  const acceptedOrderId = actionOrderId;
  const order = getOrders().find((entry) => entry.id === acceptedOrderId);
  if (!order) return;
  const scheduled = isScheduledPickupOrder(order);

  let minutes = 0;
  if (!scheduled) {
    minutes = Math.max(1, Math.min(180, Math.round(Number(el.acceptMinutes.value) || 0)));
    if (!minutes) {
      toast('Velg eller skriv minutter.');
      el.acceptMinutes.focus();
      return;
    }
  }

  el.btnAcceptConfirm.disabled = true;
  const ok = scheduled
    ? await acceptScheduledOrder(acceptedOrderId)
    : await acceptOrderWithEstimate(acceptedOrderId, minutes);
  el.btnAcceptConfirm.disabled = false;
  if (!ok) {
    toast(scheduled ? 'Kunne ikke godta den planlagte hentetiden.' : 'Kunne ikke godta bestillingen.');
    return;
  }

  selectedOrderId = acceptedOrderId;
  closeModals();
  renderOrders();
  renderStats();
  toast(scheduled ? `Bestillingen er godtatt · henting ${order.pickup}.` : `Bestillingen er godtatt · ${minutes} min.`);
  window.setTimeout(() => {
    if (selectedOrderId !== acceptedOrderId) return;
    selectedOrderId = null;
    renderOrders();
  }, 1000);
});
'''
          s = s[:hstart] + handler + s[hend:]
          p.write_text(s, encoding='utf-8')

          # ---------------- admin.css ----------------
          p = Path('demo/css/admin.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Scheduled pickup accept UI 2026-09-15 */'
          if marker not in s:
              s += r'''

/* Scheduled pickup accept UI 2026-09-15 */
.scheduled-accept-card {
  display: grid;
  gap: 8px;
  margin: 14px 0 4px;
  padding: 18px;
  border: 1px solid #d8e8dc;
  border-radius: 16px;
  background: #f3fbf5;
}
.scheduled-accept-card[hidden] { display: none !important; }
.scheduled-accept-card > span {
  color: #6b7b70;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .06em;
}
.scheduled-accept-card > strong {
  color: #18211b;
  font-size: 34px;
  line-height: 1;
  font-weight: 850;
}
.scheduled-accept-card > small {
  color: #657169;
  font-size: 13px;
  line-height: 1.45;
}
.pos-scheduled-pickup-summary {
  display: grid;
  gap: 8px;
  padding: 16px 18px;
  border: 1px solid #dce7df;
  border-radius: 14px;
  background: #f6fbf7;
}
.pos-scheduled-pickup-summary > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.pos-scheduled-pickup-summary span { color: #617067; font-size: 13px; }
.pos-scheduled-pickup-summary strong { color: #18211b; font-size: 20px; }
.pos-scheduled-pickup-summary small { color: #7a867f; font-size: 12px; }
'''
          p.write_text(s, encoding='utf-8')

          # ---------------- index/cache ----------------
          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'/demo/js/customer\.js\?v=[^\"\']+', f'/demo/js/customer.js?v={VERSION}', s)
          p.write_text(s, encoding='utf-8')

          p = Path('demo/service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME = 'kol-demo-v\d+';", "const CACHE_NAME = 'kol-demo-v50';", s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check demo/js/data.js
          node --check demo/js/customer.js
          node --check demo/js/admin.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/scheduled-pickup-flow-temp.yml
          git add demo/js/data.js demo/js/customer.js demo/js/admin.js demo/admin.html demo/css/admin.css demo/index.html demo/service-worker.js .github/workflows/scheduled-pickup-flow-temp.yml
          git commit -m 'Handle scheduled pickup orders by selected time'
          git push origin HEAD:main
