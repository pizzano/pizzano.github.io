name: Demo loyalty opt-in

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-loyalty-optin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch demo loyalty wording and optional program
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path=Path('demo/index.html')
          s=path.read_text(encoding='utf-8')

          style_marker='.reward-product-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid #f1d1c3;background:#fff5ef;color:#be4a21;font-size:12px}.reward-product-banner strong{font-size:13px}.reward-product-banner span{white-space:nowrap;font-weight:700}.reward-line{background:#fffdfb}.reward-cart-note{color:#d05227;font-weight:700}.cart-line-price .reward-old-price{display:block;color:#8f8781;font-size:10.5px;text-decoration:line-through;font-weight:500}.cart-line-price .reward-free-price{display:block;color:#168458;font-size:14px;font-weight:800}.cart-savings{margin-top:9px;padding:9px 10px;border-radius:9px;background:#eef8f3;color:#18714e;font-size:12px;font-weight:700}'
          style_add=style_marker+'\n.loyalty-optin{padding:12px;border-bottom:1px solid #e8e0da;background:#fff}.loyalty-optin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.loyalty-optin-head strong{font-size:13px}.loyalty-optin-head span{color:#8a817b;font-size:11px}.loyalty-radio{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid #e6ded8;border-radius:11px;background:#fff;cursor:pointer}.loyalty-radio.active{border-color:#f1a487;background:#fff5ef}.loyalty-radio input{width:19px;height:19px;margin:1px 0 0;accent-color:#f36a2d}.loyalty-radio-copy{min-width:0}.loyalty-radio-copy b{display:block;font-size:13px;line-height:1.25}.loyalty-radio-copy small{display:block;margin-top:3px;color:#7d746e;font-size:11px;line-height:1.35}.loyalty-cart-note{color:#d45a2d;font-weight:700}'
          if '.loyalty-optin{' not in s:
              assert style_marker in s
              s=s.replace(style_marker,style_add,1)

          strength='''      <div class="product-choice-group" id="strengthGroup" hidden>\n        <div class="product-choice-head"><strong>Velg styrke</strong><span>Obligatorisk</span></div>\n        <div id="strengthOptions"></div>\n      </div>'''
          loyalty='''      <div class="product-choice-group" id="strengthGroup" hidden>\n        <div class="product-choice-head"><strong>Velg styrke</strong><span>Obligatorisk</span></div>\n        <div id="strengthOptions"></div>\n      </div>\n      <div class="loyalty-optin" id="loyaltyGroup" hidden>\n        <div class="loyalty-optin-head"><strong>Lojalitetsprogram</strong><span>Valgfritt</span></div>\n        <label class="loyalty-radio" id="loyaltyRadioRow">\n          <input type="radio" id="loyaltyProgramRadio" name="loyaltyProgramDemo">\n          <span class="loyalty-radio-copy"><b>Hver 11. Stor Pizza gratis</b><small>Tell denne Stor Pizzaen med i kupongkortet.</small></span>\n        </label>\n      </div>'''
          if 'id="loyaltyGroup"' not in s:
              assert strength in s
              s=s.replace(strength,loyalty,1)

          old="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap',toastTimer=0,rewardMode=false;"
          new="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap',toastTimer=0,rewardMode=false,loyaltyProgram=false;"
          assert old in s or new in s
          s=s.replace(old,new,1)

          old="function openProduct(id,{reward=false}={}){const p=product(id);if(!p)return;rewardMode=!!reward;editingCartIndex=-1;selectedProduct=p;selectedSize=0;selectedStrength=p.strengths?.[0]||'';qty=1;if(rewardMode){"
          new="function openProduct(id,{reward=false}={}){const p=product(id);if(!p)return;rewardMode=!!reward;loyaltyProgram=false;editingCartIndex=-1;selectedProduct=p;selectedSize=0;selectedStrength=p.strengths?.[0]||'';qty=1;if(rewardMode){"
          assert old in s or new in s
          s=s.replace(old,new,1)

          old="function openCartEdit(index){const line=cart[index],p=line&&product(line.productId);if(!line||!p)return;rewardMode=!!line.freeReward;editingCartIndex=index;selectedProduct=p;selectedSize=Math.max(0,p.sizes.findIndex(s=>s[0]===line.size));selectedStrength=line.strength||p.strengths?.[0]||'';qty=rewardMode?1:Math.max(1,line.qty||1);"
          new="function openCartEdit(index){const line=cart[index],p=line&&product(line.productId);if(!line||!p)return;rewardMode=!!line.freeReward;loyaltyProgram=!!line.loyaltyProgram;editingCartIndex=index;selectedProduct=p;selectedSize=Math.max(0,p.sizes.findIndex(s=>s[0]===line.size));selectedStrength=line.strength||p.strengths?.[0]||'';qty=rewardMode?1:Math.max(1,line.qty||1);"
          assert old in s or new in s
          s=s.replace(old,new,1)

          old="renderSizeOptions();renderStrengthOptions();updateProductTotal()}"
          new="renderSizeOptions();renderStrengthOptions();renderLoyaltyOption();updateProductTotal()}"
          if 'renderLoyaltyOption();updateProductTotal()' not in s:
              assert old in s
              s=s.replace(old,new,1)

          old="$$('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=+b.dataset.size;renderSizeOptions();updateProductTotal()})}"
          new="$$('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=+b.dataset.size;if(norm(selectedProduct.sizes[selectedSize][0])!=='stor')loyaltyProgram=false;renderSizeOptions();renderLoyaltyOption();updateProductTotal()})}"
          assert old in s or new in s
          s=s.replace(old,new,1)

          strength_fn="function renderStrengthOptions(){const group=$('#strengthGroup'),values=selectedProduct.strengths||[];if(!values.length||rewardMode){group.hidden=true;$('#strengthOptions').innerHTML='';return}group.hidden=false;$('#strengthOptions').innerHTML=values.map(v=>`<button class=\"product-choice ${v===selectedStrength?'active':''}\" data-strength=\"${v}\"><span class=\"choice-mark\">${v===selectedStrength?'✓':''}</span><span>${v}</span></button>`).join('');$$('[data-strength]').forEach(b=>b.onclick=()=>{selectedStrength=b.dataset.strength;renderStrengthOptions()})}"
          loyalty_fn=strength_fn+"\nfunction renderLoyaltyOption(){const group=$('#loyaltyGroup'),radio=$('#loyaltyProgramRadio'),row=$('#loyaltyRadioRow'),isPizza=selectedProduct?.sectionId==='pizza',isStor=norm(selectedProduct?.sizes?.[selectedSize]?.[0])==='stor';if(!group||!radio||!row)return;if(rewardMode||!isPizza||!isStor){group.hidden=true;loyaltyProgram=false;radio.checked=false;row.classList.remove('active');return}group.hidden=false;radio.checked=!!loyaltyProgram;row.classList.toggle('active',!!loyaltyProgram);radio.onclick=e=>{e.preventDefault();loyaltyProgram=!loyaltyProgram;radio.checked=loyaltyProgram;row.classList.toggle('active',loyaltyProgram);showToast(loyaltyProgram?'Lojalitetsprogram valgt':'Lojalitetsprogram fjernet')}}"
          if 'function renderLoyaltyOption()' not in s:
              assert strength_fn in s
              s=s.replace(strength_fn,loyalty_fn,1)

          old="const entry={key:`${selectedProduct.id}|${size[0]}|${strength}|${note}`,productId:selectedProduct.id,name:selectedProduct.name,size:size[0],strength,price:size[1],qty,note};"
          new="const countsForLoyalty=selectedProduct.sectionId==='pizza'&&norm(size[0])==='stor'&&loyaltyProgram;const entry={key:`${selectedProduct.id}|${size[0]}|${strength}|${note}|${countsForLoyalty?'loyalty':'standard'}`,productId:selectedProduct.id,name:selectedProduct.name,size:size[0],strength,price:size[1],qty,note,loyaltyProgram:countsForLoyalty};"
          assert old in s or new in s
          s=s.replace(old,new,1)

          old="${x.note?`<br>${escapeHtml(x.note)}`:''}</small>"
          new="${x.loyaltyProgram?`<br><span class=\"loyalty-cart-note\">Lojalitetsprogram · teller med</span>`:''}${x.note?`<br>${escapeHtml(x.note)}`:''}</small>"
          assert old in s or new in s
          s=s.replace(old,new,1)

          old="paidLarge=cart.filter(x=>!x.freeReward&&x.productId.startsWith('p')&&norm(x.size)==='stor').reduce((n,x)=>n+x.qty,0);"
          new="paidLarge=cart.filter(x=>!x.freeReward&&x.loyaltyProgram&&x.productId.startsWith('p')&&norm(x.size)==='stor').reduce((n,x)=>n+x.qty,0);"
          assert old in s or new in s
          s=s.replace(old,new,1)

          pattern=r"function pizzaProgress\(a\)\{.*?\}\nfunction renderRewardPicker"
          m=re.search(pattern,s,flags=re.S)
          assert m, 'pizzaProgress not found'
          replacement="""function pizzaProgress(a){normalizeLoyalty(a);const count=Math.min(10,Math.max(0,Number(a.stamps)||0)),ready=count>=10,rewardInCart=cart.some(x=>x.freeReward);let message='';if(ready)message='<strong>Neste Stor Pizza er gratis.</strong>';else if(count===9)message='Kjøp 1 Stor Pizza til – <strong>neste Stor Pizza er gratis.</strong>';else{const left=10-count;message=`Kjøp ${left} Stor Pizza${left===1?'':'er'} til – deretter er <strong>neste Stor Pizza gratis.</strong>`}return `<section class=\"pizza-loyalty-card\"><div class=\"pizza-loyalty-top\"><div><small>STOR PIZZA-KUPONGER</small><h3>${count} av 10</h3></div></div><div class=\"stamps\">${stampsHtml(a)}</div><p>${message}</p>${ready?`<div class=\"reward-ready\">🎁 Gratis Stor Pizza klar</div><button class=\"reward-claim-button\" id=\"claimRewardBtn\" ${rewardInCart?'disabled':''}>${rewardInCart?'Gratis pizza ligger i handlekurven':'Velg gratis Stor Pizza'}</button>`:''}</section>`}
function renderRewardPicker"""
          s=s[:m.start()]+replacement+s[m.end():]

          s=s.replace("const savings=Math.max(0,Number(a.savings)||0);if(a.savings!==savings){a.savings=savings;changed=true}","")
          s=s.replace("accounts[phone]={phone,name:'',email:'',marketing:true,stamps:0,rewards:0,savings:0,favorites:[]}","accounts[phone]={phone,name:'',email:'',marketing:true,stamps:0,rewards:0,favorites:[]}")
          s=s.replace("if(freeUsed)a.savings=(a.savings||0)+orderSavings;","")

          path.write_text(s,encoding='utf-8')
          PY

      - name: Validate demo
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('demo/index.html').read_text(encoding='utf-8')
          checks=[
            'id="loyaltyGroup"',
            'Hver 11. Stor Pizza gratis',
            'function renderLoyaltyOption()',
            "x.loyaltyProgram&&x.productId.startsWith('p')",
            'Kjøp 1 Stor Pizza til – <strong>neste Stor Pizza er gratis.</strong>',
            'Neste Stor Pizza er gratis.',
          ]
          for c in checks: assert c in s,c
          script=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/demo.js').write_text(script,encoding='utf-8')
          print('demo loyalty checks: OK')
          PY
          node --check /tmp/demo.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Demo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Clarify loyalty progress and add opt-in"
          git push origin HEAD:main

# trigger
