name: Polish search UI v2
on:
  push:
    paths:
      - '.github/workflows/polish-search-v2.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply cleanup
        run: python .github/scripts/polish-search-v2.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('test/test.html').read_text()
          assert 'id="allergenSearch"' not in s
          assert 'Søk i allergener' not in s
          assert 'Search polish v2' in s
          assert 'id="resetAllergens"' in s
          start=s.rfind('<script>')+8
          end=s.rfind('</script>')
          Path('/tmp/test-inline.js').write_text(s[start:end])
          PY
          node --check /tmp/test-inline.js
      - name: Commit and remove helpers
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/scripts/polish-search-v2.py .github/workflows/polish-search-v2.yml
          git commit -m 'Simplify allergen selector and polish search focus'
          git push
