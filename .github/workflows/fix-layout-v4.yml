name: Rebuild customer mobile v6
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-layout-v4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild customer HTML and CSS
        env:
          KOL_PREFIX: ""
          KOL_CSS: ""
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,zlib
          index=Path('test/index.html')
          old=index.read_text(encoding='utf-8')
          marker='<script>'
          if marker not in old:
              raise SystemExit('script marker missing')
          tail=old[old.index(marker):]
          prefix=zlib.decompress(base64.b64decode(os.environ['KOL_PREFIX'])).decode()
          css=zlib.decompress(base64.b64decode(os.environ['KOL_CSS'])).decode()
          index.write_text(prefix+tail,encoding='utf-8')
          Path('test/kol-core.css').write_text(css,encoding='utf-8')
          html=index.read_text(encoding='utf-8')
          required=['categoryTabs','menuSections','productModal','profileModal','cartModal','cartItems','customerFullName','customerPhone','checkoutNextHint']
          missing=[x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit('missing ids: '+','.join(missing))
          if '<style' in html.lower():
              raise SystemExit('embedded style found')
          print('mobile rebuild validated')
          PY
      - name: Commit rebuilt customer UI
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Rebuild customer UI as mobile-only v6
          file_pattern: test/index.html test/kol-core.css
