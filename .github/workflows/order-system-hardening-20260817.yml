name: Order system hardening 2026-08-17
on:
  push:
    branches:
      - fix/order-system-hardening-20260817
    paths:
      - .github/workflows/order-system-hardening-20260817.yml
permissions:
  contents: write
jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: python .github/scripts/order-system-hardening-20260817.py
      - name: Validate JavaScript and invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          index = Path('test/index.html').read_text(encoding='utf-8')
          admin = Path('test/admin-panel.html').read_text(encoding='utf-8')
          css = Path('test/kol-core.css').read_text(encoding='utf-8')

          assert '/publicStats/mostOrdered.json' in index
          assert 'fetch(`${firebaseOrdersUrl}?ts=' not in index
          assert 'buildMostOrderedFromOrders' not in index
          assert 'syncRecentOrdersFromFirebase, 4000' not in index
          assert '}, 10000);' in index
          assert 'result.getSeconds() > 0 || result.getMilliseconds() > 0' in index
          assert 'client_order_count:' not in index
          assert 'confirmed_at:' not in index
          assert 'fulfill_time:' not in index
          assert 'order_type:' not in index

          assert 'const MENU_CONFIG_KEYS' in admin
          assert 'menuFieldRefs[key].on("value"' in admin
          assert 'firebase.database().ref("/").on' not in admin
          assert 'const menuRef = firebase.database().ref("/")' not in admin
          assert 'ordersRef.on("child_added"' in admin
          assert 'publicMostOrderedRef' in admin
          assert 'iceSmsPendingRef.child(job.id).set(job)' in admin
          assert 'promoteNextIceSmsJob' in admin
          assert 'iceSmsCurrentRef.set(job)' not in admin
          assert 'confirmed_at:' not in admin
          assert 'fulfill_time:' not in admin
          assert 'order_type:' not in admin
          assert 'id="kol-embedded-menu-catalog"' not in admin
          assert 'KOLMenuCatalog' not in admin

          assert '@import url(' not in css
          assert '@layer mobile' not in css
          assert 'cdn.jsdelivr.net/gh/pizzano/pizzano.github.io@' not in css
          assert 'Customer/mobile overrides (formerly @layer mobile)' in css

          rules = json.loads(Path('test/database.rules.hardened.example.json').read_text(encoding='utf-8'))
          assert rules['rules']['.read'] is False
          assert Path('test/FIREBASE_SECURITY.md').exists()

          def inline_scripts(html):
              return re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, re.S | re.I)

          tmp = Path('/tmp/kol-js-check')
          tmp.mkdir(exist_ok=True)
          paths = []
          for prefix, html in [('index', index), ('admin', admin)]:
              for i, script in enumerate(inline_scripts(html), 1):
                  p = tmp / f'{prefix}-{i}.js'
                  p.write_text(script, encoding='utf-8')
                  paths.append(str(p))
          Path('/tmp/kol-js-files.txt').write_text('\n'.join(paths), encoding='utf-8')
          print(f'Prepared {len(paths)} inline scripts for node --check')
          PY
          while IFS= read -r file; do
            node --check "$file"
          done < /tmp/kol-js-files.txt
          git diff --check
      - name: Show scoped diff
        shell: bash
        run: |
          git status --short
          git diff --stat -- test/index.html test/admin-panel.html test/kol-core.css test/FIREBASE_SECURITY.md test/database.rules.hardened.example.json
          git diff --numstat -- test/index.html test/admin-panel.html test/kol-core.css test/FIREBASE_SECURITY.md test/database.rules.hardened.example.json
      - name: Commit hardened ordering system
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL Hardening Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- test/index.html test/admin-panel.html test/kol-core.css test/FIREBASE_SECURITY.md test/database.rules.hardened.example.json
          git rm -- .github/scripts/order-system-hardening-20260817.py .github/workflows/order-system-hardening-20260817.yml
          git diff --cached --check
          git commit -m "Harden ordering data flow and remove legacy layers"
          git push origin HEAD:fix/order-system-hardening-20260817
