name: Mobile v16
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-v16.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 mobile_v16_patch.py
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html
          git commit -m 'Finalize compact mobile checkout v16' || exit 0
          git push origin HEAD:main