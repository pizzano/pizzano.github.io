name: Cleanup ingredient workflows
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-ingredient-workflows.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove temporary workflows
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/remove-ingredient-tags.yml .github/workflows/remove-ingredient-tags-v2.yml .github/workflows/remove-ingredient-tags-v3.yml .github/workflows/cleanup-ingredient-workflows.yml
          git commit -m 'Remove temporary ingredient cleanup workflows'
          git push
