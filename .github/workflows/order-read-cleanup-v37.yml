name: Order read cleanup V37
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/order-read-cleanup-v37.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply order read cleanup
        run: python .github/scripts/order-read-cleanup-v37.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('test/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'const firebaseOrdersBaseUrl = `${firebaseBaseUrl}/orders`;' in html
          assert 'const firebaseOrderUrl = (orderId)' in html
          assert 'fetch(`${firebaseOrderUrl(cleanOrderId)}?ts=${Date.now()}`' in html
          assert 'firebaseOrdersUrl.replace("orders.json"' not in html
          # Root orders URL is allowed only for creating a new order with POST.
          assert 'const response = await fetch(firebaseOrdersUrl, {' in html
          post_block = html.split('const response = await fetch(firebaseOrdersUrl, {', 1)[1][:240]
          assert 'method: "POST"' in post_block
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html
          git commit -m "Use direct per-order Firebase reads"
          git push
