name: Finish profile and info sheet
on:
  push:
    paths:
      - '.github/workflows/finish-profile-info-sheet.yml'
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python .github/scripts/finish_profile_info.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('test/test.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',h)
          assert m
          Path('/tmp/test.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/test.js
          git diff --check
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html test/test.css
          git rm -f .github/scripts/finish_profile_info.py .github/workflows/finish-profile-info-sheet.yml
          git commit -m 'Simplify pizza profile and add store info sheet'
          git push
