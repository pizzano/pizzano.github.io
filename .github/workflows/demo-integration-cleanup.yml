name: Demo integration cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-integration-cleanup.yml
      - .github/scripts/demo_cleanup.py
      - .github/triggers/demo-integration-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply cleanup
        run: python3 .github/scripts/demo_cleanup.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('demo/index.html').read_text(encoding='utf-8')
          css=Path('demo/kol.css').read_text(encoding='utf-8')
          assert '<style>' not in html and '</style>' not in html
          assert 'KOLIntegration' in html and 'applyAdminConfig' in html and 'buildAdminOrderPayload' in html
          assert 'loyaltyProgram' not in html and 'loyaltyEnabled' not in html
          assert 'clean-admin-ready-20260818' in html
          assert 'Customer components: product, rewards, QR, checkout' in css
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          Path('/tmp/demo-clean.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('index bytes',len(html.encode()))
          print('css bytes',len(css.encode()))
          PY
          node --check /tmp/demo-clean.js
      - name: Commit main
        shell: bash
        run: |
          git config user.name "KOL Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          git rm -f .github/workflows/demo-integration-cleanup.yml .github/scripts/demo_cleanup.py .github/triggers/demo-integration-cleanup
          git commit -m "Clean demo customer app and prepare admin integration"
          git push origin HEAD:main
