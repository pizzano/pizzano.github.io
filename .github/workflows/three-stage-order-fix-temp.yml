name: Three stage order fix
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/temp-three-stage.py
      - name: Validate
        run: |
          node --check demo/js/data.js
          node --check demo/js/customer.js
          node --check demo/js/admin.js
      - name: Commit
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/three-stage-order-fix-temp.yml
          rm .github/temp-three-stage.py
          git add demo/js/data.js demo/js/customer.js demo/js/admin.js demo/css/customer.css demo/css/admin.css demo/index.html demo/admin.html demo/service-worker.js .github/workflows/three-stage-order-fix-temp.yml .github/temp-three-stage.py
          git commit -m "Use three order stages and fix admin acceptance"
          git push origin HEAD:main
