name: Checkout review clean mobile layout
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-review-clean-layout-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean up checkout review layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('demo/js/customer.js')
          js = js_path.read_text(encoding='utf-8')
          start = None
          for marker in [
              "  const reviewCount = cartCount();",
              "  const reviewLines = cart.map((line) => cartLineHtml(line, true)).join('');",
          ]:
              if marker in js:
                  start = js.index(marker)
                  break
          if start is None:
              raise SystemExit('Checkout review block start not found in demo/js/customer.js')
          end_marker = "  if (ui.checkoutStep === 3) {"
          end = js.index(end_marker, start)
          block = r'''  const reviewCount = cartCount();
  const reviewLabel = `${reviewCount} ${reviewCount === 1 ? 'vare' : 'varer'}`;
  const reviewItems = cart.map((line) => {
    const { item } = findItem(line.itemId);
    if (!item) return '';
    const size = (item.sizes || []).find((entry) => entry.id === line.sizeId);
    const optionIds = Object.values(line.selections || {}).flat();
    const linePrice = computeLinePrice(item, line.sizeId, optionIds, line.quantity);
    const addons = describeSelection(optionIds);
    const addonGroups = addons.reduce((groups, addon) => {
      let group = groups.find((entry) => entry.title === addon.groupTitle);
      if (!group) {
        group = { title: addon.groupTitle || 'Tilvalg', items: [] };
        groups.push(group);
      }
      group.items.push(addon);
      return groups;
    }, []);
    return `
      <article class="checkout-review-item">
        <div class="checkout-review-item-top">
          <span class="checkout-review-item-qty">${line.quantity}×</span>
          <div class="checkout-review-item-main">
            <strong class="checkout-review-item-name">${escapeHtml(item.name)}</strong>
            ${size ? `
              <div class="checkout-review-meta">
                <span class="checkout-review-meta-label">Størrelse</span>
                <strong class="checkout-review-meta-value">${escapeHtml(size.label)}</strong>
                <span class="checkout-review-meta-price">${formatPrice(getSizePrice(item, line.sizeId))}</span>
              </div>` : ''}
          </div>
          <strong class="checkout-review-item-total">${formatPrice(linePrice)}</strong>
        </div>
        ${addonGroups.length ? `
          <div class="checkout-review-addon-wrap">
            ${addonGroups.map((group) => `
              <section class="checkout-review-addon-group">
                <span class="checkout-review-addon-title">${escapeHtml(group.title)}</span>
                ${group.items.map((addon) => `
                  <div class="checkout-review-addon-row">
                    <span class="checkout-review-addon-name">• ${escapeHtml(addon.label)}</span>
                    <strong class="checkout-review-addon-price">${addon.price > 0 ? `+${formatPrice(addon.price)}` : 'Inkludert'}</strong>
                  </div>`).join('')}
              </section>`).join('')}
          </div>` : ''}
        ${line.comment ? `
          <div class="checkout-review-comment">
            <span>Kommentar</span>
            <p>${escapeHtml(line.comment)}</p>
          </div>` : ''}
      </article>`;
  }).join('');

  el.reviewCard.innerHTML = `
    <div class="checkout-review-head">
      <div class="checkout-review-head-copy">
        <span>Kontroller bestillingen</span>
        <strong>Din bestilling</strong>
      </div>
      <button class="link-btn" data-review-cart type="button">Endre kurv</button>
    </div>
    <details class="checkout-review-toggle">
      <summary class="checkout-review-summary">
        <strong class="checkout-review-count">${escapeHtml(reviewLabel)}</strong>
        <span class="checkout-review-summary-action" aria-hidden="true"></span>
      </summary>
      <div class="checkout-review-details">
        <div class="checkout-review-items">${reviewItems || '<div class="checkout-review-empty">Ingen varer i kurven.</div>'}</div>
        <div class="checkout-review-info">
          <h4>Din informasjon</h4>
          <div class="checkout-review-info-row"><span>Navn</span><strong>${escapeHtml(el.custName.value || '—')}</strong></div>
          <div class="checkout-review-info-row"><span>Telefon</span><strong>${el.custPhone.value ? `+47 ${escapeHtml(el.custPhone.value)}` : '—'}</strong></div>
          <div class="checkout-review-info-row"><span>Hentetid</span><strong>${ui.pickup ? (ui.pickup === 'asap' ? 'Snarest' : escapeHtml(ui.pickup)) : 'Ikke valgt'}</strong></div>
          <div class="checkout-review-info-row is-total"><span>Å betale ved henting</span><strong>${formatPrice(total)}</strong></div>
        </div>
      </div>
    </details>`;
'''
          js = js[:start] + block + js[end:]
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('demo/css/customer.css')
          css = css_path.read_text(encoding='utf-8')
          for marker in [
              '/* Checkout review clean layout 2026-09-15 */',
              '/* Checkout review cart-style polish 2026-09-15 */',
              '/* Checkout review accordion mobile polish 2026-09-15 */',
          ]:
              if marker in css:
                  css = css.split(marker)[0].rstrip() + '\n'
                  break
          css_block = r'''

/* Checkout review clean layout 2026-09-15 */
.checkout-review-head,
.checkout-review-summary,
.checkout-review-details,
.checkout-review-items,
.checkout-review-item,
.checkout-review-item-top,
.checkout-review-item-main,
.checkout-review-addon-wrap,
.checkout-review-addon-group,
.checkout-review-addon-row,
.checkout-review-comment,
.checkout-review-info,
.checkout-review-info-row {
  box-sizing: border-box;
}
.checkout-review-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.checkout-review-head-copy { min-width: 0; display: grid; gap: 3px; }
.checkout-review-head-copy span { color: var(--ink-3); font-size: 11px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.checkout-review-head-copy strong { color: var(--ink); font-size: 17px; line-height: 1.2; font-weight: 800; }
.checkout-review-head .link-btn { flex: none; padding-top: 2px; color: var(--accent); font-size: 13px; line-height: 1.2; font-weight: 700; white-space: nowrap; }
.checkout-review-toggle { display: block; background: #fff; }
.checkout-review-summary { list-style: none; display: flex !important; align-items: center !important; justify-content: space-between !important; gap: 12px !important; min-height: 56px; padding: 0 16px !important; cursor: pointer; background: #fff; }
.checkout-review-summary::-webkit-details-marker { display: none; }
.checkout-review-count { color: var(--ink); font-size: 16px; line-height: 1; font-weight: 800; }
.checkout-review-summary-action { flex: none; color: var(--accent); font-size: 13px; line-height: 1; font-weight: 700; }
.checkout-review-summary-action::after { content: 'Vis mer'; }
.checkout-review-toggle[open] .checkout-review-summary-action::after { content: 'Skjul'; }
.checkout-review-details { display: grid; gap: 12px; padding: 12px; background: #f7f7f6; border-top: 1px solid var(--line); }
.checkout-review-items { display: grid; gap: 12px; padding: 0; }
.checkout-review-item { width: 100%; min-width: 0; overflow: hidden; padding: 14px; border: 1px solid #eee9e4; border-radius: 16px; background: #fff; box-shadow: 0 1px 6px rgba(22, 28, 36, .05); }
.checkout-review-item-top { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: start; gap: 12px; }
.checkout-review-item-qty { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent-dark); font-size: 12px; line-height: 1; font-weight: 700; }
.checkout-review-item-main { min-width: 0; display: grid; gap: 8px; align-content: start; }
.checkout-review-item-name { display: block; margin: 0; color: var(--ink); font-size: 15px; line-height: 1.25; font-weight: 800; word-break: normal; overflow-wrap: anywhere; }
.checkout-review-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--ink-2); font-size: 12px; line-height: 1.35; }
.checkout-review-meta-value { color: var(--ink); font-size: 12.5px; font-weight: 700; }
.checkout-review-meta-price { color: var(--ink-2); white-space: nowrap; }
.checkout-review-item-total { color: var(--ink); font-size: 16px; line-height: 1.2; font-weight: 800; white-space: nowrap; align-self: start; }
.checkout-review-addon-wrap { margin: 12px 0 0 48px; display: grid; gap: 10px; }
.checkout-review-addon-group { min-width: 0; padding-top: 10px; border-top: 1px dashed var(--line); }
.checkout-review-addon-title { display: block; margin-bottom: 6px; color: var(--ink-3); font-size: 10px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.checkout-review-addon-row { min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 3px 0; color: var(--ink-2); font-size: 12px; line-height: 1.35; }
.checkout-review-addon-name { min-width: 0; word-break: normal; overflow-wrap: anywhere; }
.checkout-review-addon-price { flex: none; color: var(--ink); font-size: 12px; font-weight: 700; white-space: nowrap; }
.checkout-review-comment { margin: 12px 0 0 48px; padding: 10px 12px; border-radius: 12px; background: #f8f8f7; }
.checkout-review-comment span { display: block; margin-bottom: 4px; color: var(--ink-3); font-size: 10px; line-height: 1.2; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.checkout-review-comment p { margin: 0; color: var(--ink-2); font-size: 12px; line-height: 1.45; }
.checkout-review-empty { padding: 14px; border: 1px dashed var(--line-strong); border-radius: 14px; background: #fff; color: var(--ink-2); font-size: 13px; }
.checkout-review-info { width: 100%; min-width: 0; overflow: hidden; padding: 14px; border: 1px solid #eee9e4; border-radius: 16px; background: #fff; }
.checkout-review-info h4 { margin: 0 0 6px; color: var(--ink); font-size: 15px; line-height: 1.2; font-weight: 800; }
.checkout-review-info-row { min-height: 40px; display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 12px; line-height: 1.35; }
.checkout-review-info-row:last-child { border-bottom: 0; }
.checkout-review-info-row strong { max-width: 58%; min-width: 0; color: var(--ink); font-size: 13px; line-height: 1.35; font-weight: 700; text-align: right; word-break: normal; overflow-wrap: anywhere; }
.checkout-review-info-row.is-total { align-items: center; margin-top: 2px; color: var(--ink); font-size: 13px; font-weight: 700; }
.checkout-review-info-row.is-total strong { font-size: 15px; font-weight: 800; }
@media (max-width: 520px) {
  .checkout-review-head { padding: 12px 14px; }
  .checkout-review-head-copy strong { font-size: 16px; }
  .checkout-review-summary { min-height: 54px; padding: 0 14px !important; }
  .checkout-review-count { font-size: 15px; }
  .checkout-review-summary-action { font-size: 12.5px; }
  .checkout-review-details { gap: 10px; padding: 10px; }
  .checkout-review-items { gap: 10px; }
  .checkout-review-item { padding: 12px; border-radius: 15px; }
  .checkout-review-item-top { grid-template-columns: 32px minmax(0, 1fr); gap: 10px; }
  .checkout-review-item-qty { width: 32px; height: 32px; grid-column: 1; grid-row: 1 / span 2; font-size: 11px; }
  .checkout-review-item-main { grid-column: 2; grid-row: 1; gap: 7px; }
  .checkout-review-item-name { font-size: 14px; line-height: 1.22; }
  .checkout-review-meta { gap: 6px; font-size: 11.5px; }
  .checkout-review-meta-value { font-size: 12px; }
  .checkout-review-item-total { grid-column: 2; grid-row: 2; justify-self: end; margin-top: 2px; font-size: 15px; }
  .checkout-review-addon-wrap, .checkout-review-comment { margin-left: 42px; }
  .checkout-review-addon-row, .checkout-review-comment p, .checkout-review-info-row { font-size: 11.5px; }
  .checkout-review-info { padding: 12px; border-radius: 15px; }
  .checkout-review-info h4 { font-size: 14px; }
  .checkout-review-info-row strong { max-width: 56%; font-size: 12.5px; }
  .checkout-review-info-row.is-total strong { font-size: 14px; }
}
'''
          css = css.rstrip() + css_block + '\n'
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('demo/index.html')
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'/demo/css/customer\.css\?v=[^\"\']+', '/demo/css/customer.css?v=20260915-reviewclean1', index)
          index_path.write_text(index, encoding='utf-8')

          sw_path = Path('demo/service-worker.js')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'kol-demo-v\d+';", "const CACHE_NAME = 'kol-demo-v37';", sw)
          sw_path.write_text(sw, encoding='utf-8')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/checkout-review-clean-layout-temp.yml
          git add demo/js/customer.js demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/checkout-review-clean-layout-temp.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m 'Clean checkout review details layout'
            git push origin HEAD:main
          fi
