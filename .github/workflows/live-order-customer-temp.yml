name: Live customer order status patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-order-customer-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply live order tracking patch
        run: python3 .github/scripts/live-order-customer-temp.py
      - name: Validate customer JavaScript
        run: node --check demo/js/customer.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/live-order-customer-temp.yml
          rm .github/scripts/live-order-customer-temp.py
          git add demo/js/customer.js demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/live-order-customer-temp.yml .github/scripts/live-order-customer-temp.py
          git commit -m 'Make customer order status live and focused' || exit 0
          git push origin HEAD:main
