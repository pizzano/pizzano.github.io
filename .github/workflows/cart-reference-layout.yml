name: Cart reference layout
on:
  push:
    paths:
      - '.github/workflows/cart-reference-layout.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cart UI and edit flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path('test/test.html')
          css_path = Path('test/test.css')
          html = html_path.read_text()
          css = css_path.read_text()

          old_state = "selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1;"
          new_state = "selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1;"
          if old_state in html:
              html = html.replace(old_state, new_state, 1)
          elif 'editingCartIndex=-1' not in html:
              raise SystemExit('state declaration not found')

          product_block = '''function openProduct(id){selectedProduct=product(id);selectedSize=0;selectedStrength=selectedProduct.strengths?.[0]||'';qty=1;editingCartIndex=-1;$('#addToCart').textContent='Legg til i handlekurven';$('#productBodyTitle').textContent=selectedProduct.name;$('#productDesc').textContent=selectedProduct.description;$('#productPhoto').style.backgroundImage=selectedProduct.image?`url('${selectedProduct.image}')`:'';renderSizeOptions();renderStrengthOptions();$('#qtyValue').textContent=qty;$('#productNote').value='';updateProductTotal();openScreen('productScreen');setActiveCategory(selectedProduct.sectionId,false);const tabs=$('#tabs');if(tabs){tabs.scrollLeft=0;requestAnimationFrame(()=>{const active=document.querySelector(`.category-tab[data-tab="${selectedProduct.sectionId}"]`);if(active)active.scrollIntoView({behavior:'auto',block:'nearest',inline:'center'})})}}
function openCartEdit(index){const line=cart[index],p=line&&product(line.productId);if(!line||!p)return;editingCartIndex=index;selectedProduct=p;selectedSize=Math.max(0,p.sizes.findIndex(s=>s[0]===line.size));selectedStrength=line.strength||p.strengths?.[0]||'';qty=Math.max(1,line.qty||1);$('#addToCart').textContent='Oppdater handlekurven';$('#productBodyTitle').textContent=p.name;$('#productDesc').textContent=p.description;$('#productPhoto').style.backgroundImage=p.image?`url('${p.image}')`:'';renderSizeOptions();renderStrengthOptions();$('#qtyValue').textContent=qty;$('#productNote').value=line.note||'';updateProductTotal();openScreen('productScreen');setActiveCategory(p.sectionId,false)}
function renderSizeOptions'''
          html, n = re.subn(r"function openProduct\(id\)\{.*?\}\nfunction renderSizeOptions", product_block, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('openProduct block not replaced')

          add_block = '''function addCart(){const size=selectedProduct.sizes[selectedSize],note=$('#productNote').value.trim(),strength=selectedProduct.strengths?.length?selectedStrength:'',key=`${selectedProduct.id}|${size[0]}|${strength}|${note}`,entry={key,productId:selectedProduct.id,name:selectedProduct.name,size:size[0],strength,price:size[1],qty,note};if(editingCartIndex>=0&&cart[editingCartIndex]){cart[editingCartIndex]=entry;editingCartIndex=-1;save(KEY.cart,cart);renderCartCount();renderCart();openScreen('cartScreen');return}const old=cart.find(x=>x.key===key);if(old)old.qty+=qty;else cart.push(entry);save(KEY.cart,cart);renderCartCount();closeScreens()}
function renderCartCount'''
          html, n = re.subn(r"function addCart\(\)\{.*?\}\nfunction renderCartCount", add_block, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('addCart block not replaced')

          cart_block = '''function renderCart(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0),cartMoney=n=>`${Number(n||0).toLocaleString('nb-NO',{minimumFractionDigits:2,maximumFractionDigits:2})} kr`;$('#cartLines').innerHTML=cart.map((x,i)=>`<div class="cart-line"><div class="cart-line-main"><span class="cart-qty-badge">${x.qty}x</span><div class="cart-line-copy"><strong>${escapeHtml(x.name)}</strong><small><span>Størrelse: <b>${escapeHtml(x.size)}</b></span>${x.strength?`<span>Styrke: <b>${escapeHtml(x.strength)}</b></span>`:''}${x.note?`<span>${escapeHtml(x.note)}</span>`:''}</small></div></div><div class="cart-line-side"><b class="cart-line-price">${cartMoney(x.price*x.qty)}</b><div class="cart-line-actions"><button class="cart-edit-btn" data-editcart="${i}" aria-label="Rediger">✎</button><button class="cart-remove-btn" data-remove="${i}" aria-label="Fjern">×</button></div></div></div>`).join('');$('#cartEmpty').hidden=cart.length>0;$('#cartTotal').textContent=cartMoney(total);const tax=$('.tax-note-row');if(tax)tax.textContent=`(inkl. mva ${cartMoney(total*15/115)})`;$$('[data-editcart]').forEach(b=>b.onclick=()=>openCartEdit(+b.dataset.editcart));$$('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save(KEY.cart,cart);renderCart();renderCartCount()});const a=account();$('#checkoutName').value=a?.name||'';$('#checkoutPhone').value=a?.phone||'';$('#checkoutPhone').disabled=!!a;$('#checkoutLoginHint').textContent=a?'Innlogget medlemskonto.':'Du kan bestille uten å logge inn.';renderCheckoutStep()}
function renderCheckoutStep'''
          html, n = re.subn(r"function renderCart\(\)\{.*?\}\nfunction renderCheckoutStep", cart_block, html, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('renderCart block not replaced')

          html = re.sub(r'test\.css\?v=[^"\']+', 'test.css?v=cart-reference-20260818-0030', html, count=1)

          old_css = re.search(r"\.cart-line\{.*?\.cart-summary\{", css, flags=re.S)
          if not old_css:
              raise SystemExit('cart css block not found')
          new_css = '''.cart-line{min-height:92px;padding:13px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.cart-line-main{min-width:0;display:grid;grid-template-columns:42px minmax(0,1fr);align-items:start;gap:10px;flex:1}.cart-qty-badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#d94740;color:#fff;font-size:13px;font-weight:700;line-height:1}.cart-line-copy{min-width:0;padding-top:3px}.cart-line-copy strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:700;text-transform:uppercase}.cart-line-copy small{display:block;margin-top:6px;color:#211d1a;font-size:11.5px;line-height:1.45}.cart-line-copy small span{display:block}.cart-line-copy small b{font-weight:700}.cart-line-side{flex:0 0 auto;display:flex;align-items:center;gap:10px}.cart-line-price{min-width:78px;text-align:right;font-size:13px;font-weight:650;white-space:nowrap}.cart-line-actions{display:flex;gap:6px}.cart-edit-btn,.cart-remove-btn{width:46px;height:46px;border-radius:7px;display:grid;place-items:center;font-size:17px}.cart-edit-btn{border:1px solid #cbded6;background:#edf6f2;color:#12604e}.cart-remove-btn{border:1px solid #efcfcc;background:#fff6f5;color:#b72e2a}.cart-summary{'''
          css = css[:old_css.start()] + new_css + css[old_css.end():]

          html_path.write_text(html)
          css_path.write_text(css)
          PY
      - name: Validate cart behavior
        shell: bash
        run: |
          grep -q 'cart-qty-badge' test/test.html
          grep -q 'data-editcart' test/test.html
          grep -q 'openCartEdit' test/test.html
          grep -q 'Oppdater handlekurven' test/test.html
          ! grep -q 'data-pluscart' test/test.html
          ! grep -q 'data-minus=' test/test.html
          grep -q 'cart-edit-btn' test/test.css
          grep -q 'cart-remove-btn' test/test.css
          grep -q 'function goToCategory' test/test.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/test.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/test-inline.js').write_text(m.group(1))
          PY
          node --check /tmp/test-inline.js
          git diff --check
      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/cart-reference-layout.yml
          git add test/test.html test/test.css
          git commit -m 'Match cart layout and add line editing'
          git push
