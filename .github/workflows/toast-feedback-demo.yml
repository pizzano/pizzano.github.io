name: Toast feedback demo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/toast-feedback-demo.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared toast feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/test.html')
          s=p.read_text()

          # cache bust CSS
          s=s.replace('test.css?v=allergen-search-20260818-0115','test.css?v=toast-feedback-20260818-0130',1)

          # shared toast element
          marker='''</section>\n</div>\n\n<script>'''
          replacement='''</section>\n<div class="app-toast" id="appToast" role="status" aria-live="polite" aria-atomic="true"></div>\n</div>\n\n<script>'''
          if marker not in s:
              raise SystemExit('toast insertion marker not found')
          s=s.replace(marker,replacement,1)

          # timer + shared helper
          old="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap';"
          new="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap',toastTimer=0;"
          if old not in s: raise SystemExit('state marker not found')
          s=s.replace(old,new,1)

          helper_marker="const allergenLabel=id=>ALLERGENS.find(a=>a[0]===id)?.[2]||id;"
          helper_new="""const allergenLabel=id=>ALLERGENS.find(a=>a[0]===id)?.[2]||id;
function showToast(message){
  const el=$('#appToast');
  if(!el||!message)return;
  clearTimeout(toastTimer);
  el.textContent=message;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  toastTimer=setTimeout(()=>el.classList.remove('show'),2000);
}"""
          if helper_marker not in s: raise SystemExit('helper marker not found')
          s=s.replace(helper_marker,helper_new,1)

          # favorite feedback
          old="""    const f=favSet(),id=b.dataset.fav;
    f.has(id)?f.delete(id):f.add(id);
    saveFav(f);
    refreshFavoriteUi();"""
          new="""    const f=favSet(),id=b.dataset.fav,wasFavorite=f.has(id);
    wasFavorite?f.delete(id):f.add(id);
    saveFav(f);
    refreshFavoriteUi();
    showToast(wasFavorite?'Favoritt fjernet':'Lagt til i favoritter');"""
          if old not in s: raise SystemExit('favorite block not found')
          s=s.replace(old,new,1)

          # cart add/update feedback
          old="""  if(editingCartIndex>=0&&cart[editingCartIndex]){cart[editingCartIndex]=entry;editingCartIndex=-1;save(KEY.cart,cart);renderCartCount();renderCart();openView('cartScreen',{tabs:true});return}
  const old=cart.find(x=>x.key===entry.key);old?old.qty+=qty:cart.push(entry);
  save(KEY.cart,cart);renderCartCount();goMenu();"""
          new="""  if(editingCartIndex>=0&&cart[editingCartIndex]){cart[editingCartIndex]=entry;editingCartIndex=-1;save(KEY.cart,cart);renderCartCount();renderCart();openView('cartScreen',{tabs:true});showToast('Handlekurven er oppdatert');return}
  const old=cart.find(x=>x.key===entry.key);old?old.qty+=qty:cart.push(entry);
  save(KEY.cart,cart);renderCartCount();goMenu();showToast('Produkt lagt i handlekurven');"""
          if old not in s: raise SystemExit('cart add/update block not found')
          s=s.replace(old,new,1)

          # cart remove feedback
          old="$$('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save(KEY.cart,cart);renderCart();renderCartCount()});"
          new="$$('[data-remove]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.remove,1);save(KEY.cart,cart);renderCart();renderCartCount();showToast('Produkt fjernet fra handlekurven')});"
          if old not in s: raise SystemExit('cart remove block not found')
          s=s.replace(old,new,1)

          # profile save feedback
          old="$('#saveProfile').onclick=()=>{a.name=$('#pfName').value.trim()||a.name;a.email=$('#pfEmail').value.trim();a.marketing=$('#pfMarketing').checked;saveAccounts();renderHeader();renderProfileHome()};"
          new="$('#saveProfile').onclick=()=>{a.name=$('#pfName').value.trim()||a.name;a.email=$('#pfEmail').value.trim();a.marketing=$('#pfMarketing').checked;saveAccounts();renderHeader();renderProfileHome();showToast('Profilen er lagret')};"
          if old not in s: raise SystemExit('profile save block not found')
          s=s.replace(old,new,1)

          # logout feedback
          old="$('#logoutBtn').onclick=()=>{setSession(null);renderLogin()};"
          new="$('#logoutBtn').onclick=()=>{setSession(null);renderLogin();showToast('Du er logget ut')};"
          if old not in s: raise SystemExit('logout block not found')
          s=s.replace(old,new,1)

          # allergen toggle feedback
          old="""  $$('[data-allergen]').forEach(b=>b.onclick=()=>{draftAllergens.has(b.dataset.allergen)?draftAllergens.delete(b.dataset.allergen):draftAllergens.add(b.dataset.allergen);renderAllergens()});"""
          new="""  $$('[data-allergen]').forEach(b=>b.onclick=()=>{const id=b.dataset.allergen,wasSelected=draftAllergens.has(id);wasSelected?draftAllergens.delete(id):draftAllergens.add(id);renderAllergens();showToast(wasSelected?`${allergenLabel(id)} fjernet`:`${allergenLabel(id)} valgt`)});"""
          if old not in s: raise SystemExit('allergen toggle block not found')
          s=s.replace(old,new,1)

          # allergen reset/save feedback
          old="$('#allergenReset').onclick=()=>{draftAllergens.clear();selectedAllergens.clear();save(KEY.allergens,[]);allergenSearch='';$('#allergenSearch').value='';renderAllergens();renderAll();};"
          new="$('#allergenReset').onclick=()=>{draftAllergens.clear();selectedAllergens.clear();save(KEY.allergens,[]);allergenSearch='';$('#allergenSearch').value='';renderAllergens();renderAll();showToast('Allergener nullstilt')};"
          if old not in s: raise SystemExit('allergen reset block not found')
          s=s.replace(old,new,1)

          old="$('#allergenSave').onclick=()=>{selectedAllergens=new Set(draftAllergens);save(KEY.allergens,[...selectedAllergens]);renderAll();goMenu()};"
          new="$('#allergenSave').onclick=()=>{selectedAllergens=new Set(draftAllergens);save(KEY.allergens,[...selectedAllergens]);renderAll();goMenu();showToast('Allergener lagret')};"
          if old not in s: raise SystemExit('allergen save block not found')
          s=s.replace(old,new,1)

          # order sent feedback instead of blocking alert
          old="  alert(`Testbestilling ${id} er lagret lokalt.`);"
          new="  showToast('Bestillingen er sendt');"
          if old not in s: raise SystemExit('order alert not found')
          s=s.replace(old,new,1)

          p.write_text(s)

          c=Path('test/test.css')
          css=c.read_text()
          marker='/* toast-feedback-v1 */'
          if marker in css:
              css=css.split(marker,1)[0].rstrip()+'\n'
          css += '''\n/* toast-feedback-v1 */
.app-toast{position:fixed;z-index:1000;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));width:max-content;max-width:min(calc(100vw - 32px),420px);padding:8px 13px;border-radius:999px;background:rgba(28,26,25,.92);color:#fff;font-size:12.5px;font-weight:600;line-height:1.25;text-align:center;box-shadow:0 5px 18px rgba(0,0,0,.16);pointer-events:none;opacity:0;transform:translate(-50%,10px);transition:opacity .18s ease,transform .18s ease}
.app-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:420px){.app-toast{max-width:calc(100vw - 24px);font-size:12px;padding:8px 12px}}
'''
          c.write_text(css)
          PY
      - name: Validate toast integration
        shell: bash
        run: |
          grep -q 'id="appToast"' test/test.html
          grep -q 'function showToast(message)' test/test.html
          grep -q "showToast('Produkt lagt i handlekurven')" test/test.html
          grep -q "showToast('Produkt fjernet fra handlekurven')" test/test.html
          grep -q "showToast('Allergener nullstilt')" test/test.html
          grep -q 'toast-feedback-v1' test/test.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/test.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/test.js').write_text(m.group(1))
          PY
          node --check /tmp/test.js
          git diff --check
      - name: Commit and clean workflow
        shell: bash
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/toast-feedback-demo.yml
          git add test/test.html test/test.css
          git commit -m 'Add shared action feedback toast'
          git push origin HEAD:main
