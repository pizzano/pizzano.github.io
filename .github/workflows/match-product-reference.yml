name: Match product reference
on:
  push:
    paths:
      - '.github/workflows/match-product-reference.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply product reference layout
        run: python .github/scripts/match-product-reference.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('test/test.html').read_text(encoding='utf-8')
          c=Path('test/test.css').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/test-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert '<span class="brand-back-label">‹ Meny</span>' in h
          assert 'const productMoney=' in h
          assert 'product-reference-20260818-0024' in h
          assert '/* Product detail reference layout */' in c
          assert '#productScreen .product-choice.active' in c
          PY
          node --check /tmp/test-inline.js
          git diff --check
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/match-product-reference.py .github/workflows/match-product-reference.yml
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html test/test.css .github/scripts/match-product-reference.py .github/workflows/match-product-reference.yml
          git commit -m 'Match product detail reference layout'
          git push origin main
