name: Mobile v9
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-v9.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 checkout_mobile_v9.py
      - name: Commit
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git commit -m 'Simplify product UI and checkout to two steps' || exit 0
          git push origin HEAD:main