name: Diagnose hardening syntax
on:
  push:
    branches:
      - fix/order-system-hardening-20260817
    paths:
      - .github/workflows/order-system-hardening-syntax.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          python .github/scripts/fix-hardening-normalizer.py
          python .github/scripts/fix-hardening-final.py
          python .github/scripts/order-system-hardening-20260817.py
      - name: Show customer syntax failure context
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('test/index.html').read_text(encoding='utf-8')
          script=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)[0]
          p=Path('/tmp/index.js'); p.write_text(script,encoding='utf-8')
          lines=script.splitlines()
          for n in range(2935,2970):
              if n <= len(lines): print(f'{n:04d}: {lines[n-1]}')
          PY
          node --check /tmp/index.js
