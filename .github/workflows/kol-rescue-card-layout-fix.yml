name: KOL rescue card layout fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-rescue-card-layout-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix rescue card CSS
        shell: bash
        run: |
          cat >> test/kol-core.css <<'CSS'

/* REDDE MATEN CARD LAYOUT FIX */
.rescue-menu-row{
  min-height:132px !important;
  height:auto !important;
  overflow:visible !important;
  align-items:center !important;
  padding-top:10px !important;
  padding-bottom:10px !important;
}
.rescue-menu-row .menu-row-main{
  display:flex !important;
  flex-wrap:wrap !important;
  align-content:center !important;
  align-items:center !important;
  gap:5px 8px !important;
  min-width:0 !important;
  overflow:visible !important;
}
.rescue-menu-row .menu-row-headline,
.rescue-menu-row .menu-row-description{
  flex:0 0 100% !important;
  min-width:0 !important;
}
.rescue-menu-row .menu-row-description{
  margin:0 !important;
  line-height:1.25 !important;
}
.rescue-variant-badge,
.rescue-stock-label{
  display:inline-flex !important;
  align-items:center !important;
  width:auto !important;
  max-width:100% !important;
  margin:0 !important;
  white-space:nowrap !important;
  line-height:1 !important;
}
.rescue-menu-row .rescue-product-side{
  align-self:stretch !important;
  display:flex !important;
  flex-direction:column !important;
  align-items:flex-end !important;
  justify-content:space-between !important;
  min-height:108px !important;
  padding:0 !important;
}
.rescue-menu-row .rescue-price-stack{
  margin-top:auto !important;
  padding-top:8px !important;
  line-height:1.05 !important;
  white-space:nowrap !important;
}
@media (max-width:760px){
  .rescue-menu-row{
    min-height:122px !important;
  }
  .rescue-menu-row .rescue-product-side{
    min-height:100px !important;
  }
  .rescue-variant-badge,
  .rescue-stock-label{
    font-size:11px !important;
  }
}
CSS
      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/kol-rescue-card-layout-fix.yml
          git add test/kol-core.css .github/workflows/kol-rescue-card-layout-fix.yml
          git commit -m 'Fix Redde maten card spacing and clipping'
          git push origin HEAD:main