name: Orders fullscreen sidebar
on:
  push:
    branches:
      - fix/orders-fullscreen-sidebar-20260915
    paths:
      - .github/workflows/orders-fullscreen-sidebar.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply orders fullscreen sidebar patch
        run: python3 .github/scripts/orders-fullscreen-sidebar.py
      - name: Commit patched admin
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/admin.html demo/css/admin.css demo/js/admin.js
          git commit -m 'Collapse admin sidebar in orders workspace' || exit 0
          git push origin HEAD:fix/orders-fullscreen-sidebar-20260915
