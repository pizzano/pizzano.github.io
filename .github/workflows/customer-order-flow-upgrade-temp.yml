name: Customer order flow upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/customer-order-flow-upgrade-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer order upgrade
        run: |
          python3 .github/scripts/customer-order-upgrade-temp.py
          node --check demo/js/customer.js
          node --check demo/js/data.js
          node --check demo/js/admin.js
          node --check demo/js/install.js
      - name: Commit update and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/customer-order-flow-upgrade-temp.yml
          rm .github/scripts/customer-order-upgrade-temp.py
          rm -f .github/workflows/fix-customer-upgrade-runner-temp.yml
          git add demo/js/data.js demo/js/customer.js demo/index.html demo/css/customer.css demo/js/install.js demo/js/admin.js demo/admin.html demo/css/admin.css demo/service-worker.js .github/workflows/customer-order-flow-upgrade-temp.yml .github/scripts/customer-order-upgrade-temp.py
          git add -A .github/workflows/fix-customer-upgrade-runner-temp.yml || true
          git commit -m 'Complete customer order status and reliability flow'
          git push origin HEAD:main
