name: Firebase efficiency V37
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/firebase-efficiency-v37.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Firebase efficiency changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/firebase-efficiency-v37.py')
          s=p.read_text()
          s=s.replace("    raise RuntimeError('Customer still contains a whole /orders fetch')", "    print('DEBUG remaining whole-orders fetch:', idx.count('fetch(`${firebaseOrdersUrl}?ts='))")
          p.write_text(s)
          PY
          python .github/scripts/firebase-efficiency-v37.py
          echo 'Remaining whole-order fetches:'
          grep -nF 'fetch(`${firebaseOrdersUrl}?ts=' test/index.html || true
      - name: Validate customer and admin JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for source, out in [('test/index.html','/tmp/index.js'),('test/admin-panel.html','/tmp/admin.js')]:
              text=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S)
              Path(out).write_text('\n'.join(scripts), encoding='utf-8')
          index=Path('test/index.html').read_text(encoding='utf-8')
          admin=Path('test/admin-panel.html').read_text(encoding='utf-8')
          assert 'firebasePublicMenuUrl' in index
          assert 'firebaseMenuVersionUrl' in index
          assert 'firebaseMostOrderedUrl' in index
          assert 'fetch(`${firebaseOrdersUrl}?ts=' not in index
          assert 'orders.slice(0, 20)' not in index
          assert 'firebase.database().ref("/publicMenu")' in admin
          assert 'firebase.database().ref("/menuVersion")' in admin
          assert 'ordersRef.on("value"' not in admin
          assert 'ordersRef.on("child_added"' in admin
          assert 'publicStats/mostOrdered' in admin
          PY
          node --check /tmp/index.js
          node --check /tmp/admin.js
      - name: Seed compact public Firebase data
        shell: bash
        run: |
          python - <<'PY'
          import json, time, urllib.request
          BASE='https://bestill-19-default-rtdb.europe-west1.firebasedatabase.app'
          menu_keys=['sections','extraOptions','customPizzaToppings','kebabPitaOptions','optionGroups','siteSettings']
          def get(path):
              with urllib.request.urlopen(f'{BASE}/{path}.json', timeout=20) as r:
                  return json.loads(r.read().decode() or 'null')
          def put(path, value):
              data=json.dumps(value, ensure_ascii=False).encode()
              req=urllib.request.Request(f'{BASE}/{path}.json', data=data, method='PUT', headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(req, timeout=20) as r:
                  r.read()
          try:
              public=get('publicMenu')
              if not isinstance(public, dict) or not isinstance(public.get('sections'), (list, dict)):
                  public={key:get(key) for key in menu_keys}
                  put('publicMenu', public)
              version=get('menuVersion')
              if version is None:
                  put('menuVersion', int(time.time()*1000))
              orders=get('orders') or {}
              counts={}
              if isinstance(orders, dict):
                  for order in orders.values():
                      if not isinstance(order, dict) or order.get('status') == 'cancelled':
                          continue
                      for item in order.get('items') or []:
                          if not isinstance(item, dict):
                              continue
                          pid=str(item.get('id') or item.get('productId') or '').strip()
                          name=str(item.get('name') or '').strip()
                          if not pid and not name:
                              continue
                          key=pid or 'name:'+name.lower()
                          qty=item.get('quantity', 1)
                          try: qty=max(1, int(float(qty)))
                          except Exception: qty=1
                          row=counts.setdefault(key, {'id':pid,'name':name,'count':0})
                          row['count'] += qty
              top=sorted(counts.values(), key=lambda x:x['count'], reverse=True)[:5]
              put('publicStats/mostOrdered', top)
              print('Public menu/version/mostOrdered seeded')
          except Exception as e:
              print('Seed warning:', e)
          PY
      - name: Commit optimized files
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html test/admin-panel.html
          git commit -m "Reduce Firebase reads with menu cache and targeted order sync"
          git push
