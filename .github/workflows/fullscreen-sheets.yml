name: Fullscreen sheets
on:
  push:
    paths:
      - '.github/workflows/fullscreen-sheets.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert account info allergen to full screen
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          hp=Path('test/test.html')
          cp=Path('test/test.css')
          html=hp.read_text()
          css=cp.read_text()

          html=html.replace("['productScreen','cartScreen','infoScreen'].includes(id)", "['productScreen','cartScreen','infoScreen','accountScreen'].includes(id)")
          html=html.replace("function closeAllergens(){const modal=$('#allergenModal');if(modal)modal.hidden=true;document.body.classList.remove('allergen-modal-open')}", "function closeAllergens(){const modal=$('#allergenModal');if(modal)modal.hidden=true;document.body.classList.remove('allergen-modal-open','kol-top-back-active')}")
          html=html.replace("function openAllergens(){closeTransientLayers();draftAllergens=new Set(selectedAllergens);renderAllergens();$('#allergenModal').hidden=false;document.body.classList.add('allergen-modal-open')}", "function openAllergens(){closeTransientLayers();draftAllergens=new Set(selectedAllergens);renderAllergens();$('#allergenModal').hidden=false;document.body.classList.add('allergen-modal-open','kol-top-back-active')}")
          html=html.replace('test.css?v=product-reference-20260818-0024','test.css?v=fullscreen-20260818-0037')

          replacements={
          ".account-sheet{top:auto;bottom:0;height:min(72dvh,690px);border-radius:24px 24px 0 0;overflow:hidden;background:#fff;box-shadow:0 -100vh 0 100vh rgba(0,0,0,.25),0 -16px 50px rgba(0,0,0,.16)}":
          ".account-sheet{top:var(--head);bottom:0;height:auto;border-radius:0;overflow:hidden;background:#fff;box-shadow:none}",
          ".account-sheet-grip{position:absolute;top:8px;left:50%;width:42px;height:4px;transform:translateX(-50%);border-radius:999px;background:#ddd7d2}":
          ".account-sheet-grip{display:none}",
          ".info-sheet{top:auto;bottom:0;height:min(78dvh,760px);border-radius:24px 24px 0 0;overflow:hidden;background:#f7f7f7;box-shadow:0 -100vh 0 100vh rgba(0,0,0,.25),0 -16px 50px rgba(0,0,0,.16)}":
          ".info-sheet{top:var(--head);bottom:0;height:auto;border-radius:0;overflow:hidden;background:#f7f7f7;box-shadow:none}",
          ".info-sheet-grip{position:absolute;top:8px;left:50%;width:42px;height:4px;transform:translateX(-50%);border-radius:999px;background:#d9d5d2}":
          ".info-sheet-grip{display:none}",
          ".local-allergen-modal{position:fixed;z-index:150;top:var(--head);bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,var(--app));background:#0005;display:flex;align-items:flex-end}":
          ".local-allergen-modal{position:fixed;z-index:150;top:var(--head);bottom:0;left:50%;transform:translateX(-50%);width:min(100vw,var(--app));background:#fff;display:flex;align-items:stretch}",
          ".local-allergen-sheet{width:100%;max-height:92dvh;overflow:auto;background:#fff;border-radius:26px 26px 0 0;padding:18px}":
          ".local-allergen-sheet{width:100%;height:100%;max-height:none;overflow:auto;background:#fff;border-radius:0;padding:18px}"
          }
          for old,new in replacements.items():
              if old not in css:
                  raise SystemExit('missing css block: '+old[:60])
              css=css.replace(old,new,1)

          hp.write_text(html)
          cp.write_text(css)
          PY
      - name: Validate
        shell: bash
        run: |
          grep -q "accountScreen'].includes" test/test.html
          grep -q "allergen-modal-open','kol-top-back-active" test/test.html
          grep -q '.account-sheet{top:var(--head);bottom:0;height:auto;border-radius:0' test/test.css
          grep -q '.info-sheet{top:var(--head);bottom:0;height:auto;border-radius:0' test/test.css
          grep -q '.local-allergen-sheet{width:100%;height:100%;max-height:none' test/test.css
          ! grep -q 'height:min(72dvh' test/test.css
          ! grep -q 'height:min(78dvh' test/test.css
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/test.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          Path('/tmp/test.js').write_text(m.group(1))
          PY
          node --check /tmp/test.js
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/fullscreen-sheets.yml
          git add test/test.html test/test.css
          git commit -m 'Open profile info and allergens full screen'
          git push
