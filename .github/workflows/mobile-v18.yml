name: Mobile v18
on:
  push:
    branches: [main]
    paths:
      - 'mobile_v18_patch.py'
      - '.github/workflows/mobile-v18.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python mobile_v18_patch.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('test/index.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/customer-v18.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/customer-v18.js
      - name: Commit result
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Mobile v18 menu scroll and order selection'
          git push
