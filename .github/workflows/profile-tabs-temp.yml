name: Temporary profile tabs upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-tabs-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile tabs patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path = Path("demo/index.html")
          js_path = Path("demo/js/customer.js")
          css_path = Path("demo/css/customer.css")
          sw_path = Path("demo/service-worker.js")

          html = html_path.read_text(encoding="utf-8")
          start = html.find('            <details class="card profile-section" name="profile-sections" open>')
          end_marker = '            </details>\n        </section>\n\n        <!-- ============ INFO ============ -->'
          end = html.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Profile accordion block not found")
          end_details = end + len('            </details>')

          new_profile = '''            <nav class="profile-tabs" role="tablist" aria-label="Profilinnhold">
              <button class="profile-tab is-active" data-profile-tab="contact" id="profileTabContact" type="button" role="tab" aria-selected="true" aria-controls="profilePanelContact">Kontakt</button>
              <button class="profile-tab" data-profile-tab="favorites" id="profileTabFavorites" type="button" role="tab" aria-selected="false" aria-controls="profilePanelFavorites">Favoritter</button>
              <button class="profile-tab" data-profile-tab="orders" id="profileTabOrders" type="button" role="tab" aria-selected="false" aria-controls="profilePanelOrders">Bestillinger</button>
          </nav>

          <div class="profile-tab-panels">
              <section class="card profile-tab-panel is-active" id="profilePanelContact" data-profile-panel="contact" role="tabpanel" aria-labelledby="profileTabContact">
                  <p class="section-help">Lagre her hvis du vil fylle ut raskere neste gang.</p>
                  <div class="field">
                      <label class="field-label" for="profName">Navn</label>
                      <div class="validated-input"><input id="profName" class="input" type="text" placeholder="Fornavn og etternavn"><span class="valid-check" hidden aria-label="Gyldig">✓</span></div>
                  </div>
                  <div class="field">
                      <label class="field-label" for="profPhone">Mobilnummer</label>
                      <div class="phone-row">
                          <span class="phone-prefix">+47</span>
                          <div class="validated-input"><input id="profPhone" class="input" type="tel" inputmode="numeric" placeholder="8 siffer"><span class="valid-check" hidden aria-label="Gyldig">✓</span></div>
                      </div>
                  </div>
                  <button class="btn btn-primary" id="btnSaveProfile" type="button">Lagre opplysninger</button>
                  <span class="saved-flash" id="profileSaved" role="status" hidden>✓ Lagret</span>
              </section>

              <section class="card profile-tab-panel" id="profilePanelFavorites" data-profile-panel="favorites" role="tabpanel" aria-labelledby="profileTabFavorites" hidden>
                  <div id="favList" class="mini-list"></div>
              </section>

              <section class="card profile-tab-panel" id="profilePanelOrders" data-profile-panel="orders" role="tabpanel" aria-labelledby="profileTabOrders" hidden>
                  <div id="orderList" class="mini-list"></div>
              </section>
          </div>'''

          html = html[:start] + new_profile + html[end_details:]
          html = html.replace("?v=20260908-1", "?v=20260909-1")
          html_path.write_text(html, encoding="utf-8")

          js = js_path.read_text(encoding="utf-8")
          helper_marker = "function renderProfile() {"
          helper = '''function setProfileTab(tabName) {
            const validTabs = new Set(['contact', 'favorites', 'orders']);
            const activeTab = validTabs.has(tabName) ? tabName : 'contact';
            document.querySelectorAll('[data-profile-tab]').forEach((button) => {
              const active = button.dataset.profileTab === activeTab;
              button.classList.toggle('is-active', active);
              button.setAttribute('aria-selected', String(active));
            });
            document.querySelectorAll('[data-profile-panel]').forEach((panel) => {
              const active = panel.dataset.profilePanel === activeTab;
              panel.classList.toggle('is-active', active);
              panel.hidden = !active;
            });
            const activeButton = document.querySelector('[data-profile-tab="' + activeTab + '"]');
            if (activeButton && typeof activeButton.scrollIntoView === 'function') {
              activeButton.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
          }

          '''
          if "function setProfileTab(tabName)" not in js:
              if helper_marker not in js:
                  raise SystemExit("renderProfile marker not found")
              js = js.replace(helper_marker, helper + helper_marker, 1)

          click_marker = "document.addEventListener('click', (event) => {\n"
          click_code = '''  const profileTab = event.target.closest('[data-profile-tab]');
            if (profileTab) {
              setProfileTab(profileTab.dataset.profileTab);
              return;
            }
          '''
          if click_code not in js:
              if click_marker not in js:
                  raise SystemExit("document click marker not found")
              js = js.replace(click_marker, click_marker + click_code, 1)
          js_path.write_text(js, encoding="utf-8")

          css = css_path.read_text(encoding="utf-8")
          marker = "/* ======================== Horizontal profile tabs ======================== */"
          if marker not in css:
              css += '''

          /* ======================== Horizontal profile tabs ======================== */
          #viewProfile .profile-tabs {
            display: flex;
            align-items: center;
            gap: 6px;
            width: 100%;
            margin: 2px 0 10px;
            padding: 2px 0 5px;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
          }
          #viewProfile .profile-tabs::-webkit-scrollbar { display: none; }
          #viewProfile .profile-tab {
            flex: 1 0 auto;
            min-width: 112px;
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--surface);
            color: var(--ink-2);
            font: inherit;
            font-size: 12.5px;
            line-height: 1;
            font-weight: 700;
            white-space: nowrap;
            text-align: center;
            scroll-snap-align: center;
            transition: background .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease;
          }
          #viewProfile .profile-tab:hover { border-color: var(--line-strong); }
          #viewProfile .profile-tab.is-active {
            border-color: var(--accent);
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 6px rgba(232, 98, 15, .14);
          }
          #viewProfile .profile-tab:focus-visible {
            outline: 2px solid rgba(232, 98, 15, .28);
            outline-offset: 2px;
          }
          #viewProfile .profile-tab-panels { width: 100%; }
          #viewProfile .profile-tab-panel {
            margin: 0;
            padding: 14px;
            border-radius: 13px;
            animation: profilePanelIn .16s ease;
          }
          #viewProfile .profile-tab-panel[hidden] { display: none !important; }
          @keyframes profilePanelIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
          }
          @media (prefers-reduced-motion: reduce) {
            #viewProfile .profile-tab-panel { animation: none; }
            #viewProfile .profile-tab { transition: none; }
          }
          @media (max-width: 420px) {
            #viewProfile .profile-tabs { gap: 5px; margin-bottom: 8px; }
            #viewProfile .profile-tab {
              min-width: 104px;
              min-height: 36px;
              padding: 0 12px;
              font-size: 12px;
            }
            #viewProfile .profile-tab-panel { padding: 11px; border-radius: 11px; }
          }
          '''
          css_path.write_text(css, encoding="utf-8")

          sw = sw_path.read_text(encoding="utf-8")
          sw = re.sub(r"const CACHE_NAME = 'kol-demo-v\d+';", "const CACHE_NAME = 'kol-demo-v26';", sw, count=1)
          sw_path.write_text(sw, encoding="utf-8")
          PY
      - name: Validate customer JavaScript
        run: node --check demo/js/customer.js
      - name: Commit profile tabs
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/index.html demo/js/customer.js demo/css/customer.css demo/service-worker.js
          git commit -m 'Replace profile accordions with horizontal tabs' || exit 0
          git push origin HEAD:main
