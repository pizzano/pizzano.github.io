name: Customer order stability and rejection fix
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/customer-order-stability-rejection-temp.yml
      - fix_order_stability_tmp.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 fix_order_stability_tmp.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/data.js
          node --check demo/js/install.js
          node --check demo/js/customer.js
          node --check demo/js/admin.js
          node --check demo/js/allergen-ui.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/customer-order-stability-rejection-temp.yml
          rm fix_order_stability_tmp.py
          git add demo/js/data.js demo/js/install.js demo/js/customer.js demo/js/admin.js demo/js/allergen-ui.js demo/css/customer.css demo/index.html demo/admin.html demo/service-worker.js .github/workflows/customer-order-stability-rejection-temp.yml fix_order_stability_tmp.py
          git commit -m 'Stabilize customer countdown and show rejection reason'
          git push origin HEAD:main
