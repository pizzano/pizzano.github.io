name: Move demo files

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/move-demo-files.yml

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move demo files
        shell: bash
        run: |
          set -e
          mkdir -p demo
          cp test/test.css demo/kol.css
          sed 's#href="test\.css?v=[^"]*"#href="kol.css?v=demo-20260818"#' test/test.html > demo/index.html
          rm test/test.html test/test.css
          test -f demo/index.html
          test -f demo/kol.css
          grep -q 'href="kol.css?v=demo-20260818"' demo/index.html
          test ! -e test/test.html
          test ! -e test/test.css

      - name: Commit move
        shell: bash
        run: |
          git config user.name "KOL Move Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css test/test.html test/test.css
          git commit -m "Move demo app to demo folder"
          git push origin HEAD:main
