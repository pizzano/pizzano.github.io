name: Checkout review accordion mobile polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-review-accordion-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkout review accordion patch
        run: python3 .github/scripts/checkout-review-accordion-temp.py
      - name: Commit patch and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/checkout-review-accordion-temp.yml
          rm .github/scripts/checkout-review-accordion-temp.py
          git add demo/js/customer.js demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/checkout-review-accordion-temp.yml .github/scripts/checkout-review-accordion-temp.py
          git commit -m 'Polish checkout review accordion on mobile'
          git push origin HEAD:main
