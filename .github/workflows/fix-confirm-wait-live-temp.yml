name: Fix live confirmation wait
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-confirm-wait-live-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/fix-confirm-wait-live-temp.py
      - name: Validate
        run: |
          node --check demo/js/customer.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/fix-confirm-wait-live-temp.yml
          rm .github/scripts/fix-confirm-wait-live-temp.py
          git add demo/js/customer.js demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/fix-confirm-wait-live-temp.yml .github/scripts/fix-confirm-wait-live-temp.py
          git commit -m 'Fix customer confirmation wait and accepted countdown'
          git push origin HEAD:main
