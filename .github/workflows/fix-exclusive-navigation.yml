name: Fix exclusive navigation
on:
  push:
    paths:
      - '.github/workflows/fix-exclusive-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply navigation fix
        run: python .github/scripts/fix-exclusive-navigation.py
      - name: Validate JavaScript and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('test/test.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',text,re.S)
          Path('/tmp/test-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          required=[
            'function closeTransientLayers()',
            'function goToCategory(id)',
            "b.onclick=()=>goToCategory(b.dataset.tab)",
            "function openAllergens(){closeTransientLayers();",
          ]
          for token in required:
            assert token in text, token
          PY
          node --check /tmp/test-inline.js
          git diff --check
      - name: Commit and cleanup
        run: |
          rm -f .github/scripts/fix-exclusive-navigation.py .github/workflows/fix-exclusive-navigation.yml
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html .github/scripts/fix-exclusive-navigation.py .github/workflows/fix-exclusive-navigation.yml
          git commit -m 'Make navigation mutually exclusive'
          git push origin main
