name: Remove ingredient tag feature v3
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-ingredient-tags-v3.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run corrected cleanup
        shell: bash
        run: |
          awk '/python - <<'\''PY'\''/{flag=1;next} flag && /^          PY$/{exit} flag{sub(/^          /,""); print}' .github/workflows/remove-ingredient-tags-v2.yml > /tmp/ingredient-clean.py
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/ingredient-clean.py')
          s=p.read_text(encoding='utf-8')
          needle="a=a.replace('<link href=\"kol-core.css\" rel=\"stylesheet\"/>','<link href=\"kol-core.css?v=mobile-v27\" rel=\"stylesheet\"/>',1)"
          insert='''a,nprev=re.subn(r'\\n\\s*if \\(Array\\.isArray\\(previous\\.ingredientTags\\)\\) \\{.*?\\n\\s*\\}\\n\\s*if \\(previous\\.ingredientTagsConfigured === true \\|\\| Array\\.isArray\\(previous\\.ingredientTags\\)\\) \\{.*?\\n\\s*\\}', '', a, count=1, flags=re.S)\nif nprev!=1: raise SystemExit('admin previous ingredient tag preservation block not found')\n'''
          if needle not in s:
              raise SystemExit('injection point not found')
          s=s.replace(needle,insert+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
          python /tmp/ingredient-clean.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for file in ['test/index.html','test/admin-panel.html']:
              s=Path(file).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
              Path('/tmp/'+Path(file).stem+'.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/index.js
          node --check /tmp/admin-panel.js
          ! grep -q 'ingredientRemoval' test/index.html
          ! grep -q 'removedIngredients' test/index.html
          ! grep -q 'ingredientTags' test/index.html
          ! grep -q 'Ingredienser kunden kan fjerne' test/admin-panel.html
          ! grep -q 'ingredientTags' test/admin-panel.html
          ! grep -q 'productIngredientTagList' test/admin-panel.html
          ! grep -q 'ingredient-removal' test/kol-core.css
          ! grep -q 'ingredient-chip' test/kol-core.css
          grep -q 'product-summary{display:block' test/kol-core.css
      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/admin-panel.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Remove ingredient tag and removal feature'
          git push
