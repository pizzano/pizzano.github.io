name: Mobile v25 CSS only
on:
  push:
    branches: [main]
    paths:
      - 'fix_category_css_v25.py'
      - '.github/workflows/mobile-v25.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply CSS-only fix
        run: python fix_category_css_v25.py
      - name: Commit result
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Mobile v25 CSS-only fixed categories'
          git push
