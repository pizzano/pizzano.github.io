name: Order status V35 retry
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/status-v35.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply automatic ready status
        run: python .github/scripts/status-v35.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('test/index.html').read_text(encoding='utf-8')
          css = Path('test/kol-core.css').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'mobile-v35' in html
          assert 'Kjøkkenet har satt' in html
          assert 'promoteOrderToAutomaticReady' in html
          assert 'Vent på status <b>«Klar»</b>' not in html
          assert 'Kom og hent når det passer.' not in html
          assert 'live-status-flow' not in html
          assert css.count('{') == css.count('}')
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html test/kol-core.css
          git commit -m "Make orders ready automatically when countdown ends"
          git push
