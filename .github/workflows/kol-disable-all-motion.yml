name: KOL disable all motion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-disable-all-motion.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove animations and smooth movement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_paths = [Path('test/index.html'), Path('test/admin-panel.html')]
          for path in html_paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace('"smooth"', '"auto"').replace("'smooth'", "'auto'")
              path.write_text(text, encoding='utf-8')

          css_path = Path('test/kol-core.css')
          css = css_path.read_text(encoding='utf-8')

          # Remove all CSS transition/animation declarations.
          css = re.sub(r'(?i)(?:-webkit-)?transition(?:-[a-z-]+)?\s*:\s*[^;{}]*;?', '', css)
          css = re.sub(r'(?i)(?:-webkit-)?animation(?:-[a-z-]+)?\s*:\s*[^;{}]*;?', '', css)
          css = re.sub(r'(?i)scroll-behavior\s*:\s*smooth\s*;?', 'scroll-behavior:auto;', css)

          # Remove keyframe blocks completely.
          def remove_at_block(source, token):
              lower = source.lower()
              token = token.lower()
              while True:
                  start = lower.find(token)
                  if start < 0:
                      break
                  brace = source.find('{', start)
                  if brace < 0:
                      break
                  depth = 0
                  end = brace
                  while end < len(source):
                      if source[end] == '{':
                          depth += 1
                      elif source[end] == '}':
                          depth -= 1
                          if depth == 0:
                              end += 1
                              break
                      end += 1
                  source = source[:start] + source[end:]
                  lower = source.lower()
              return source

          css = remove_at_block(css, '@keyframes')
          css = remove_at_block(css, '@-webkit-keyframes')

          # Hover/press rules must not physically move/scale/rotate elements.
          simple_rule = re.compile(r'([^{}]+)\{([^{}]*)\}')
          def clean_interaction_rule(match):
              selector, body = match.group(1), match.group(2)
              low = selector.lower()
              if ':hover' in low or ':active' in low:
                  body = re.sub(r'(?i)(?:-webkit-)?transform\s*:\s*[^;{}]*;?', '', body)
              return selector + '{' + body + '}'

          for _ in range(3):
              css = simple_rule.sub(clean_interaction_rule, css)

          marker = '/* KOL ALL MOTION DISABLED */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip()
          css += '''\n\n/* KOL ALL MOTION DISABLED */\nhtml{scroll-behavior:auto!important;}\nbody.kol-customer *,body.kol-customer *::before,body.kol-customer *::after,body.kol-admin *,body.kol-admin *::before,body.kol-admin *::after{transition:none!important;animation:none!important;}\n'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Validate no motion remains
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('test/index.html'), Path('test/admin-panel.html')]:
              text = path.read_text(encoding='utf-8').lower()
              assert '"smooth"' not in text
              assert "'smooth'" not in text
          css = Path('test/kol-core.css').read_text(encoding='utf-8')
          assert not re.search(r'(?i)@(?:-webkit-)?keyframes', css)
          assert not re.search(r'(?i)\banimation(?:-[a-z-]+)?\s*:', css.replace('animation:none!important;', ''))
          assert not re.search(r'(?i)\btransition(?:-[a-z-]+)?\s*:', css.replace('transition:none!important;', ''))
          assert not re.search(r'(?is):(?:hover|active)[^{}]*\{[^{}]*\btransform\s*:', css)
          print('No-motion validation OK')
          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/kol-disable-all-motion.yml
          git add test/index.html test/admin-panel.html test/kol-core.css .github/workflows/kol-disable-all-motion.yml
          git commit -m 'Remove all customer and admin animations'
          git push origin HEAD:main