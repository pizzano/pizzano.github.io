name: Premium order status V30
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/order-status-v30.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V30
        run: python .github/scripts/order_status_v30.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('test/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', text, re.S)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'status-v30-countdown-hero' in text
          assert 'mobile-v30' in text
          css=Path('test/kol-core.css').read_text(encoding='utf-8')
          assert 'PREMIUM ORDER STATUS V30' in css
          assert 'PREMIUM ORDER STATUS V29' not in css
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html test/kol-core.css
          git commit -m "Redesign order status with clearer pickup countdown"
          git push
