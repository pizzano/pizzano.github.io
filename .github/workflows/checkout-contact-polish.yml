name: Checkout contact polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-contact-polish.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply checkout polish
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python /tmp/patch.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('test/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.js
          grep -q 'Vanligvis klar om ca. 10–15 min' test/index.html
          grep -q 'contact-field-help' test/index.html
          grep -q 'input-valid' test/kol-core.css
      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Polish pickup and contact checkout'
          git push
