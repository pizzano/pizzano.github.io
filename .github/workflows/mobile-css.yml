name: mobile css
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 kol_mobile_css_cleanup.py
      - run: |
          git config user.name KOLBot
          git config user.email bot@users.noreply.github.com
          rm kol_mobile_css_cleanup.py .github/workflows/mobile-css.yml
          git add test/index.html test/kol-core.css kol_mobile_css_cleanup.py .github/workflows/mobile-css.yml
          git commit -m 'Use one mobile-only customer layout'
          git push