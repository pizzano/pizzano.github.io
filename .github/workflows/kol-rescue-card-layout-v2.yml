name: KOL rescue card layout v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-rescue-card-layout-v2.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Redde maten card fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/kol_fix.py
          python3 /tmp/kol_fix.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/kol-rescue-card-layout-v2.yml
          git add test/index.html test/kol-core.css .github/workflows/kol-rescue-card-layout-v2.yml
          git commit -m 'Fix Redde maten card layout correctly'
          git push origin HEAD:main