name: Flatten test.css
on:
  push:
    paths:
      - '.github/workflows/flatten-test-css.yml'
permissions:
  contents: write
jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Flatten stylesheet
        run: python .github/scripts/flatten-test-css.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('test/test.html').read_text(encoding='utf-8')
          c=Path('test/test.css').read_text(encoding='utf-8')
          assert 'href="test.css?v=20260817-2305"' in h
          assert '<style>' not in h
          assert '@import ' not in c
          assert '@layer mobile,legacy' not in c
          assert 'content:none!important' in c
          assert len(c) > 50000
          PY
          git diff --check
      - name: Commit and clean helpers
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.css
          git rm -f .github/scripts/flatten-test-css.py .github/workflows/flatten-test-css.yml
          git commit -m 'Make test.css fully self-contained'
          git push
