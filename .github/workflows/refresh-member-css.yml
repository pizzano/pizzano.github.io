name: Refresh member demo stylesheet cache
on:
  push:
    paths:
      - '.github/workflows/refresh-member-css.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh stylesheet key
        run: sed -i 's/test\.css?v=[^" ]*/test.css?v=member-fix-20260817-2336/' test/test.html
      - name: Commit and clean helper
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/workflows/refresh-member-css.yml
          git commit -m 'Reload member demo stylesheet cleanly'
          git push
