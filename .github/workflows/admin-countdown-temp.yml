name: Live countdown orders patch
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-countdown-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 admin_countdown_patch.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/admin.js
          node --check demo/js/customer.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f admin_countdown_patch.py .github/workflows/admin-countdown-temp.yml
          git add demo/admin.html demo/index.html demo/js/admin.js demo/js/customer.js demo/css/admin.css demo/css/customer.css demo/service-worker.js admin_countdown_patch.py .github/workflows/admin-countdown-temp.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add live countdowns and simplify admin orders'
            git push origin HEAD:main
          fi
