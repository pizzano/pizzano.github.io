name: Add free pizza loyalty redemption

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/loyalty-free-pizza.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch demo loyalty flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          hp=Path('demo/index.html')
          cp=Path('demo/kol.css')
          h=hp.read_text(encoding='utf-8')
          c=cp.read_text(encoding='utf-8')

          h=h.replace('kol.css?v=demo-20260818','kol.css?v=loyalty-20260818-1447')

          old='''      <div class="cart-summary"><div class="total-row"><span>Sluttsum</span><strong id="cartTotal">0,00 kr</strong></div><div class="tax-note-row" id="taxNote">(inkl. mva)</div></div>'''
          new='''      <div class="cart-summary"><div class="total-row"><span>Sluttsum</span><strong id="cartTotal">0,00 kr</strong></div><div class="cart-savings" id="cartSavings" hidden></div><div class="tax-note-row" id="taxNote">(inkl. mva)</div></div>'''
          assert old in h
          h=h.replace(old,new)

          old='''      <p class="product-summary" id="productDesc"></p>'''
          new='''      <p class="product-summary" id="productDesc"></p>
      <div class="reward-product-banner" id="rewardProductBanner" hidden></div>'''
          assert old in h
          h=h.replace(old,new)

          marker='''<section class="screen" id="allergenScreen" hidden>'''
          reward='''<section class="screen" id="rewardScreen" hidden>
  <div class="screen-scroll reward-scroll">
    <div class="screen-title"><h2>Velg gratis Stor Pizza</h2><p>Du har samlet 10 kuponger. Velg den 11. pizzaen din gratis.</p></div>
    <div class="reward-pizza-list" id="rewardPizzaList"></div>
  </div>
</section>

'''
          assert marker in h
          h=h.replace(marker,reward+marker,1)

          old="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap',toastTimer=0;"
          new="let selectedProduct=null,selectedSize=0,selectedStrength='',qty=1,checkoutStep=1,editingCartIndex=-1,pickupChoice='asap',toastTimer=0,rewardMode=false;"
          assert old in h
          h=h.replace(old,new)

          old="const account=()=>session&&accounts[session]?accounts[session]:null;"
          new="""function normalizeLoyalty(a){
  if(!a)return a;
  let changed=false;
  const legacyRewards=Math.max(0,Number(a.rewards)||0);
  let stamps=Math.max(0,Number(a.stamps)||0);
  if(legacyRewards>0&&stamps<10){stamps=10;changed=true}
  if(stamps>10){stamps=10;changed=true}
  if(a.stamps!==stamps){a.stamps=stamps;changed=true}
  if(a.rewards!==0){a.rewards=0;changed=true}
  const savings=Math.max(0,Number(a.savings)||0);
  if(a.savings!==savings){a.savings=savings;changed=true}
  if(changed)save(KEY.accounts,accounts);
  return a;
}
const account=()=>session&&accounts[session]?normalizeLoyalty(accounts[session]):null;"""
          assert old in h
          h=h.replace(old,new)

          old="function ensureAccount(phone){if(!accounts[phone])accounts[phone]={phone,name:'',email:'',marketing:true,stamps:0,rewards:0,favorites:[]};save(KEY.accounts,accounts);return accounts[phone]}"
          new="function ensureAccount(phone){if(!accounts[phone])accounts[phone]={phone,name:'',email:'',marketing:true,stamps:0,rewards:0,savings:0,favorites:[]};normalizeLoyalty(accounts[phone]);save(KEY.accounts,accounts);return accounts[phone]}"
          assert old in h
          h=h.replace(old,new)

          old='''function openProduct(id){
  const p=product(id);if(!p)return;
  editingCartIndex=-1;selectedProduct=p;selectedSize=0;selectedStrength=p.strengths?.[0]||'';qty=1;
  $('#addToCart').textContent='Legg til i handlekurven';
  fillProduct();openView('productScreen',{tabs:true});setActiveTab(p.sectionId,true);
}'''
          new='''function openProduct(id,{reward=false}={}){
  const p=product(id);if(!p)return;
  rewardMode=!!reward;
  editingCartIndex=-1;selectedProduct=p;selectedSize=0;selectedStrength=p.strengths?.[0]||'';qty=1;
  if(rewardMode){
    const storIndex=p.sizes.findIndex(s=>norm(s[0])==='stor');
    if(storIndex<0){rewardMode=false;showToast('Denne pizzaen finnes ikke som Stor');return}
    selectedSize=storIndex;
  }
  $('#addToCart').textContent=rewardMode?'Legg til gratis Stor Pizza':'Legg til i handlekurven';
  fillProduct();openView('productScreen',{tabs:true});setActiveTab(p.sectionId,true);
}'''
          assert old in h
          h=h.replace(old,new)

          old='''function openCartEdit(index){
  const line=cart[index],p=line&&product(line.productId);if(!line||!p)return;
  editingCartIndex=index;selectedProduct=p;selectedSize=Math.max(0,p.sizes.findIndex(s=>s[0]===line.size));selectedStrength=line.strength||p.strengths?.[0]||'';qty=Math.max(1,line.qty||1);
  $('#addToCart').textContent='Oppdater handlekurven';
  fillProduct(line.note||'');openView('productScreen',{tabs:true});setActiveTab(p.sectionId,true);
}'''
          new='''function openCartEdit(index){
  const line=cart[index],p=line&&product(line.productId);if(!line||!p)return;
  rewardMode=!!line.freeReward;
  editingCartIndex=index;selectedProduct=p;selectedSize=Math.max(0,p.sizes.findIndex(s=>s[0]===line.size));selectedStrength=line.strength||p.strengths?.[0]||'';qty=rewardMode?1:Math.max(1,line.qty||1);
  $('#addToCart').textContent=rewardMode?'Oppdater gratis pizza':'Oppdater handlekurven';
  fillProduct(line.note||'');openView('productScreen',{tabs:true});setActiveTab(p.sectionId,true);
}'''
          assert old in h
          h=h.replace(old,new)

          old="""  $('#qtyValue').textContent=qty;$('#productNote').value=note;
  renderSizeOptions();renderStrengthOptions();updateProductTotal();"""
          new="""  $('#qtyValue').textContent=qty;$('#productNote').value=note;
  const rewardBanner=$('#rewardProductBanner');
  const quantityRow=document.querySelector('.quantity-row');
  if(rewardMode){
    const regular=selectedProduct.sizes[selectedSize][1];
    rewardBanner.hidden=false;rewardBanner.innerHTML=`🎁 <strong>Gratis Stor Pizza</strong><span>Du sparer ${money(regular)}</span>`;
    quantityRow.hidden=true;
  }else{
    rewardBanner.hidden=true;rewardBanner.innerHTML='';quantityRow.hidden=false;
  }
  renderSizeOptions();renderStrengthOptions();updateProductTotal();"""
          assert old in h
          h=h.replace(old,new)

          old='''function renderSizeOptions(){
  const group=$('#sizeGroup');
  if(selectedProduct.sizes.length<=1){group.hidden=true;$('#sizeOptions').innerHTML='';return}
  group.hidden=false;'''
          new='''function renderSizeOptions(){
  const group=$('#sizeGroup');
  if(rewardMode){group.hidden=true;$('#sizeOptions').innerHTML='';return}
  if(selectedProduct.sizes.length<=1){group.hidden=true;$('#sizeOptions').innerHTML='';return}
  group.hidden=false;'''
          assert old in h
          h=h.replace(old,new)

          old="function updateProductTotal(){$('#productTotal').textContent=productMoney(selectedProduct.sizes[selectedSize][1]*qty)}"
          new="function updateProductTotal(){$('#productTotal').textContent=rewardMode?'0,00 KR':productMoney(selectedProduct.sizes[selectedSize][1]*qty)}"
          assert old in h
          h=h.replace(old,new)

          start=h.index('function addOrUpdateCart(){')
          end=h.index('\n\nfunction renderCart(){',start)
          assert start>=0 and end>start
          new_func='''function addOrUpdateCart(){
  const size=selectedProduct.sizes[selectedSize],note=$('#productNote').value.trim(),strength=selectedProduct.strengths?.length?selectedStrength:'';
  if(rewardMode){
    const a=account();
    if(!a||a.stamps<10){rewardMode=false;showToast('Gratis pizza er ikke tilgjengelig');return}
    const existingReward=cart.findIndex((x,i)=>x.freeReward&&i!==editingCartIndex);
    if(existingReward>=0){showToast('Gratis pizza ligger allerede i handlekurven');return}
    const entry={key:`reward|${selectedProduct.id}|Stor|${note}`,productId:selectedProduct.id,name:selectedProduct.name,size:'Stor',strength:'',price:0,regularPrice:size[1],qty:1,note,freeReward:true};
    if(editingCartIndex>=0&&cart[editingCartIndex])cart[editingCartIndex]=entry;else cart.push(entry);
    editingCartIndex=-1;rewardMode=false;save(KEY.cart,cart);renderCartCount();renderCart();openView('cartScreen',{tabs:true});
    showToast(`Gratis pizza lagt i handlekurven – du sparer ${money(size[1])}`);return;
  }
  const entry={key:`${selectedProduct.id}|${size[0]}|${strength}|${note}`,productId:selectedProduct.id,name:selectedProduct.name,size:size[0],strength,price:size[1],qty,note};
  if(editingCartIndex>=0&&cart[editingCartIndex]){
    cart[editingCartIndex]=entry;editingCartIndex=-1;save(KEY.cart,cart);renderCartCount();renderCart();openView('cartScreen',{tabs:true});showToast('Handlekurv oppdatert');return;
  }
  const old=cart.find(x=>x.key===entry.key);old?old.qty+=qty:cart.push(entry);
  save(KEY.cart,cart);renderCartCount();goMenu();showToast(`${selectedProduct.name} lagt i handlekurven`);
}'''
          h=h[:start]+new_func+h[end:]

          old="""function renderCart(){
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  $('#cartLines').innerHTML=cart.map((x,i)=>`<div class=\"cart-line\">"""
          new="""function renderCart(){
  const total=cart.reduce((s,x)=>s+x.price*x.qty,0);
  const savings=cart.reduce((s,x)=>s+(x.freeReward?(Number(x.regularPrice)||0)*x.qty:0),0);
  $('#cartLines').innerHTML=cart.map((x,i)=>`<div class=\"cart-line ${x.freeReward?'reward-line':''}\">"""
          assert old in h
          h=h.replace(old,new)

          old='''    <div class="cart-line-main"><span class="cart-qty-badge">${x.qty}x</span><div class="cart-line-copy"><strong>${escapeHtml(x.name)}</strong><small>Størrelse: <b>${escapeHtml(x.size)}</b>${x.strength?`<br>Styrke: <b>${escapeHtml(x.strength)}</b>`:''}${x.note?`<br>${escapeHtml(x.note)}`:''}</small></div></div>
    <div class="cart-line-side"><b class="cart-line-price">${money(x.price*x.qty)}</b><div class="cart-line-actions"><button class="cart-edit-btn" data-editcart="${i}" aria-label="Rediger">✎</button><button class="cart-remove-btn" data-remove="${i}" aria-label="Fjern">×</button></div></div>'''
          new='''    <div class="cart-line-main"><span class="cart-qty-badge">${x.qty}x</span><div class="cart-line-copy"><strong>${escapeHtml(x.name)}</strong><small>Størrelse: <b>${escapeHtml(x.size)}</b>${x.strength?`<br>Styrke: <b>${escapeHtml(x.strength)}</b>`:''}${x.freeReward?`<br><span class="reward-cart-note">Gratis medlemsfordel · Du sparer ${money(x.regularPrice||0)}</span>`:''}${x.note?`<br>${escapeHtml(x.note)}`:''}</small></div></div>
    <div class="cart-line-side"><b class="cart-line-price">${x.freeReward?`<span class="reward-old-price">${money(x.regularPrice||0)}</span><span class="reward-free-price">0,00 kr</span>`:money(x.price*x.qty)}</b><div class="cart-line-actions"><button class="cart-edit-btn" data-editcart="${i}" aria-label="Rediger">✎</button><button class="cart-remove-btn" data-remove="${i}" aria-label="Fjern">×</button></div></div>'''
          assert old in h
          h=h.replace(old,new)

          old="""  $('#cartTotal').textContent=money(total);
  $('#taxNote').textContent=`(inkl. mva ${money(total*15/115)})`;"""
          new="""  $('#cartTotal').textContent=money(total);
  $('#cartSavings').hidden=!savings;$('#cartSavings').textContent=savings?`Du sparer ${money(savings)} med medlemsfordelen`:'';
  $('#taxNote').textContent=`(inkl. mva ${money(total*15/115)})`;"""
          assert old in h
          h=h.replace(old,new)

          old="""  const large=cart.filter(x=>x.productId.startsWith('p')&&norm(x.size)==='stor').reduce((n,x)=>n+x.qty,0);
  if(large){const sum=(a.stamps||0)+large;a.rewards=(a.rewards||0)+Math.floor(sum/10);a.stamps=sum%10}
  saveAccounts();"""
          new="""  normalizeLoyalty(a);
  const wasLocked=(a.stamps||0)>=10;
  const freeRewardUsed=cart.some(x=>x.freeReward);
  const orderSavings=cart.reduce((s,x)=>s+(x.freeReward?(Number(x.regularPrice)||0)*x.qty:0),0);
  const paidLarge=cart.filter(x=>!x.freeReward&&x.productId.startsWith('p')&&norm(x.size)==='stor').reduce((n,x)=>n+x.qty,0);
  if(wasLocked){
    if(freeRewardUsed)a.stamps=0;
  }else if(paidLarge){
    a.stamps=Math.min(10,(a.stamps||0)+paidLarge);
  }
  if(freeRewardUsed)a.savings=(a.savings||0)+orderSavings;
  a.rewards=0;
  orders[0].savings=orderSavings;save(KEY.orders,orders);
  saveAccounts();"""
          assert old in h
          h=h.replace(old,new)

          start=h.index('function stampsHtml(a)')
          end=h.index('\nfunction renderLogin(){',start)
          assert start>=0 and end>start
          new_loyalty='''function stampsHtml(a){const count=Math.min(10,Math.max(0,Number(a.stamps)||0));return Array.from({length:10},(_,i)=>`<span class="stamp ${i<count?'on':''}"><b>${i+1}</b><i>🍕</i></span>`).join('')}
function pizzaProgress(a){
  normalizeLoyalty(a);
  const ready=(a.stamps||0)>=10, rewardInCart=cart.some(x=>x.freeReward), saved=Number(a.savings)||0;
  return `<section class="pizza-loyalty-card"><div class="pizza-loyalty-top"><div><small>STOR PIZZA-KUPONGER</small><h3>${Math.min(10,a.stamps||0)} av 10</h3></div><div class="pizza-reward">${ready?1:0}<span>gratis</span></div></div><div class="stamps">${stampsHtml(a)}</div><p>Kjøp 10 Stor Pizza – <strong>den 11. er gratis.</strong></p>${ready?`<div class="reward-ready">🎁 Din gratis Stor Pizza er klar</div><button class="reward-claim-button" id="claimRewardBtn" ${rewardInCart?'disabled':''}>${rewardInCart?'Gratis pizza ligger i handlekurven':'Velg gratis Stor Pizza'}</button>`:''}${saved?`<div class="loyalty-savings">Totalt spart med medlemsfordeler: <strong>${money(saved)}</strong></div>`:''}</section>`
}
function renderRewardPicker(){
  const a=account();if(!a||a.stamps<10){showToast('Du har ikke en gratis pizza klar');return}
  if(cart.some(x=>x.freeReward)){showToast('Gratis pizza ligger allerede i handlekurven');return}
  const pizzas=MENU.find(s=>s.id==='pizza')?.items||[];
  $('#rewardPizzaList').innerHTML=pizzas.map(p=>{const stor=p.sizes.find(s=>norm(s[0])==='stor');if(!stor)return'';return `<button class="reward-pizza-card" data-reward-pizza="${p.id}"><span class="reward-pizza-image" style="background-image:url('${p.image||''}')"></span><span class="reward-pizza-copy"><strong>${escapeHtml(p.name)}</strong><small>${escapeHtml(p.description||'')}</small><em>Stor · ${money(stor[1])} → Gratis</em></span><b>Velg</b></button>`}).join('');
  $$('[data-reward-pizza]').forEach(b=>b.onclick=()=>openProduct(b.dataset.rewardPizza,{reward:true}));
  openView('rewardScreen',{tabs:true});setActiveTab('pizza',true);
}'''
          h=h[:start]+new_loyalty+h[end:]

          old="""  $$('[data-account]').forEach(b=>b.onclick=()=>b.dataset.account==='orders'?renderOrders():renderContact());
  $('#logoutBtn').onclick=()=>{setSession(null);renderLogin();showToast('Logget ut')};"""
          new="""  $$('[data-account]').forEach(b=>b.onclick=()=>b.dataset.account==='orders'?renderOrders():renderContact());
  const claim=$('#claimRewardBtn');if(claim&&!claim.disabled)claim.onclick=renderRewardPicker;
  $('#logoutBtn').onclick=()=>{setSession(null);renderLogin();showToast('Logget ut')};"""
          assert old in h
          h=h.replace(old,new)

          css_marker='/* Loyalty reward redemption */'
          if css_marker in c:c=c.split(css_marker,1)[0].rstrip()+'\n'
          c += r'''

/* Loyalty reward redemption */
.reward-ready{display:flex;align-items:center;justify-content:center;margin-top:10px;padding:9px 11px;border-radius:10px;background:#fff1ea;color:#b84b25;font-size:12px;font-weight:700;text-align:center}
.reward-claim-button{width:100%;height:46px;margin-top:9px;border:0;border-radius:11px;background:var(--o);color:#fff;font-weight:750}.reward-claim-button:disabled{background:#ded8d4;color:#8c837d;cursor:default}
.loyalty-savings{margin-top:10px;padding-top:10px;border-top:1px solid #eee4de;color:#756b65;font-size:12px}.loyalty-savings strong{color:#302b28}
.reward-scroll{background:#f8f7f5}.reward-pizza-list{display:grid;gap:10px;padding:14px}.reward-pizza-card{width:100%;min-height:92px;display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px;border:1px solid #e9e1dc;border-radius:15px;background:#fff;text-align:left}.reward-pizza-image{width:74px;height:74px;border-radius:10px;background:#eee center/cover no-repeat}.reward-pizza-copy{min-width:0}.reward-pizza-copy strong,.reward-pizza-copy small,.reward-pizza-copy em{display:block}.reward-pizza-copy strong{font-size:14px}.reward-pizza-copy small{margin-top:4px;color:#7c736d;font-size:12px;line-height:1.35}.reward-pizza-copy em{margin-top:6px;color:#d25327;font-size:11px;font-style:normal;font-weight:700}.reward-pizza-card>b{padding:8px 10px;border-radius:9px;background:#fff1ea;color:#c84e24;font-size:12px}
.reward-product-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border-bottom:1px solid #f1d1c3;background:#fff5ef;color:#be4a21;font-size:12px}.reward-product-banner strong{font-size:13px}.reward-product-banner span{white-space:nowrap;font-weight:700}
.reward-line{background:#fffdfb}.reward-cart-note{color:#d05227;font-weight:700}.cart-line-price .reward-old-price{display:block;color:#8f8781;font-size:10.5px;text-decoration:line-through;font-weight:500}.cart-line-price .reward-free-price{display:block;color:#168458;font-size:14px;font-weight:800}.cart-savings{margin-top:9px;padding:9px 10px;border-radius:9px;background:#eef8f3;color:#18714e;font-size:12px;font-weight:700}
@media(max-width:420px){.reward-pizza-card{grid-template-columns:64px minmax(0,1fr) auto}.reward-pizza-image{width:64px;height:64px}.reward-pizza-card>b{padding:7px 8px}.reward-product-banner{font-size:11.5px}}
'''

          hp.write_text(h,encoding='utf-8')
          cp.write_text(c,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('demo/index.html').read_text(encoding='utf-8')
          c=Path('demo/kol.css').read_text(encoding='utf-8')
          checks=[
            'Velg gratis Stor Pizza', 'freeReward:true', 'Math.min(10,(a.stamps||0)+paidLarge)',
            'Du sparer ${money(savings)}', 'renderRewardPicker', 'rewardProductBanner',
            'Loyalty reward redemption'
          ]
          for x in checks: assert x in h or x in c, x
          scripts=re.findall(r'<script>([\s\S]*?)</script>',h)
          assert scripts
          Path('/tmp/demo-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/demo-inline.js

      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Loyalty Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          git commit -m "Add free pizza loyalty redemption"
          git push origin HEAD:main
