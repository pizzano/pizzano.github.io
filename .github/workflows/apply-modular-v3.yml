name: Apply modular frontend v3
on:
  push:
    branches: [main]
    paths: ['.github/merge-v3/**', '.github/workflows/apply-modular-v3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and install modular demo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, lzma, io, tarfile, zipfile, shutil
          parts=sorted(Path('.github/merge-v3').glob('part*.txt'))
          assert len(parts)==5, f'Expected 5 parts, got {len(parts)}'
          encoded=''.join(p.read_text().strip() for p in parts)
          raw=lzma.decompress(base64.b64decode(encoded))
          out=Path('/tmp/kol-v3'); shutil.rmtree(out, ignore_errors=True); out.mkdir()
          bio=io.BytesIO(raw)
          extracted=False
          try:
              with tarfile.open(fileobj=bio, mode='r:*') as t:
                  t.extractall(out); extracted=True
          except tarfile.TarError:
              pass
          if not extracted:
              bio.seek(0)
              if zipfile.is_zipfile(bio):
                  bio.seek(0)
                  with zipfile.ZipFile(bio) as z: z.extractall(out)
                  extracted=True
          if not extracted:
              raise RuntimeError('Decoded payload is neither tar nor zip')
          expected={'index.html','kol.css','app.js','data.js','admin.html','admin.css','admin.js'}
          candidates=[]
          for p in out.rglob('index.html'):
              if expected.issubset({x.name for x in p.parent.iterdir() if x.is_file()}): candidates.append(p.parent)
          if not candidates: raise RuntimeError('Could not locate modular app directory')
          src=candidates[0]
          dest=Path('demo'); dest.mkdir(exist_ok=True)
          for name in expected: shutil.copy2(src/name, dest/name)
          print('Installed from', src)
          PY
          node --check demo/app.js
          node --check demo/data.js
          node --check demo/admin.js
          rm -rf .github/merge-v3 .github/workflows/apply-modular-v3.yml
      - name: Commit installed demo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'pizzano'
          git config user.email '152447842+pizzano@users.noreply.github.com'
          git add -A
          git commit -m 'Install modular frontend v3 on demo'
          git push origin main
