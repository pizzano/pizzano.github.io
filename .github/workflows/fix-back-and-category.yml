name: Fix back and category sync
on:
  push:
    paths:
      - '.github/workflows/fix-back-and-category.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply focused UI fix
        run: python .github/scripts/fix-back-and-category.py
      - name: Validate JavaScript and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('test/test.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',h)
          assert m
          Path('/tmp/test.js').write_text(m.group(1),encoding='utf-8')
          assert "['productScreen','cartScreen','infoScreen'].includes(id)" in h
          assert "scheduleActiveCategorySync" in h
          assert "openAllergens" in h
          assert "draftAllergens.has(b.dataset.allergen)" in h
          PY
          node --check /tmp/test.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/scripts/fix-back-and-category.py .github/workflows/fix-back-and-category.yml
          git add test/test.html test/test.css
          git commit -m 'Restore back navigation and active category sync'
          git push
