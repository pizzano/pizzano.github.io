name: Move shop info to header
on:
  push:
    branches:
      - fix/move-shop-info-to-header-20260917
    paths:
      - .github/workflows/move-shop-info-header.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/move-shop-info-to-header-20260917
      - name: Apply shop info header patch
        run: python .github/scripts/move-shop-info-header.py
      - name: Commit patched customer UI
        run: |
          git config user.name "pizzano"
          git config user.email "152447842+pizzano@users.noreply.github.com"
          git add demo/js/shop-info.js demo/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Move shop info icon into header"
          git push
