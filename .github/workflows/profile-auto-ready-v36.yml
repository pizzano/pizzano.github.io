name: Profile auto ready V36
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-auto-ready-v36.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply profile ready logic
        run: python .github/scripts/profile-auto-ready-v36.py
      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('test/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'mobile-v36' in html
          assert 'function isOrderReadyForPickup' in html
          assert 'function refreshProfileReadyStates' in html
          assert 'profileReady ? "ready"' in html
          assert 'if (isOrderReadyForPickup(order)) return "Maten er klar";' in html
          PY
          node --check /tmp/index.js
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html
          git commit -m "Sync profile orders with automatic ready time"
          git push
