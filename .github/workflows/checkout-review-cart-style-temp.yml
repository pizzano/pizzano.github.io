name: Checkout review cart style polish
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-review-cart-style-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Polish checkout review on mobile
        run: |
          echo '' | base64 -d >> demo/css/customer.css
          sed -i -E 's#(/demo/css/customer\.css\?v=)[^" ]+#\1v20260915-food4#' demo/index.html || true
          sed -i "s/const CACHE_NAME = 'kol-demo-v35';/const CACHE_NAME = 'kol-demo-v36';/" demo/service-worker.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/checkout-review-cart-style-temp.yml
          git add demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/checkout-review-cart-style-temp.yml
          git commit -m 'Polish checkout review details like cart'
          git push origin HEAD:main
