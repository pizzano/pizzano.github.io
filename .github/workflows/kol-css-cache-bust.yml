name: Refresh rebuilt customer CSS cache

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cache-bust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh stylesheet version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('test/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'kol-core.css?v=mobile-v36'
          new = 'kol-core.css?v=rebuild-20260817-0904'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('stylesheet link not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit cache refresh and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL UI Rebuild Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/kol-css-cache-bust.yml
          git add -- test/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Activate rebuilt customer UI stylesheet"
          git push origin HEAD:main
