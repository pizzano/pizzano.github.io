name: Apply customer default size support
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-default-size.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js
        shell: python
        run: |
          from pathlib import Path
          p=Path('demo/app.js')
          s=p.read_text(encoding='utf-8')
          old="""          sizes: adminSizes(product),
          strengths: adminStrengths(product, config),"""
          new="""          sizes: adminSizes(product),
          defaultSizeIndex: Math.max(0, Number(product.defaultSizeIndex) || 0),
          strengths: adminStrengths(product, config),"""
          if old not in s:
              raise SystemExit('normalize product target not found')
          s=s.replace(old,new,1)
          old2="""  state.product.selected = selected;
  state.product.sizeIndex = 0;
  state.product.strength = selected.strengths?.[0] || '';"""
          new2="""  state.product.selected = selected;
  state.product.sizeIndex = Math.min(
    Math.max(0, Number(selected.defaultSizeIndex) || 0),
    Math.max(0, selected.sizes.length - 1)
  );
  state.product.strength = selected.strengths?.[0] || '';"""
          if old2 not in s:
              raise SystemExit('openProduct target not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'KOL Admin Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/app.js
          git commit -m 'Use admin default product size in customer app'
          git push origin HEAD:main
