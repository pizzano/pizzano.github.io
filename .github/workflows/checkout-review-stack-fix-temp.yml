name: Checkout review stack fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/checkout-review-stack-fix-temp.yml'
      - '.github/scripts/checkout-review-stack-fix-temp.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkout review patch
        run: python3 .github/scripts/checkout-review-stack-fix-temp.py
      - name: Commit patch and cleanup
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/checkout-review-stack-fix-temp.yml
          rm -f .github/scripts/checkout-review-stack-fix-temp.py
          git add demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/checkout-review-stack-fix-temp.yml .github/scripts/checkout-review-stack-fix-temp.py
          git commit -m 'Stack checkout review items and customer info'
          git push origin HEAD:main
