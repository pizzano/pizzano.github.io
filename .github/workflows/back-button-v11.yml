name: Back button v11
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/back-button-v11.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 back_button_v11.py
      - run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git commit -m 'Improve Meny back control alignment' || exit 0
          git push origin HEAD:main
