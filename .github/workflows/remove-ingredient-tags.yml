name: Remove ingredient tag feature
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/remove-ingredient-tags.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove ingredient tag feature from customer, admin and CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def remove_function(src, name):
              m = re.search(r'\nfunction\s+' + re.escape(name) + r'\s*\(', src)
              if not m:
                  return src
              start = m.start()
              brace = src.find('{', m.end())
              if brace < 0:
                  raise SystemExit(f'Opening brace not found for {name}')
              i = brace
              depth = 0
              quote = None
              escape = False
              line_comment = False
              block_comment = False
              template = False
              while i < len(src):
                  c = src[i]
                  n = src[i+1] if i + 1 < len(src) else ''
                  if line_comment:
                      if c == '\n': line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False; i += 1
                  elif quote:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == quote: quote = None
                  elif template:
                      if escape: escape = False
                      elif c == '\\': escape = True
                      elif c == '`': template = False
                  else:
                      if c == '/' and n == '/': line_comment = True; i += 1
                      elif c == '/' and n == '*': block_comment = True; i += 1
                      elif c in ('"', "'"): quote = c
                      elif c == '`': template = True
                      elif c == '{': depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              while end < len(src) and src[end] in ' \t\r\n': end += 1
                              return src[:start] + '\n' + src[end:]
                  i += 1
              raise SystemExit(f'Closing brace not found for {name}')

          # ---------- index.html ----------
          p = Path('test/index.html')
          s = p.read_text(encoding='utf-8')

          s, n = re.subn(
              r'\n\s*<section aria-labelledby="ingredientRemovalTitle" class="ingredient-removal" hidden id="ingredientRemoval">.*?</section>',
              '', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Customer ingredient removal HTML block not found')

          for line_pattern in [
              r'^const ingredientRemoval = .*?;\n',
              r'^const ingredientChips = .*?;\n',
              r'^const ingredientRemovalHelp = .*?;\n',
              r'^let selectedRemovedIngredients = new Set\(\);\n',
          ]:
              s = re.sub(line_pattern, '', s, flags=re.M)

          for fn in ['parseIngredientNames', 'defaultIngredientIsRemovable', 'getProductIngredientTags', 'renderIngredientRemoval']:
              s = remove_function(s, fn)

          s = re.sub(r'^\s*renderIngredientRemoval\(\);\n', '', s, flags=re.M)
          s = re.sub(r'^\s*productModal\.classList\.toggle\("has-ingredient-removal".*?\);\n', '', s, flags=re.M)
          s = re.sub(r'^\s*selectedRemovedIngredients = new Set\([^\n]*\);\n', '', s, flags=re.M)

          s = re.sub(
              r'\ningredientChips\?\.addEventListener\("click", \(event\) => \{.*?\n\}\);\n',
              '\n', s, count=1, flags=re.S)

          # Remove old removed-ingredient payload/data from new cart lines.
          s = re.sub(r'^\s*removedIngredients:\s*\[\],\n', '', s, flags=re.M)
          s = re.sub(r'^\s*removedIngredients:\s*line\.removedIngredients\s*\|\|\s*\[\],\n', '', s, flags=re.M)
          s = re.sub(
              r'\n\s*const removedIngredients = \[\.\.\.selectedRemovedIngredients\];\n\s*if \(removedIngredients\.length\) \{.*?\n\s*\}\n(?=\s*return \{)',
              '\n', s, count=1, flags=re.S)
          s = re.sub(
              r'\)\.concat\(removedIngredients\.length \? \[`Uten: \$\{removedIngredients\.join\("\\, "\)\}`\] : \[\]\)',
              ')', s)
          # Slightly looser fallback for the concat expression.
          s = re.sub(r'\)\.concat\(removedIngredients\.length \?.*?\[\]\)', ')', s)
          s = re.sub(r'^\s*removedIngredients,\n', '', s, flags=re.M)
          s = re.sub(
              r'^\s*removedIngredients:\s*Array\.isArray\(line\.removedIngredients\).*?\n\s*:\s*\[\],\n',
              '', s, flags=re.M | re.S)

          # Old locally saved cart items should not keep showing legacy "Uten:" details.
          s = s.replace('extras: line.extras || [],', 'extras: (line.extras || []).filter((item) => !String(item || "").startsWith("Uten:")),')
          s = s.replace('extraDetails: line.extraDetails || [],', 'extraDetails: (line.extraDetails || []).filter((item) => !String(item?.label || "").startsWith("Uten:")),')

          s = s.replace('kol-core.css?v=mobile-v26', 'kol-core.css?v=mobile-v27', 1)

          banned_customer = [
              'ingredientRemoval', 'ingredientChips', 'ingredientRemovalHelp',
              'selectedRemovedIngredients', 'getProductIngredientTags',
              'ingredientTagsConfigured', 'ingredientTags', 'removedIngredients',
              'data-ingredient', 'has-ingredient-removal'
          ]
          leftovers = [x for x in banned_customer if x in s]
          if leftovers:
              raise SystemExit('Customer leftovers: ' + ', '.join(leftovers))
          p.write_text(s, encoding='utf-8')

          # ---------- admin-panel.html ----------
          p = Path('test/admin-panel.html')
          a = p.read_text(encoding='utf-8')

          a, n = re.subn(
              r'\n<details class="product-more wide" id="productIngredientSettings">.*?</details>',
              '', a, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Admin ingredient settings HTML block not found')

          for line_pattern in [
              r'^const productIngredientTagList = .*?;\n',
              r'^const syncProductIngredientsButton = .*?;\n',
              r'^const addProductIngredientButton = .*?;\n',
              r'^let productIngredientDraft = \[\];\n',
          ]:
              a = re.sub(line_pattern, '', a, flags=re.M)

          for fn in ['parseIngredientNamesForAdmin', 'defaultIngredientCanBeRemoved', 'normalizeProductIngredientTags', 'ingredientTagsFromDescription', 'renderProductIngredientTags']:
              a = remove_function(a, fn)

          a = re.sub(r'^\s*productIngredientDraft = \[\];\n', '', a, flags=re.M)
          a = re.sub(r'^\s*renderProductIngredientTags\(\);\n', '', a, flags=re.M)
          a = re.sub(
              r'\n\s*const hasSavedIngredientSetup = product\.ingredientTagsConfigured.*?\n\s*renderProductIngredientTags\(\);',
              '', a, count=1, flags=re.S)
          a = re.sub(
              r'^\s*ingredientTags:\s*normalizeProductIngredientTags\([^\n]*\),\n\s*// Firebase kan fjerne.*?\n\s*// .*?\n\s*ingredientTagsConfigured:\s*true,\n',
              '', a, flags=re.M)

          start = a.find('if (syncProductIngredientsButton) {')
          if start != -1:
              end = a.find('// Türkçe not:', start)
              if end == -1:
                  raise SystemExit('Could not find end of admin ingredient event block')
              a = a[:start] + a[end:]

          # Cache-bust shared stylesheet on admin too.
          a = a.replace('<link href="kol-core.css" rel="stylesheet"/>', '<link href="kol-core.css?v=mobile-v27" rel="stylesheet"/>', 1)

          banned_admin = [
              'productIngredientSettings', 'productIngredientTagList', 'productIngredientDraft',
              'syncProductIngredients', 'addProductIngredient', 'ingredientTagsConfigured',
              'ingredientTags:', 'normalizeProductIngredientTags', 'parseIngredientNamesForAdmin',
              'defaultIngredientCanBeRemoved', 'data-product-ingredient', 'Kan fjernes'
          ]
          leftovers = [x for x in banned_admin if x in a]
          if leftovers:
              raise SystemExit('Admin leftovers: ' + ', '.join(leftovers))
          p.write_text(a, encoding='utf-8')

          # ---------- kol-core.css ----------
          p = Path('test/kol-core.css')
          c = p.read_text(encoding='utf-8')

          old_summary = 'body.kol-customer .product-summary{display:none!important}'
          new_summary = 'body.kol-customer .product-summary{display:block!important;margin:0!important;padding:10px 12px 12px!important;border-bottom:1px solid var(--line)!important;color:var(--muted)!important;font-size:14px!important;font-weight:400!important;line-height:1.45!important}'
          if old_summary not in c:
              raise SystemExit('product-summary mobile rule not found')
          c = c.replace(old_summary, new_summary, 1)

          cleaned = []
          for line in c.splitlines():
              if 'body.kol-customer .ingredient-removal,body.kol-customer .option-group{' in line:
                  line = line.replace('body.kol-customer .ingredient-removal,', '')
              elif 'body.kol-customer .ingredient-removal-heading,body.kol-customer .option-group>h3{' in line:
                  line = line.replace('body.kol-customer .ingredient-removal-heading,', '')
              elif ('body.kol-customer .ingredient-removal' in line or
                    'body.kol-customer .ingredient-chips' in line or
                    'body.kol-customer .ingredient-chip' in line):
                  continue
              cleaned.append(line)
          c = '\n'.join(cleaned) + '\n'

          banned_css = ['.ingredient-removal', '.ingredient-chips', '.ingredient-chip', '.product-ingredient-admin', '.product-ingredient-tag']
          leftovers = [x for x in banned_css if x in c]
          if leftovers:
              raise SystemExit('CSS leftovers: ' + ', '.join(leftovers))
          p.write_text(c, encoding='utf-8')
          PY

      - name: Validate JavaScript and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for filename in ['test/index.html', 'test/admin-panel.html']:
              s = Path(filename).read_text(encoding='utf-8')
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
              Path('/tmp/' + Path(filename).stem + '.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/index.js
          node --check /tmp/admin-panel.js
          grep -q 'product-summary{display:block' test/kol-core.css
          ! grep -q 'ingredient-removal' test/kol-core.css
          ! grep -q 'ingredient-chip' test/kol-core.css
          ! grep -q 'Ingredienser kunden kan fjerne' test/admin-panel.html
          ! grep -q 'ingredientRemoval' test/index.html

      - name: Commit cleaned system
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/admin-panel.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Remove ingredient tag and removal feature'
          git push
