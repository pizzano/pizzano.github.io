name: Update ready pickup text
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ready-pickup-text.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace pickup instruction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('test/index.html')
          s=p.read_text(encoding='utf-8')
          old='Vis gjerne ordrenummeret ved henting.'
          new='Oppgi navnet ditt og hva du har bestilt ved henting.'
          if old not in s:
              raise SystemExit('Old pickup text not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html
          git commit -m "Clarify pickup instruction for ready orders"
          git push
