name: Mobile v15 validate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-v15-validate.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate v15 and validate HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          p=Path('test/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('kol-core.css?v=mobile-v14','kol-core.css?v=mobile-v15')
          p.write_text(s,encoding='utf-8')
          class IDParser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.ids=[]
              def handle_starttag(self,tag,attrs):
                  for k,v in attrs:
                      if k=='id' and v: self.ids.append(v)
          parser=IDParser(); parser.feed(s)
          dup=sorted({x for x in parser.ids if parser.ids.count(x)>1})
          if dup: raise SystemExit('Duplicate IDs: '+', '.join(dup))
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          css=Path('test/kol-core.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS brace mismatch')
          print('HTML IDs OK; CSS braces OK; scripts:',len(scripts))
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/index-inline.js
      - name: Commit index v15
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html
          git commit -m 'Activate clean mobile v15 customer layout' || exit 0
          git push origin HEAD:main
