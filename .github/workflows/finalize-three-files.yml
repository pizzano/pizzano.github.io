name: Finalize three-file KOL build
on:
  push:
    paths:
      - '.github/workflows/finalize-three-files.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge customer and admin into three files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          d = Path('demo')
          index = (d/'index.html').read_text(encoding='utf-8')
          admin = (d/'admin.html').read_text(encoding='utf-8')
          kol = (d/'kol.css').read_text(encoding='utf-8')
          compact = (d/'compact.css').read_text(encoding='utf-8') if (d/'compact.css').exists() else ''
          admin_css = (d/'admin.css').read_text(encoding='utf-8') if (d/'admin.css').exists() else ''
          app_core = (d/'app-core.js').read_text(encoding='utf-8') if (d/'app-core.js').exists() else ''
          customer_options = (d/'customer-options.js').read_text(encoding='utf-8') if (d/'customer-options.js').exists() else ''
          admin_js = (d/'admin.js').read_text(encoding='utf-8') if (d/'admin.js').exists() else ''

          merged_css = kol.rstrip() + '\n\n/* ===== CUSTOMER COMPACT LAYER ===== */\n' + compact.strip() + '\n\n/* ===== ADMIN PANEL ===== */\n' + admin_css.strip() + '\n'
          (d/'kol.css').write_text(merged_css, encoding='utf-8')

          index = re.sub(r'\s*<link[^>]+href=["\']compact\.css[^>]*>\s*', '\n', index, flags=re.I)
          core_bundle = app_core.rstrip() + '\n\n' + customer_options.rstrip()
          index = re.sub(r'<script[^>]+src=["\']app\.js[^>]*></script>', '<script>\n' + core_bundle.replace('</script>', '<\\/script>') + '\n</script>', index, count=1, flags=re.I)
          index = re.sub(r'href=["\']kol\.css[^"\']*["\']', 'href="kol.css?v=20260825-threefile"', index, count=1, flags=re.I)
          (d/'index.html').write_text(index, encoding='utf-8')

          admin = re.sub(r'<link[^>]+href=["\']admin\.css[^>]*>', '<link rel="stylesheet" href="kol.css?v=20260825-threefile">', admin, count=1, flags=re.I)
          admin = re.sub(r'<script[^>]+src=["\']admin\.js[^>]*></script>', '<script>\n' + admin_js.replace('</script>', '<\\/script>') + '\n</script>', admin, count=1, flags=re.I)
          (d/'admin.html').write_text(admin, encoding='utf-8')

          for name in ['admin.css','admin.js','app.js','app-core.js','customer-options.js','compact.css']:
              p=d/name
              if p.exists(): p.unlink()

          assert 'admin.js' not in (d/'admin.html').read_text(encoding='utf-8')
          assert 'admin.css' not in (d/'admin.html').read_text(encoding='utf-8')
          assert 'app.js' not in (d/'index.html').read_text(encoding='utf-8')
          assert 'compact.css' not in (d/'index.html').read_text(encoding='utf-8')
          remaining=sorted(p.name for p in d.iterdir() if p.is_file())
          assert remaining == ['admin.html','index.html','kol.css'], remaining
          print('Final demo files:', remaining)
          PY
      - name: Commit three-file build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A demo
          git commit -m 'Convert demo to admin index and kol css only' || exit 0
          git push
