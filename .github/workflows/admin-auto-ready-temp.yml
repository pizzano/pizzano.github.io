name: Admin auto ready and compact workflow
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-auto-ready-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 admin_auto_ready_patch.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/admin.js
          node --check demo/js/customer.js
          node --check demo/js/data.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f admin_auto_ready_patch.py
          rm -f .github/workflows/admin-auto-ready-temp.yml
          rm -f admin_orders_pro_patch.py
          rm -f .github/workflows/admin-orders-pro-temp.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Auto-complete timed orders and collapse handled admin view'
            git push origin HEAD:main
          fi
