name: KOL cleanup run
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-clean-run.yml
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 kol_cleanup_mobile.py || true
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin.html')
          t=p.read_text(encoding='utf-8')
          t=re.sub(r'(?ms)^\s*const dailyBackupCreated\s*=.*?^\s*\);\s*', '\n  setStatus(hasValidConfig(value) ? "Synkronisert med Firebase." : "Firebase er tom. Du kan starte fra null og legge til kategori.");\n', t, count=1)
          t=re.sub(r'(?m)^\s*//[^\n]*(?:backup|yedek|sikkerhetskopi|gjenopprett)[^\n]*\n?', '', t, flags=re.I)
          p.write_text(t,encoding='utf-8')
          PY
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          for p in [Path('admin.html'),Path('test/admin-panel.html')]:
              low=p.read_text(encoding='utf-8').lower()
              bad=[x for x in ('data-top-nav="backup"','backup-settings-page','downloadbackup','restorebackup','localbackup','local_backup','yedek','sikkerhetskopi','gjenopprett fra json') if x in low]
              assert not bad,(p,bad)
          t=Path('test/index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S|re.I))
          f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8');f.write(js);f.close()
          subprocess.run(['node','--check',f.name],check=True)
          c=Path('test/kol-core.css').read_text(encoding='utf-8')
          assert c.count('{')==c.count('}')
          assert not any(x in c.lower() for x in ('backup-grid','backup-box','restore-preview','local-backup-list'))
          assert 'body.kol-customer{width:min(100%,760px)!important' in c
          assert 'body.kol-customer .menu-list{display:grid!important;grid-template-columns:1fr!important}' in c
          print('validation ok')
          PY
      - run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f kol_cleanup_mobile.py .github/workflows/kol-clean-run.yml
          git add admin.html test/index.html test/admin-panel.html test/kol-core.css kol_cleanup_mobile.py .github/workflows/kol-clean-run.yml
          git commit -m 'Remove backup system and use compact customer layout'
          git push origin HEAD:main