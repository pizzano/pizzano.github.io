name: Timer persistence fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/timer-persistence-autoclose-temp.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/timer_persistence_autoclose.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/data.js
          node --check demo/js/customer.js
          node --check demo/js/admin.js
          node --check demo/js/allergen-ui.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/timer-persistence-autoclose-temp.yml
          rm .github/scripts/timer_persistence_autoclose.py
          git add demo/js/data.js demo/js/customer.js demo/js/admin.js demo/js/allergen-ui.js demo/index.html demo/admin.html demo/service-worker.js .github/workflows/timer-persistence-autoclose-temp.yml .github/scripts/timer_persistence_autoclose.py
          git commit -m 'Persist live countdowns and close accepted detail after one second'
          git push origin HEAD:main
