name: Green selected option styling
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/selected-options-green-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply selected option confirmation colors
        run: |
          if ! grep -q "Selected option confirmation green" demo/css/customer.css; then
            cat >> demo/css/customer.css <<'CSS'

          /* ======================== Selected option confirmation green ======================== */
          .product-sheet .opt-row.is-checked,
          #productSheet .opt-row.is-checked {
            border-color: #8bcfa6 !important;
            background: #edf9f1 !important;
            box-shadow: inset 0 0 0 1px rgba(31, 143, 82, .035);
          }
          .product-sheet .opt-row.is-checked .opt-label,
          #productSheet .opt-row.is-checked .opt-label {
            color: #176b3a;
          }
          .product-sheet .opt-row.is-checked .opt-price,
          #productSheet .opt-row.is-checked .opt-price {
            color: #277a48;
          }
          .product-sheet .opt-row input[type="radio"],
          .product-sheet .opt-row input[type="checkbox"],
          #productSheet .opt-row input[type="radio"],
          #productSheet .opt-row input[type="checkbox"] {
            accent-color: #238a4b;
          }
          .product-sheet .opt-row.is-checked:hover,
          #productSheet .opt-row.is-checked:hover {
            border-color: #70bf91 !important;
            background: #e8f7ed !important;
          }
          CSS
          fi
          python3 - <<'PY'
          from pathlib import Path
          import re
          html_path = Path('demo/index.html')
          sw_path = Path('demo/service-worker.js')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'/demo/css/customer\.css\?v=[^\"\']+', '/demo/css/customer.css?v=20260914-2', html, count=1)
          html_path.write_text(html, encoding='utf-8')
          sw = sw_path.read_text(encoding='utf-8')
          sw = re.sub(r"const CACHE_NAME = 'kol-demo-v\d+';", "const CACHE_NAME = 'kol-demo-v31';", sw, count=1)
          sw_path.write_text(sw, encoding='utf-8')
          PY
      - name: Commit update and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/selected-options-green-temp.yml
          git add demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/selected-options-green-temp.yml
          git commit -m 'Use green confirmation styling for selected product options'
          git push origin HEAD:main
