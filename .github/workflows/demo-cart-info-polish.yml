name: Demo cart info polish

on:
  push:
    branches: [main]
    paths:
      - demo/cart-info-polish.trigger

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Polish cart info and contact flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('demo/index.html')
          css_path=Path('demo/kol.css')
          html=html_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          html=re.sub(r'kol\.css\?v=[^"\']+','kol.css?v=cart-info-20260818-2034',html)

          old_step3='''<div id="checkoutStep3" hidden><div class="checkout-title"><span>3</span><div><strong>Navn og telefon</strong><small id="checkoutLoginHint"></small></div></div><div class="checkout-grid"><label>Hele navn<input id="checkoutName" autocomplete="name"></label><label>Telefonnummer<input id="checkoutPhone" inputmode="numeric" maxlength="8"></label></div></div>'''
          new_step3='''<div id="checkoutStep3" hidden><div class="checkout-title"><span>3</span><div><strong>Navn og telefon</strong><small id="checkoutLoginHint"></small></div></div><div class="checkout-grid contact-checkout-grid"><label class="checkout-field" id="checkoutNameField">Hele navn<span class="field-control"><input id="checkoutName" autocomplete="name" placeholder="Hele navn"><i class="field-check">✓</i></span></label><label class="checkout-field" id="checkoutPhoneField">Telefonnummer<span class="field-control"><input id="checkoutPhone" inputmode="numeric" maxlength="8" placeholder="8 sifre"><i class="field-check">✓</i></span></label><div class="checkout-confirm-card" id="checkoutConfirmCard" hidden><span>✓</span><div><strong>Kontaktinfo er klar</strong><small>Kontroller opplysningene og send bestillingen.</small></div></div></div></div>'''
          if old_step3 not in html: raise SystemExit('checkout step 3 markup not found')
          html=html.replace(old_step3,new_step3)

          old_info='''<section class="screen" id="infoScreen" hidden><div class="screen-scroll info-scroll"><div class="screen-title"><h2>Butikksinformasjon</h2></div><div class="info-tabs"><button class="info-tab active" data-info-tab="about">Om KØL</button><button class="info-tab" data-info-tab="terms">Vilkår</button><button class="info-tab" data-info-tab="privacy">Personvern</button></div><div class="info-panel active" data-info-panel="about"><section class="store-card"><h3>KØL Grill & Pizza</h3><p>ØGARDSVEGEN 44<br>2100 SKARNES</p><button id="storeMapBtn">⌖ Kart</button></section><section class="store-section"><h3>Matallergier</h3><div class="store-card"><p>Har du matallergi? Se allergenene i menyen eller spør oss før du bestiller.</p><button id="infoAllergenBtn">Se allergener</button></div></section><section class="store-section"><h3>Kontakt oss</h3><div class="store-card"><a href="tel:+4741145353">☎ +47 41 14 53 53</a></div></section><section class="store-section"><h3>Sosiale medier</h3><div class="social-row"><button>Instagram</button><button>Facebook</button></div></section><section class="store-section"><h3>Åpningstider</h3><div class="store-card store-hours"><span>Mandag–Søndag</span><strong>14:00–22:00</strong></div></section></div><div class="info-panel" data-info-panel="terms"><section class="store-card"><h3>Vilkår</h3><p>Bestillingen er bindende når den er sendt. Hentetid er veiledende og kan variere ved stor pågang.</p></section></div><div class="info-panel" data-info-panel="privacy"><section class="store-card"><h3>Personvern</h3><p>Denne LocalStorage-demoen lagrer konto, favoritter, allergener og bestillinger på denne enheten.</p></section></div></div></section>'''
          new_info='''<section class="screen" id="infoScreen" hidden><div class="screen-scroll info-scroll"><div class="screen-title info-title"><small>KØL GRILL &amp; PIZZA</small><h2>Butikksinformasjon</h2></div><div class="info-tabs"><button class="info-tab active" data-info-tab="about">Om KØL</button><button class="info-tab" data-info-tab="terms">Vilkår</button><button class="info-tab" data-info-tab="privacy">Personvern</button></div><div class="info-panel active" data-info-panel="about"><section class="store-card store-main-card"><div class="store-identity"><div class="store-logo-mini">KØL</div><div><h3>KØL Grill &amp; Pizza</h3><p>Øgardsvegen 44 · 2100 Skarnes</p></div></div><div class="store-quick-actions"><button id="storeMapBtn"><span>⌖</span><b>Kart</b></button><a href="tel:+4741145353"><span>☎</span><b>Ring</b></a></div></section><section class="info-list-card"><button class="info-list-row" id="infoAllergenBtn"><span class="info-row-icon">⚠</span><span><strong>Matallergier</strong><small>Se allergeninformasjon i menyen</small></span><b>›</b></button><a class="info-list-row" href="tel:+4741145353"><span class="info-row-icon">☎</span><span><strong>Kontakt oss</strong><small>+47 41 14 53 53</small></span><b>›</b></a><div class="info-list-row"><span class="info-row-icon">◷</span><span><strong>Åpningstider</strong><small>Mandag–søndag</small></span><em>14:00–22:00</em></div></section><section class="store-section compact-social"><h3>Følg KØL</h3><div class="social-row"><button>Instagram</button><button>Facebook</button></div></section></div><div class="info-panel" data-info-panel="terms"><section class="store-card text-card"><h3>Vilkår</h3><p>Bestillingen er bindende når den er sendt. Hentetid er veiledende og kan variere ved stor pågang.</p></section></div><div class="info-panel" data-info-panel="privacy"><section class="store-card text-card"><h3>Personvern</h3><p>Denne LocalStorage-demoen lagrer konto, favoritter, allergener og bestillinger på denne enheten.</p></section></div></div></section>'''
          if old_info not in html: raise SystemExit('info markup not found')
          html=html.replace(old_info,new_info)

          helpers=r'''function checkoutContactState(){const name=$('#checkoutName')?.value.trim()||'',phone=$('#checkoutPhone')?.value.replace(/\D/g,'')||'';return{name,phone,nameOk:name.length>=2,phoneOk:phone.length===8}}
function syncCheckoutValidation(){const s=checkoutContactState(),nf=$('#checkoutNameField'),pf=$('#checkoutPhoneField'),card=$('#checkoutConfirmCard');nf?.classList.toggle('valid',s.nameOk);pf?.classList.toggle('valid',s.phoneOk);if(card)card.hidden=!(s.nameOk&&s.phoneOk);const badge=$('#checkoutStep3 .checkout-title>span');if(badge){badge.textContent=s.nameOk&&s.phoneOk?'✓':'3';badge.classList.toggle('step-ok',s.nameOk&&s.phoneOk)}if(checkoutStep===3){const next=$('#checkoutNext');if(next){next.disabled=!(s.nameOk&&s.phoneOk);next.classList.toggle('ready',s.nameOk&&s.phoneOk)}}}
function bindCheckoutValidation(){const n=$('#checkoutName'),p=$('#checkoutPhone');if(n&&!n.dataset.validationBound){n.dataset.validationBound='1';n.addEventListener('input',syncCheckoutValidation)}if(p&&!p.dataset.validationBound){p.dataset.validationBound='1';p.addEventListener('input',()=>{p.value=p.value.replace(/\D/g,'').slice(0,8);syncCheckoutValidation()})}syncCheckoutValidation()}
function upsertCheckoutAccount(name,phone){const guest=load(KEY.guestFav,[]);let a=account();if(a&&session!==phone){const oldPhone=session,existing=accounts[phone];if(existing){existing.favorites=[...new Set([...(existing.favorites||[]),...(a.favorites||[])])];existing.stamps=Math.max(Number(existing.stamps)||0,Number(a.stamps)||0);existing.email=existing.email||a.email||'';existing.marketing=existing.marketing??a.marketing;delete accounts[oldPhone];a=existing}else{delete accounts[oldPhone];a={...a,phone};accounts[phone]=a}session=phone;save(KEY.session,session)}if(!a){a=ensureAccount(phone);session=phone;save(KEY.session,session)}a.name=name;a.phone=phone;a.favorites=[...new Set([...(a.favorites||[]),...guest])];save(KEY.guestFav,[]);saveAccounts();return a}
'''
          marker='function renderCart(){'
          if marker not in html: raise SystemExit('renderCart marker not found')
          html=html.replace(marker,helpers+marker,1)

          new_render_cart=r'''function renderCart(){const total=cart.reduce((s,x)=>s+x.price*x.qty,0),savings=cart.reduce((s,x)=>s+(x.freeReward?(Number(x.regularPrice)||0)*x.qty:0),0);$('#cartLines').innerHTML=cart.map((x,i)=>`<div class="cart-line ${x.freeReward?'reward-line':''}"><div class="cart-line-main"><span class="cart-qty-badge">${x.qty}x</span><div class="cart-line-copy"><strong>${escapeHtml(x.name)}</strong><small>Størrelse: <b>${escapeHtml(x.size)}</b>${x.strength?`<br>Styrke: <b>${escapeHtml(x.strength)}</b>`:''}${x.freeReward?`<br><span class="reward-cart-note">Gratis medlemsfordel · Du sparer ${money(x.regularPrice||0)}</span>`:''}${x.note?`<br>${escapeHtml(x.note)}`:''}</small></div></div><div class="cart-line-side"><b class="cart-line-price">${x.freeReward?`<span class="reward-old-price">${money(x.regularPrice||0)}</span><span class="reward-free-price">0,00 kr</span>`:money(x.price*x.qty)}</b><div class="cart-line-actions"><button class="cart-edit-btn" data-editcart="${i}" aria-label="Rediger" title="Rediger">✎</button><button class="cart-remove-btn" data-remove="${i}" aria-label="Fjern" title="Fjern">×</button></div></div></div>`).join('');$('#cartEmpty').hidden=cart.length>0;$('#cartTotal').textContent=money(total);$('#cartSavings').hidden=!savings;$('#cartSavings').textContent=savings?`Du sparer ${money(savings)} med medlemsfordelen`:'';$('#taxNote').textContent=`(inkl. mva ${money(total*15/115)})`;$$('[data-editcart]').forEach(b=>b.onclick=()=>openCartEdit(+b.dataset.editcart));$$('[data-remove]').forEach(b=>b.onclick=()=>{const removed=cart[+b.dataset.remove];cart.splice(+b.dataset.remove,1);save(KEY.cart,cart);renderCart();renderCartCount();showToast(`${removed?.name||'Produkt'} fjernet fra handlekurven`)});const a=account(),name=$('#checkoutName'),phone=$('#checkoutPhone');if(name&&document.activeElement!==name&&!name.value)name.value=a?.name||'';if(phone&&document.activeElement!==phone&&!phone.value)phone.value=a?.phone||'';if(phone)phone.disabled=false;$('#checkoutLoginHint').textContent=a?'Navn og telefon kan endres før bestillingen sendes.':'Fyll inn kontaktinformasjonen din.';bindCheckoutValidation();renderCheckoutStep()}
'''
          html,n=re.subn(r'function renderCart\(\)\{.*?\}\nfunction pickupSlots',new_render_cart+'function pickupSlots',html,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderCart replacement failed')

          new_render_step=r'''function renderCheckoutStep(){[1,2,3].forEach(n=>$('#checkoutStep'+n).hidden=n!==checkoutStep);$('#checkoutBack').hidden=checkoutStep===1;const step1=$('#checkoutStep1 .checkout-title>span'),step2=$('#checkoutStep2 .checkout-title>span');if(step1){step1.textContent=cart.length?'✓':'1';step1.classList.toggle('step-ok',!!cart.length)}if(step2){step2.textContent=pickupChoice?'✓':'2';step2.classList.toggle('step-ok',!!pickupChoice)}const next=$('#checkoutNext');next.textContent=checkoutStep===3?'Send bestilling':'Neste';const contact=checkoutContactState();next.disabled=(checkoutStep===1&&!cart.length)||(checkoutStep===3&&!(contact.nameOk&&contact.phoneOk));next.style.background=next.disabled?'#d4cfcb':'';next.style.opacity=next.disabled?'.78':'';next.style.cursor=next.disabled?'not-allowed':'';next.classList.toggle('ready',!next.disabled);if(checkoutStep===2)renderPickupTimes();if(checkoutStep===3)syncCheckoutValidation();const cartOpen=!$('#cartScreen').hidden,focused=cartOpen&&checkoutStep>1;document.body.classList.toggle('hide-tabs',focused);$('#cartScreen').style.top=focused?'var(--head)':'calc(var(--head) + var(--tabs))'}
'''
          html,n=re.subn(r'function renderCheckoutStep\(\)\{.*?\}\nfunction placeOrder',new_render_step+'function placeOrder',html,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderCheckoutStep replacement failed')

          new_place=r'''function placeOrder(){if(!cart.length)return;const c=checkoutContactState(),name=c.name,phone=c.phone;if(!c.nameOk||!c.phoneOk){syncCheckoutValidation();showToast('Kontroller navn og telefonnummer');return}const total=cart.reduce((s,x)=>s+x.price*x.qty,0),id=Math.random().toString(36).slice(2,8).toUpperCase(),pickupTime=pickupChoice==='asap'?'Snarest mulig':pickupChoice,orderSavings=cart.reduce((s,x)=>s+(x.freeReward?(Number(x.regularPrice)||0)*x.qty:0),0);orders.unshift({id,createdAt:Date.now(),name,phone,total,pickupTime,savings:orderSavings,items:cart.map(x=>({...x})),status:'Sendt'});save(KEY.orders,orders);const a=upsertCheckoutAccount(name,phone);normalizeLoyalty(a);const locked=(a.stamps||0)>=10,freeUsed=cart.some(x=>x.freeReward),paidLarge=cart.filter(x=>!x.freeReward&&x.productId.startsWith('p')&&norm(x.size)==='stor').reduce((n,x)=>n+x.qty,0);if(locked){if(freeUsed)a.stamps=Math.min(10,paidLarge)}else if(paidLarge)a.stamps=Math.min(10,(a.stamps||0)+paidLarge);a.rewards=0;saveAccounts();cart=[];save(KEY.cart,cart);checkoutStep=1;pickupChoice='asap';goMenu();renderCartCount();renderHeader();renderMenu();renderTabs();showToast(`Bestilling ${id} sendt${orderSavings?` · du sparte ${money(orderSavings)}`:''}`)}
'''
          html,n=re.subn(r'function placeOrder\(\)\{.*?\}\nfunction stampsHtml',new_place+'function stampsHtml',html,count=1,flags=re.S)
          if n!=1: raise SystemExit('placeOrder replacement failed')

          new_contact=r'''function renderContact(){const a=account();$('#accountContent').innerHTML=`<div class="subhead"><button id="accountBack">‹ Profil</button><h2>Kontaktinfo</h2></div><div class="profile-form modern-profile-form"><label class="profile-field" id="pfNameField">Hele navn<span class="field-control"><input id="pfName" class="text-input" value="${escapeHtml(a.name||'')}"><i class="field-check">✓</i></span></label><label class="profile-field" id="pfPhoneField">Telefonnummer<span class="field-control"><input id="pfPhone" class="text-input" inputmode="numeric" maxlength="8" value="${escapeHtml(a.phone||'')}"><i class="field-check">✓</i></span></label><label class="profile-field optional-field">E-post <small>(valgfritt)</small><span class="field-control"><input id="pfEmail" class="text-input" value="${escapeHtml(a.email||'')}"></span></label><label class="check-row"><input id="pfMarketing" type="checkbox" ${a.marketing?'checked':''}> Jeg ønsker tilbud fra KØL</label><button class="primary full" id="saveProfile">Lagre endringer</button></div>`;const validate=()=>{const name=$('#pfName').value.trim(),phone=$('#pfPhone').value.replace(/\D/g,'');$('#pfNameField').classList.toggle('valid',name.length>=2);$('#pfPhoneField').classList.toggle('valid',phone.length===8);return{name,phone,ok:name.length>=2&&phone.length===8}};$('#pfName').oninput=validate;$('#pfPhone').oninput=e=>{e.target.value=e.target.value.replace(/\D/g,'').slice(0,8);validate()};validate();$('#accountBack').onclick=renderProfileHome;$('#saveProfile').onclick=()=>{const v=validate();if(!v.ok){showToast('Kontroller navn og telefonnummer');return}const email=$('#pfEmail').value.trim(),marketing=$('#pfMarketing').checked,newA=upsertCheckoutAccount(v.name,v.phone);newA.email=email;newA.marketing=marketing;saveAccounts();renderHeader();renderProfileHome();showToast('Kontaktinfo oppdatert')}}
'''
          html,n=re.subn(r'function renderContact\(\)\{.*?\}\nfunction setInfoTab',new_contact+'function setInfoTab',html,count=1,flags=re.S)
          if n!=1: raise SystemExit('renderContact replacement failed')

          html=html.replace("$$('input[name=\"pickup\"]').forEach(r=>r.onchange=()=>{if(r.checked)pickupChoice=r.value})","$$('input[name=\"pickup\"]').forEach(r=>r.onchange=()=>{if(r.checked){pickupChoice=r.value;renderCheckoutStep()}})")

          marker='/* Cart info contact polish 20260818 */'
          if marker in css: css=css.split(marker,1)[0].rstrip()+'\n'
          css += r'''

/* Cart info contact polish 20260818 */
.cart-scroll{padding-bottom:16px;background:#faf9f7}
.checkout-title{min-height:68px;padding:0 14px;gap:11px;background:#fff}
.checkout-title>span{width:38px;height:38px;border-radius:10px;font-size:13px;font-weight:700;transition:.18s ease}
.checkout-title>span.step-ok{background:#eaf7f0;color:#19704d;border:1px solid #b9ddcc}
.checkout-title strong{font-size:17px;font-weight:700;letter-spacing:-.1px}
.checkout-title small{font-size:11.5px;line-height:1.35}
.cart-line{min-height:84px;padding:11px 14px;gap:9px;background:#fff}
.cart-line-main{grid-template-columns:34px minmax(0,1fr);gap:9px}
.cart-qty-badge{width:32px;height:32px;font-size:11.5px;font-weight:700}
.cart-line-copy{padding-top:1px}
.cart-line-copy strong{font-size:13.5px;font-weight:650;text-transform:none;letter-spacing:-.05px}
.cart-line-copy small{margin-top:4px;font-size:11px;line-height:1.4;color:#6f6762}
.cart-line-copy small b{font-weight:650;color:#3e3936}
.cart-line-side{gap:8px}
.cart-line-price{min-width:72px;font-size:12.5px;font-weight:650;color:#2d2927}
.cart-line-actions{gap:5px}
.cart-edit-btn,.cart-remove-btn{width:36px;height:36px;border-radius:9px;font-size:14px}
.cart-edit-btn{background:#f1f8f5}.cart-remove-btn{background:#fff8f7}
.cart-summary{padding:15px 14px 14px;background:#fff}
.total-row{font-size:14.5px;font-weight:450}.total-row strong{font-size:21px;font-weight:700;letter-spacing:-.25px}
.tax-note-row{margin-top:5px;font-size:10.5px;color:#8b817b}
.cart-savings{font-size:11.5px;font-weight:650}
.checkout-footer{padding:8px 10px max(8px,env(safe-area-inset-bottom))}.checkout-footer .primary,.checkout-footer .secondary{height:50px}.checkout-footer .primary.ready{box-shadow:0 4px 12px rgba(243,106,45,.14)}

.info-scroll{background:#f8f7f5}
.info-title{padding:17px 16px 14px;background:#fff}.info-title small{display:block;margin-bottom:4px;color:#a0644c;font-size:9px;font-weight:800;letter-spacing:.12em}.info-title h2{font-size:21px}
.info-tabs{padding:0 12px}.info-tab{height:43px;font-size:13px;font-weight:600}.info-panel{padding:13px}
.store-main-card{padding:15px;border-radius:17px;box-shadow:none}.store-identity{display:flex;align-items:center;gap:12px}.store-logo-mini{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#fff2ec;color:#e65c25;font-size:17px;font-weight:850;letter-spacing:-.7px}.store-identity h3{margin:0 0 3px;font-size:16px}.store-identity p{margin:0;font-size:12.5px;color:#766d67}.store-quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.store-quick-actions button,.store-quick-actions a{height:42px;border:1px solid #e5ddd7;border-radius:11px;background:#fff;color:#393431;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font-size:12.5px}.store-quick-actions b{font-weight:650}
.info-list-card{margin-top:10px;border:1px solid #e9e2dd;border-radius:17px;background:#fff;overflow:hidden}.info-list-row{width:100%;min-height:64px;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:9px;align-items:center;padding:10px 13px;border:0;border-bottom:1px solid #eee7e2;background:#fff;color:#302b28;text-align:left;text-decoration:none}.info-list-row:last-child{border-bottom:0}.info-row-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:#f6f3f1;color:#6f6762;font-size:14px}.info-list-row strong,.info-list-row small{display:block}.info-list-row strong{font-size:13.5px;font-weight:650}.info-list-row small{margin-top:3px;color:#817872;font-size:11.5px}.info-list-row>b{font-size:19px;font-weight:400;color:#9a918b}.info-list-row em{font-size:12px;font-style:normal;font-weight:650;color:#5d5550}.compact-social{margin-top:15px}.compact-social h3{font-size:13px;margin:0 2px 8px;color:#6c635e}.social-row button{height:42px;font-size:12.5px;font-weight:600;background:#fff}.text-card{box-shadow:none}.text-card h3{font-size:16px}.text-card p{font-size:13px;line-height:1.55}

.contact-checkout-grid,.modern-profile-form{gap:12px}
.checkout-field,.profile-field{position:relative;display:block;color:#514944;font-size:12.5px!important;font-weight:600!important}.field-control{position:relative;display:block}.field-control input{padding-right:42px!important;transition:border-color .16s ease,background .16s ease,box-shadow .16s ease}.field-control input:focus{border-color:#ef9e7d;box-shadow:0 0 0 3px #fff1eb}.field-check{position:absolute;right:12px;top:50%;transform:translateY(-50%) scale(.85);width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#daf1e5;color:#18724f;font-size:12px;font-style:normal;font-weight:800;opacity:0;transition:.16s ease}.checkout-field.valid input,.profile-field.valid input{border-color:#9bcdb7;background:#f8fcfa}.checkout-field.valid .field-check,.profile-field.valid .field-check{opacity:1;transform:translateY(-50%) scale(1)}
.checkout-confirm-card{display:grid;grid-template-columns:32px 1fr;gap:9px;align-items:center;padding:11px 12px;border:1px solid #bfe0d0;border-radius:12px;background:#f3faf6}.checkout-confirm-card>span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#daf1e5;color:#17714d;font-weight:800}.checkout-confirm-card strong,.checkout-confirm-card small{display:block}.checkout-confirm-card strong{font-size:12.5px;color:#225a43}.checkout-confirm-card small{margin-top:2px;font-size:10.5px;color:#658071}.modern-profile-form{padding:14px}.optional-field small{color:#998f89;font-weight:400}

@media(max-width:420px){.cart-line{padding-left:11px;padding-right:11px}.cart-line-side{gap:5px}.cart-line-price{min-width:63px;font-size:12px}.cart-edit-btn,.cart-remove-btn{width:34px;height:34px}.store-main-card{padding:13px}.info-panel{padding:11px}.info-list-row{padding-left:11px;padding-right:11px}.total-row strong{font-size:20px}}
'''

          html_path.write_text(html,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('demo/index.html').read_text()
          c=Path('demo/kol.css').read_text()
          checks=['checkoutConfirmCard','upsertCheckoutAccount','info-list-card','checkoutPhoneField','kol.css?v=cart-info-20260818-2034']
          for x in checks: assert x in h,x
          assert 'Cart info contact polish 20260818' in c
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/demo-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/demo-inline.js

      - name: Commit directly to main
        shell: bash
        run: |
          git config user.name "KOL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish cart info and contact flow"
          git push origin HEAD:main
