name: Demo static and regression checks
on:
  push:
    branches: [audit-fixes-20261026]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-audit.yml'
  pull_request:
    paths:
      - 'demo/**'
      - '.github/workflows/demo-audit.yml'
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find demo/js -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --experimental-default-type=module --check "$file"
          done
          node --check demo/service-worker.js
          node --check demo/tools/audit-references.mjs
      - name: Audit asset references and duplicate IDs
        run: node demo/tools/audit-references.mjs
      - name: Order timeout regression tests
        run: node --experimental-default-type=module --test demo/tests/*.test.mjs
