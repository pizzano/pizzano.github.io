name: Food app UI redesign
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/food-app-redesign-temp.yml
      - .github/scripts/food-app-redesign-temp.py
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply redesign
        run: |
          python3 .github/scripts/food-app-redesign-temp.py
          node --check demo/js/customer.js
          node --check demo/js/data.js
      - name: Commit redesign and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/food-app-redesign-temp.yml
          rm .github/scripts/food-app-redesign-temp.py
          git add demo/index.html demo/css/customer.css demo/js/customer.js demo/service-worker.js .github/workflows/food-app-redesign-temp.yml .github/scripts/food-app-redesign-temp.py
          git commit -m 'Redesign customer ordering UI in modern food app style'
          git push origin HEAD:main
