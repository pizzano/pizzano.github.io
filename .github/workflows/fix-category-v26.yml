name: Fix category v26
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-category-v26.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full CSS
        run: git show 3d04f79776e29308243b133a081a071f7a40229e:test/kol-core.css > test/kol-core.css
      - name: Keep category in header
        run: |
          perl -0pi -e 's/\n\s*if \(categoryTabsWrap\) \{\s*menuSectionsEl\.insertBefore\(categoryTabsWrap, menuSectionsEl\.firstChild\);\s*\}\n/\n/s' test/index.html
          sed -i 's/kol-core.css?v=mobile-v25/kol-core.css?v=mobile-v26/' test/index.html
          if grep -q 'menuSectionsEl.insertBefore(categoryTabsWrap' test/index.html; then exit 1; fi
          if ! grep -q 'mobile-v26' test/index.html; then exit 1; fi
          if [ "$(wc -c < test/kol-core.css)" -lt 20000 ]; then exit 1; fi
      - name: Commit
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Fix fixed category navigation structure'
          git push