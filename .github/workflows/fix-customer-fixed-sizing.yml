name: Fix customer fixed sizing
on:
  push:
    branches:
      - fix/order-system-hardening-20260817
    paths:
      - .github/workflows/fix-customer-fixed-sizing.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixed sizing
        run: python .github/scripts/fix-customer-fixed-sizing.py
      - name: Validate fixed sizing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          css = Path('test/kol-core.css').read_text(encoding='utf-8')
          index = Path('test/index.html').read_text(encoding='utf-8')
          admin = Path('test/admin-panel.html').read_text(encoding='utf-8')
          marker = 'CUSTOMER FIXED SIZE LOCK V1'
          assert css.count(marker) == 1
          assert '-webkit-text-size-adjust: none !important' in css
          assert 'body.kol-customer .menu-page-heading h1' in css
          assert 'font-size: 31px !important' in css
          assert 'body.kol-customer .menu-row-headline strong' in css
          assert 'font-size: 15px !important' in css
          assert 'grid-template-columns: 84px minmax(0, 1fr) 75px !important' in css
          assert 'kol-core.css?v=fixed-size-v1' in index
          assert 'kol-core.css?v=fixed-size-v1' in admin
          print('fixed sizing invariants passed')
          PY
          git diff --check
      - name: Commit result and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- test/kol-core.css test/index.html test/admin-panel.html
          git rm -f -- .github/scripts/fix-customer-fixed-sizing.py .github/workflows/fix-customer-fixed-sizing.yml
          git diff --cached --check
          git commit -m "Lock customer UI sizing across breakpoints"
          git push origin HEAD:fix/order-system-hardening-20260817
