name: Polish profile and store information UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/profile-info-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply unified profile and store design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('test/test.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* Profile and store info unified visual system */'
          if marker in css:
              css = css.split(marker, 1)[0].rstrip() + '\n'

          block = r'''
/* Profile and store info unified visual system */
#accountScreen .screen-scroll,
#infoScreen .screen-scroll{
  background:#f8f7f5;
}

#accountScreen .screen-title,
#infoScreen .screen-title{
  padding:20px 18px 17px;
  background:#fff;
  border-bottom:1px solid #ece5df;
}
#accountScreen .screen-title h2,
#infoScreen .screen-title h2{
  font-size:22px;
  line-height:1.2;
  letter-spacing:-.25px;
  font-weight:750;
}

.profile-home{
  padding:14px 14px 28px;
}
.profile-greeting{
  min-height:78px;
  margin:0 0 12px;
  padding:14px;
  gap:12px;
  border:1px solid #ebe4de;
  border-radius:16px;
  background:#fff;
}
.member-avatar{
  width:50px;
  height:50px;
  flex:0 0 50px;
  background:#f2f1ef;
  color:#211e1c;
  font-size:19px;
}
.profile-greeting small{
  color:#8a817b;
  font-size:10px;
  font-weight:650;
  letter-spacing:.09em;
}
.profile-greeting h2{
  margin:3px 0 2px;
  font-size:18px;
  line-height:1.15;
  letter-spacing:-.15px;
}
.profile-greeting p{
  margin:0;
  color:#746b65;
  font-size:13px;
}

.pizza-loyalty-card{
  padding:15px;
  border:1px solid #f4c8b7;
  border-radius:16px;
  background:#fff;
  box-shadow:0 3px 14px rgba(42,31,25,.035);
}
.pizza-loyalty-top{
  align-items:flex-start;
}
.pizza-loyalty-top small{
  color:#df5b29;
  font-size:10px;
  font-weight:800;
  letter-spacing:.08em;
}
.pizza-loyalty-top h3{
  margin:4px 0 0;
  font-size:23px;
  line-height:1;
  letter-spacing:-.4px;
}
.pizza-reward{
  min-width:58px;
  height:58px;
  border-radius:15px;
  background:var(--o);
  font-size:21px;
  box-shadow:none;
}
.pizza-reward span{
  font-size:9px;
  font-weight:700;
}
.stamps{
  gap:7px;
  margin:14px 0 11px;
}
.stamp{
  min-height:66px;
  border:1px solid #e9e3df;
  border-radius:10px;
  background:#f2efed;
}
.stamp b{
  font-size:11px;
  font-weight:700;
}
.stamp i{
  font-size:23px;
  opacity:.55;
}
.stamp.on{
  border-color:#f2aa8e;
  background:#fff1ea;
  color:#c95025;
}
.stamp.on i{
  filter:none;
  opacity:1;
}
.pizza-loyalty-card p{
  margin:0;
  color:#6e655f;
  font-size:12.5px;
  line-height:1.4;
}
.reward-ready{
  margin-top:10px;
  padding:9px 11px;
  border-radius:10px;
  background:#fff1ea;
  color:#b84b25;
  font-size:12px;
}

.profile-actions{
  gap:10px;
  margin-top:12px;
}
.profile-actions button{
  min-height:68px;
  padding:12px 14px;
  border:1px solid #e8e1db;
  border-radius:15px;
  background:#fff;
  box-shadow:0 2px 8px rgba(42,31,25,.02);
}
.profile-actions strong{
  font-size:15px;
  line-height:1.2;
}
.profile-actions small{
  margin-top:4px;
  color:#8a817b;
  font-size:11.5px;
  font-weight:400;
}
.profile-actions b{
  color:#766d67;
  font-size:20px;
  font-weight:500;
}
.logout-link{
  margin:22px auto 0;
  padding:9px 14px;
  color:#9a8880;
  font-size:12.5px;
  border-radius:9px;
}

.info-scroll{
  background:#f8f7f5;
}
.info-tabs{
  position:sticky;
  top:0;
  z-index:4;
  padding:0 14px;
  background:#fff;
  border-bottom:1px solid #ece5df;
}
.info-tab{
  height:45px;
  border-bottom:2px solid transparent;
  color:#80766f;
  font-size:14px;
  font-weight:600;
}
.info-tab.active{
  color:#2b2724;
  border-bottom-color:var(--o);
}
.info-panel{
  padding:14px;
}
.store-section{
  margin-top:16px;
}
.store-section h3{
  margin:0 3px 8px;
  color:#2f2a27;
  font-size:16px;
  line-height:1.25;
  font-weight:700;
}
.store-card{
  padding:16px;
  border:1px solid #ebe4de;
  border-radius:16px;
  background:#fff;
  box-shadow:0 3px 14px rgba(42,31,25,.03);
}
.store-card h3{
  margin:0 0 8px;
  font-size:17px;
  line-height:1.25;
  font-weight:700;
}
.store-card p{
  margin:0 0 13px;
  color:#6f6660;
  font-size:13.5px;
  line-height:1.5;
}
.store-card p:last-child{
  margin-bottom:0;
}
.store-card button,
.social-row button{
  min-width:0;
  height:40px;
  padding:0 13px;
  border:1px solid #ded7d2;
  border-radius:10px;
  background:#fff;
  color:#342f2c;
  font-size:13.5px;
  font-weight:600;
}
.store-card a{
  display:flex;
  align-items:center;
  min-height:28px;
  color:#302b28;
  font-size:15px;
  font-weight:700;
  text-decoration:none;
}
.store-hours{
  align-items:center;
  gap:12px;
  color:#655c56;
  font-size:13.5px;
}
.store-hours strong{
  color:#302b28;
  font-size:14px;
}
.social-row{
  gap:9px;
}
.social-row button{
  height:44px;
}

@media(max-width:420px){
  #accountScreen .screen-title,
  #infoScreen .screen-title{padding:18px 14px 15px}
  #accountScreen .screen-title h2,
  #infoScreen .screen-title h2{font-size:21px}
  .profile-home{padding:12px 12px 24px}
  .profile-greeting{padding:13px}
  .pizza-loyalty-card{padding:13px}
  .stamps{gap:6px}
  .stamp{min-height:61px}
  .stamp i{font-size:21px}
  .info-panel{padding:12px}
  .store-card{padding:15px}
}
'''
          css_path.write_text(css.rstrip() + '\n\n' + block.strip() + '\n', encoding='utf-8')

          html_path = Path('test/test.html')
          html = html_path.read_text(encoding='utf-8')
          html = re.sub(r'test\.css\?v=[^"\']+', 'test.css?v=profile-info-20260818-0158', html)
          html_path.write_text(html, encoding='utf-8')
          PY

      - name: Validate changed files
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('test/test.html').read_text(encoding='utf-8')
          assert 'test.css?v=profile-info-20260818-0158' in html
          css=Path('test/test.css').read_text(encoding='utf-8')
          assert 'Profile and store info unified visual system' in css
          assert '.info-tab.active' in css
          assert '.pizza-loyalty-card' in css
          print('profile/info visual checks: OK')
          PY

      - name: Commit to main
        shell: bash
        run: |
          git config user.name "KOL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/test.css test/test.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Polish profile and store information"
          git push origin HEAD:main
