# trigger
name: Allergen search demo update
on:
  push:
    paths:
      - '.github/workflows/allergen-search-demo.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update allergen UX and demo data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/test.html')
          s=p.read_text()

          s=s.replace('test.css?v=clean-cart-20260818-0045','test.css?v=allergen-search-20260818-0115',1)

          old='''    <div class="allergen-toolbar"><button id="allergenReset">Nullstill</button></div>
    <div class="allergen-grid" id="allergenGrid"></div>
    <div class="allergen-bottom"><div>Valgene lagres bare på denne enheten.</div><button class="primary" id="allergenSave">Lagre</button></div>'''
          new='''    <div class="allergen-toolbar">
      <label class="allergen-search"><span>⌕</span><input id="allergenSearch" type="search" placeholder="Søk allergen" autocomplete="off"></label>
    </div>
    <div class="allergen-grid" id="allergenGrid"></div>
    <div class="allergen-bottom"><div>Valgene lagres bare på denne enheten.</div><div class="allergen-actions"><button id="allergenReset">Nullstill</button><button class="primary" id="allergenSave">Lagre</button></div></div>'''
          if old not in s: raise SystemExit('allergen markup not found')
          s=s.replace(old,new,1)

          replacements={
          "{id:'k1',name:'Kebab i pita',description:'Kebabkjøtt, salat og dressing',image:IMG[2],allergens:['gluten','melk'],strengths:['Mild','Medium','Sterk'],sizes:[['Standard',149]]},":"{id:'k1',name:'Kebab i pita',description:'Kebabkjøtt, salat og dressing',image:IMG[2],allergens:['gluten','melk','egg','sennep','sesam'],strengths:['Mild','Medium','Sterk'],sizes:[['Standard',149]]},",
          "{id:'k2',name:'Kebab tallerken',description:'Kebabkjøtt, pommes frites, salat og dressing',image:IMG[2],allergens:['melk'],strengths:['Mild','Medium','Sterk'],sizes:[['Standard',189]]}]},":"{id:'k2',name:'Kebab tallerken',description:'Kebabkjøtt, pommes frites, salat og dressing',image:IMG[2],allergens:['melk','egg','sennep'],strengths:['Mild','Medium','Sterk'],sizes:[['Standard',189]]}]},",
          "{id:'b1',name:'Cheeseburger',description:'Burger, ost, salat og dressing',image:IMG[2],allergens:['gluten','melk','egg'],sizes:[['160 g',159],['250 g',199]]},":"{id:'b1',name:'Cheeseburger',description:'Burger, ost, salat og dressing',image:IMG[2],allergens:['gluten','melk','egg','sennep','sesam'],sizes:[['160 g',159],['250 g',199]]},",
          "{id:'b2',name:'Baconburger',description:'Burger, bacon, ost og salat',image:IMG[2],allergens:['gluten','melk','egg'],sizes:[['160 g',179],['250 g',219]]}]},":"{id:'b2',name:'Baconburger',description:'Burger, bacon, ost og salat',image:IMG[2],allergens:['gluten','melk','egg','sennep','sesam'],sizes:[['160 g',179],['250 g',219]]}]},"
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit('menu allergen source not found: '+a[:40])
              s=s.replace(a,b,1)

          old_state="let selectedAllergens=new Set(load(KEY.allergens,[])),draftAllergens=new Set(selectedAllergens),searchOpen=false,searchQuery='',expanded={popular:false,favorites:false};"
          new_state="let selectedAllergens=new Set(load(KEY.allergens,[])),draftAllergens=new Set(selectedAllergens),allergenSearch='',searchOpen=false,searchQuery='',expanded={popular:false,favorites:false};"
          if old_state not in s: raise SystemExit('allergen state not found')
          s=s.replace(old_state,new_state,1)

          old_render='''function renderAllergens(){
  $('#allergenGrid').innerHTML=ALLERGENS.map(a=>`<button class="allergen-choice ${draftAllergens.has(a[0])?'active':''}" data-allergen="${a[0]}"><span>${a[1]}</span>${a[2]}</button>`).join('');
  $$('[data-allergen]').forEach(b=>b.onclick=()=>{draftAllergens.has(b.dataset.allergen)?draftAllergens.delete(b.dataset.allergen):draftAllergens.add(b.dataset.allergen);renderAllergens()});
}
function openAllergens(){draftAllergens=new Set(selectedAllergens);renderAllergens();openView('allergenScreen',{tabs:true})}'''
          new_render='''function renderAllergens(){
  const q=norm(allergenSearch);
  const visible=ALLERGENS.filter(a=>!q||norm(`${a[0]} ${a[2]}`).includes(q));
  $('#allergenGrid').innerHTML=visible.length?visible.map(a=>`<button class="allergen-choice ${draftAllergens.has(a[0])?'active':''}" data-allergen="${a[0]}"><span>${a[1]}</span>${a[2]}</button>`).join(''):'<div class="allergen-empty">Ingen allergener funnet.</div>';
  $$('[data-allergen]').forEach(b=>b.onclick=()=>{draftAllergens.has(b.dataset.allergen)?draftAllergens.delete(b.dataset.allergen):draftAllergens.add(b.dataset.allergen);renderAllergens()});
}
function openAllergens(){draftAllergens=new Set(selectedAllergens);allergenSearch='';$('#allergenSearch').value='';renderAllergens();openView('allergenScreen',{tabs:true})}'''
          if old_render not in s: raise SystemExit('renderAllergens block not found')
          s=s.replace(old_render,new_render,1)

          old_handlers="$('#allergenReset').onclick=()=>{draftAllergens.clear();renderAllergens()};\n$('#allergenSave').onclick=()=>{selectedAllergens=new Set(draftAllergens);save(KEY.allergens,[...selectedAllergens]);renderAll();goMenu()};"
          new_handlers="$('#allergenSearch').oninput=e=>{allergenSearch=e.target.value;renderAllergens()};\n$('#allergenReset').onclick=()=>{draftAllergens.clear();renderAllergens()};\n$('#allergenSave').onclick=()=>{selectedAllergens=new Set(draftAllergens);save(KEY.allergens,[...selectedAllergens]);renderAll();goMenu()};"
          if old_handlers not in s: raise SystemExit('allergen handlers not found')
          s=s.replace(old_handlers,new_handlers,1)
          p.write_text(s)

          c=Path('test/test.css')
          css=c.read_text()
          marker='/* allergen-search-demo-v1 */'
          if marker in css:
              css=css.split(marker,1)[0].rstrip()+'\n'
          css += '''\n/* allergen-search-demo-v1 */
.allergen-toolbar{padding:14px 16px 10px;text-align:left}
.allergen-search{height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line);border-radius:15px;background:#f5f6f7}
.allergen-search span{font-size:22px;color:#8b8f96;line-height:1}
.allergen-search input{min-width:0;flex:1;height:100%;border:0;outline:0;background:transparent;color:var(--txt);font-size:15px}
.allergen-search input::placeholder{color:#8b8f96}
.allergen-empty{grid-column:1/-1;margin:4px 0;padding:20px;border:1px dashed var(--line);border-radius:13px;text-align:center;color:var(--mut);font-size:13px}
.allergen-actions{display:flex;gap:9px;margin-top:10px}
.allergen-actions #allergenReset{flex:0 0 112px;height:50px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#5f5752;font-weight:600}
.allergen-actions #allergenSave{flex:1;margin:0}
'''
          c.write_text(css)
          PY
      - name: Validate customer demo
        shell: bash
        run: |
          grep -q 'id="allergenSearch"' test/test.html
          grep -q 'allergen-search-demo-v1' test/test.css
          grep -q "allergens:\['gluten','melk','egg','sennep','sesam'\]" test/test.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/test.html').read_text()
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('script not found')
          Path('/tmp/test.js').write_text(m.group(1))
          PY
          node --check /tmp/test.js
          git diff --check
      - name: Commit update and clean workflow
        shell: bash
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/allergen-search-demo.yml
          git add test/test.html test/test.css
          git commit -m 'Add allergen search and realistic demo warnings'
          git push
