name: Checkout stepper v8
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-stepper-v8.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checkout patch
        run: python3 checkout_stepper_v8.py
      - name: Commit changes
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git commit -m 'Convert cart to three-step checkout flow'
          git push origin HEAD:main
