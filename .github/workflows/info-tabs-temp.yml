name: Temporary profile and info tabs update
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/info-tabs-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply profile and info tabs update
        run: echo '...<TRUNCATED>...=='} | base64 -d | python3
      - name: Validate customer JavaScript
        run: node --check demo/js/customer.js
      - name: Commit update
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/index.html demo/js/customer.js demo/css/customer.css demo/service-worker.js
          git commit -m 'Reorder profile tabs and compact info into tabs' || exit 0
          git push origin HEAD:main
