name: KOL rescue one-time deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-rescue-deploy.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Redde maten feature
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/apply_rescue.py
          python3 /tmp/apply_rescue.py

      - name: Validate output
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('test/index.html'), Path('test/admin-panel.html')]:
              t=p.read_text(encoding='utf-8')
              assert '<style' not in t.lower(), f'Embedded CSS found in {p}'
              assert 'rescueDeals' in t, f'Rescue code missing in {p}'
          css=Path('test/kol-core.css').read_text(encoding='utf-8')
          assert 'REDDE MATEN / RESCUE DEALS' in css
          assert css.count('{') == css.count('}')
          print('validation ok')
          PY

      - name: Commit and deploy
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f .github/workflows/kol-rescue-deploy.yml
          git add test/index.html test/admin-panel.html test/kol-core.css .github/workflows/kol-rescue-deploy.yml
          git commit -m 'Add Redde maten rescue stock system'
          git push origin HEAD:main