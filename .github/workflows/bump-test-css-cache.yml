name: Refresh test CSS cache
on:
  push:
    paths:
      - '.github/workflows/bump-test-css-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update cache key
        run: sed -i 's/test\.css?v=[^"'"']*/test.css?v=simple-20260817-2310/' test/test.html
      - name: Commit cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/workflows/bump-test-css-cache.yml
          git commit -m 'Use rebuilt simple test stylesheet'
          git push
