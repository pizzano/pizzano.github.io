name: Checkout review final mobile fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkout-review-final-fix-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final checkout review fix
        run: |
          echo '' | base64 -d > /tmp/patch_review.py
          python3 /tmp/patch_review.py
          node --check demo/js/customer.js
      - name: Commit and publish
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/checkout-review-final-fix-temp.yml
          git add demo/css/customer-base.css demo/css/customer.css demo/js/customer.js demo/index.html demo/service-worker.js .github/workflows/checkout-review-final-fix-temp.yml
          git commit -m 'Fix mobile checkout review layout definitively'
          git push origin HEAD:main
