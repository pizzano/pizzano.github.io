name: Apply allergen section context fix

on:
  push:
    paths:
      - '.github/workflows/apply-allergen-context-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch allergen section detection
        run: python .github/scripts/fix-allergen-section-context.py
      - name: Commit fix
        run: |
          git config user.name "KOL Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Fix intermittent allergen warnings [skip ci]"
          git push origin HEAD:main
