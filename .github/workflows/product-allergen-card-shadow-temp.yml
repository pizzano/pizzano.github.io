name: Product allergen and card shadow polish
on:
  push:
    branches: [main]
    paths:
      - .github/scripts/product-allergen-card-shadow-temp.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI patch
        run: python3 .github/scripts/product-allergen-card-shadow-temp.py
      - name: Validate JavaScript
        run: node --check demo/js/customer.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/scripts/product-allergen-card-shadow-temp.py
          rm .github/workflows/product-allergen-card-shadow-temp.yml
          git add -A
          git commit -m 'Polish product allergens and menu card shadows'
          git push origin HEAD:main