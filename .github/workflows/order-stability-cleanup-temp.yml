name: Order stability cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/order-stability-cleanup-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply order stability fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---------- customer.js ----------
          p = Path('demo/js/customer.js')
          s = p.read_text(encoding='utf-8')

          old = '''function mergedCustomerOrders() {
  const localOrders = getLocalOrders();
  const liveOrders = getOrders();
  const local = Array.isArray(localOrders) ? localOrders : [];
  const live = Array.isArray(liveOrders) ? liveOrders : [];
  const byId = new Map(local.filter((order) => order?.id).map((order) => [order.id, order]));
  for (const remote of live) {
    if (!remote?.id) continue;
    const previous = byId.get(remote.id) || {};
    byId.set(remote.id, {
      ...previous,
      ...remote,
      lines: remote.lines?.length ? remote.lines : (previous.lines || []),
    });
  }
  return Array.from(byId.values()).sort(
    (a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0)
  );
}'''
          new = '''function mergedCustomerOrders() {
  const localOrders = getLocalOrders();
  const liveOrders = getOrders();
  const local = Array.isArray(localOrders) ? localOrders : [];
  const live = Array.isArray(liveOrders) ? liveOrders : [];
  const byId = new Map(local.filter((order) => order?.id).map((order) => [order.id, order]));
  for (const remote of live) {
    if (!remote?.id) continue;
    const previous = byId.get(remote.id) || {};
    // Firebase is authoritative for every live status/timer field. Local history is
    // only a fallback for immutable order details such as lines.
    byId.set(remote.id, {
      ...previous,
      ...remote,
      status: remote.status || previous.status || 'mottatt',
      statusUpdatedAt: remote.statusUpdatedAt ?? previous.statusUpdatedAt ?? null,
      estimatedMinutes: remote.estimatedMinutes ?? null,
      estimatedAt: remote.estimatedAt ?? null,
      estimatedReadyAt: remote.estimatedReadyAt ?? null,
      lines: remote.lines?.length ? remote.lines : (previous.lines || []),
    });
  }
  return Array.from(byId.values()).sort(
    (a, b) => (Number(b.createdAt) || 0) - (Number(a.createdAt) || 0)
  );
}'''
          if old not in s:
              raise SystemExit('mergedCustomerOrders block not found')
          s = s.replace(old, new, 1)

          s = re.sub(r'''\nfunction effectiveCustomerOrder\(order\) \{.*?\n\}\n\nfunction activeCustomerOrders\(\) \{''', '\nfunction activeCustomerOrders() {', s, count=1, flags=re.S)
          s = s.replace('return mergedCustomerOrders().map(effectiveCustomerOrder).filter((order) => {', 'return mergedCustomerOrders().filter((order) => {', 1)

          old = '''function customerOrderCountdown(order) {
  const readyAt = Number(order?.estimatedReadyAt) || 0;
  if (!readyAt) return '';
  const seconds = Math.max(0, Math.ceil((readyAt - Date.now()) / 1000));
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${minutes}:${String(secs).padStart(2, '0')} igjen`;
}'''
          new = '''function customerOrderCountdown(order) {
  const readyAt = Number(order?.estimatedReadyAt) || 0;
  if (!readyAt) return '';
  const remainingMs = readyAt - Date.now();
  if (remainingMs <= 0) return 'Klar nå';
  const seconds = Math.ceil(remainingMs / 1000);
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  return `${minutes}:${String(secs).padStart(2, '0')} igjen`;
}'''
          if old not in s:
              raise SystemExit('customerOrderCountdown block not found')
          s = s.replace(old, new, 1)

          old = '''function refreshCustomerOrderCountdowns() {
  const orders = activeCustomerOrders();
  const byId = new Map(orders.map((order) => [order.id, order]));
  document.querySelectorAll('[data-customer-countdown]').forEach((node) => {
    const order = byId.get(node.dataset.customerCountdown);
    if (!order) return;
    node.textContent = customerOrderCountdown(order) || (order.status === 'klar' ? 'Klar nå' : `Ca. ${Math.max(0, Number(order.estimatedMinutes) || 0)} min`);
  });
  for (const order of orders) {
    const readyAt = Number(order.estimatedReadyAt) || 0;
    if (readyAt > 0 && readyAt <= Date.now() && ['bekreftet', 'tilberedning'].includes(order.status)) {
      void promoteCustomerExpiredOrder(order);
    }
  }
}'''
          new = '''function refreshCustomerOrderCountdowns() {
  const visibleOrders = activeCustomerOrders();
  const byId = new Map(visibleOrders.map((order) => [order.id, order]));
  document.querySelectorAll('[data-customer-countdown]').forEach((node) => {
    const order = byId.get(node.dataset.customerCountdown);
    if (!order) return;
    const countdown = customerOrderCountdown(order);
    node.textContent = countdown || (Number(order.estimatedMinutes) > 0 ? `Ca. ${Number(order.estimatedMinutes)} min` : '');
  });

  // IMPORTANT: use the raw merged orders here, not a presentation-transformed
  // list. Otherwise an expired order can look ready in the UI without the
  // ready status ever being persisted to Firebase.
  for (const order of mergedCustomerOrders()) {
    const readyAt = Number(order.estimatedReadyAt) || 0;
    if (readyAt > 0 && readyAt <= Date.now() && ['bekreftet', 'tilberedning'].includes(order.status)) {
      void promoteCustomerExpiredOrder(order);
    }
  }
}'''
          if old not in s:
              raise SystemExit('refreshCustomerOrderCountdowns block not found')
          s = s.replace(old, new, 1)

          # Remove redundant timeout-based transition layer; the 1s clock is the
          # single source of truth and also persists the state to Firebase.
          s = s.replace('const scheduledReadyTransitions = new Map();\n', '')
          s = re.sub(r'''\nfunction syncScheduledReadyTransitions\(orders\) \{.*?\n\}\n\nfunction notifyReadyOrders''', '\nfunction notifyReadyOrders', s, count=1, flags=re.S)
          s = s.replace('  syncScheduledReadyTransitions(orders);\n', '')
          p.write_text(s, encoding='utf-8')

          # ---------- data.js ----------
          p = Path('demo/js/data.js')
          s = p.read_text(encoding='utf-8')
          old = '''function applyRemoteOrders(value) {
  const next = normalizeOrders(value);
  const before = JSON.stringify(store.orders.map((o) => [o.id, o.status]));
  const after = JSON.stringify(next.map((o) => [o.id, o.status]));
  store.orders = next;
  return before !== after;
}'''
          new = '''function applyRemoteOrders(value) {
  const next = normalizeOrders(value);
  const snapshot = (orders) => JSON.stringify(orders.map((o) => [
    o.id,
    o.status,
    Number(o.statusUpdatedAt) || 0,
    Number(o.estimatedMinutes) || 0,
    Number(o.estimatedAt) || 0,
    Number(o.estimatedReadyAt) || 0,
    o.pickup || '',
    Number(o.total) || 0,
    Array.isArray(o.lines) ? o.lines.length : 0,
  ]));
  const before = snapshot(store.orders || []);
  const after = snapshot(next);
  store.orders = next;
  return before !== after;
}'''
          if old not in s:
              raise SystemExit('applyRemoteOrders block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- admin.js ----------
          p = Path('demo/js/admin.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("orderFilterBtns: document.querySelectorAll('.filter-btn[data-order-filter]'),", "orderFilterBtns: document.querySelectorAll('.orders-tab[data-order-filter]'),", 1)

          s = re.sub(r'''function filteredOrders\(\) \{.*?\n\}\n\nfunction compactOrderTime''', '''function filteredOrders() {
  ui.orderFilter = 'all';
  return getOrders();
}

function compactOrderTime''', s, count=1, flags=re.S)

          start = s.find('function orderListRowHtml(order, isNew = false) {')
          end = s.find('\nfunction renderOrderTabs(allOrders) {', start)
          if start < 0 or end < 0:
              raise SystemExit('orderListRowHtml boundaries not found')
          replacement = r'''function orderCenterText(order) {
  if (order.status === 'klar') return 'Klar for henting';
  if (order.status === 'mottatt') return 'Venter på svar';
  if (['bekreftet', 'tilberedning'].includes(order.status)) {
    const readyAt = Number(order.estimatedReadyAt) || 0;
    if (readyAt) {
      const remainingMs = readyAt - Date.now();
      if (remainingMs <= 0) return 'Klar nå';
      const seconds = Math.ceil(remainingMs / 1000);
      const minutes = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${minutes} min. ${String(secs).padStart(2, '0')} sek.`;
    }
  }
  return orderListStatus(order);
}

function orderListRowHtml(order, isNew = false) {
  const selected = order.id === selectedOrderId;
  return `
    <button class="orders-list-row${isNew ? ' is-new' : ''}${selected ? ' is-selected' : ''}" data-select-order="${escapeHtml(order.id)}" type="button">
      <span class="orders-list-icon" aria-hidden="true">${order.type === 'levering' ? '🛵' : '🥡'}</span>
      <span class="orders-list-main">
        <span class="orders-list-name-row">
          <strong>${escapeHtml(order.customerName || 'Ukjent kunde')}</strong>
          ${isNew ? '<b class="orders-new-pill">NY</b>' : ''}
        </span>
        <small><i class="orders-status-mark"></i>${escapeHtml(orderListStatus(order))}</small>
      </span>
      <span class="orders-list-center" data-order-center="${escapeHtml(order.id)}">${escapeHtml(orderCenterText(order))}</span>
      <span class="orders-list-side">
        <strong>${order.status === 'klar' ? 'Klar' : formatPrice(order.total)}</strong>
        <small>${escapeHtml(compactOrderTime(order.createdAt))}</small>
      </span>
    </button>`;
}
'''
          s = s[:start] + replacement + s[end:]

          s = re.sub(r'''function renderOrderTabs\(allOrders\) \{.*?\n\}\n\nfunction renderOrderList''', '''function renderOrderTabs(allOrders) {
  ui.orderFilter = 'all';
  el.orderFilterBtns.forEach((button) => {
    button.classList.add('is-active');
    button.innerHTML = `<span>Alle</span><b>${allOrders.length}</b>`;
  });
}

function renderOrderList''', s, count=1, flags=re.S)

          # Detail should show both the originally assigned minutes and a live countdown.
          old = "${estimated ? `<div><span>Forventet</span><strong>Ca. ${estimated} min</strong></div>` : ''}"
          new = "${estimated ? `<div><span>Gitt tid</span><strong>${estimated} min</strong></div>` : ''}\n          ${estimated && ['bekreftet', 'tilberedning'].includes(order.status) ? `<div><span>Gjenstår</span><strong data-admin-detail-countdown=\"${escapeHtml(order.id)}\">${escapeHtml(orderCountdown(order) || 'Klar nå')}</strong></div>` : ''}"
          if old not in s:
              raise SystemExit('admin detail expected-time row not found')
          s = s.replace(old, new, 1)

          # Prevent browsers from restoring an old number-input value over the rendered order value.
          s = s.replace('data-detail-estimate type="number"', 'data-detail-estimate autocomplete="off" type="number"', 1)

          start = s.find('function refreshOrderClocks() {')
          end = s.find('\n}\n\n/* ------------------------------------------------------------------ *\n * Restaurantinnstillinger', start)
          if start < 0 or end < 0:
              raise SystemExit('refreshOrderClocks boundaries not found')
          replacement = r'''function refreshOrderClocks() {
  if (ui.page !== 'orders') return;
  document.querySelectorAll('[data-order-center]').forEach((node) => {
    const order = getOrders().find((entry) => entry.id === node.dataset.orderCenter);
    if (!order) return;
    node.textContent = orderCenterText(order);
  });
  document.querySelectorAll('[data-admin-detail-countdown]').forEach((node) => {
    const order = getOrders().find((entry) => entry.id === node.dataset.adminDetailCountdown);
    if (!order) return;
    node.textContent = orderCountdown(order) || (order.status === 'klar' ? 'Klar nå' : '—');
  });
}'''
          s = s[:start] + replacement + s[end+2:]
          p.write_text(s, encoding='utf-8')

          # ---------- admin.css ----------
          p = Path('demo/css/admin.css')
          s = p.read_text(encoding='utf-8')
          marker = '/* Centered live order state 2026-09-15 */'
          if marker in s:
              s = s.split(marker)[0].rstrip() + '\n'
          s += r'''

/* Centered live order state 2026-09-15 */
.orders-list-center { display: none; }
.orders-app.is-list-only .orders-list-row {
  grid-template-columns: 52px minmax(220px, 360px) minmax(260px, 1fr) 120px !important;
  min-height: 108px;
  column-gap: 18px;
}
.orders-app.is-list-only .orders-list-center {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  color: #2dbd59;
  font-size: clamp(19px, 2vw, 27px);
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -.02em;
  text-align: center;
  white-space: nowrap;
}
.orders-app.is-list-only .orders-list-row.is-new .orders-list-center {
  color: #f06c00;
  font-size: clamp(16px, 1.55vw, 21px);
}
.orders-app.is-list-only .orders-list-side {
  align-self: center;
}
.orders-app.is-list-only .orders-list-main {
  align-self: center;
}
@media (max-width: 900px) {
  .orders-app.is-list-only .orders-list-row {
    grid-template-columns: 44px minmax(0, 1fr) auto !important;
  }
  .orders-app.is-list-only .orders-list-center {
    grid-column: 2 / -1;
    justify-content: flex-start;
    margin-top: 4px;
    font-size: 17px;
    white-space: normal;
  }
}
'''
          p.write_text(s, encoding='utf-8')

          # ---------- cache bust ----------
          p = Path('demo/admin.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'/demo/css/admin\.css\?v=[^\"\']+', '/demo/css/admin.css?v=20260915-orderstable1', s)
          s = re.sub(r'/demo/js/admin\.js\?v=[^\"\']+', '/demo/js/admin.js?v=20260915-orderstable1', s)
          p.write_text(s, encoding='utf-8')

          p = Path('demo/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'/demo/js/customer\.js\?v=[^\"\']+', '/demo/js/customer.js?v=20260915-orderstable1', s)
          p.write_text(s, encoding='utf-8')

          p = Path('demo/service-worker.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"const CACHE_NAME = 'kol-demo-v\d+';", "const CACHE_NAME = 'kol-demo-v45';", s)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check demo/js/customer.js
          node --check demo/js/admin.js
          node --check demo/js/data.js
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/order-stability-cleanup-temp.yml
          git add demo/js/customer.js demo/js/admin.js demo/js/data.js demo/css/admin.css demo/admin.html demo/index.html demo/service-worker.js .github/workflows/order-stability-cleanup-temp.yml
          git commit -m 'Stabilize live order timers and admin status layout'
          git push origin HEAD:main
