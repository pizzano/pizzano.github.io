name: Order stability cleanup
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/order-stability-cleanup-temp.yml
      - .github/scripts/order_stability_cleanup.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/order_stability_cleanup.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/customer.js
          node --check demo/js/admin.js
          node --check demo/js/data.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/order-stability-cleanup-temp.yml
          rm .github/scripts/order_stability_cleanup.py
          git add demo/js/customer.js demo/js/admin.js demo/js/data.js demo/css/admin.css demo/admin.html demo/index.html demo/service-worker.js .github/workflows/order-stability-cleanup-temp.yml .github/scripts/order_stability_cleanup.py
          git commit -m 'Stabilize live order timers and admin status layout'
          git push origin HEAD:main
