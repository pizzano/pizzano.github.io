name: Fix cart auto close

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-cart-auto-close.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch cart behavior
        run: python .github/scripts/fix-cart-auto-close.py
      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'blockingCustomerOverlayOpen' test/index.html
          git diff --check
          git config user.name "KOL Cart Fix Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-cart-auto-close.yml .github/scripts/fix-cart-auto-close.py
          git add -- test/index.html
          git commit -m "Keep cart open during background order sync"
          git push origin HEAD:main
