name: Premium order status V29
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/premium-order-status-v29.yml
      - .github/scripts/premium_status_v29.py
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply premium status redesign
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/premium_status_v29.py')
          s = p.read_text(encoding='utf-8')
          old = "index, count = re.subn(pattern, new_func + '\\n\\nfunction renderOrderStatus(order) {', index, count=1, flags=re.S)"
          new = "index, count = re.subn(pattern, lambda _m: new_func + '\\n\\nfunction renderOrderStatus(order) {', index, count=1, flags=re.S)"
          if old not in s:
              raise SystemExit('regex replacement line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/premium_status_v29.py
      - name: Validate JavaScript and premium markup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('test/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S|re.I)
          Path('/tmp/index.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'premium-order-status' in s
          assert 'premium-order-progress' in s
          assert 'mobile-v29' in s
          c = Path('test/kol-core.css').read_text(encoding='utf-8')
          assert 'PREMIUM ORDER STATUS V29' in c
          PY
          node --check /tmp/index.js
      - name: Commit premium redesign
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git diff --cached --quiet || git commit -m 'Premium mobile order status redesign'
          git push
