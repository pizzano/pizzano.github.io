name: Consolidate stable demo

on:
  push:
    paths:
      - '.github/workflows/consolidate-demo.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Consolidate customer app safely
        shell: bash
        run: |
          set -euo pipefail

          test -f demo/app-core.js
          test -f demo/checkout-stability.js
          test -f demo/checkout-3step.js
          test -f demo/checkout-guidance.js
          test -f demo/index.html
          test -f demo/kol.css

          cat > demo/app.js.new <<'EOF'
          /*
           * KØL GRILL & PIZZA — CUSTOMER APP — STABLE BASELINE 2026-08-23
           *
           * IMPORTANT FOR FUTURE DEVELOPERS / AI AGENTS:
           * This file contains the complete customer-side application. It was deliberately
           * consolidated from the previously layered app-core + checkout patch files so the
           * working behavior has one source of truth.
           *
           * BEFORE CHANGING CHECKOUT:
           * - Preserve the 3-step flow: Bestilling -> Kontakt -> Hentetid.
           * - Completed progress steps must remain clickable for backwards navigation.
           * - No pickup option is preselected.
           * - "Send bestilling" remains clickable without a pickup choice only to show the
           *   validation warning/focus; it must NEVER submit until a choice is made.
           * - Pickup-time restrictions are TEMPORARILY in TEST MODE. Restore clock restrictions
           *   deliberately before production; do not silently change this while testing.
           * - Preserve Firebase/admin bridge events and payload shape unless admin is updated too.
           *
           * CHANGE POLICY:
           * Prefer small, local edits. Do not add another override/patch file for a normal fix.
           * Do not duplicate functions/styles just to override earlier code. Refactor only when
           * the working path is understood and tested. Keep index.html, app.js and kol.css as the
           * three customer-app source files unless there is a strong architectural reason not to.
           */
          EOF

          cat demo/app-core.js >> demo/app.js.new
          printf '\n\n/* ===== PICKUP STABILITY / TEST-MODE LAYER (consolidated) ===== */\n' >> demo/app.js.new
          cat demo/checkout-stability.js >> demo/app.js.new
          printf '\n\n/* ===== THREE-STEP CHECKOUT UX (consolidated) ===== */\n' >> demo/app.js.new
          cat demo/checkout-3step.js >> demo/app.js.new
          printf '\n\n/* ===== FINAL PICKUP VALIDATION GUIDANCE (consolidated) ===== */\n' >> demo/app.js.new
          cat demo/checkout-guidance.js >> demo/app.js.new
          mv demo/app.js.new demo/app.js

          node --check demo/app.js

          python3 - <<'PY'
          from pathlib import Path

          index = Path('demo/index.html')
          text = index.read_text(encoding='utf-8')
          note = '''<!--
KØL CUSTOMER APP — STABLE BASELINE 2026-08-23
Future developers / AI agents: keep this HTML as the structural shell. Business logic belongs
in app.js and reusable visual rules belong in kol.css. Avoid adding new inline patch layers
unless there is a concrete reason. Preserve element IDs used by app.js.
-->\n'''
          if 'KØL CUSTOMER APP — STABLE BASELINE 2026-08-23' not in text:
              if text.lower().startswith('<!doctype html>'):
                  first, rest = text.split('\n', 1)
                  text = first + '\n' + note + rest
              else:
                  text = note + text
          import re
          text = re.sub(r'app\.js\?v=[^"\']+', 'app.js?v=20260823-stable-baseline', text)
          index.write_text(text, encoding='utf-8')

          css = Path('demo/kol.css')
          css_text = css.read_text(encoding='utf-8')
          css_note = '''/*
 * KØL CUSTOMER UI — STABLE BASELINE 2026-08-23
 * Future developers / AI agents: this is the canonical stylesheet. Reuse existing selectors
 * and tokens before adding new rules. Avoid duplicate late-file overrides unless required for
 * a documented compatibility fix. Keep scrolling available on all customer screens.
 */\n'''
          if 'KØL CUSTOMER UI — STABLE BASELINE 2026-08-23' not in css_text:
              css_text = css_note + css_text
          css.write_text(css_text, encoding='utf-8')
          PY

          grep -q 'checkoutStep1' demo/app.js
          grep -q 'checkoutStep3' demo/app.js
          grep -q 'kol:order-ready' demo/app.js
          grep -q 'checkout-guidance' demo/app.js
          grep -q 'app.js?v=20260823-stable-baseline' demo/index.html

          rm demo/app-core.js demo/checkout-stability.js demo/checkout-3step.js demo/checkout-guidance.js
          rm .github/workflows/consolidate-demo.yml

          git config user.name 'KOL Stable Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'Consolidate and harden customer demo baseline'
          git push
