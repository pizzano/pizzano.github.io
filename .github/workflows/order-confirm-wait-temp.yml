name: Order confirmation wait flow
"on":
  push:
    branches: [main]
    paths:
      - .github/workflows/order-confirm-wait-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer confirmation wait flow
        run: python3 .github/order-confirm-wait-temp.py
      - name: Validate customer script
        run: node --check demo/js/customer.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/order-confirm-wait-temp.yml .github/order-confirm-wait-temp.py
          git add demo/js/customer.js demo/css/customer.css demo/index.html demo/service-worker.js .github/workflows/order-confirm-wait-temp.yml .github/order-confirm-wait-temp.py
          git commit -m 'Wait for restaurant confirmation after ordering'
          git push origin HEAD:main
