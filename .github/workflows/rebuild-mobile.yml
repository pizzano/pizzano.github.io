name: rebuild mobile
on:
  push:
    branches: [main]
    paths: [.github/workflows/rebuild-mobile.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 rebuild_mobile.py
      - run: |
          git config user.name KOLBot
          git config user.email bot@users.noreply.github.com
          rm -f rebuild_mobile.py .github/workflows/rebuild-mobile.yml
          git add test/index.html test/kol-core.css rebuild_mobile.py .github/workflows/rebuild-mobile.yml
          git commit -m 'Rebuild customer UI as stable mobile-only app'
          git push