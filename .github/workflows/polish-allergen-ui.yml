name: Polish allergen UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/polish-allergen-ui.yml'
      - '.github/scripts/polish-allergen-ui.py'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply UI polish
        run: python .github/scripts/polish-allergen-ui.py
      - name: Validate HTML script and UI markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('test/test.html').read_text(encoding='utf-8')
          checks=[
            'id="allergenSearch"',
            'id="resetAllergens"',
            'Søk i allergener',
            'local-allergen-device-note',
            'Ingen allergener funnet.',
            "['skalldyr','🦐','Skalldyr']",
            "['sulfitter','◇','Sulfitter']",
          ]
          for x in checks:
              assert x in s, x
          assert 'Produktene skjules ikke.' not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/test-inline.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/test-inline.js
          git diff --check
      - name: Commit polished UI and remove helpers
        shell: bash
        run: |
          git config user.name "KOL Test UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add test/test.html
          git rm -f .github/scripts/polish-allergen-ui.py .github/workflows/polish-allergen-ui.yml
          git commit -m "Polish allergen selector and search UI"
          git push origin HEAD:main
