name: BETA Realtime Database test-mode checks
on:
  push:
    branches: [main]
    paths:
      - 'BETA/**'
      - '.github/workflows/beta-order-tests.yml'
  pull_request:
    paths:
      - 'BETA/**'
      - '.github/workflows/beta-order-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mocked Firebase RTDB BETA order and admin flow
        run: node --test BETA/tests/beta-direct-rtdb.test.cjs
