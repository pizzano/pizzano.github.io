name: BETA secure order API tests
on:
  push:
    branches: [main]
    paths:
      - 'BETA/**'
      - 'api/beta.js'
      - 'vercel.json'
      - '.github/workflows/beta-order-tests.yml'
  pull_request:
    paths:
      - 'BETA/**'
      - 'api/beta.js'
      - 'vercel.json'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Original Vercel API regression (kept isolated)
        run: node --test BETA/tests/beta-api.test.cjs
      - name: Firebase Cloud Functions checkout-to-admin mock integration
        env:
          BETA_BACKEND_FIREBASE: '1'
        run: node --test BETA/tests/beta-api.test.cjs
      - name: Cloud Functions entrypoint and security tests
        run: node --test BETA/tests/firebase-adapter.test.cjs
