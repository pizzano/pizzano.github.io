name: Allergen text labels
on:
  push:
    paths:
      - '.github/workflows/allergen-text-labels.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/allergen-text-labels.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('test/test.html').read_text(encoding='utf-8')
          assert 'Inneholder: ${labels.join' in s
          assert 'Selected allergen warning: compact text' in s
          start=s.rfind('<script>')+8
          end=s.rfind('</script>')
          Path('/tmp/test-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/test-inline.js
      - name: Commit and clean helpers
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/scripts/allergen-text-labels.py .github/workflows/allergen-text-labels.yml
          git commit -m 'Show selected allergens as text warnings'
          git push
