name: Apply remix UI safely
on:
  push:
    paths:
      - '.github/workflows/remix-ui-apply.yml'
permissions:
  contents: write
jobs:
  remix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and apply remix CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source=Path('.github/workflows/remix-ui.yml').read_text(encoding='utf-8')
          m=re.search(r"remix=r'''\n(.*?)\n'''",source,re.S)
          if not m:
              raise SystemExit('Remix CSS source not found')
          remix=m.group(1)
          css_path=Path('demo/kol.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* ===== KOL ATOMS REMIX 2026-08-25 ===== */'
          if marker in css:
              css=css.split(marker)[0].rstrip()
          css_path.write_text(css+'\n\n'+remix.strip()+'\n',encoding='utf-8')
          for name in ('admin.html','index.html'):
              p=Path('demo')/name
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'kol\.css\?v=[^"\']+','kol.css?v=20260825-remix1',t)
              p.write_text(t,encoding='utf-8')
          PY
      - name: Commit remix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/admin.html demo/index.html demo/kol.css
          git commit -m 'Apply Atoms inspired KOL remix' || exit 0
          git push