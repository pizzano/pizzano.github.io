name: Persist customer header
on:
  push:
    paths:
      - '.github/workflows/persist-customer-header.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply header update
        run: python .github/scripts/persist_header.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h = Path('test/test.html').read_text(encoding='utf-8')
          m = re.search(r'<script>([\s\S]*?)</script>', h)
          assert m
          Path('/tmp/test.js').write_text(m.group(1), encoding='utf-8')
          assert "classList.remove('kol-top-back-active')" in h
          assert 'persistent-header-20260818-0002' in h
          PY
          node --check /tmp/test.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/scripts/persist_header.py .github/workflows/persist-customer-header.yml
          if [ -f .github/workflows/refine-profile-modern.yml ]; then git rm -f .github/workflows/refine-profile-modern.yml; fi
          git add test/test.html test/test.css
          git commit -m 'Keep customer header accessible on all screens'
          git push
