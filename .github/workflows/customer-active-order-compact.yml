name: Customer active order compact
on:
  push:
    branches:
      - fix/customer-active-order-compact-20260916
    paths:
      - .github/workflows/customer-active-order-compact.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply customer active order patch
        run: python3 .github/scripts/customer-active-order-compact.py
      - name: Commit patched customer UI
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/js/customer.js demo/css/customer.css demo/index.html
          git commit -m 'Compact active order card' || exit 0
          git push origin HEAD:fix/customer-active-order-compact-20260916
