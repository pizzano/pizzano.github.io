name: Refine member profile
on:
  push:
    paths:
      - '.github/workflows/refine-member-profile.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply member profile refinement
        run: python .github/scripts/refine_member_profile.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          import re, pathlib
          text=pathlib.Path('test/test.html').read_text()
          m=re.search(r'<script>([\s\S]*?)</script>', text)
          pathlib.Path('/tmp/test-member.js').write_text(m.group(1))
          PY
          node --check /tmp/test-member.js
      - name: Validate CSS and language removal
        run: |
          grep -q 'account-sheet' test/test.css
          grep -q 'STOR PIZZA-KUPONGER' test/test.html
          ! grep -q 'memberLang\|Velg språk\|pfLang' test/test.html
      - name: Commit changes and cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html test/test.css
          git rm -f .github/scripts/refine_member_profile.py .github/workflows/refine-member-profile.yml
          git commit -m 'Simplify member profile around pizza rewards'
          git push
