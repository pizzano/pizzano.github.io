name: Product sheet UX improvements
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-sheet-ux-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply product sheet UX improvements
        run: python3 .github/scripts/product_sheet_ux_temp.py
      - name: Validate customer JavaScript
        run: node --check demo/js/customer.js
      - name: Commit update and cleanup
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/product-sheet-ux-temp.yml .github/scripts/product_sheet_ux_temp.py
          git add demo/index.html demo/js/customer.js demo/css/customer.css demo/service-worker.js .github/workflows/product-sheet-ux-temp.yml .github/scripts/product_sheet_ux_temp.py
          git commit -m 'Improve product sheet close, allergens and action feedback'
          git push origin HEAD:main
