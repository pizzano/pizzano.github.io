name: Run corrected demo cart info polish

on:
  push:
    branches: [main]
    paths:
      - demo/cart-info-polish2.trigger
      - .github/workflows/demo-cart-info-polish-run.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute prepared patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          src=Path('.github/workflows/demo-cart-info-polish.yml').read_text(encoding='utf-8')
          anchor="          python3 - <<'PY'\n"
          start=src.index(anchor)+len(anchor)
          end=src.index("\n          PY\n",start)
          code=textwrap.dedent(src[start:end])
          bad="html=re.sub(r'kol\\.css\\?v=[^\"\\']+','kol.css?v=cart-info-20260818-2034',html)"
          good="html=html.replace('kol.css?v=coupon-qr-20260818-2005','kol.css?v=cart-info-20260818-2034')"
          if bad not in code:
              raise SystemExit('expected regex line not found')
          code=code.replace(bad,good)
          exec(compile(code,'cart-info-patch','exec'))
          PY

      - name: Validate and commit to main
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('demo/index.html').read_text(encoding='utf-8')
          c=Path('demo/kol.css').read_text(encoding='utf-8')
          for x in ['checkoutConfirmCard','upsertCheckoutAccount','info-list-card','checkoutPhoneField','kol.css?v=cart-info-20260818-2034']:
              assert x in h,x
          assert 'Cart info contact polish 20260818' in c
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/demo-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/demo-inline.js
          git config user.name "KOL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish cart info and contact flow"
          git push origin HEAD:main

