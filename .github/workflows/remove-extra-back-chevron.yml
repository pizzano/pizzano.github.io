name: Remove extra back chevron
on:
  push:
    paths:
      - '.github/workflows/remove-extra-back-chevron.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/remove-extra-back-chevron.py
      - name: Validate
        run: |
          grep -q 'suppress legacy extra chevron' test/test.html
          grep -q 'brand-back-label.*← Til meny' test/test.html
      - name: Commit and clean helpers
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/scripts/remove-extra-back-chevron.py .github/workflows/remove-extra-back-chevron.yml
          git commit -m 'Remove extra back chevron'
          git push
