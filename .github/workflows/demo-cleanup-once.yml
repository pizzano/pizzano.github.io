name: One-time demo cleanup

on:
  push:
    branches: [main]
    paths:
      - '.cleanup/**'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild cleaned demo files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, shutil

          root = Path('.')
          parts = root / '.cleanup'
          targets = {
              'app_js': root / 'demo/app.js',
              'index_html': root / 'demo/index.html',
              'kol_css': root / 'demo/kol.css',
          }

          for stem, target in targets.items():
              encoded = ''.join(
                  p.read_text().strip()
                  for p in sorted(parts.glob(f'{stem}.*.part'))
              )
              if not encoded:
                  raise RuntimeError(f'Missing cleanup chunks for {stem}')
              target.write_bytes(gzip.decompress(base64.b64decode(encoded)))

          for obsolete in [
              root / 'demo/firebase-menu.js',
              root / 'demo/firebase-menu-seed.json',
          ]:
              if obsolete.exists():
                  obsolete.unlink()

          shutil.rmtree(parts)
          PY

      - name: Verify rebuilt files
        shell: bash
        run: |
          test "$(git hash-object demo/app.js)" = "1562b852e923950d6a91198dff6f09abee191c61"
          test "$(git hash-object demo/index.html)" = "090c2173efbd48373837463000f721f714d55c19"
          test "$(git hash-object demo/kol.css)" = "16702a55495ab2705726915bf9d4e2aec90cdfe2"
          node --check demo/app.js

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate Firebase menu integration" || exit 0
          git push origin HEAD:main
