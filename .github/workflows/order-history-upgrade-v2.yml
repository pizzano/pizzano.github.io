name: Temporary order history upgrade v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/order-history-upgrade-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade customer order history
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import re

          js_path = Path('demo/js/customer.js')
          css_path = Path('demo/css/customer.css')
          sw_path = Path('demo/service-worker.js')
          js = js_path.read_text(encoding='utf-8')

          serialization_pattern = re.compile(r"  const lines = cart\.map\(\(line\) => \{.*?\n  \}\);", re.S)
          new_lines = dedent(r'''\
            const lines = cart.map((line) => {
              const { item } = findItem(line.itemId);
              const size = (item.sizes || []).find((s) => s.id === line.sizeId);
              const optionIds = Object.values(line.selections || {}).flat();
              const optionDetails = describeSelection(optionIds).map((addon) => ({
                groupTitle: addon.groupTitle || 'Tilvalg',
                label: addon.label,
                price: Number(addon.price) || 0,
              }));
              return {
                itemId: line.itemId,
                name: item ? item.name : 'Ukjent',
                sizeId: size ? size.id : line.sizeId || null,
                size: size ? size.label : '',
                quantity: line.quantity,
                selections: JSON.parse(JSON.stringify(line.selections || {})),
                optionIds: [...optionIds],
                options: optionDetails.map((addon) => addon.label),
                optionDetails,
                comment: line.comment || '',
                unitPrice: computeLinePrice(item, line.sizeId, optionIds, 1),
                price: computeLinePrice(item, line.sizeId, optionIds, line.quantity),
              };
            });
          ''').rstrip()
          js, count = serialization_pattern.subn(lambda _: new_lines, js, count=1)
          if count != 1:
              raise SystemExit(f'Order-line serialization replacement count: {count}')

          profile_marker = 'function renderProfile() {'
          helpers = dedent(r'''\
            function previousOrderSelections(item, line) {
              const groups = getItemOptionGroups(item);
              const savedSelections =
                line && line.selections && typeof line.selections === 'object'
                  ? line.selections
                  : {};
              const savedIds = new Set([
                ...(Array.isArray(line.optionIds) ? line.optionIds : []),
                ...Object.values(savedSelections)
                  .flat()
                  .filter((id) => typeof id === 'string'),
              ]);
              const savedLabels = new Set([
                ...(Array.isArray(line.options) ? line.options : []),
                ...(Array.isArray(line.optionDetails)
                  ? line.optionDetails.map((entry) => entry && entry.label)
                  : []),
              ].filter(Boolean).map((label) => String(label)));

              const selections = {};
              for (const group of groups) {
                const options = group.options || [];
                const validIds = new Set(options.map((option) => option.id));
                let picked = Array.isArray(savedSelections[group.id])
                  ? savedSelections[group.id].filter((id) => validIds.has(id))
                  : [];

                if (!picked.length && savedIds.size) {
                  picked = options.filter((option) => savedIds.has(option.id)).map((option) => option.id);
                }
                if (!picked.length && savedLabels.size) {
                  picked = options
                    .filter((option) => savedLabels.has(option.label))
                    .map((option) => option.id);
                }
                if (!picked.length && group.required) {
                  picked = (group.defaultOptionIds || []).filter((id) => validIds.has(id));
                }

                selections[group.id] = group.selectionMode === 'single'
                  ? picked.slice(0, 1)
                  : picked.slice(0, Math.max(Number(group.maxSelections) || picked.length, 1));
              }
              return selections;
            }

            function previousOrderOptionDetails(line) {
              if (Array.isArray(line.optionDetails) && line.optionDetails.length) {
                return line.optionDetails
                  .filter((entry) => entry && entry.label)
                  .map((entry) => ({
                    groupTitle: entry.groupTitle || 'Tilvalg',
                    label: entry.label,
                    price: Number.isFinite(Number(entry.price)) ? Number(entry.price) : null,
                  }));
              }

              const labels = Array.isArray(line.options) ? line.options.filter(Boolean) : [];
              if (!labels.length) return [];
              const remaining = new Set(labels.map((label) => String(label)));
              const details = [];
              const { item } = findItem(line.itemId);

              if (item) {
                for (const group of getItemOptionGroups(item)) {
                  for (const option of group.options || []) {
                    if (!remaining.has(option.label)) continue;
                    details.push({
                      groupTitle: group.title || 'Tilvalg',
                      label: option.label,
                      price: Number(option.price) || 0,
                    });
                    remaining.delete(option.label);
                  }
                }
              }

              for (const label of remaining) {
                details.push({ groupTitle: 'Tilvalg', label, price: null });
              }
              return details;
            }

            function orderHistoryLineHtml(line) {
              const details = previousOrderOptionDetails(line);
              const grouped = new Map();
              for (const detail of details) {
                const key = detail.groupTitle || 'Tilvalg';
                if (!grouped.has(key)) grouped.set(key, []);
                grouped.get(key).push(detail);
              }
              const groupsHtml = Array.from(grouped.entries())
                .map(([title, items]) => `
                  <div class="order-history-option-group">
                    <span>${escapeHtml(title)}</span>
                    <ul>${items.map((item) => `
                      <li>
                        <span>${escapeHtml(item.label)}</span>
                        ${item.price > 0 ? `<strong>+${formatPrice(item.price)}</strong>` : ''}
                      </li>`).join('')}</ul>
                  </div>`)
                .join('');

              return `
                <div class="order-history-line">
                  <div class="order-history-line-head">
                    <strong>${escapeHtml(`${line.quantity || 1}× ${line.name || 'Produkt'}`)}</strong>
                    <b>${formatPrice(Number(line.price) || 0)}</b>
                  </div>
                  ${line.size ? `<div class="order-history-size"><span>Størrelse</span><strong>${escapeHtml(line.size)}</strong></div>` : ''}
                  ${groupsHtml}
                  ${line.comment ? `<p class="order-history-comment">«${escapeHtml(line.comment)}»</p>` : ''}
                </div>`;
            }

            function orderStatusClass(status) {
              const value = String(status || '').toLocaleLowerCase('no');
              if (value.includes('avvist')) return 'is-rejected';
              if (value.includes('klar') || value.includes('fullført')) return 'is-done';
              if (value.includes('tilbered')) return 'is-active';
              return 'is-new';
            }

          ''')
          if 'function previousOrderSelections(item, line)' not in js:
              if profile_marker not in js:
                  raise SystemExit('Could not find profile marker')
              js = js.replace(profile_marker, helpers + profile_marker, 1)

          order_block_pattern = re.compile(
              r"  const live = getOrders\(\);\n  const orders = getLocalOrders\(\);\n  el\.orderList\.innerHTML = orders\.length\n.*?    : '<p class=\"hint\">Ingen tidligere bestillinger\.</p>';\n}",
              re.S,
          )
          new_order_block = dedent(r'''\
              const live = getOrders();
              const orders = getLocalOrders();
              el.orderList.innerHTML = orders.length
                ? orders
                    .slice(0, 30)
                    .map((order) => {
                      const date = new Date(order.createdAt);
                      const stamp = `${String(date.getDate()).padStart(2, '0')}.${String(
                        date.getMonth() + 1
                      ).padStart(2, '0')}.${date.getFullYear()} · ${String(date.getHours()).padStart(2, '0')}:${String(
                        date.getMinutes()
                      ).padStart(2, '0')}`;
                      const summary = (order.lines || [])
                        .map((line) => `${line.quantity}× ${line.name}`)
                        .join(', ');
                      const current = live.find((entry) => entry.id === order.id);
                      const status = orderStatusLabel(current ? current.status : order.status);
                      const details = (order.lines || []).map(orderHistoryLineHtml).join('');
                      const shortId = String(order.id || '').slice(-6).toUpperCase();
                      return `
                        <details class="order-history-card">
                          <summary>
                            <div class="order-history-top">
                              <div class="order-history-total">
                                <strong>${formatPrice(order.total)}</strong>
                                <span>${escapeHtml(stamp)}</span>
                              </div>
                              <span class="order-status-pill ${orderStatusClass(status)}">${escapeHtml(status)}</span>
                            </div>
                            <p class="order-history-summary">${escapeHtml(summary)}</p>
                            <span class="order-history-toggle">Se detaljer <i aria-hidden="true">⌄</i></span>
                          </summary>
                          <div class="order-history-details">
                            <div class="order-history-lines">${details || '<p class="hint">Ingen varelinjer lagret.</p>'}</div>
                            <div class="order-history-meta">
                              <div><span>Ordrenummer</span><strong>${escapeHtml(shortId || '—')}</strong></div>
                              <div><span>Hentetid</span><strong>${escapeHtml(order.pickup || '—')}</strong></div>
                              <div><span>Totalt</span><strong>${formatPrice(order.total)}</strong></div>
                            </div>
                            <button class="btn btn-primary order-reorder-btn" data-reorder="${escapeHtml(order.id)}" type="button">Bestill samme igjen</button>
                          </div>
                        </details>`;
                    })
                    .join('')
                : '<p class="hint">Ingen tidligere bestillinger.</p>';
            }''')
          js, count = order_block_pattern.subn(lambda _: new_order_block, js, count=1)
          if count != 1:
              raise SystemExit(f'Order history render replacement count: {count}')

          reorder_pattern = re.compile(
              r"function reorder\(orderId\) \{.*?\n}\n\n/\* ------------------------------------------------------------------ \*\n \* Hendelser",
              re.S,
          )
          new_reorder = dedent(r'''\
            function reorder(orderId) {
              const order = getLocalOrders().find((entry) => entry.id === orderId);
              if (!order) return;
              let added = 0;
              for (const line of order.lines || []) {
                const { item } = findItem(line.itemId);
                if (!item || item.hidden || item.soldOut) continue;
                const size =
                  (item.sizes || []).find((s) => s.id === line.sizeId) ||
                  (item.sizes || []).find((s) => s.label === line.size) ||
                  getDefaultSize(item);
                const selections = previousOrderSelections(item, line);
                const signature = lineSignature(
                  item.id,
                  size ? size.id : null,
                  selections,
                  line.comment
                );
                const existing = cart.find((entry) => entry.signature === signature);
                const quantity = Math.max(1, Number(line.quantity) || 1);
                if (existing) existing.quantity += quantity;
                else
                  cart.push({
                    lineId: uid('ln'),
                    signature,
                    itemId: item.id,
                    sizeId: size ? size.id : null,
                    selections,
                    comment: line.comment || '',
                    quantity,
                  });
                added += quantity;
              }
              persistCart();
              renderCartCount();
              renderBottomBar();
              if (added) {
                toast(`${added} ${added === 1 ? 'vare' : 'varer'} lagt i handlekurven med samme valg.`);
                setView('cart');
              } else {
                toast('Produktene er ikke tilgjengelige nå.');
              }
            }

            /* ------------------------------------------------------------------ *
             * Hendelser''')
          js, count = reorder_pattern.subn(lambda _: new_reorder, js, count=1)
          if count != 1:
              raise SystemExit(f'Reorder replacement count: {count}')

          js_path.write_text(js, encoding='utf-8')

          css = css_path.read_text(encoding='utf-8')
          marker = '/* ======================== Modern order history ======================== */'
          if marker not in css:
              css += dedent(r'''\

                /* ======================== Modern order history ======================== */
                #orderList { gap: 9px; }
                .order-history-card { border: 1px solid #e1e4e8; border-radius: 13px; background: #fff; overflow: hidden; box-shadow: 0 1px 3px rgba(25,31,38,.045); }
                .order-history-card > summary { list-style: none; cursor: pointer; padding: 11px 12px 10px; user-select: none; }
                .order-history-card > summary::-webkit-details-marker { display: none; }
                .order-history-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
                .order-history-total { min-width: 0; }
                .order-history-total strong { display: block; color: #24272b; font-size: 14px; line-height: 1.15; font-weight: 800; }
                .order-history-total span { display: block; margin-top: 2px; color: #7b838d; font-size: 10.8px; }
                .order-status-pill { flex: none; display: inline-flex; align-items: center; min-height: 25px; padding: 0 9px; border-radius: 999px; font-size: 10.8px; font-weight: 750; border: 1px solid transparent; }
                .order-status-pill.is-new { color: #bd4e08; background: #fff4ec; border-color: #ffd9bf; }
                .order-status-pill.is-active { color: #9b5d00; background: #fff8df; border-color: #f4dda0; }
                .order-status-pill.is-done { color: #177443; background: #eefaf3; border-color: #bfe8cf; }
                .order-status-pill.is-rejected { color: #a83b3b; background: #fff1f1; border-color: #efc8c8; }
                .order-history-summary { margin: 7px 0 0; color: #5f6873; font-size: 11.5px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
                .order-history-toggle { display: inline-flex; align-items: center; gap: 4px; margin-top: 7px; color: #d75a0d; font-size: 10.8px; font-weight: 700; }
                .order-history-toggle i { font-style: normal; transition: transform .18s ease; }
                .order-history-card[open] .order-history-toggle i { transform: rotate(180deg); }
                .order-history-details { padding: 0 12px 12px; border-top: 1px solid #edf0f2; background: #fcfcfc; }
                .order-history-lines { display: grid; gap: 8px; padding-top: 10px; }
                .order-history-line { padding: 9px 10px; border: 1px solid #e5e7ea; border-radius: 10px; background: #fff; }
                .order-history-line-head, .order-history-size, .order-history-option-group li, .order-history-meta > div { display: flex; align-items: baseline; justify-content: space-between; gap: 9px; }
                .order-history-line-head strong { font-size: 12.2px; color: #25282c; }
                .order-history-line-head b { flex: none; font-size: 11.8px; color: #25282c; }
                .order-history-size { margin-top: 5px; font-size: 10.8px; color: #727b86; }
                .order-history-size strong { color: #353a40; }
                .order-history-option-group { margin-top: 7px; }
                .order-history-option-group > span { display: block; margin-bottom: 3px; color: #8a929c; font-size: 9.7px; line-height: 1.2; font-weight: 800; letter-spacing: .025em; text-transform: uppercase; }
                .order-history-option-group ul { list-style: none; margin: 0; padding: 0; }
                .order-history-option-group li { position: relative; padding: 2px 0 2px 9px; color: #646d77; font-size: 10.8px; }
                .order-history-option-group li::before { content: ''; position: absolute; left: 0; top: .72em; width: 3px; height: 3px; border-radius: 50%; background: #ef6812; }
                .order-history-option-group li strong { flex: none; color: #3f454c; font-size: 10.5px; }
                .order-history-comment { margin: 6px 0 0; color: #9b5d00; font-size: 10.5px; font-style: italic; }
                .order-history-meta { display: grid; gap: 3px; margin-top: 10px; padding-top: 9px; border-top: 1px solid #e5e7ea; }
                .order-history-meta > div { color: #747d87; font-size: 10.8px; }
                .order-history-meta strong { color: #34393f; }
                .order-reorder-btn { width: 100%; min-height: 39px; margin-top: 10px; border-radius: 9px; font-size: 12px; }
              ''')
              css_path.write_text(css, encoding='utf-8')

          sw = sw_path.read_text(encoding='utf-8')
          sw = sw.replace("const CACHE_NAME = 'kol-demo-v24';", "const CACHE_NAME = 'kol-demo-v25';")
          sw_path.write_text(sw, encoding='utf-8')
          PY

      - name: Commit upgraded order history
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add demo/js/customer.js demo/css/customer.css demo/service-worker.js
          git diff --cached --check
          git commit -m 'Preserve order extras and modernize order history'
          git push origin HEAD:main
