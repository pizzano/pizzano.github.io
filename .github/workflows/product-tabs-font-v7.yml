name: Product tabs and font v7 repair
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/product-tabs-font-v7.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore clean mobile base and apply measured changes
        shell: bash
        run: |
          git show c9241d4fc0aa6899d52a8f03a0a3b323365747a9:test/kol-core.css > test/kol-core.css
          git show c9241d4fc0aa6899d52a8f03a0a3b323365747a9:test/index.html > test/index.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_path = Path('test/kol-core.css')
          css = css_path.read_text(encoding='utf-8')

          hidden_old = 'body.kol-customer.cart-open .category-tabs-wrap,body.kol-customer.profile-open .category-tabs-wrap,body.kol-customer.info-open .category-tabs-wrap,body.kol-customer.order-live-open .category-tabs-wrap,body.kol-customer.kol-product-detail-open .category-tabs-wrap{display:none!important}'
          hidden_new = 'body.kol-customer.cart-open .category-tabs-wrap,body.kol-customer.profile-open .category-tabs-wrap,body.kol-customer.info-open .category-tabs-wrap,body.kol-customer.order-live-open .category-tabs-wrap{display:none!important}'
          if hidden_old not in css:
              raise SystemExit('product category hide selector not found')
          css = css.replace(hidden_old, hidden_new, 1)

          product_tabs_rule = '''\n/* product screen keeps category navigation visible */\nbody.kol-customer.kol-product-detail-open .category-tabs-wrap{display:block!important}\nbody.kol-customer .product-modal.mobile-screen{top:calc(var(--head) + var(--tabs))!important;height:calc(100dvh - var(--head) - var(--tabs))!important}\n'''
          css = css.replace('/* product */', product_tabs_rule + '\n/* product */', 1)

          size_map = {
              '8':'9', '8.5':'9.5', '9':'10', '9.5':'10.5',
              '10':'11', '10.5':'11.5', '11':'12', '12':'13',
              '13':'14', '15':'16'
          }
          pattern = re.compile(r'font-size:(8(?:\.5)?|9(?:\.5)?|10(?:\.5)?|11|12|13|15)px!important')
          css = pattern.sub(lambda m: f'font-size:{size_map[m.group(1)]}px!important', css)

          readable = '''\n/* readable product choices */\nbody.kol-customer .ingredient-chip,body.kol-customer .option-line,body.kol-customer .option-chip,body.kol-customer .option-group label{font-size:13px!important;line-height:1.4!important}\nbody.kol-customer .option-group>h3,body.kol-customer .ingredient-removal-heading{font-size:14px!important;font-weight:900!important}\nbody.kol-customer .quantity-row,body.kol-customer .quantity-stepper{font-size:14px!important}\n'''
          css = css.replace('/* cart */', readable + '\n/* cart */', 1)
          css_path.write_text(css, encoding='utf-8')

          index_path = Path('test/index.html')
          html = index_path.read_text(encoding='utf-8')
          html = html.replace('kol-core.css?v=mobile-v6', 'kol-core.css?v=mobile-v7')
          nav_js = '''\n// When a category is chosen while a product is open, close the product and continue to that category.\ndocument.getElementById("categoryTabs")?.addEventListener("click", (event) => {\n  const tab = event.target.closest("button");\n  if (!tab || !document.body.classList.contains("kol-product-detail-open")) return;\n  document.getElementById("closeProduct")?.click();\n}, true);\n'''
          pos = html.rfind('</script>')
          if pos == -1:
              raise SystemExit('script closing tag not found')
          html = html[:pos] + nav_js + html[pos:]
          index_path.write_text(html, encoding='utf-8')

          assert 'mobile-v7' in html
          assert 'product screen keeps category navigation visible' in css
          assert 'readable product choices' in css
          PY
      - name: Commit repaired changes
        shell: bash
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/kol-core.css
          git commit -m 'Repair product categories and measured text sizing'
          git push origin HEAD:main
