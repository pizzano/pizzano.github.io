name: Professional admin orders redesign
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/admin-orders-pro-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 admin_orders_pro_patch.py
      - name: Validate
        run: |
          node --check demo/js/admin.js
          node --check demo/js/data.js
          grep -q 'orders-app' demo/admin.html
          grep -q 'Professional orders workspace' demo/css/admin.css
      - name: Commit changes
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm admin_orders_pro_patch.py
          git add demo/admin.html demo/js/admin.js demo/js/data.js demo/css/admin.css demo/service-worker.js admin_orders_pro_patch.py
          git commit -m 'Redesign admin orders into professional POS workspace'
          git push origin HEAD:main
