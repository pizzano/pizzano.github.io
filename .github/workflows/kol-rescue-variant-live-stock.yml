name: KOL rescue variant live stock deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/kol-rescue-variant-live-stock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 kol_rescue_patch.py
      - name: Validate
        run: |
          grep -q 'id="rescueVariant"' test/admin-panel.html
          grep -q 'getRescueCartQuantity' test/index.html
          grep -q 'REDDE MATEN VARIANT + LIVE STOCK' test/kol-core.css
      - name: Commit
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/index.html test/admin-panel.html test/kol-core.css
          git commit -m 'Add rescue variant and live remaining stock'
          git push origin HEAD:main