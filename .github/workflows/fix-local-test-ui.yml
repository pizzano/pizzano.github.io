name: Fix local test UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-local-test-ui.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch local test UI
        run: python .github/scripts/fix-local-test-ui.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('test/test.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          if len(scripts)!=1: raise SystemExit(f'expected one inline script, got {len(scripts)}')
          Path('/tmp/test-local.js').write_text(scripts[0],encoding='utf-8')
          for needle in ('local-allergen-rail','data-vis-mer','slice(0,3)','expandedVirtual'):
              if needle not in html: raise SystemExit('missing '+needle)
          print('invariants ok')
          PY
          node --check /tmp/test-local.js
          git diff --check
      - name: Commit and clean helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL Test UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/fix-local-test-ui.yml .github/scripts/fix-local-test-ui.py
          git add test/test.html
          git diff --cached --check
          git commit -m "Show allergen filter and limit featured lists"
          git push origin HEAD:main
