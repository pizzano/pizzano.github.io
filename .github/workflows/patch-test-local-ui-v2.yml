name: Patch local test UI v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-test-local-ui-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch test UI
        run: python .github/scripts/patch-test-local-ui-v2.py
      - name: Validate
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess
          s=Path('test/test.html').read_text(encoding='utf-8')
          assert 'Matallergier' in s
          assert 'local-menu-tools' in s
          assert 'local-product-allergens' in s
          assert 'Inneholder:' in s
          assert 'local-allergen-rail' not in s
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert scripts
          Path('/tmp/test-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          subprocess.run(['node','--check','/tmp/test-inline.js'],check=True)
          PY
          git diff --check
      - name: Commit and remove helpers
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/scripts/patch-test-local-ui-v2.py .github/workflows/patch-test-local-ui-v2.yml
          git commit -m 'Polish search and allergen menu placement'
          git push origin main
