name: Refresh test page stylesheet cache
on:
  push:
    paths:
      - '.github/workflows/refresh-test-cache.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change stylesheet cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/test.html')
          text = p.read_text(encoding='utf-8')
          old = 'test.css?v=20260817-2305'
          new = 'test.css?v=simple-20260817-2317'
          if old not in text:
              raise SystemExit('old stylesheet cache key not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit page and remove helper
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add test/test.html
          git rm -f .github/workflows/refresh-test-cache.yml
          git commit -m 'Load rebuilt test stylesheet cleanly'
          git push
