name: Two-step checkout updater

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/two-step-checkout.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply two-step checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('demo/index.html')
          css_path=Path('demo/kol.css')
          html=html_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          new_cart='''<section class="screen" id="cartScreen" hidden><div class="screen-scroll cart-scroll"><div id="checkoutStep1"><div class="checkout-title"><span>1</span><strong>Din bestilling</strong></div><div id="cartLines"></div><div class="empty-note" id="cartEmpty">Handlekurven er tom.</div><div class="cart-summary"><div class="total-row"><span>Sluttsum</span><strong id="cartTotal">0,00 kr</strong></div><div class="cart-savings" id="cartSavings" hidden></div><div class="tax-note-row" id="taxNote">(inkl. mva)</div></div></div><div id="checkoutStep2" hidden><div class="checkout-title"><span>2</span><div><strong>Fullfør bestilling</strong><small>Hentetid og kontaktinformasjon.</small></div></div><section class="final-checkout-section" id="finalPickupSection"><div class="final-section-head"><span>1</span><div><strong>Hentetid</strong><small>Velg når du ønsker å hente.</small></div></div><div class="pickup-options" id="pickupOptions"></div></section><section class="final-checkout-section" id="finalContactSection"><div class="final-section-head"><span>2</span><div><strong>Kontaktinformasjon</strong><small id="checkoutLoginHint"></small></div></div><div class="checkout-grid contact-checkout-grid"><label class="checkout-field" id="checkoutNameField">Hele navn<span class="field-control"><input id="checkoutName" type="text" autocomplete="name" autocapitalize="words" enterkeyhint="next" placeholder="Hele navn"><i class="field-check">✓</i></span></label><label class="checkout-field" id="checkoutPhoneField">Telefonnummer<span class="field-control"><input id="checkoutPhone" type="tel" autocomplete="tel-national" inputmode="tel" enterkeyhint="done" maxlength="8" placeholder="8 sifre"><i class="field-check">✓</i></span></label><small class="keyboard-hint">Trykk Ferdig på tastaturet eller trykk utenfor feltet.</small><div class="checkout-confirm-card" id="checkoutConfirmCard" hidden><span>✓</span><div><strong>Kontaktinfo er klar</strong><small>Kontroller opplysningene og send bestillingen.</small></div></div></div></section></div></div><div class="checkout-footer"><button class="secondary" id="checkoutBack" hidden>Tilbake</button><button class="primary" id="checkoutNext">Neste</button></div></section>'''

          pattern=r'<section class="screen" id="cartScreen"[\s\S]*?</section>\n<section class="screen" id="accountScreen"'
          repl=new_cart+'\n<section class="screen" id="accountScreen"'
          html,count=re.subn(pattern,repl,html,count=1)
          if count!=1:
              raise SystemExit('cart section replacement failed')

          html,count=re.subn(r'<div class="screen-title info-title"><small>KØL GRILL &amp; PIZZA</small><h2>Butikksinformasjon</h2></div>','',html,count=1)
          if count!=1:
              raise SystemExit('info title removal failed')

          html=re.sub(r'kol\.css\?v=[^"\']+','kol.css?v=two-step-20260819',html,count=1)

          new_sync='''function syncCheckoutValidation(){const s=checkoutContactState(),ready=s.nameOk&&s.phoneOk,nf=$('#checkoutNameField'),pf=$('#checkoutPhoneField'),card=$('#checkoutConfirmCard');nf?.classList.toggle('valid',s.nameOk);pf?.classList.toggle('valid',s.phoneOk);if(card)card.hidden=!ready;$('#finalPickupSection')?.classList.toggle('is-complete',!!pickupChoice);$('#finalContactSection')?.classList.toggle('is-complete',ready);const badge=$('#checkoutStep2 .checkout-title>span');if(badge){badge.textContent=ready?'✓':'2';badge.classList.toggle('step-ok',ready)}if(checkoutStep===2){const next=$('#checkoutNext');if(next){next.disabled=!ready;next.classList.toggle('ready',ready);next.style.background=ready?'':'#d4cfcb';next.style.opacity=ready?'1':'.78';next.style.cursor=ready?'pointer':'not-allowed'}}}'''
          html,count=re.subn(r'function syncCheckoutValidation\(\)\{[\s\S]*?\}\nfunction bindCheckoutValidation\(\)\{',new_sync+'\nfunction bindCheckoutValidation(){',html,count=1)
          if count!=1:
              raise SystemExit('syncCheckoutValidation replacement failed')

          new_bind='''function bindCheckoutValidation(){const n=$('#checkoutName'),p=$('#checkoutPhone'),scrollIntoView=input=>setTimeout(()=>input?.scrollIntoView({behavior:'smooth',block:'center'}),180);if(n&&!n.dataset.validationBound){n.dataset.validationBound='1';['input','change','blur'].forEach(ev=>n.addEventListener(ev,syncCheckoutValidation));n.addEventListener('focus',()=>scrollIntoView(n));n.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();p?.focus()}})}if(p&&!p.dataset.validationBound){p.dataset.validationBound='1';['input','change','blur'].forEach(ev=>p.addEventListener(ev,()=>{p.value=p.value.replace(/\D/g,'').slice(0,8);syncCheckoutValidation()}));p.addEventListener('focus',()=>scrollIntoView(p));p.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();p.blur()}})}if(!document.documentElement.dataset.checkoutKeyboardBound){document.documentElement.dataset.checkoutKeyboardBound='1';document.addEventListener('pointerdown',e=>{const active=document.activeElement;if(!active||!['checkoutName','checkoutPhone'].includes(active.id))return;if(e.target===active||e.target.closest('input,textarea'))return;active.blur()},{capture:true})}syncCheckoutValidation();requestAnimationFrame(syncCheckoutValidation);setTimeout(syncCheckoutValidation,120)}'''
          html,count=re.subn(r'function bindCheckoutValidation\(\)\{[\s\S]*?\}\nfunction upsertCheckoutAccount',new_bind+'\nfunction upsertCheckoutAccount',html,count=1)
          if count!=1:
              raise SystemExit('bindCheckoutValidation replacement failed')

          new_render='''function renderCheckoutStep(){[1,2].forEach(n=>$('#checkoutStep'+n).hidden=n!==checkoutStep);$('#checkoutBack').hidden=checkoutStep===1;const step1=$('#checkoutStep1 .checkout-title>span'),step2=$('#checkoutStep2 .checkout-title>span'),contact=checkoutContactState();if(step1){step1.textContent=cart.length?'✓':'1';step1.classList.toggle('step-ok',!!cart.length)}if(step2){step2.textContent=contact.nameOk&&contact.phoneOk?'✓':'2';step2.classList.toggle('step-ok',contact.nameOk&&contact.phoneOk)}const next=$('#checkoutNext');next.textContent=checkoutStep===2?'Send bestilling':'Neste';next.disabled=(checkoutStep===1&&!cart.length)||(checkoutStep===2&&!(contact.nameOk&&contact.phoneOk));next.style.background=next.disabled?'#d4cfcb':'';next.style.opacity=next.disabled?'.78':'1';next.style.cursor=next.disabled?'not-allowed':'pointer';next.classList.toggle('ready',!next.disabled);if(checkoutStep===2){renderPickupTimes();syncCheckoutValidation()}const cartOpen=!$('#cartScreen').hidden,focused=cartOpen&&checkoutStep===2;document.body.classList.toggle('hide-tabs',focused);$('#cartScreen').style.top=focused?'var(--head)':'calc(var(--head) + var(--tabs))'}'''
          html,count=re.subn(r'function renderCheckoutStep\(\)\{[\s\S]*?\}\nfunction placeOrder',new_render+'\nfunction placeOrder',html,count=1)
          if count!=1:
              raise SystemExit('renderCheckoutStep replacement failed')

          old="$('#checkoutBack').onclick=()=>{checkoutStep=Math.max(1,checkoutStep-1);renderCheckoutStep()};$('#checkoutNext').onclick=()=>{if(checkoutStep===1&&!cart.length)return;if(checkoutStep<3){checkoutStep++;renderCheckoutStep()}else placeOrder()};"
          new="$('#checkoutBack').onclick=()=>{document.activeElement?.blur?.();checkoutStep=1;renderCheckoutStep()};$('#checkoutNext').onclick=()=>{if(checkoutStep===1&&!cart.length)return;if(checkoutStep===1){checkoutStep=2;renderCheckoutStep();const c=checkoutContactState();if(!c.nameOk)$('#checkoutName')?.focus();else if(!c.phoneOk)$('#checkoutPhone')?.focus();return}document.activeElement?.blur?.();placeOrder()};"
          if old not in html:
              raise SystemExit('checkout button wiring not found')
          html=html.replace(old,new,1)

          marker='/* Two-step checkout and mobile keyboard UX — 2026-08-19 */'
          if marker not in css:
              css += '''\n\n/* Two-step checkout and mobile keyboard UX — 2026-08-19 */
#checkoutStep1 .checkout-title:after{content:'STEG 1 / 2'}
#checkoutStep2 .checkout-title:after{content:'STEG 2 / 2'}
#checkoutStep2{padding-bottom:12px}
#checkoutStep2>.checkout-title{margin-bottom:10px}
.final-checkout-section{margin:0 10px 10px;border:1px solid #e9e2dd;border-radius:15px;background:#fff;overflow:hidden;box-shadow:0 3px 12px rgba(43,35,31,.025)}
.final-section-head{min-height:58px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #eee7e2;background:#fff}
.final-section-head>span{width:29px;height:29px;flex:0 0 29px;border-radius:9px;display:grid;place-items:center;background:#fff0e9;color:#cf5628;border:1px solid #f2c3af;font-size:11px;font-weight:750}
.final-section-head strong{display:block;font-size:14px;font-weight:700;letter-spacing:-.05px}
.final-section-head small{display:block;margin-top:2px;color:#817872;font-size:10.5px;line-height:1.35}
.final-checkout-section.is-complete .final-section-head>span{background:#edf8f2;color:#19704d;border-color:#b9ddcc}
.final-checkout-section.is-complete .final-section-head>span{font-size:0}
.final-checkout-section.is-complete .final-section-head>span:after{content:'✓';font-size:13px}
#checkoutStep2 .pickup-options{margin:0;padding:11px 12px 12px;border:0;border-radius:0;background:transparent;box-shadow:none}
#checkoutStep2 .checkout-grid{margin:0;padding:11px 12px 13px;border:0;border-radius:0;background:transparent;box-shadow:none}
#checkoutStep2 .checkout-field{font-size:12.5px}
#checkoutStep2 .field-control input{font-size:15px}
.keyboard-hint{display:block;margin:-2px 2px 1px;color:#918780;font-size:10.5px;line-height:1.35;font-weight:400}
@media(max-width:420px){.final-checkout-section{margin-left:8px;margin-right:8px}.final-section-head{padding:9px 10px}.keyboard-hint{font-size:10px}}
'''

          html_path.write_text(html,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('demo/index.html').read_text(encoding='utf-8')
          c=Path('demo/kol.css').read_text(encoding='utf-8')
          assert 'checkoutStep3' not in h
          assert 'Fullfør bestilling' in h
          assert 'enterkeyhint="done"' in h
          assert 'screen-title info-title' not in h
          assert 'STEG 1 / 2' in c and 'STEG 2 / 2' in c
          assert 'Two-step checkout and mobile keyboard UX' in c
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/two-step.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/two-step.js

      - name: Commit to main and clean workflow
        shell: bash
        run: |
          git config user.name "KOL Checkout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          git rm -f .github/workflows/two-step-checkout.yml
          git commit -m "Combine checkout into two steps"
          git push origin HEAD:main
