name: Two-step checkout updater

on:
  push:
    branches: [main]
    paths:
      - .github/triggers/two-step-checkout

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/two_step_checkout.py
      - name: Validate
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          h=Path('demo/index.html').read_text(encoding='utf-8')
          c=Path('demo/kol.css').read_text(encoding='utf-8')
          assert 'checkoutStep3' not in h
          assert 'Fullfør bestilling' in h
          assert 'enterkeyhint="done"' in h
          assert 'screen-title info-title' not in h
          assert 'STEG 1 / 2' in c and 'STEG 2 / 2' in c
          scripts=re.findall(r'<script>(.*?)</script>',h,re.S)
          Path('/tmp/two-step.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/two-step.js
      - name: Commit to main
        shell: bash
        run: |
          git config user.name "KOL Checkout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          git rm -f .github/workflows/two-step-checkout.yml .github/triggers/two-step-checkout .github/scripts/two_step_checkout.py
          git commit -m "Combine checkout into two steps"
          git push origin HEAD:main
