name: Fix customer text-only sizing
on:
  push:
    branches:
      - fix/order-system-hardening-20260817
    paths:
      - .github/workflows/fix-customer-text-only-lock.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply text-only lock
        run: python .github/scripts/fix-customer-text-only-lock.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          css=Path('test/kol-core.css').read_text(encoding='utf-8')
          index=Path('test/index.html').read_text(encoding='utf-8')
          admin=Path('test/admin-panel.html').read_text(encoding='utf-8')
          marker='CUSTOMER TEXT SIZE LOCK V2'
          assert css.count(marker)==1
          tail=css[css.index(marker):]
          forbidden_props = re.findall(r'(?m)^\s*(width|min-width|max-width|height|min-height|max-height|padding|gap|grid-template-columns)\s*:', tail)
          assert not forbidden_props, forbidden_props
          assert '-webkit-text-size-adjust: none !important' in tail
          assert 'font-size: 15px !important' in tail
          assert 'font-size: 12px !important' in tail
          assert 'kol-core.css?v=text-lock-v2' in index
          assert 'kol-core.css?v=text-lock-v2' in admin
          print('text-only lock validated')
          PY
          git diff --check
      - name: Commit and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- test/kol-core.css test/index.html test/admin-panel.html
          git rm -f -- .github/scripts/fix-customer-text-only-lock.py .github/workflows/fix-customer-text-only-lock.yml
          git diff --cached --check
          git commit -m "Keep customer text sizes fixed across 760px"
          git push origin HEAD:fix/order-system-hardening-20260817
