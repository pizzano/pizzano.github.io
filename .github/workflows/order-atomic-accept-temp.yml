name: Atomic order acceptance fix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/order-atomic-accept-temp.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/order_atomic_accept_fix.py
      - name: Validate JavaScript
        run: |
          node --check demo/js/customer.js
          node --check demo/js/admin.js
          node --check demo/js/data.js
      - name: Commit and clean temporary files
        run: |
          git config user.name 'KOL Deploy Bot'
          git config user.email 'actions@users.noreply.github.com'
          rm .github/workflows/order-atomic-accept-temp.yml
          rm .github/scripts/order_atomic_accept_fix.py
          git add -A
          git commit -m 'Fix atomic order acceptance and stable live countdowns'
          git push origin HEAD:main
