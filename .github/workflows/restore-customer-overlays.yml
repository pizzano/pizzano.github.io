name: Restore cart checkout profile UI

on:
  push:
    branches:
      - fix/restore-cart-profile-checkout-20260817

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-cart-profile-checkout-20260817
          fetch-depth: 0

      - name: Restore known-good customer UI
        shell: bash
        run: |
          set -euo pipefail
          marker='KØL known-good customer UI restore 2026-08-17'
          if ! grep -q "$marker" test/kol-core.css; then
            printf '\n/* %s */\n' "$marker" >> test/kol-core.css
            git show origin/fix/customer-ui-restore-20260817:test/kol-core.css | sed '1,4d;$d' >> test/kol-core.css
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('test/index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'kol-core\.css\?v=[^"\']+', 'kol-core.css?v=restore-ui-20260817-0917', s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate restored views
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'KØL known-good customer UI restore 2026-08-17' test/kol-core.css
          grep -q 'grid-template-columns:minmax(0,1fr) 86px!important' test/kol-core.css
          grep -q 'profile-order-card.is-expanded' test/kol-core.css
          grep -q 'checkout-back-button' test/kol-core.css
          grep -q 'restore-ui-20260817-0917' test/index.html
          git diff --check

      - name: Commit restored views
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'KOL UI Restore Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/restore-customer-overlays.yml
          git add -- test/kol-core.css test/index.html
          git commit -m 'Restore cart checkout and profile views'
          git push origin HEAD:fix/restore-cart-profile-checkout-20260817
