name: Restore cart checkout profile UI

on:
  push:
    branches:
      - fix/restore-cart-profile-checkout-20260817

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-cart-profile-checkout-20260817
          fetch-depth: 0

      - name: Restore customer overlay styles
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q "KØL RESTORE CART / CHECKOUT / PROFILE 2026-08-17" test/kol-core.css; then
            printf '%s' '' | base64 -d >> test/kol-core.css
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("test/index.html")
          s = p.read_text(encoding="utf-8")
          s = re.sub(r'kol-core\.css\?v=[^"]+', 'kol-core.css?v=restore-overlays-20260817-0911', s, count=1)
          p.write_text(s, encoding="utf-8")
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          grep -q "KØL RESTORE CART / CHECKOUT / PROFILE 2026-08-17" test/kol-core.css
          grep -q "profile-order-card.is-expanded" test/kol-core.css
          grep -q "grid-template-columns:minmax(0,1fr) 86px" test/kol-core.css
          grep -q "restore-overlays-20260817-0911" test/index.html
          git diff --check

      - name: Commit restored views
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "KOL UI Restore Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -f .github/workflows/restore-customer-overlays.yml
          git add -- test/kol-core.css test/index.html
          git commit -m "Restore cart checkout and profile views"
          git push origin HEAD:fix/restore-cart-profile-checkout-20260817
