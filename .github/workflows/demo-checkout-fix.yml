name: Demo checkout polish
on:
  push:
    branches: [main]
    paths:
      - .github/triggers/demo-checkout-fix
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch checkout state and styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html_path=Path('demo/index.html')
          css_path=Path('demo/kol.css')
          html=html_path.read_text(encoding='utf-8')
          css=css_path.read_text(encoding='utf-8')

          html=re.sub(r'kol\.css\?v=[^"\']+', 'kol.css?v=checkout-polish-20260818-2132', html)

          old="function syncCheckoutValidation(){const s=checkoutContactState(),nf=$('#checkoutNameField'),pf=$('#checkoutPhoneField'),card=$('#checkoutConfirmCard');nf?.classList.toggle('valid',s.nameOk);pf?.classList.toggle('valid',s.phoneOk);if(card)card.hidden=!(s.nameOk&&s.phoneOk);const badge=$('#checkoutStep3 .checkout-title>span');if(badge){badge.textContent=s.nameOk&&s.phoneOk?'✓':'3';badge.classList.toggle('step-ok',s.nameOk&&s.phoneOk)}if(checkoutStep===3){const next=$('#checkoutNext');if(next){next.disabled=!(s.nameOk&&s.phoneOk);next.classList.toggle('ready',s.nameOk&&s.phoneOk)}}}"
          new="function syncCheckoutValidation(){const s=checkoutContactState(),ready=s.nameOk&&s.phoneOk,nf=$('#checkoutNameField'),pf=$('#checkoutPhoneField'),card=$('#checkoutConfirmCard');nf?.classList.toggle('valid',s.nameOk);pf?.classList.toggle('valid',s.phoneOk);if(card)card.hidden=!ready;const badge=$('#checkoutStep3 .checkout-title>span');if(badge){badge.textContent=ready?'✓':'3';badge.classList.toggle('step-ok',ready)}if(checkoutStep===3){const next=$('#checkoutNext');if(next){next.disabled=!ready;next.classList.toggle('ready',ready);next.style.background=ready?'':'#d4cfcb';next.style.opacity=ready?'1':'.78';next.style.cursor=ready?'pointer':'not-allowed'}}}"
          if old not in html: raise SystemExit('syncCheckoutValidation signature not found')
          html=html.replace(old,new,1)

          old2="function bindCheckoutValidation(){const n=$('#checkoutName'),p=$('#checkoutPhone');if(n&&!n.dataset.validationBound){n.dataset.validationBound='1';n.addEventListener('input',syncCheckoutValidation)}if(p&&!p.dataset.validationBound){p.dataset.validationBound='1';p.addEventListener('input',()=>{p.value=p.value.replace(/\\D/g,'').slice(0,8);syncCheckoutValidation()})}syncCheckoutValidation()}"
          new2="function bindCheckoutValidation(){const n=$('#checkoutName'),p=$('#checkoutPhone');if(n&&!n.dataset.validationBound){n.dataset.validationBound='1';['input','change','blur'].forEach(ev=>n.addEventListener(ev,syncCheckoutValidation))}if(p&&!p.dataset.validationBound){p.dataset.validationBound='1';['input','change','blur'].forEach(ev=>p.addEventListener(ev,()=>{p.value=p.value.replace(/\\D/g,'').slice(0,8);syncCheckoutValidation()}))}syncCheckoutValidation();requestAnimationFrame(syncCheckoutValidation);setTimeout(syncCheckoutValidation,120)}"
          if old2 not in html: raise SystemExit('bindCheckoutValidation signature not found')
          html=html.replace(old2,new2,1)

          old3="next.style.background=next.disabled?'#d4cfcb':'';next.style.opacity=next.disabled?'.78':'';next.style.cursor=next.disabled?'not-allowed':'';next.classList.toggle('ready',!next.disabled);"
          new3="next.style.background=next.disabled?'#d4cfcb':'';next.style.opacity=next.disabled?'.78':'1';next.style.cursor=next.disabled?'not-allowed':'pointer';next.classList.toggle('ready',!next.disabled);"
          if old3 not in html: raise SystemExit('checkout next presentation not found')
          html=html.replace(old3,new3,1)

          marker='/* Checkout polish 20260818 */'
          if marker in css:
              css=css.split(marker,1)[0].rstrip()+'\n'
          css += r'''

/* Checkout polish 20260818 */
#cartScreen .cart-scroll{background:#f7f5f2}
#checkoutStep1,#checkoutStep2,#checkoutStep3{padding:10px 10px 14px}
#checkoutStep1 .checkout-title,#checkoutStep2 .checkout-title,#checkoutStep3 .checkout-title{position:relative;min-height:70px;margin:0;border:1px solid #e8e0da;border-radius:16px;background:#fff;box-shadow:0 4px 16px rgba(43,35,31,.035);overflow:hidden;padding:0 64px 0 12px}
#checkoutStep1 .checkout-title:after,#checkoutStep2 .checkout-title:after,#checkoutStep3 .checkout-title:after{position:absolute;right:12px;top:50%;transform:translateY(-50%);padding:5px 8px;border-radius:999px;background:#fff3ed;color:#c95b30;font-size:9.5px;font-weight:750;letter-spacing:.02em}
#checkoutStep1 .checkout-title:after{content:'STEG 1 / 3'}
#checkoutStep2 .checkout-title:after{content:'STEG 2 / 3'}
#checkoutStep3 .checkout-title:after{content:'STEG 3 / 3'}
.checkout-title>span{width:36px;height:36px;border-radius:11px;background:#fff0e9;color:#cf5628;border:1px solid #f2c3af;font-size:12px}
.checkout-title>span.step-ok{background:#edf8f2;color:#19704d;border-color:#b9ddcc}
.checkout-title strong{font-size:16px;font-weight:700;letter-spacing:-.12px}.checkout-title small{font-size:11px;color:#817872}
#checkoutStep1 #cartLines{margin-top:9px;border:1px solid #e9e2dd;border-radius:15px;overflow:hidden;background:#fff}
#checkoutStep1 .cart-line:last-child{border-bottom:0}
.cart-line{min-height:80px;padding:10px 11px}.cart-line-main{grid-template-columns:31px minmax(0,1fr);gap:8px}.cart-qty-badge{width:29px;height:29px;font-size:10.5px}.cart-line-copy strong{font-size:13px}.cart-line-copy small{font-size:10.7px}.cart-line-price{min-width:61px;font-size:12px}.cart-line-actions{gap:4px}.cart-edit-btn,.cart-remove-btn{width:32px;height:32px;border-radius:8px;font-size:12.5px}
#checkoutStep1 .cart-summary{margin-top:9px;padding:13px 13px 12px;border:1px solid #e9e2dd;border-radius:15px;background:#fff}.total-row{font-size:13.5px;color:#655d58}.total-row strong{font-size:18px;font-weight:700;color:#272321;letter-spacing:-.15px}.tax-note-row{font-size:10px;margin-top:4px}
#checkoutStep2 .pickup-options,#checkoutStep3 .checkout-grid{margin-top:9px;padding:12px;border:1px solid #e9e2dd;border-radius:15px;background:#fff}
.checkout-confirm-card{margin-top:2px}
.checkout-footer{border-top:1px solid #ebe4df;background:#fff;box-shadow:0 -8px 24px rgba(48,37,30,.035)}
#checkoutNext.ready:not(:disabled){background:var(--o)!important;opacity:1!important;cursor:pointer!important;color:#fff!important}
#checkoutNext:disabled{background:#d8d3cf!important;opacity:.72!important;cursor:not-allowed!important}
#checkoutNext.ready{box-shadow:0 5px 14px rgba(243,106,45,.18)}
@media(max-width:420px){#checkoutStep1,#checkoutStep2,#checkoutStep3{padding:8px 8px 12px}#checkoutStep1 .checkout-title,#checkoutStep2 .checkout-title,#checkoutStep3 .checkout-title{padding-right:58px}.checkout-title strong{font-size:15.5px}#checkoutStep1 .checkout-title:after,#checkoutStep2 .checkout-title:after,#checkoutStep3 .checkout-title:after{right:9px;font-size:9px}.total-row strong{font-size:17.5px}}
'''
          html_path.write_text(html,encoding='utf-8')
          css_path.write_text(css,encoding='utf-8')
          PY
      - name: Validate JavaScript and diff
        shell: bash
        run: |
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('demo/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          Path('/tmp/demo-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          assert 'checkout-polish-20260818-2132' in s
          assert "next.style.opacity=ready?'1':'.78'" in s
          assert 'Checkout polish 20260818' in Path('demo/kol.css').read_text(encoding='utf-8')
          PY
          node --check /tmp/demo-inline.js
      - name: Commit main
        shell: bash
        run: |
          git config user.name "KOL Checkout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add demo/index.html demo/kol.css
          git commit -m "Fix checkout validation and polish steps"
          git push origin HEAD:main
