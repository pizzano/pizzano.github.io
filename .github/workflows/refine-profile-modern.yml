name: Refine profile modern
on:
  push:
    paths:
      - '.github/workflows/refine-profile-modern.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine profile UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          hp=Path('test/test.html'); cp=Path('test/test.css')
          h=hp.read_text(encoding='utf-8'); c=cp.read_text(encoding='utf-8')

          # Logout only on main profile view.
          h=h.replace("function accountFooter(){return `<div class=\"account-logout-bar\"><button class=\"account-logout\" id=\"logoutBtn\" type=\"button\">Logg ut</button></div>`}\nfunction bindAccountFooter(){const b=$('#logoutBtn');if(b)b.onclick=()=>{setSession(null);renderLogin()}}",
                      "function profileLogout(){return `<div class=\"profile-logout-zone\"><button class=\"profile-logout-link\" id=\"logoutBtn\" type=\"button\">Logg ut</button></div>`}\nfunction bindProfileLogout(){const b=$('#logoutBtn');if(b)b.onclick=()=>{setSession(null);renderLogin()}}",1)

          s=h.index('function renderProfileMenu(){'); e=h.index('function renderProfileForm(){',s)
          h=h[:s]+'''function renderProfileMenu(){
 const a=account();if(!a){renderLogin();return}
 $('#accountTitle').textContent='Profil';
 const recent=orders.filter(o=>o.phone===a.phone).length;
 $('#accountContent').innerHTML=`<div class="profile-home"><section class="profile-identity-card"><div class="member-avatar-large">${escapeHtml((a.name||'K').charAt(0).toUpperCase())}</div><div class="profile-identity-copy"><span class="profile-member-pill">KØL MEDLEM</span><h2>${escapeHtml(a.name||'KØL-medlem')}</h2><p>+47 ${formatPhone(a.phone)}</p></div></section>${pizzaProgress(a)}<div class="profile-section-label">Min konto</div><div class="profile-simple-actions"><button data-account="orders"><span class="profile-action-icon">≡</span><span><strong>Bestillinger</strong><small>${recent?recent+' lagret':'Se tidligere bestillinger'}</small></span><b>›</b></button><button data-account="profile"><span class="profile-action-icon">✎</span><span><strong>Kontaktinfo</strong><small>Navn, telefon og e-post</small></span><b>›</b></button></div>${profileLogout()}</div>`;
 $$('[data-account]').forEach(b=>b.onclick=()=>({profile:renderProfileForm,orders:renderOrders}[b.dataset.account]()));bindProfileLogout()
}
'''+h[e:]

          # Contact info: no logout footer.
          h=h.replace("</div>${accountFooter()}`;\n $('#saveProfile').onclick=", "</div>`;\n $('#saveProfile').onclick=",1)
          h=h.replace(";bindAccountBack();bindAccountFooter()", ";bindAccountBack()",1)

          # Orders: cleaner content, no logout footer.
          s=h.index('function renderOrders(){'); e=h.index('function renderAll(){',s)
          new_orders='''function renderOrders(){
 const a=account(),list=orders.filter(o=>o.phone===a.phone);$('#accountTitle').textContent='Bestillinger';
 const body=list.length?`<div class="orders-list">${list.map(o=>`<div class="order-card"><div class="order-card-top"><strong>Ordre ${o.id}</strong><b>${money(o.total)}</b></div><small>${new Date(o.createdAt).toLocaleString('nb-NO')}</small><div class="order-items-mini">${o.items.map(x=>`${x.qty}x ${x.name} (${x.size})`).join('<br>')}</div></div>`).join('')}</div>`:`<div class="orders-empty"><div class="orders-empty-icon">▤</div><strong>Ingen bestillinger ennå</strong><p>Når du bestiller med dette telefonnummeret, samles bestillingene dine her.</p></div>`;
 $('#accountContent').innerHTML=`${accountBack()}<div class="profile-body"><div class="orders-mini-head"><div><small>HISTORIKK</small><strong>Mine bestillinger</strong></div><span>${list.length}</span></div>${body}</div>`;bindAccountBack()
}
'''
          # preserve helpers between renderOrders and renderAll only if any; current layout has renderOrders immediately before renderAll
          h=h[:s]+new_orders+h[e:]

          # Update CSS cache key.
          h=re.sub(r'test\.css\?v=[^"\']+','test.css?v=profile-modern-20260817-2359',h,count=1)

          # Remove old sticky logout styling if present.
          c=re.sub(r'\.account-logout-bar\{[^}]*\}\.account-logout\{[^}]*\}','',c,count=1)

          c += '''\n.profile-home{padding:16px 14px 22px}.profile-identity-card{display:flex;align-items:center;gap:13px;padding:14px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#fff,#faf9f8);box-shadow:0 4px 16px rgba(0,0,0,.035)}.profile-identity-card .member-avatar-large{width:54px;height:54px;flex:0 0 54px;background:#111;color:#fff}.profile-identity-copy{min-width:0}.profile-member-pill{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;background:#fff0e9;color:var(--o);font-size:9px;font-weight:800;letter-spacing:.08em}.profile-identity-copy h2{margin:6px 0 2px;font-size:20px;line-height:1.15}.profile-identity-copy p{margin:0;color:var(--mut);font-size:13px}.profile-section-label{margin:18px 2px 8px;color:#8a817b;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.profile-simple-actions{margin-top:0}.profile-simple-actions button{min-height:70px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.025)}.profile-action-icon{background:#f5f3f2}.profile-logout-zone{margin:24px 2px 0;padding:18px 0 4px;border-top:1px solid var(--line);text-align:center}.profile-logout-link{border:0;background:none;color:#8a817b;padding:9px 18px;font-size:13px;text-decoration:underline;text-underline-offset:3px}.profile-logout-link:active{color:#c33}.orders-mini-head{display:flex;align-items:end;justify-content:space-between;margin:4px 0 14px}.orders-mini-head>div{display:flex;flex-direction:column;gap:3px}.orders-mini-head small{color:var(--mut);font-size:9px;font-weight:800;letter-spacing:.1em}.orders-mini-head strong{font-size:20px}.orders-mini-head>span{min-width:30px;height:30px;padding:0 9px;border-radius:999px;background:#f2f1f0;display:grid;place-items:center;font-size:12px;font-weight:800}.orders-empty{margin-top:8px;padding:34px 22px;border:1px solid var(--line);border-radius:17px;background:#fbfbfa;text-align:center}.orders-empty-icon{width:46px;height:46px;margin:0 auto 13px;border-radius:13px;background:#f1efed;display:grid;place-items:center;font-size:23px}.orders-empty strong{display:block;font-size:16px}.orders-empty p{max-width:300px;margin:8px auto 0;color:var(--mut);font-size:12px;line-height:1.5}.orders-list{display:grid;gap:10px}\n'''

          hp.write_text(h,encoding='utf-8'); cp.write_text(c,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('test/test.html').read_text(encoding='utf-8')
          m=re.search(r'<script>([\s\S]*?)</script>',h); assert m
          Path('/tmp/test.js').write_text(m.group(1),encoding='utf-8')
          assert h.count('id="logoutBtn"') == 0 or 'profileLogout()' in h
          assert '${accountFooter()}' not in h
          PY
          node --check /tmp/test.js
      - name: Commit and cleanup
        run: |
          git config user.name 'KOL Test UI Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f .github/workflows/refine-profile-modern.yml
          git add test/test.html test/test.css
          git commit -m 'Polish profile and reduce logout prominence'
          git push
