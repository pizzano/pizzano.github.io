<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KØL Admin – Meny</title>
<link rel="stylesheet" href="admin.css?v=20260825-1">
</head>
<body>
<div class="app" id="app">
<aside class="sidebar">
<div class="brand"><div class="brand-mark">K</div><div><strong>KØL Admin</strong><small>Grill & Pizza</small></div></div>
<div class="nav-title">MENY</div>
<button class="nav-btn active">☰ &nbsp; Produkter & kategorier</button>
<button class="nav-btn" id="previewNav">↗ &nbsp; Åpne kundemeny</button>
<div class="nav-note">Endringer lagres automatisk. Dra kategorier og produkter for å endre rekkefølgen.</div>
</aside>
<section class="workspace">
<header class="topbar"><button class="preview" id="previewBtn">Preview & Test Ordering</button><span class="save-state" id="saveState">Laster…</span><button class="save" id="saveBtn" disabled>Lagre nå</button></header>
<main class="content"><div class="page-head"><div><h1>Meny</h1><p>Kategorier, produkter, priser, tilgjengelighet og valg.</p></div><div class="tools"><input class="search" id="menuSearch" placeholder="Søk etter produkt"><button class="ghost" id="collapseBtn">Lukk kategori</button></div></div><div id="menuRoot" class="empty">Laster meny…</div><button class="add-category" id="addCategoryBtn">+ Legg til kategori</button></main>
</section>
<aside class="editor" id="editor"><div class="editor-head"><div><small id="editorEyebrow">PRODUKTINNSTILLINGER</small><h3 id="editorTitle">Produkt</h3></div><button id="closeEditor">×</button></div><div class="editor-body" id="editorBody"></div></aside>
</div>
<div class="toast" id="toast"></div>
<script src="admin.js?v=20260825-1"></script>
</body>
</html>
