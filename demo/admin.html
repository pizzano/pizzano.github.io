<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KØL Admin – Meny</title>
<style>
:root{--orange:#f36a2d;--orange-soft:#fff2ec;--green:#39a96b;--green-soft:#edf9f3;--bg:#f5f3f0;--card:#fff;--line:#e5e0dc;--text:#2e2a27;--muted:#7d746e;--danger:#d94a4a;--danger-soft:#fff2f2;--shadow:0 2px 10px rgba(49,39,33,.07);--radius:12px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{cursor:default}.app{min-height:100vh;display:grid;grid-template-columns:220px minmax(620px,1fr) 0;transition:grid-template-columns .18s ease}.app.editor-open{grid-template-columns:220px minmax(540px,1fr) 430px}
.sidebar{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);padding:24px 18px}.brand{display:flex;align-items:center;gap:10px;margin-bottom:30px}.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:900}.brand strong{display:block;font-size:16px}.brand small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.nav-title{margin:20px 8px 8px;color:#a39b95;font-size:10px;font-weight:800;letter-spacing:.12em}.nav-btn{width:100%;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border:0;border-radius:9px;background:transparent;color:#514b47;text-align:left}.nav-btn.active{background:var(--orange-soft);color:#c84f22;font-weight:700}.nav-btn .ico{width:22px;text-align:center}.nav-note{margin:18px 8px 0;padding-top:16px;border-top:1px solid #eee;color:#9a918b;font-size:11px;line-height:1.45}
.workspace{min-width:0}.topbar{height:68px;position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px}.preview,.save,.ghost{height:40px;border-radius:9px;padding:0 15px;font-weight:700}.preview{border:0;background:var(--green);color:#fff}.save{border:0;background:var(--orange);color:#fff;margin-left:auto}.save:disabled{opacity:.45}.ghost{border:1px solid var(--line);background:#fff;color:#5e5752}.save-state{font-size:11px;color:var(--muted)}.content{padding:24px 28px 70px;max-width:1100px;margin:auto}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}.page-head h1{margin:0;font-size:25px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.tools{display:flex;gap:8px;align-items:center}.search{height:38px;width:220px;border:1px solid var(--line);border-radius:9px;padding:0 11px;background:#fff}.category{margin-bottom:12px}.category-head{min-height:82px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px}.cat-image{width:54px;height:54px;border-radius:9px;background:#f0eeec center/cover no-repeat;border:1px solid #ece7e3;display:grid;place-items:center;color:#aaa}.cat-copy strong{display:block;font-size:14px}.cat-copy small{display:block;margin-top:4px;color:var(--muted);font-size:11px}.cat-meta{display:flex;align-items:center;gap:8px}.count{padding:4px 8px;border-radius:999px;background:#f4f1ef;color:#7d746e;font-size:10px}.icon-btn{width:34px;height:34px;border:0;background:transparent;border-radius:8px;color:#817871;font-size:17px}.icon-btn:hover{background:#f5f2f0}.category-body{margin:7px 0 0 24px}.category-body[hidden]{display:none}.item{min-height:74px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 6px rgba(40,32,27,.05);display:grid;grid-template-columns:18px 52px minmax(0,1fr) 95px 78px;gap:10px;align-items:center;padding:8px 10px;margin-bottom:6px}.drag{color:#b3aaa4}.item-img{width:50px;height:50px;border-radius:8px;background:#f0eeec center/cover no-repeat}.item-copy{min-width:0}.item-copy strong{display:block;font-size:12.5px}.item-copy small{display:block;color:#8d847e;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10.5px}.badges{margin-bottom:3px}.badge{display:inline-block;padding:2px 6px;border-radius:999px;font-size:8.5px;font-weight:800}.badge.red{background:#ffe9e9;color:#c73d3d}.badge.gray{background:#eee;color:#6f6a67}.badge.green{background:#e9f7ef;color:#277b50}.item-price{text-align:right;font-size:11px;font-weight:700}.item-actions{display:flex;justify-content:flex-end}.add-item,.add-category{height:36px;border:1px solid #d3ccc7;background:#fff;border-radius:8px;padding:0 12px;color:#5f5853;font-size:11px}.empty{padding:40px;text-align:center;color:#8c837d}.loading{padding:80px;text-align:center;color:#8c837d}
.editor{position:sticky;top:0;height:100vh;background:#f8f7f5;border-left:1px solid var(--line);overflow:auto;display:none;z-index:30}.editor-open .editor{display:block}.editor-head{min-height:68px;position:sticky;top:0;background:#fff;z-index:4;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px}.editor-head-text{min-width:0}.editor-head small{display:block;color:var(--muted);font-size:10px}.editor-head h3{margin:2px 0 0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.editor-head button{margin-left:auto;border:0;background:transparent;font-size:24px;color:#777}.editor-body{padding:12px}.editor-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.editor-card-head{min-height:46px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee}.editor-card-head h4{margin:0;font-size:12.5px}.editor-card-head small{color:var(--muted);font-size:9.5px}.editor-card-body{padding:12px}.product-summary-card{display:grid;grid-template-columns:64px minmax(0,1fr);gap:11px;align-items:center}.preview-img{width:64px;height:64px;border-radius:10px;background:#f0eeec center/cover no-repeat;border:1px solid #eee}.summary-copy strong{display:block;font-size:14px}.summary-copy small{display:block;margin-top:4px;color:var(--muted);font-size:10.5px}.summary-badges{margin-top:6px}.field{display:block;margin-bottom:10px}.field:last-child{margin-bottom:0}.field>span{display:block;font-size:10px;color:#6f6762;margin-bottom:5px;font-weight:650}.field input,.field textarea,.field select{width:100%;border:1px solid #d8d1cc;border-radius:8px;padding:9px 10px;background:#fff;outline:0;font-size:12px}.field input:focus,.field textarea:focus,.field select:focus{border-color:#ef9a76;box-shadow:0 0 0 3px #fff1eb}.field textarea{min-height:72px;resize:vertical}.toggle-row{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #f0ece9}.toggle-row:last-child{border-bottom:0}.toggle-copy strong{display:block;font-size:11.5px}.toggle-copy small{display:block;margin-top:2px;color:var(--muted);font-size:9.5px}.switch{position:relative;width:38px;height:22px;flex:0 0 38px}.switch input{opacity:0;position:absolute}.switch span{position:absolute;inset:0;background:#d7d3d0;border-radius:999px;transition:.15s}.switch span:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0002;transition:.15s}.switch input:checked+span{background:var(--green)}.switch input:checked+span:after{transform:translateX(16px)}
.size-head{display:grid;grid-template-columns:28px minmax(0,1fr) 82px 28px;gap:6px;margin-bottom:5px;color:#978f89;font-size:9px}.size-row{display:grid;grid-template-columns:28px minmax(0,1fr) 82px 28px;gap:6px;margin-bottom:6px;align-items:center}.size-row input[type=text],.size-row input[type=number]{min-width:0;width:100%;height:36px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;font-size:11px}.size-default{display:grid;place-items:center}.size-default input{width:16px;height:16px;accent-color:var(--orange)}.remove-mini{width:28px;height:28px;border:0;border-radius:7px;background:#f5f2f0;color:#9b716c}.add-line{height:34px;border:1px dashed #ccc4be;border-radius:8px;background:#fff;color:#68615c;padding:0 10px;font-size:10.5px}.hint{margin:7px 0 0;color:#9a918b;font-size:9.5px;line-height:1.4}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip-check{display:flex;align-items:center;gap:7px;min-height:34px;padding:0 8px;border:1px solid #e8e2de;border-radius:8px;font-size:10px}.chip-check input{accent-color:var(--green)}
.group-card{border:1px solid #e5dfda;border-radius:10px;margin-bottom:8px;overflow:hidden}.group-head{min-height:42px;padding:0 10px;display:flex;align-items:center;gap:8px;background:#fbfaf9;border-bottom:1px solid #eee}.group-head input{min-width:0;flex:1;height:32px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;font-size:11px}.group-type{width:92px;height:32px;border:1px solid #ddd6d1;border-radius:7px;background:#fff;font-size:10px}.group-body{padding:9px}.choice-head{display:grid;grid-template-columns:minmax(0,1fr) 78px 28px;gap:6px;color:#978f89;font-size:9px;margin-bottom:5px}.choice-row{display:grid;grid-template-columns:minmax(0,1fr) 78px 28px;gap:6px;margin-bottom:6px}.choice-row input{min-width:0;height:34px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;font-size:10.5px}.group-rules{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.group-rules label span{display:block;font-size:9px;color:#8f8781;margin-bottom:4px}.group-rules input{width:100%;height:32px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;font-size:10.5px}.group-actions{display:flex;gap:6px;margin-top:8px}.group-actions button{height:32px;border-radius:7px;font-size:10px}.danger-btn{border:1px solid #f0c6c6;background:var(--danger-soft);color:#ba4040;padding:0 10px}.secondary-mini{border:1px solid #d6cfca;background:#fff;color:#5f5853;padding:0 10px}.danger-zone{display:flex;gap:7px}.danger-zone button{flex:1;height:36px;border-radius:8px;font-size:10.5px}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#302c29;color:#fff;padding:10px 13px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none;font-size:11px}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.app,.app.editor-open{grid-template-columns:190px minmax(500px,1fr)}.editor{position:fixed;right:0;width:420px;box-shadow:-12px 0 30px #0002}.sidebar{padding:20px 12px}.content{padding:20px 18px}.search{width:180px}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand"><div class="brand-mark">K</div><div><strong>KØL Admin</strong><small>Grill & Pizza</small></div></div>
    <div class="nav-title">MENY</div>
    <button class="nav-btn active"><span class="ico">☰</span>Produkter & kategorier</button>
    <button class="nav-btn" id="previewNav"><span class="ico">↗</span>Åpne kundemeny</button>
    <div class="nav-note">Denne admin-siden redigerer samme menydata som <b>index.html</b> bruker.</div>
  </aside>
  <section class="workspace">
    <header class="topbar"><button class="preview" id="previewBtn">Preview & Test Ordering</button><span class="save-state" id="saveState">Laster…</span><button class="save" id="saveBtn" disabled>Lagre endringer</button></header>
    <main class="content"><div class="page-head"><div><h1>Meny</h1><p>Administrer kategorier, produkter, priser, tilgjengelighet og valg.</p></div><div class="tools"><input class="search" id="menuSearch" placeholder="Søk etter produkt"><button class="ghost" id="collapseBtn">Lukk alle</button></div></div><div id="menuRoot" class="loading">Laster meny fra Firebase…</div><button class="add-category" id="addCategoryBtn" hidden>+ Legg til kategori</button></main>
  </section>
  <aside class="editor" id="editor"><div class="editor-head"><div class="editor-head-text"><small id="editorEyebrow">REDIGER</small><h3 id="editorTitle">Produktinnstillinger</h3></div><button id="closeEditor" aria-label="Lukk">×</button></div><div class="editor-body" id="editorBody"></div></aside>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const DB='https://bestill-19-default-rtdb.europe-west1.firebasedatabase.app';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
const ALLERGENS=[['melk','Melk'],['gluten','Gluten'],['egg','Egg'],['soya','Soya'],['selleri','Selleri'],['sennep','Sennep'],['sesam','Sesam'],['fisk','Fisk'],['skalldyr','Skalldyr'],['peanøtter','Peanøtter'],['nøtter','Nøtter'],['sulfitter','Sulfitter']];
let config={sections:[],optionGroups:[]},dirty=false,openCats=new Set(),editing=null,query='';
const root=$('#menuRoot'),saveBtn=$('#saveBtn'),saveState=$('#saveState'),app=$('#app');
function uid(prefix='id'){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function markDirty(){dirty=true;saveBtn.disabled=false;saveState.textContent='Ikke lagret'}
function productImage(p){return p?.imageUrl||p?.image||''}function sectionImage(s){return s?.imageUrl||s?.image||arr(s?.items).map(productImage).find(Boolean)||''}
function prices(p){const s=arr(p?.sizes);return s.length?s.map(x=>Number(x?.price)).filter(Number.isFinite):[Number(p?.price??p?.mediumPrice)].filter(Number.isFinite)}
function priceText(p){const v=prices(p);if(!v.length)return '';const mn=Math.min(...v),mx=Math.max(...v);return mn===mx?`${mn} kr`:`fra ${mn} kr`}
function activeSoldOut(p){if(!p?.soldOut)return false;if(!p.soldOutUntil||p.soldOutUntil==='undetermined')return true;const t=new Date(p.soldOutUntil).getTime();if(Number.isFinite(t)&&t>Date.now())return true;p.soldOut=false;p.soldOutUntil='';markDirty();return false}
function ensure(){config.sections=arr(config.sections);config.optionGroups=arr(config.optionGroups);config.sections.forEach(s=>{s.id=String(s.id||uid('section'));s.items=arr(s.items);s.items.forEach(p=>{p.id=String(p.id||uid('product'));p.sizes=arr(p.sizes);if(!p.sizes.length){const price=Number(p.price??p.mediumPrice);p.sizes=[{label:'Standard',price:Number.isFinite(price)?price:0}]};p.sizes=p.sizes.map((x,i)=>({id:String(x?.id||uid('size')),label:String(x?.label||x?.name||`Størrelse ${i+1}`),price:Number(x?.price)||0}));if(!Number.isInteger(p.defaultSizeIndex)||p.defaultSizeIndex<0||p.defaultSizeIndex>=p.sizes.length)p.defaultSizeIndex=0;p.optionGroupIds=arr(p.optionGroupIds).map(String);p.allergens=arr(p.allergens)});openCats.add(s.id)});config.optionGroups=config.optionGroups.map(g=>({id:String(g?.id||uid('group')),title:String(g?.title||''),type:String(g?.type||''),min:Number.isFinite(Number(g?.min))?Number(g.min):0,max:Number.isFinite(Number(g?.max))?Number(g.max):1,options:arr(g?.options).map(o=>({id:String(o?.id||uid('choice')),label:String(o?.label||''),price:Number(o?.price)||0}))}))}
async function load(){try{const r=await fetch(DB+'/.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);config=await r.json()||{};ensure();root.className='';$('#addCategoryBtn').hidden=false;saveState.textContent='Synkronisert';render()}catch(e){root.className='empty';root.textContent='Kunne ikke laste meny: '+e.message;saveState.textContent='Feil'}}
function filteredItems(s){if(!query)return arr(s.items);const q=query.toLocaleLowerCase('nb-NO');return arr(s.items).filter(p=>`${p.name||''} ${p.ingredients||p.description||''}`.toLocaleLowerCase('nb-NO').includes(q))}
function render(){root.innerHTML=config.sections.map((s,si)=>categoryHtml(s,si)).join('')||'<div class="empty">Ingen kategorier.</div>';bindMenu()}
function categoryHtml(s,si){const open=openCats.has(s.id),img=sectionImage(s),items=filteredItems(s);if(query&&!items.length)return '';return `<section class="category" data-si="${si}"><div class="category-head"><div class="cat-image" ${img?`style="background-image:url('${esc(img)}')"`:''}>${img?'':'▧'}</div><div class="cat-copy"><strong>${esc(s.title||s.name||'Ny kategori')}</strong><small>${esc(s.note||s.description||'')}</small></div><div class="cat-meta"><span class="count">${arr(s.items).length} produkter</span><button class="icon-btn cat-edit" title="Rediger kategori">✎</button><button class="icon-btn cat-toggle">${open?'⌃':'⌄'}</button></div></div><div class="category-body" ${open?'':'hidden'}>${items.map(p=>itemHtml(p,si,arr(s.items).indexOf(p))).join('')}<button class="add-item" data-si="${si}">+ Legg til produkt</button></div></section>`}
function itemHtml(p,si,pi){const img=productImage(p),sold=activeSoldOut(p),def=p.sizes?.[p.defaultSizeIndex||0];return `<article class="item" data-si="${si}" data-pi="${pi}"><div class="drag">≡</div><div class="item-img" ${img?`style="background-image:url('${esc(img)}')"`:''}></div><div class="item-copy"><div class="badges">${sold?'<span class="badge red">Utsolgt</span> ':''}${p.hidden?'<span class="badge gray">Skjult</span> ':''}${def?`<span class="badge green">Standard: ${esc(def.label)}</span>`:''}</div><strong>${esc(p.name||'Nytt produkt')}</strong><small>${esc(p.ingredients||p.description||'')}</small></div><div class="item-price">${esc(priceText(p))}</div><div class="item-actions"><button class="icon-btn item-edit" title="Produktinnstillinger">✎</button><button class="icon-btn item-dup" title="Dupliser">⧉</button></div></article>`}
function bindMenu(){$$('.cat-toggle').forEach(b=>b.onclick=e=>{const si=+e.target.closest('.category').dataset.si,s=config.sections[si];openCats.has(s.id)?openCats.delete(s.id):openCats.add(s.id);render()});$$('.cat-edit').forEach(b=>b.onclick=e=>editCategory(+e.target.closest('.category').dataset.si));$$('.item-edit').forEach(b=>b.onclick=e=>{const a=e.target.closest('.item');editProduct(+a.dataset.si,+a.dataset.pi)});$$('.item-dup').forEach(b=>b.onclick=e=>{const a=e.target.closest('.item'),si=+a.dataset.si,pi=+a.dataset.pi,p=config.sections[si].items[pi],copy=structuredClone(p);copy.id=uid('product');copy.name=(copy.name||'Produkt')+' – kopi';config.sections[si].items.splice(pi+1,0,copy);markDirty();render();toast('Produkt duplisert')});$$('.add-item').forEach(b=>b.onclick=e=>addProduct(+e.target.dataset.si))}
function openEditor(title,eyebrow='REDIGER'){app.classList.add('editor-open');$('#editorTitle').textContent=title;$('#editorEyebrow').textContent=eyebrow}function closeEditor(){editing=null;app.classList.remove('editor-open');$('#editorBody').innerHTML=''}
function card(title,body,sub=''){return `<section class="editor-card"><div class="editor-card-head"><h4>${esc(title)}</h4>${sub?`<small>${esc(sub)}</small>`:''}</div><div class="editor-card-body">${body}</div></section>`}
function editCategory(si){const s=config.sections[si];editing={type:'category',si};openEditor('Kategoriinnstillinger');$('#editorBody').innerHTML=card('Kategori',`<label class="field"><span>Navn</span><input id="catTitle" placeholder="F.eks. Pizza" value="${esc(s.title||'')}"></label><label class="field"><span>Beskrivelse</span><textarea id="catNote" placeholder="Kort tekst under kategorinavnet">${esc(s.note||s.description||'')}</textarea></label><label class="field"><span>Bilde-URL</span><input id="catImage" placeholder="https://…" value="${esc(s.imageUrl||'')}"></label>`)+card('Kategori handlinger',`<div class="danger-zone"><button class="secondary-mini" id="moveCatUp">Flytt opp</button><button class="secondary-mini" id="moveCatDown">Flytt ned</button><button class="danger-btn" id="deleteCat">Slett</button></div>`);['catTitle','catNote','catImage'].forEach(id=>$('#'+id).oninput=()=>{if(id==='catTitle')s.title=$('#'+id).value;if(id==='catNote')s.note=$('#'+id).value;if(id==='catImage')s.imageUrl=$('#'+id).value;markDirty();render()});$('#moveCatUp').onclick=()=>moveCategory(si,-1);$('#moveCatDown').onclick=()=>moveCategory(si,1);$('#deleteCat').onclick=()=>{if(!confirm(`Slette kategorien "${s.title||''}" og alle produktene?`))return;config.sections.splice(si,1);markDirty();closeEditor();render()}}
function moveCategory(si,dir){const ni=si+dir;if(ni<0||ni>=config.sections.length)return;[config.sections[si],config.sections[ni]]=[config.sections[ni],config.sections[si]];markDirty();closeEditor();render();toast('Kategori flyttet')}
function addProduct(si){const p={id:uid('product'),name:'',description:'',imageUrl:'',sizes:[{id:uid('size'),label:'',price:0}],defaultSizeIndex:0,allergens:[],optionGroupIds:[],hidden:false,soldOut:false,soldOutUntil:''};config.sections[si].items.push(p);markDirty();render();editProduct(si,config.sections[si].items.length-1)}
function editProduct(si,pi){const p=config.sections[si].items[pi];editing={type:'product',si,pi};openEditor(p.name||'Nytt produkt','PRODUKTINNSTILLINGER');renderProductEditor()}
function renderProductEditor(){if(!editing||editing.type!=='product')return;const {si,pi}=editing,p=config.sections[si].items[pi],img=productImage(p),sold=activeSoldOut(p),linked=new Set(arr(p.optionGroupIds).map(String));const summary=`<div class="product-summary-card"><div class="preview-img" ${img?`style="background-image:url('${esc(img)}')"`:''}></div><div class="summary-copy"><strong>${esc(p.name||'Nytt produkt')}</strong><small>${esc(config.sections[si].title||'')}</small><div class="summary-badges">${p.hidden?'<span class="badge gray">Skjult</span> ':''}${sold?'<span class="badge red">Utsolgt</span>':'<span class="badge green">Tilgjengelig</span>'}</div></div></div>`;const basics=`<label class="field"><span>Produktnavn</span><input id="pName" placeholder="F.eks. 3 - Al Capone" value="${esc(p.name||'')}"></label><label class="field"><span>Beskrivelse / ingredienser</span><textarea id="pDesc" placeholder="F.eks. Pepperoni, biff, paprika og løk">${esc(p.ingredients||p.description||'')}</textarea></label><label class="field"><span>Bilde-URL</span><input id="pImage" placeholder="https://…" value="${esc(p.imageUrl||p.image||'')}"></label>`;const availability=`<div class="toggle-row"><div class="toggle-copy"><strong>Vis produktet</strong><small>Skjul uten å slette</small></div><label class="switch"><input id="pVisible" type="checkbox" ${p.hidden?'':'checked'}><span></span></label></div><div class="toggle-row"><div class="toggle-copy"><strong>Utsolgt</strong><small>Produktet kan ikke bestilles</small></div><label class="switch"><input id="pSold" type="checkbox" ${sold?'checked':''}><span></span></label></div><label class="field" id="soldUntilWrap" ${sold?'':'hidden'}><span>Utsolgt til</span><select id="pSoldUntil"><option value="undetermined">Inntil jeg åpner igjen</option><option value="tomorrow">Til i morgen</option><option value="custom">Velg dato og tid</option></select></label><label class="field" id="customUntilWrap" hidden><span>Dato og tid</span><input id="pCustomUntil" type="datetime-local"></label>`;const sizes=`<div class="size-head"><span>Standard</span><span>Størrelse</span><span>Pris</span><span></span></div><div id="sizeRows">${p.sizes.map((s,i)=>sizeRowHtml(s,i,p.defaultSizeIndex||0)).join('')}</div><button class="add-line" id="addSize">+ Legg til størrelse</button><p class="hint">Standard-størrelsen blir forhåndsvalgt for kunden.</p>`;const allergens=`<div class="chips">${ALLERGENS.map(([id,label])=>`<label class="chip-check"><input type="checkbox" data-allergen="${esc(id)}" ${p.allergens.includes(id)?'checked':''}>${esc(label)}</label>`).join('')}</div>`;const groups=`<div id="productGroups">${config.optionGroups.filter(g=>linked.has(g.id)).map(g=>groupHtml(g)).join('')||'<p class="hint">Ingen valggrupper koblet til produktet.</p>'}</div><button class="add-line" id="addGroup">+ Add Group</button>${config.optionGroups.filter(g=>!linked.has(g.id)).length?`<div style="height:7px"></div><label class="field"><span>Koble til eksisterende gruppe</span><select id="attachGroup"><option value="">Velg gruppe…</option>${config.optionGroups.filter(g=>!linked.has(g.id)).map(g=>`<option value="${esc(g.id)}">${esc(g.title||'Uten navn')}</option>`).join('')}</select></label>`:''}`;const actions=`<div class="danger-zone"><button class="secondary-mini" id="duplicateProduct">Dupliser</button><button class="danger-btn" id="deleteProduct">Slett produkt</button></div>`;$('#editorBody').innerHTML=card('',summary)+card('Grunninformasjon',basics)+card('Tilgjengelighet',availability)+card('Størrelser og priser',sizes,'Velg standard')+card('Allergener',allergens)+card('Choices & addons',groups,'Tillegg og valg')+card('Handlinger',actions);bindProductEditor()}
function sizeRowHtml(s,i,def){return `<div class="size-row" data-size="${i}"><label class="size-default"><input type="radio" name="defaultSize" value="${i}" ${i===def?'checked':''}></label><input class="size-label" type="text" placeholder="F.eks. Stor" value="${esc(s.label||'')}"><input class="size-price" type="number" min="0" step="1" placeholder="0" value="${Number(s.price)||''}"><button class="remove-mini remove-size">×</button></div>`}
function bindProductEditor(){const {si,pi}=editing,p=config.sections[si].items[pi];$('#pName').oninput=e=>{p.name=e.target.value;$('#editorTitle').textContent=p.name||'Nytt produkt';markDirty();render()};$('#pDesc').oninput=e=>{p.description=e.target.value;delete p.ingredients;markDirty();render()};$('#pImage').oninput=e=>{p.imageUrl=e.target.value;delete p.image;markDirty();render()};$('#pVisible').onchange=e=>{p.hidden=!e.target.checked;markDirty();render();renderProductEditor()};$('#pSold').onchange=e=>{p.soldOut=e.target.checked;p.soldOutUntil=e.target.checked?(p.soldOutUntil||'undetermined'):'';markDirty();render();renderProductEditor()};$('#pSoldUntil')?.addEventListener('change',e=>{if(e.target.value==='tomorrow'){const d=new Date();d.setDate(d.getDate()+1);d.setHours(6,0,0,0);p.soldOutUntil=d.toISOString()}else if(e.target.value==='custom'){$('#customUntilWrap').hidden=false;return}else p.soldOutUntil='undetermined';$('#customUntilWrap').hidden=true;markDirty();render()});$('#pCustomUntil')?.addEventListener('change',e=>{if(e.target.value){p.soldOutUntil=new Date(e.target.value).toISOString();markDirty();render()}});bindSizeRows();$$('[data-allergen]').forEach(c=>c.onchange=e=>{const set=new Set(p.allergens),id=e.target.dataset.allergen;e.target.checked?set.add(id):set.delete(id);p.allergens=[...set];markDirty()});$('#addSize').onclick=()=>{p.sizes.push({id:uid('size'),label:'',price:0});markDirty();renderProductEditor()};$('#addGroup').onclick=()=>{const g={id:uid('group'),title:'',type:'addon',min:0,max:1,options:[]};config.optionGroups.push(g);p.optionGroupIds.push(g.id);markDirty();renderProductEditor();setTimeout(()=>$('#productGroups .group-card:last-of-type .group-title')?.focus(),0)};if($('#attachGroup'))$('#attachGroup').onchange=e=>{if(!e.target.value)return;p.optionGroupIds.push(e.target.value);markDirty();renderProductEditor()};bindGroups();$('#duplicateProduct').onclick=()=>{const copy=structuredClone(p);copy.id=uid('product');copy.name=(copy.name||'Produkt')+' – kopi';config.sections[si].items.splice(pi+1,0,copy);markDirty();render();toast('Produkt duplisert')};$('#deleteProduct').onclick=()=>{if(!confirm(`Slette "${p.name||'produktet'}"?`))return;config.sections[si].items.splice(pi,1);markDirty();closeEditor();render()}}
function bindSizeRows(){const {si,pi}=editing,p=config.sections[si].items[pi];$$('.size-row').forEach(row=>{const i=+row.dataset.size;row.querySelector('.size-label').oninput=e=>{p.sizes[i].label=e.target.value;markDirty();render()};row.querySelector('.size-price').oninput=e=>{p.sizes[i].price=Number(e.target.value)||0;markDirty();render()};row.querySelector('input[type=radio]').onchange=()=>{p.defaultSizeIndex=i;markDirty();render()};row.querySelector('.remove-size').onclick=()=>{if(p.sizes.length<=1){toast('Produktet må ha minst én størrelse');return}p.sizes.splice(i,1);if(p.defaultSizeIndex===i)p.defaultSizeIndex=0;else if(p.defaultSizeIndex>i)p.defaultSizeIndex--;markDirty();renderProductEditor();render()}})}
function groupHtml(g){return `<div class="group-card" data-gid="${esc(g.id)}"><div class="group-head"><input class="group-title" placeholder="F.eks. Velg saus" value="${esc(g.title||'')}"><select class="group-type"><option value="addon" ${g.type==='addon'?'selected':''}>Tillegg</option><option value="choice" ${g.type==='choice'?'selected':''}>Valg</option><option value="spice" ${g.type==='spice'?'selected':''}>Styrke</option></select><button class="remove-mini unlink-group">×</button></div><div class="group-body"><div class="choice-head"><span>Valg</span><span>+ pris</span><span></span></div><div>${arr(g.options).map((o,i)=>choiceRowHtml(o,i)).join('')}</div><button class="add-line add-choice">+ Legg til valg</button><div class="group-rules"><label><span>Minimum valg</span><input class="group-min" type="number" min="0" placeholder="0" value="${Number.isFinite(Number(g.min))?Number(g.min):0}"></label><label><span>Maksimum valg</span><input class="group-max" type="number" min="1" placeholder="1" value="${Number.isFinite(Number(g.max))?Number(g.max):1}"></label></div><div class="group-actions"><button class="danger-btn delete-group">Slett gruppe helt</button></div></div></div>`}
function choiceRowHtml(o,i){return `<div class="choice-row" data-oi="${i}"><input class="choice-label" placeholder="F.eks. Hvitløksaus" value="${esc(o.label||'')}"><input class="choice-price" type="number" min="0" step="1" placeholder="0" value="${Number(o.price)||''}"><button class="remove-mini remove-choice">×</button></div>`}
function bindGroups(){const {si,pi}=editing,p=config.sections[si].items[pi];$$('.group-card').forEach(card=>{const gid=card.dataset.gid,g=config.optionGroups.find(x=>x.id===gid);if(!g)return;card.querySelector('.group-title').oninput=e=>{g.title=e.target.value;markDirty()};card.querySelector('.group-type').onchange=e=>{g.type=e.target.value;markDirty()};card.querySelector('.group-min').oninput=e=>{g.min=Math.max(0,Number(e.target.value)||0);markDirty()};card.querySelector('.group-max').oninput=e=>{g.max=Math.max(1,Number(e.target.value)||1);markDirty()};card.querySelector('.add-choice').onclick=()=>{g.options.push({id:uid('choice'),label:'',price:0});markDirty();renderProductEditor()};card.querySelector('.unlink-group').onclick=()=>{p.optionGroupIds=p.optionGroupIds.filter(id=>id!==gid);markDirty();renderProductEditor()};card.querySelector('.delete-group').onclick=()=>{if(!confirm(`Slette valggruppen "${g.title||'uten navn'}" fra hele menyen?`))return;config.optionGroups=config.optionGroups.filter(x=>x.id!==gid);config.sections.forEach(s=>arr(s.items).forEach(prod=>prod.optionGroupIds=arr(prod.optionGroupIds).filter(id=>id!==gid)));markDirty();renderProductEditor()};card.querySelectorAll('.choice-row').forEach(row=>{const oi=+row.dataset.oi;row.querySelector('.choice-label').oninput=e=>{g.options[oi].label=e.target.value;markDirty()};row.querySelector('.choice-price').oninput=e=>{g.options[oi].price=Number(e.target.value)||0;markDirty()};row.querySelector('.remove-choice').onclick=()=>{g.options.splice(oi,1);markDirty();renderProductEditor()}})})}
$('#addCategoryBtn').onclick=()=>{const s={id:uid('section'),title:'',note:'',items:[]};config.sections.push(s);openCats.add(s.id);markDirty();render();editCategory(config.sections.length-1)};$('#closeEditor').onclick=closeEditor;$('#previewBtn').onclick=()=>window.open('index.html','_blank');$('#previewNav').onclick=()=>window.open('index.html','_blank');$('#collapseBtn').onclick=()=>{if(openCats.size){openCats.clear();$('#collapseBtn').textContent='Åpne alle'}else{config.sections.forEach(s=>openCats.add(s.id));$('#collapseBtn').textContent='Lukk alle'}render()};$('#menuSearch').oninput=e=>{query=e.target.value.trim();if(query)config.sections.forEach(s=>openCats.add(s.id));render()};saveBtn.onclick=async()=>{saveBtn.disabled=true;saveState.textContent='Lagrer…';try{const r=await fetch(DB+'/.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(!r.ok)throw Error('HTTP '+r.status);dirty=false;saveState.textContent='Lagret';toast('Endringene er lagret')}catch(e){saveBtn.disabled=false;saveState.textContent='Kunne ikke lagre';toast('Lagring feilet: '+e.message)}};window.addEventListener('beforeunload',e=>{if(!dirty)return;e.preventDefault();e.returnValue=''});load();
})();
</script>
</body>
</html>
