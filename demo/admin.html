kground:#e9f7ef;color:#277b50}.badge.orange{background:#fff0e8;color:#c55629}.badge.gray{background:#eee;color:#6f6a67}.badge.red{background:#ffe9e9;color:#c73d3d}.item-price{text-align:right;font-size:11px;font-weight:700}.item-actions{display:flex;justify-content:flex-end;align-items:center;gap:3px}.mini-action{height:30px;border:1px solid #edc7b7;border-radius:8px;background:#fff7f3;color:#c65327;font-size:9.5px;padding:0 8px}.add-item,.add-category{height:36px;border:1px solid #d3ccc7;background:#fff;border-radius:8px;padding:0 12px;color:#5f5853;font-size:11px}.add-category{margin-top:4px}.empty{padding:40px;text-align:center;color:#8c837d}.editor{position:sticky;top:0;height:100vh;background:#f8f7f5;border-left:1px solid var(--line);overflow:auto;display:none}.editor-open .editor{display:block}.editor-head{height:68px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px}.editor-head small{display:block;color:var(--muted);font-size:9px}.editor-head h3{margin:2px 0 0;font-size:16px}.editor-head button{margin-left:auto;border:0;background:transparent;font-size:24px}.editor-body{padding:12px}.editor-card{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}.editor-card-head{height:46px;padding:0 13px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between}.editor-card-head h4{margin:0;font-size:12.5px}.editor-card-head small{font-size:9px;color:var(--muted)}.editor-card-body{padding:12px}.field{display:block;margin-bottom:10px}.field>span{display:block;font-size:10px;color:#6f6762;margin-bottom:5px;font-weight:650}.field input,.field textarea{width:100%;border:1px solid #d8d1cc;border-radius:8px;padding:9px 10px;background:#fff;outline:0;font-size:12px}.field textarea{min-height:72px;resize:vertical}.size-head,.size-row{display:grid;grid-template-columns:28px minmax(0,1fr) 92px 28px;gap:6px;align-items:center}.size-head{font-size:9px;color:#978f89;margin-bottom:5px}.size-row{margin-bottom:6px}.size-row input:not([type=radio]){height:36px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;min-width:0}.size-row input[type=radio],.choice-row input[type=radio],.choice-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--orange)}.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}.chip-check{display:flex;align-items:center;gap:7px;min-height:34px;border:1px solid #e8e2de;border-radius:8px;padding:0 8px;font-size:10px}.chip-check input{accent-color:var(--green)}.add-line,.primary-line{height:35px;border-radius:8px;padding:0 11px;font-size:10.5px}.add-line{border:1px dashed #cfc6c0;background:#fff;color:#625b56}.primary-line{width:100%;border:1px solid #efb89f;background:#fff4ee;color:#bf4f24;font-weight:700}.hint{color:#958c86;font-size:9.5px;line-height:1.4}.group-card{border:1px solid #e4ddd8;border-radius:11px;margin-bottom:9px;overflow:hidden}.group-head{padding:8px;display:grid;grid-template-columns:minmax(0,1fr) 30px;gap:7px;background:#fbfaf9;border-bottom:1px solid #eee}.group-head input{height:34px;border:1px solid #ddd6d1;border-radius:8px;padding:0 9px}.group-body{padding:10px}.choice-mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:9px}.choice-mode button{height:36px;border:1px solid #ddd6d1;border-radius:8px;background:#fff;color:#68605b;font-size:10.5px}.choice-mode button.active{border-color:#ef9a76;background:#fff2ec;color:#bd4d22;font-weight:700}.group-help{font-size:9.5px;color:#8d847e;line-height:1.4}.choice-head,.choice-row{display:grid;grid-template-columns:26px minmax(0,1fr) 82px 28px;gap:6px;align-items:center}.choice-head{font-size:9px;color:#978f89;margin-bottom:5px}.choice-row{margin-bottom:6px}.choice-row input:not([type=radio]):not([type=checkbox]){height:34px;border:1px solid #ddd6d1;border-radius:7px;padding:0 8px;min-width:0}.remove-mini{width:28px;height:28px;border:0;border-radius:7px;background:#f5f2f0;color:#a56b67}.rule-box{margin-top:9px;padding:9px;border:1px solid #eee7e2;border-radius:9px;background:#fcfbfa}.toggle-row{min-height:43px;display:flex;justify-content:space-between;align-items:center;gap:10px}.toggle-row strong{font-size:11px}.toggle-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.switch{position:relative;width:38px;height:22px}.switch input{opacity:0;position:absolute}.switch i{position:absolute;inset:0;border-radius:999px;background:#d7d3d0}.switch i:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}.switch input:checked+i{background:var(--green)}.switch input:checked+i:after{transform:translateX(16px)}.danger-link{margin-top:9px;border:0;background:transparent;color:#c74747;font-size:10px}.danger-wide,.quiet{height:35px;border-radius:8px;padding:0 11px;font-size:10.5px}.danger-wide{border:1px solid #efc4c4;background:#fff4f4;color:#bd4141}.quiet{border:1px solid #ddd;background:#fff;color:#777}.toast{position:fixed;right:18px;bottom:18px;background:#302c29;color:#fff;padding:10px 13px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}

<body>
<div class="app" id="app">
<aside class="sidebar"><div class="brand"><div class="brand-mark">K</div><div><strong>KØL Admin</strong><small>Grill & Pizza</small></div></div><div class="nav-title">MENY</div><button class="nav-btn active">☰ &nbsp; Produkter & kategorier</button><button class="nav-btn" id="previewNav">↗ &nbsp; Åpne kundemeny</button><div class="nav-note">Endringer lagres automatisk. Dra kategorier og produkter for å endre rekkefølgen.</div></aside>

</div><div class="toast" id="toast"></div>
