<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KØL Admin – Meny</title>
<style>
:root{--orange:#f28b22;--green:#59bc62;--bg:#f4f2ef;--card:#fff;--line:#dedbd7;--text:#34383e;--muted:#7f858c;--sidebar:#fff;--danger:#e95158;--blue:#eef6fd;--shadow:0 2px 8px rgba(37,35,32,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:300px minmax(620px,1fr) 0;transition:grid-template-columns .2s}.app.editor-open{grid-template-columns:300px minmax(560px,1fr) 340px}
.sidebar{position:sticky;top:0;height:100vh;background:var(--sidebar);border-right:1px solid #ddd;display:grid;grid-template-columns:68px 1fr}.rail{border-right:1px solid #e4e1de;padding-top:14px}.rail-icon{height:78px;display:grid;place-items:center;font-size:27px;color:#56606a}.rail-icon.active{color:var(--orange);background:#fff8f1}.nav{padding:20px 22px}.nav h1{font-size:19px;letter-spacing:.03em;color:#afb2b5;margin:0 0 28px}.nav a{display:block;padding:13px 0;color:#3d4752;text-decoration:none;font-size:15px}.nav .group{margin-top:18px;font-weight:700}.nav .active{color:var(--orange);position:relative;padding-left:16px}.nav .active:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange);position:absolute;left:-4px;top:19px;box-shadow:0 0 0 6px #fff2e3}.nav .active:after{content:"✓";float:right;color:var(--green);font-weight:800}
.workspace{min-width:0}.topbar{height:70px;position:sticky;top:0;z-index:20;background:#eee;border-bottom:1px solid #d1d1d1;display:flex;align-items:center;gap:12px;padding:0 28px}.preview{height:44px;border:0;border-radius:4px;padding:0 20px;background:var(--green);color:#fff;font-weight:700}.save{height:44px;border:0;border-radius:4px;padding:0 20px;background:var(--orange);color:#fff;font-weight:700;margin-left:auto}.save:disabled{opacity:.55}.dots-top{width:44px;height:44px;border:1px solid #ccc;border-radius:4px;background:#f7f7f7;font-size:22px}.save-state{font-size:12px;color:#777}.content{padding:28px 30px 60px;max-width:1120px;margin:auto}.page-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.page-head h2{margin:0;font-size:24px}.page-head p{margin:5px 0 0;color:var(--muted);font-size:13px}.category{margin-bottom:14px}.category-head{min-height:96px;background:#fff;border:1px solid #e1ddd8;border-radius:5px;box-shadow:var(--shadow);display:grid;grid-template-columns:82px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 18px}.cat-image{width:64px;height:64px;border-radius:3px;background:#eee center/cover no-repeat;border:1px solid #e0ddd9;display:grid;place-items:center;color:#999}.cat-copy strong{display:block;font-size:16px}.cat-copy small{display:block;margin-top:5px;color:#888;font-size:13px}.cat-actions{display:flex;align-items:center;gap:8px}.icon-btn{width:38px;height:38px;border:0;background:transparent;border-radius:4px;color:#777;font-size:20px}.icon-btn:hover{background:#f2f0ed}.category-body{margin:7px 0 0 28px}.item{position:relative;min-height:88px;background:#fff;border:1px solid #ddd8d3;border-radius:4px;box-shadow:0 1px 5px rgba(30,27,24,.09);display:grid;grid-template-columns:18px 66px minmax(0,1fr) 90px 76px;gap:12px;align-items:center;padding:9px 12px;margin-bottom:8px}.drag{color:#aaa;font-size:20px}.item-img{width:64px;height:64px;border-radius:2px;background:#eee center/cover no-repeat}.item-copy{min-width:0}.item-copy strong{display:block;font-size:14px}.item-copy small{display:block;color:#8a8a8a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}.badges{margin-bottom:4px}.badge{display:inline-block;padding:2px 7px;border-radius:10px;color:#fff;font-size:10px;font-weight:700;background:#999}.badge.red{background:var(--danger)}.badge.gray{background:#8c9297}.item-price{text-align:right;font-size:13px}.item-actions{display:flex;justify-content:flex-end}.add-item,.add-category{height:38px;border:1px solid #c9c5c1;background:#fff;border-radius:3px;padding:0 14px;color:#63686d}.add-category{margin-top:4px}.category-body[hidden]{display:none}
.popover{position:fixed;z-index:70;width:310px;background:#fff;border-radius:3px;box-shadow:0 12px 32px rgba(0,0,0,.18);border:1px solid #eee;overflow:hidden}.pop-row,.pop-section-head{min-height:46px;padding:0 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #eee;background:#fff;color:#666}.pop-row:hover{background:#faf9f8}.pop-section-head{justify-content:space-between}.availability{padding:12px 18px 14px}.availability h4{font-weight:400;color:#666;margin:0 0 12px}.radio-row{min-height:36px;display:flex;align-items:center;gap:10px;color:#696d72}.radio-row input{width:18px;height:18px;accent-color:var(--green)}
.editor{position:sticky;top:0;height:100vh;background:#fff;border-left:1px solid #d9d6d2;overflow:auto;display:none;z-index:30}.editor-open .editor{display:block}.editor-head{height:70px;position:sticky;top:0;background:#fff;z-index:2;border-bottom:1px solid #ddd;display:flex;align-items:center;padding:0 18px}.editor-head h3{margin:0;font-size:18px}.editor-head button{margin-left:auto;border:0;background:transparent;font-size:26px;color:#777}.editor-section{border-bottom:1px solid #e4e1de;padding:16px}.editor-section h4{margin:0 0 12px;font-size:14px}.field{display:block;margin-bottom:11px}.field span{display:block;font-size:11px;color:#777;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #d6d2ce;border-radius:4px;padding:9px 10px;background:#fff}.field textarea{min-height:72px;resize:vertical}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.size-row,.choice-row{display:grid;grid-template-columns:minmax(0,1fr) 86px 30px;gap:6px;margin-bottom:6px}.size-row input,.choice-row input{min-width:0;border:1px solid #ddd;padding:8px}.mini{border:0;background:#f4f2f0;border-radius:3px}.link-btn{border:0;background:transparent;padding:4px 0;color:#687078;text-decoration:underline}.danger{color:#c5484c}.group-card{border-top:1px solid #eee;padding:12px 0}.group-head{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.group-head strong{font-size:13px}.check-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.check{display:flex;align-items:center;gap:7px;font-size:12px}.check input{accent-color:var(--green)}.empty{padding:38px;text-align:center;color:#888}.loading{padding:80px;text-align:center;color:#777}.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#30343a;color:#fff;padding:10px 14px;border-radius:5px;opacity:0;transform:translateY(8px);transition:.18s;pointer-events:none}.toast.show{opacity:1;transform:none}
@media(max-width:1050px){.app,.app.editor-open{grid-template-columns:230px minmax(500px,1fr)}.editor{position:fixed;right:0;width:360px;box-shadow:-10px 0 30px #0002}.sidebar{grid-template-columns:54px 1fr}.nav{padding:18px 14px}.content{padding:20px 18px}.category-head{grid-template-columns:70px minmax(0,1fr) auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="rail"><div class="rail-icon active">⚙</div><div class="rail-icon">◎</div><div class="rail-icon">⌁</div><div class="rail-icon">◔</div><div class="rail-icon">•••</div></div>
    <nav class="nav"><h1>SETUP</h1><a>Restaurant basics</a><a>Services &amp; opening hours</a><a>Payment, taxes &amp; legal</a><a>Taking orders</a><a class="group">Menu Setup</a><a class="active">Menu Setup</a><a>Publishing</a><a>Payments</a></nav>
  </aside>
  <section class="workspace">
    <header class="topbar"><button class="preview" id="previewBtn">Preview &amp; Test Ordering</button><button class="dots-top">⋮</button><span class="save-state" id="saveState">Laster…</span><button class="save" id="saveBtn" disabled>Lagre</button></header>
    <main class="content"><div class="page-head"><div><h2>Meny</h2><p>Kategorier, produkter, tilgjengelighet og valg.</p></div></div><div id="menuRoot" class="loading">Laster meny fra Firebase…</div><button class="add-category" id="addCategoryBtn" hidden>Legg til kategori</button></main>
  </section>
  <aside class="editor" id="editor"><div class="editor-head"><h3 id="editorTitle">Produkt</h3><button id="closeEditor">×</button></div><div id="editorBody"></div></aside>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
'use strict';
const DB='https://bestill-19-default-rtdb.europe-west1.firebasedatabase.app';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]);
let config={sections:[],optionGroups:[]},dirty=false,openCats=new Set(),editing=null,pop=null;
const root=$('#menuRoot'),saveBtn=$('#saveBtn'),saveState=$('#saveState'),app=$('#app');
function id(prefix='id'){return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function markDirty(){dirty=true;saveBtn.disabled=false;saveState.textContent='Ikke lagret'}
function sectionImage(s){return s.imageUrl||s.image||arr(s.items).find(i=>i?.imageUrl||i?.image)?.imageUrl||arr(s.items).find(i=>i?.image)?.image||''}
function productImage(p){return p.imageUrl||p.image||''}
function priceText(p){const sizes=arr(p.sizes);if(sizes.length){const vals=sizes.map(x=>Number(x?.price)).filter(Number.isFinite);if(vals.length){const mn=Math.min(...vals),mx=Math.max(...vals);return mn===mx?`${mn} kr`:`fra ${mn} kr`}}const v=Number(p.price??p.mediumPrice);return Number.isFinite(v)?`${v} kr`:''}
function isUnavailable(p){if(!p.soldOut)return false;if(p.soldOutUntil&&p.soldOutUntil!=='undetermined'){const d=new Date(p.soldOutUntil);if(Number.isFinite(d.getTime())&&d<=new Date()){p.soldOut=false;p.soldOutUntil='';markDirty();return false}}return true}
async function load(){try{const r=await fetch(DB+'/.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);config=await r.json()||{};config.sections=arr(config.sections);config.optionGroups=arr(config.optionGroups);config.sections.forEach(s=>{s.items=arr(s.items);openCats.add(String(s.id||''))});root.className='';$('#addCategoryBtn').hidden=false;render()}catch(e){root.className='empty';root.textContent='Meny lastes ikke: '+e.message;saveState.textContent='Feil'}}
function render(){root.innerHTML=config.sections.map((s,si)=>categoryHtml(s,si)).join('')||'<div class="empty">Ingen kategorier.</div>';bindMenu()}
function categoryHtml(s,si){const sid=String(s.id||`section-${si}`),open=openCats.has(sid),img=sectionImage(s);return `<section class="category" data-si="${si}"><div class="category-head"><div class="cat-image" ${img?`style="background-image:url('${esc(img)}')"`:''}>${img?'':'▧'}</div><div class="cat-copy"><strong>${esc(s.title||s.name||'Ny kategori')}</strong><small>${esc(s.note||s.description||'')}</small></div><div class="cat-actions"><button class="icon-btn cat-edit" title="Rediger kategori">✎</button><button class="icon-btn cat-menu">⋮</button><button class="icon-btn cat-toggle">${open?'⌃':'⌄'}</button></div></div><div class="category-body" ${open?'':'hidden'}>${arr(s.items).map((p,pi)=>itemHtml(p,si,pi)).join('')}<button class="add-item" data-si="${si}">Legg til produkt</button></div></section>`}
function itemHtml(p,si,pi){const img=productImage(p),un=isUnavailable(p);return `<article class="item" data-si="${si}" data-pi="${pi}"><div class="drag">≡</div><div class="item-img" ${img?`style="background-image:url('${esc(img)}')"`:''}></div><div class="item-copy"><div class="badges">${un?'<span class="badge red">Utsolgt</span> ':''}${p.hidden?'<span class="badge gray">Skjult</span>':''}</div><strong>${esc(p.name||'Nytt produkt')}</strong><small>${esc(p.ingredients||p.description||'')}</small></div><div class="item-price">${esc(priceText(p))}</div><div class="item-actions"><button class="icon-btn item-menu">⋮</button><button class="icon-btn item-edit">✎</button></div></article>`}
function bindMenu(){document.querySelectorAll('.cat-toggle').forEach(b=>b.onclick=e=>{const c=e.target.closest('.category'),si=+c.dataset.si,s=config.sections[si],sid=String(s.id||`section-${si}`);openCats.has(sid)?openCats.delete(sid):openCats.add(sid);render()});document.querySelectorAll('.cat-edit').forEach(b=>b.onclick=e=>editCategory(+e.target.closest('.category').dataset.si));document.querySelectorAll('.cat-menu').forEach(b=>b.onclick=e=>categoryMenu(e,+e.target.closest('.category').dataset.si));document.querySelectorAll('.add-item').forEach(b=>b.onclick=e=>addProduct(+e.target.dataset.si));document.querySelectorAll('.item-edit').forEach(b=>b.onclick=e=>{const x=e.target.closest('.item');editProduct(+x.dataset.si,+x.dataset.pi)});document.querySelectorAll('.item-menu').forEach(b=>b.onclick=e=>{const x=e.target.closest('.item');productMenu(e,+x.dataset.si,+x.dataset.pi)})}
function closePop(){pop?.remove();pop=null}document.addEventListener('click',e=>{if(pop&&!pop.contains(e.target)&&!e.target.closest('.item-menu,.cat-menu'))closePop()});
function placePop(btn,html){closePop();const r=btn.getBoundingClientRect();pop=document.createElement('div');pop.className='popover';pop.innerHTML=html;document.body.appendChild(pop);const left=Math.min(innerWidth-325,Math.max(8,r.right-300));const top=Math.min(innerHeight-pop.offsetHeight-8,r.bottom+4);Object.assign(pop.style,{left:left+'px',top:Math.max(8,top)+'px'});return pop}
function productMenu(ev,si,pi){ev.stopPropagation();const p=config.sections[si].items[pi],un=isUnavailable(p);const el=placePop(ev.currentTarget,`<button class="pop-row" data-a="dup">▣ Duplicate</button><button class="pop-row danger" data-a="remove">♜ Remove</button><div class="pop-section-head"><span>Visibility</span><label><input type="checkbox" data-a="hidden" ${p.hidden?'checked':''}> Skjult</label></div><div class="availability"><h4>Availability</h4><label class="radio-row"><input type="checkbox" data-a="sold" ${un?'checked':''}> Out of stock</label><label class="radio-row"><input type="radio" name="until" value="tomorrow" ${p.soldOutUntil==='tomorrow'?'checked':''}> Until tomorrow</label><label class="radio-row"><input type="radio" name="until" value="custom"> Until …</label><label class="radio-row"><input type="radio" name="until" value="undetermined" ${p.soldOutUntil==='undetermined'?'checked':''}> Undetermined</label></div><button class="pop-row" data-a="edit">Item Settings</button><button class="pop-row" data-a="choices">Choices & addons</button>`);el.querySelector('[data-a=dup]').onclick=()=>{const cp=structuredClone(p);cp.id=id('product');cp.name=(cp.name||'Produkt')+' kopi';config.sections[si].items.splice(pi+1,0,cp);markDirty();closePop();render()};el.querySelector('[data-a=remove]').onclick=()=>{if(confirm('Fjerne produktet?')){config.sections[si].items.splice(pi,1);markDirty();closePop();render()}};el.querySelector('[data-a=hidden]').onchange=e=>{p.hidden=e.target.checked;markDirty();render();closePop()};el.querySelector('[data-a=sold]').onchange=e=>{p.soldOut=e.target.checked;if(p.soldOut&&!p.soldOutUntil)p.soldOutUntil='undetermined';if(!p.soldOut)p.soldOutUntil='';markDirty();render();closePop()};el.querySelectorAll('input[name=until]').forEach(r=>r.onchange=e=>{if(e.target.value==='tomorrow'){const d=new Date();d.setDate(d.getDate()+1);d.setHours(23,59,59,999);p.soldOut=true;p.soldOutUntil=d.toISOString()}else if(e.target.value==='custom'){const val=prompt('Dato/tid (f.eks. 2026-08-27T18:00)');if(val){const d=new Date(val);if(!isNaN(d)){p.soldOut=true;p.soldOutUntil=d.toISOString()}}}else{p.soldOut=true;p.soldOutUntil='undetermined'}markDirty();render();closePop()});el.querySelector('[data-a=edit]').onclick=()=>{closePop();editProduct(si,pi)};el.querySelector('[data-a=choices]').onclick=()=>{closePop();editProduct(si,pi,'choices')}}
function categoryMenu(ev,si){ev.stopPropagation();const s=config.sections[si],el=placePop(ev.currentTarget,`<button class="pop-row" data-a="dup">▣ Duplicate category</button><button class="pop-row danger" data-a="remove">♜ Remove category</button><button class="pop-row" data-a="edit">Category settings</button>`);el.querySelector('[data-a=dup]').onclick=()=>{const cp=structuredClone(s);cp.id=id('section');cp.title=(cp.title||'Kategori')+' kopi';cp.items=arr(cp.items).map(p=>({...p,id:id('product')}));config.sections.splice(si+1,0,cp);markDirty();closePop();render()};el.querySelector('[data-a=remove]').onclick=()=>{if(confirm('Fjerne hele kategorien?')){config.sections.splice(si,1);markDirty();closePop();render()}};el.querySelector('[data-a=edit]').onclick=()=>{closePop();editCategory(si)}}
function openEditor(title,html){editing=editing||{};app.classList.add('editor-open');$('#editorTitle').textContent=title;$('#editorBody').innerHTML=html}
function editCategory(si){const s=config.sections[si];editing={type:'category',si};openEditor('Kategori',`<div class="editor-section"><h4>Kategoriinnstillinger</h4><label class="field"><span>Navn</span><input id="catTitle" value="${esc(s.title||'')}"></label><label class="field"><span>Beskrivelse</span><textarea id="catNote">${esc(s.note||s.description||'')}</textarea></label><label class="field"><span>Bilde-URL</span><input id="catImage" value="${esc(s.imageUrl||'')}"></label><label class="check"><input id="catLoyalty" type="checkbox" ${s.loyaltyEligible?'checked':''}> Gjelder lojalitetsprogram</label></div>`);$('#catTitle').oninput=e=>{s.title=e.target.value;markDirty();render()};$('#catNote').oninput=e=>{s.note=e.target.value;markDirty();render()};$('#catImage').oninput=e=>{s.imageUrl=e.target.value;markDirty();render()};$('#catLoyalty').onchange=e=>{s.loyaltyEligible=e.target.checked;markDirty()}}
function allergenChecks(p){const list=[['melk','Melk'],['gluten','Gluten'],['egg','Egg'],['soya','Soya'],['selleri','Selleri'],['sennep','Sennep'],['sesam','Sesam'],['fisk','Fisk'],['skalldyr','Skalldyr'],['peanøtter','Peanøtter'],['nøtter','Nøtter'],['sulfitter','Sulfitter']];const set=new Set(arr(p.allergens));return list.map(([v,l])=>`<label class="check"><input type="checkbox" data-allergen="${v}" ${set.has(v)?'checked':''}>${l}</label>`).join('')}
function sizesHtml(p){return arr(p.sizes).map((s,i)=>`<div class="size-row" data-size="${i}"><input data-k="label" value="${esc(s.label||s.name||'')}"><input data-k="price" type="number" step="1" value="${esc(s.price??'')}"><button class="mini" data-del-size="${i}">×</button></div>`).join('')}
function groupsHtml(p){const ids=new Set(arr(p.optionGroupIds).map(String));return config.optionGroups.map((g,gi)=>`<div class="group-card"><div class="group-head"><label class="check"><input type="checkbox" data-group-toggle="${gi}" ${ids.has(String(g.id))?'checked':''}><strong>${esc(g.title||'Valggruppe')}</strong></label><button class="link-btn" data-edit-group="${gi}">Rediger</button></div>${ids.has(String(g.id))?`<div>${arr(g.options).map(o=>`<div class="choice-row"><input value="${esc(o.label||'')}" disabled><input value="${esc(o.price??0)}" disabled><span></span></div>`).join('')}</div>`:''}</div>`).join('')}
function editProduct(si,pi,focus='main'){const p=config.sections[si].items[pi];p.sizes=arr(p.sizes);p.optionGroupIds=arr(p.optionGroupIds);editing={type:'product',si,pi};openEditor('Produktinnstillinger',`<div class="editor-section"><h4>Produkt</h4><label class="field"><span>Navn</span><input id="pName" value="${esc(p.name||'')}"></label><label class="field"><span>Beskrivelse / ingredienser</span><textarea id="pDesc">${esc(p.ingredients||p.description||'')}</textarea></label><label class="field"><span>Bilde-URL</span><input id="pImage" value="${esc(p.imageUrl||p.image||'')}"></label></div><div class="editor-section"><h4>Størrelser og priser</h4><div id="sizesBox">${sizesHtml(p)}</div><button class="link-btn" id="addSize">+ Legg til størrelse</button></div><div class="editor-section"><h4>Allergener</h4><div class="check-grid">${allergenChecks(p)}</div></div><div class="editor-section" id="choicesSection"><h4>Choices &amp; addons</h4><div id="groupsBox">${groupsHtml(p)}</div><button class="link-btn" id="addGroup">+ Add Group</button></div><div class="editor-section"><label class="check"><input id="pHidden" type="checkbox" ${p.hidden?'checked':''}> Skjul produkt</label><label class="check" style="margin-top:9px"><input id="pSold" type="checkbox" ${isUnavailable(p)?'checked':''}> Utsolgt</label><button class="link-btn danger" id="deleteProduct" style="margin-top:16px">Fjern produkt</button></div>`);bindProductEditor(p,si,pi);if(focus==='choices')setTimeout(()=>$('#choicesSection')?.scrollIntoView({behavior:'smooth'}),50)}
function bindProductEditor(p,si,pi){$('#pName').oninput=e=>{p.name=e.target.value;markDirty();render()};$('#pDesc').oninput=e=>{p.description=e.target.value;p.ingredients=e.target.value;markDirty();render()};$('#pImage').oninput=e=>{p.imageUrl=e.target.value;markDirty();render()};$('#pHidden').onchange=e=>{p.hidden=e.target.checked;markDirty();render()};$('#pSold').onchange=e=>{p.soldOut=e.target.checked;p.soldOutUntil=e.target.checked?'undetermined':'';markDirty();render()};document.querySelectorAll('[data-allergen]').forEach(x=>x.onchange=()=>{p.allergens=[...document.querySelectorAll('[data-allergen]:checked')].map(i=>i.dataset.allergen);markDirty()});function bindSizes(){document.querySelectorAll('[data-size]').forEach(row=>row.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const i=+row.dataset.size;p.sizes[i]=p.sizes[i]||{};p.sizes[i][inp.dataset.k]=inp.dataset.k==='price'?Number(inp.value):inp.value;markDirty();render()}));document.querySelectorAll('[data-del-size]').forEach(b=>b.onclick=()=>{p.sizes.splice(+b.dataset.delSize,1);markDirty();editProduct(si,pi)})}bindSizes();$('#addSize').onclick=()=>{p.sizes.push({id:id('size'),label:'Ny størrelse',price:0});markDirty();editProduct(si,pi)};document.querySelectorAll('[data-group-toggle]').forEach(c=>c.onchange=()=>{const g=config.optionGroups[+c.dataset.groupToggle],gid=String(g.id);const set=new Set(arr(p.optionGroupIds).map(String));c.checked?set.add(gid):set.delete(gid);p.optionGroupIds=[...set];markDirty();editProduct(si,pi,'choices')});document.querySelectorAll('[data-edit-group]').forEach(b=>b.onclick=()=>editGroup(+b.dataset.editGroup,si,pi));$('#addGroup').onclick=()=>{const g={id:id('group'),title:'Ny valggruppe',type:'addon',options:[{id:id('choice'),label:'Nytt valg',price:0}]};config.optionGroups.push(g);p.optionGroupIds=[...new Set([...arr(p.optionGroupIds).map(String),String(g.id)])];markDirty();editGroup(config.optionGroups.length-1,si,pi)};$('#deleteProduct').onclick=()=>{if(confirm('Fjerne produktet?')){config.sections[si].items.splice(pi,1);markDirty();closeEditor();render()}}}
function editGroup(gi,si,pi){const g=config.optionGroups[gi];openEditor('Choices & addons',`<div class="editor-section"><h4>Valggruppe</h4><label class="field"><span>Navn</span><input id="gTitle" value="${esc(g.title||'')}"></label><label class="field"><span>Type</span><select id="gType"><option value="addon">Tillegg</option><option value="spice" ${g.type==='spice'?'selected':''}>Styrke</option><option value="choice" ${g.type==='choice'?'selected':''}>Valg</option></select></label></div><div class="editor-section"><h4>Valg</h4><div id="choiceBox">${arr(g.options).map((o,i)=>`<div class="choice-row" data-choice="${i}"><input data-k="label" value="${esc(o.label||'')}"><input data-k="price" type="number" step="1" value="${esc(o.price??0)}"><button class="mini" data-del-choice="${i}">×</button></div>`).join('')}</div><button class="link-btn" id="addChoice">+ Add choice</button><br><button class="link-btn danger" id="deleteGroup">Fjern gruppe</button></div>`);$('#gTitle').oninput=e=>{g.title=e.target.value;markDirty()};$('#gType').onchange=e=>{g.type=e.target.value;markDirty()};document.querySelectorAll('[data-choice]').forEach(row=>row.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{const o=g.options[+row.dataset.choice];o[inp.dataset.k]=inp.dataset.k==='price'?Number(inp.value):inp.value;markDirty()}));document.querySelectorAll('[data-del-choice]').forEach(b=>b.onclick=()=>{g.options.splice(+b.dataset.delChoice,1);markDirty();editGroup(gi,si,pi)});$('#addChoice').onclick=()=>{g.options=arr(g.options);g.options.push({id:id('choice'),label:'Nytt valg',price:0});markDirty();editGroup(gi,si,pi)};$('#deleteGroup').onclick=()=>{if(confirm('Fjerne valggruppen?')){const gid=String(g.id);config.optionGroups.splice(gi,1);config.sections.forEach(s=>arr(s.items).forEach(p=>p.optionGroupIds=arr(p.optionGroupIds).filter(x=>String(x)!==gid)));markDirty();editProduct(si,pi,'choices')}}}
function closeEditor(){app.classList.remove('editor-open');editing=null}$('#closeEditor').onclick=closeEditor;
function addProduct(si){const p={id:id('product'),name:'Nytt produkt',description:'',imageUrl:'',allergens:[],sizes:[{id:id('size'),label:'Standard',price:0}],optionGroupIds:[],hidden:false,soldOut:false};config.sections[si].items.push(p);openCats.add(String(config.sections[si].id));markDirty();render();editProduct(si,config.sections[si].items.length-1)}
$('#addCategoryBtn').onclick=()=>{const s={id:id('section'),title:'Ny kategori',note:'',type:'',items:[]};config.sections.push(s);openCats.add(String(s.id));markDirty();render();editCategory(config.sections.length-1)};
$('#previewBtn').onclick=()=>window.open('./index.html','_blank');
async function save(){saveBtn.disabled=true;saveState.textContent='Lagrer…';try{const r=await fetch(DB+'/.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(config)});if(!r.ok)throw Error('HTTP '+r.status);dirty=false;saveState.textContent='Lagret';toast('Meny lagret');setTimeout(()=>{if(!dirty)saveState.textContent='Alt lagret'},1200)}catch(e){saveBtn.disabled=false;saveState.textContent='Kunne ikke lagre';toast('Lagring feilet: '+e.message)}}saveBtn.onclick=save;window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});load();
})();
</script>
</body>
</html>
