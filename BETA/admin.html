<!doctype html>
<html lang="no">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
 <meta name="theme-color" content="#f3f7f6">
 <title>Bestillinger — BETA Admin</title>
 <link rel="stylesheet" href="./css/admin.css?v=20261022-beta18">
</head>
<body>
<div class="shell">
 <header class="topbar">
  <div class="top-brand">
   <button type="button" id="menuToggle" class="toolbar-btn menu-toggle" title="Vis/skjul bestillingslisten" aria-label="Vis eller skjul bestillingslisten" aria-expanded="true">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
   </button>
   <div class="title-wrap"><h1>Bestillinger</h1><small id="restaurantName">Restaurant</small></div>
  </div>
  <div class="top-actions" aria-label="Restaurantverktøy">
   <span id="connection" class="connection" title="Firebase tilkobling">Kobler til…</span>
   <button type="button" class="toolbar-btn" id="printerTool" title="Sjekk skriverforbindelse" aria-label="Sjekk skriverforbindelse"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4V9h16v9h-2M6 15h12v6H6zM16 12h2"/></svg><span class="tool-dot" id="printerDot" hidden></span></button>
   <button type="button" class="toolbar-btn" id="smsTool" title="SMS-status" aria-label="SMS-status"><svg viewBox="0 0 24 24"><path d="M4 5h16v12H8l-4 3zM8 9h8M8 13h6"/></svg></button>
   <button type="button" class="toolbar-btn" id="emailTool" title="E-poststatus" aria-label="E-poststatus"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 7 9-7"/></svg></button>
   <button type="button" class="toolbar-btn" id="enableSound" title="Aktiver ordrelyd" aria-label="Aktiver ordrelyd"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4ZM17 9q3 3 0 6M19 6q6 6 0 12"/></svg></button>
   <button type="button" class="toolbar-btn" id="refreshOrders" title="Koble til Firebase på nytt" aria-label="Oppdater bestillinger"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/></svg></button>
  </div>
 </header>
 <main>
  <section id="ordersPane" class="orders-layout">
   <aside class="order-sidebar">
    <div class="sidebar-heading"><div><h2>Bestillinger</h2><p><span id="orderCount">0</span> bestillinger · <span id="newCount">0</span> nye</p></div><span id="newBadge" class="counter" hidden>0</span></div>
    <div id="newAlert" class="new-alert" hidden role="status"><span class="alert-led"></span> Ny bestilling venter på svar</div>
    <div class="tabs" role="group" aria-label="Filtrer bestillinger"><button type="button" class="active" data-filter="all">Alle</button><button type="button" data-filter="scheduled">Planlagte</button></div>
    <label class="search-wrap"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Søk navn, telefon eller bestilling" aria-label="Søk bestillinger"></label>
    <div id="orderList" class="order-list" aria-live="polite"></div>
   </aside>
   <section class="detail-pane" aria-label="Bestillingsdetaljer">
    <div id="detailEmpty" class="detail-empty"><div class="empty-symbol">☷</div><h2>Velg en bestilling</h2><p>Bestillingsdetaljene vises her.</p></div>
    <div id="orderDetail" hidden></div>
   </section>
  </section>
 </main>
 <div class="toast" id="toast" role="status" hidden></div>
</div>
<script type="module" src="./js/admin.js?v=20261022-beta18"></script>
</body>
</html>
