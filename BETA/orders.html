<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#062d25">
<meta name="robots" content="noindex,nofollow">
<title>BestillOnline · Bestillinger</title>
<link rel="stylesheet" href="./admin/orders.css?v=20261118-gloria3">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
<script src="./admin/orders.js?v=20261118-gloria3" defer></script>
</head>
<body>
<header class="orders-head">
  <div class="orders-headline"><h1>Orders</h1><small id="ordersBrand">BestillOnline</small></div>
  <div class="orders-top-actions">
   <span class="orders-connection" id="ordersConnection" title="Tilkoblingsstatus"><i></i><span>Kobler til…</span></span>
   <details class="orders-menu"><summary aria-label="Meny" title="Meny">⋮</summary><div class="orders-menu-items"><a href="./admin.html">Menyadmin</a><button id="ordersSignOut" type="button" hidden>Logg ut</button></div></details>
  </div>
</header>
<main class="orders-main">
 <section id="ordersLogin" class="orders-login">
  <div class="orders-login-card"><h2>Logg inn</h2><p>Skriv inn administratorpassordet for å ta imot bestillinger.</p>
   <form id="ordersLoginForm"><label for="ordersPassword">Passord</label><input id="ordersPassword" type="password" autocomplete="current-password" required placeholder="Administratorpassord"><button type="submit" id="ordersLoginSubmit" class="orders-primary">Logg inn</button></form><p id="ordersLoginError" class="orders-error" role="alert" hidden></p>
  </div>
 </section>
 <div id="ordersApp" hidden>
  <nav class="orders-tabs" role="tablist" aria-label="Bestillingsstatus">
   <button type="button" role="tab" class="active" data-filter="all" aria-selected="true">Alle</button>
   <button type="button" role="tab" data-filter="godkjent" aria-selected="false">Pågår</button>
   <button type="button" role="tab" data-filter="klar" aria-selected="false">Klar</button>
  </nav>
  <p id="ordersFeedback" class="orders-feedback" role="status" aria-live="polite" hidden></p>
  <div id="ordersEmpty" class="orders-empty"><strong>Ingen bestillinger</strong><small>Nye bestillinger vises automatisk.</small></div>
  <div id="ordersList" class="orders-list" aria-label="Bestillingsliste"></div>
 </div>
</main>
<div id="ordersSheetOverlay" class="orders-sheet-overlay" hidden></div>
<aside id="ordersSheet" class="orders-sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle" hidden>
 <div class="orders-sheet-header">
  <button class="orders-icon-button orders-back" type="button" id="ordersBack" aria-label="Tilbake">←</button>
  <div><h2 id="detailTitle">Bestilling</h2><small>HENTING</small></div>
  <button id="ordersPrint" type="button" class="orders-icon-button" title="Skriv ut" aria-label="Skriv ut bestillingen">▤</button>
 </div>
 <div id="ordersDetail" class="orders-detail"></div>
 <div id="ordersActionBar" class="orders-action-bar"></div>
</aside>
<div id="ordersAcceptOverlay" class="orders-dialog-overlay" hidden>
 <form id="ordersAcceptForm" class="orders-dialog">
  <button type="button" id="ordersCancelAccept" class="orders-dialog-close" aria-label="Tilbake">←</button>
  <h3>Godta bestilling</h3><p>Forventet hentetid</p>
  <label for="ordersPrep">Klar om</label>
  <div class="orders-minute-field"><button type="button" id="ordersPrepMinus" aria-label="Færre minutter">−</button><input id="ordersPrep" type="number" min="1" max="99" value="20" inputmode="numeric" required aria-label="Antall minutter"><span class="orders-minute-unit">min</span><button type="button" id="ordersPrepPlus" aria-label="Flere minutter">+</button></div>
  <button id="ordersConfirmAccept" class="orders-primary" type="submit">GODTA</button>
 </form>
</div>
<div id="ordersRejectOverlay" class="orders-dialog-overlay" hidden>
 <form id="ordersRejectForm" class="orders-dialog">
  <button type="button" id="ordersCancelReject" class="orders-dialog-close" aria-label="Tilbake">←</button>
  <h3>Avvis bestilling</h3><p>Oppgi grunnen til avvisningen.</p>
  <textarea id="ordersRejectReason" maxlength="180" rows="3" required placeholder="Skriv grunn…"></textarea>
  <button id="ordersConfirmReject" class="orders-danger" type="submit">AVVIS BESTILLING</button>
 </form>
</div>
</body>
</html>
