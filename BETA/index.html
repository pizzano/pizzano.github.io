<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#24332a">
  <meta name="description" content="Bestill takeaway raskt og enkelt.">
  <title>Bestill takeaway — BETA</title>
  <link rel="stylesheet" href="./css/app.css?v=20261021-beta24">
</head>
<body>
  <div class="app-shell" id="appShell">
    <header class="app-header">
      <div class="header-left">
        <button id="backButton" class="header-icon back-icon" aria-label="Tilbake" hidden><span aria-hidden="true">‹</span></button>
        <span class="brand-emblem" id="brandLogo" aria-hidden="true">🍕</span>
        <button id="brandButton" class="brand-name" type="button">Din Restaurant</button>
      </div>
      <div class="header-actions">
        <button id="themeButton" class="header-icon" aria-label="Bytt tema" title="Lyst eller mørkt tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg></button>
        <button id="profileButton" class="header-icon" aria-label="Min profil" title="Profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/></svg></button>
        <button id="cartButton" class="header-icon" aria-label="Handlekurv" title="Handlekurv"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.1 11h11.1l2-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span id="cartBadge" class="count-badge" hidden>0</span></button>
      </div>
    </header>
    <section id="categorySection" class="category-area" aria-label="Kategorier">
      <div class="category-scroller" id="categoryScroller"></div>
      <div class="category-scroll-indicator" id="categoryIndicator" role="scrollbar" aria-label="Bla i kategorier" aria-controls="categoryScroller" aria-orientation="horizontal" tabindex="0"><span></span></div>
    </section>
    <main id="mainContent" class="main-content" tabindex="-1" aria-live="polite"></main>
    <footer id="bottomBar" class="bottom-bar" hidden></footer>
  </div>
  <div id="backdrop" class="backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Produktdetaljer" hidden></div>
  <div id="notice" class="notice" role="status" hidden></div>
  <script type="module" src="./js/app.js?v=20261021-beta24"></script>
</body>
</html>
