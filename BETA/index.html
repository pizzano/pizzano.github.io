<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#103d32">
  <title>KØL Grill & Pizza · Bestilling</title>
  <link rel="stylesheet" href="./style.css?v=20261110-cart-upsell43">
  <script src="./app.js?v=20261110-cart-autoscroll44" defer></script>
</head>
<body>
  <div class="app" id="appViewport">
    <header class="header">
      <a class="brand" href="./" aria-label="Til menyen"><span class="brand-icon">🔥</span><span id="brandName">KØL Grill & Pizza</span></a>
      <div class="header-actions"><button id="refresh" class="icon-button" title="Oppdater menyen fra serveren" aria-label="Oppdater menyen">↻</button><button id="cartOpen" class="icon-button cart-top" aria-label="Åpne handlekurv">🛒 <span id="cartCount" class="count" hidden>0</span></button></div>
    </header>
    <div class="category-wrap"><div class="category-bar"><button class="search-toggle" id="searchToggle" aria-label="Søk" aria-expanded="false"><svg viewBox="0 0 24 24" width="29" height="29" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.5 15.5 5 5"/></svg></button><nav id="categories" aria-label="Meny kategorier"></nav></div><div class="category-track"><button id="catPrev" aria-label="Forrige kategorier">‹</button><div class="track-window"><span id="catProgress"></span></div><button id="catNext" aria-label="Neste kategorier">›</button></div></div>
    <div class="search-area" id="searchArea" hidden><div class="search-field"><span class="search-icon" aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Søk etter mat eller ingredienser…" aria-label="Søk etter mat" autocomplete="off"><button id="searchClear" type="button" aria-label="Tøm søket" hidden>×</button></div></div>
    <main>
      <div class="status-banner" id="statusBanner"><div class="status-icon"><svg viewBox="0 0 24 24" width="31" height="31" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10h18l-2-6H5l-2 6Zm2 0v10h14V10M9 20v-6h6v6M3 10c1 2 3 2 4 0 1 2 3 2 5 0 1 2 3 2 5 0 1 2 3 2 4 0"/></svg></div><div class="status-copy"><strong id="statusTitle">Henter åpningstider…</strong><span id="statusSubtitle">Åpningstid hentes lokalt</span><span id="hoursPill" class="hours-pill" hidden></span></div><label class="allergen-switch"><span>Vis allergener</span><input type="checkbox" id="showAllergens" checked><i aria-hidden="true"></i></label></div><div id="cacheStatus" class="cache-line" aria-live="polite">Laster…</div>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="menu"></div>
    </main>
  </div>
  <div class="overlay" id="overlay" hidden></div>
  <section id="productSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-scroll"><div class="hero" id="sheetHero"><button id="sheetFavorite" class="sheet-favorite" type="button" aria-label="Legg til favoritter" aria-pressed="false">♡</button><button id="sheetClose" class="close" aria-label="Lukk">×</button><div class="hero-fallback">🍕</div></div><div class="sheet-intro"><h2 id="sheetTitle"></h2><p id="sheetDesc"></p></div><div id="options"></div><div id="sheetIngredients"></div><section class="detail-panel kitchen-panel product-section" id="sheetKitchenPanel"><div class="product-section-heading"><strong>Kommentar til kjøkkenet</strong><span class="product-section-flag">Valgfritt</span></div><div class="product-section-body"><p class="panel-caption">Raske beskjeder (valgfritt)</p><div id="quickNotes" class="quick-notes"></div><textarea id="comment" rows="2" maxlength="1000" placeholder="Egen kommentar (valgfritt)…"></textarea></div></section><section id="sheetAllergens" class="detail-panel allergens-panel product-section"><div class="product-section-heading"><strong>Allergener</strong></div><div id="allergenInfo" class="product-section-body"></div></section><p id="sheetOrderNotice" class="sheet-order-notice" hidden></p></div>
    <footer class="sheet-footer"><div class="qty"><button id="minus" aria-label="Reduser antall">−</button><b id="quantity">1</b><button id="plus" aria-label="Øk antall">+</button></div><button id="add" class="primary" type="button">Legg til <strong id="addPrice"></strong></button></footer>
  </section>
  <section id="cartSheet" class="sheet cart-sheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden>
    <header class="cart-topbar"><button id="cartClose" class="cart-back" type="button" aria-label="Tilbake til menyen">‹</button><button id="cartBrandHome" class="cart-brand" type="button" aria-label="Til menyen"><span aria-hidden="true">🔥</span> KØL Grill & Pizza</button><span class="cart-header-icon cart-header-bag" aria-label="Handlekurv">🛒 <b id="cartTopCount">0</b></span></header>
    <div class="cart-content-scroll" id="cartScroll">
      <nav class="cart-steps" aria-label="Bestillingssteg"><span class="is-current"><b>1</b> Kurv</span><span><b>2</b> Kontakt</span><span><b>3</b> Hentetid</span></nav>
      <div class="cart-header-line"><h2 id="cartTitle">Handlekurv</h2><button id="cartClear" class="cart-clear-btn" type="button" aria-label="Tøm handlekurv"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg><span>Tøm handlekurv</span></button></div>
      <div id="cartItems" class="cart-items"></div>
      <div class="cart-summary" id="cartSummary"><span>Totalt</span><strong id="cartTotal">0 kr</strong></div>
      <section id="cartRecommendations" class="cart-recommendations" aria-label="Anbefalt til handlekurven" hidden><div class="cart-recommendations-head"><strong>Vil du ha noe ved siden av?</strong><small>Passer til bestillingen din</small></div><details id="cartSuggestionsDisclosure" class="cart-suggestions-disclosure"><summary class="cart-suggestions-preview"><span id="cartSuggestionsThumbnails" class="cart-suggestions-thumbnails" aria-hidden="true"></span><span id="cartSuggestionsCount" class="cart-suggestions-count"></span><svg class="cart-suggestions-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></summary><div id="cartRecommendationsItems" class="cart-recommendations-items"></div></details></section>
    </div>
    <footer class="cart-footer"><div class="cart-buttons"><button id="continue" class="cart-outline" type="button">Fortsett å handle</button><button id="cartNext" class="primary" type="button" disabled title="Kontaktsteget er ikke tilgjengelig ennå">Neste: Kontakt</button></div></footer>
  </section>
</body>
</html>
