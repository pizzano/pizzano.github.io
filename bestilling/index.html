<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuell bestilling</title>
<style>
* { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: #edf3f0; color: #142b23; font: 16px system-ui,sans-serif }
main { width: min(100%, 42rem); height: 100dvh; margin: auto; padding: 8px; display: grid; grid-template-rows: auto minmax(0,1.45fr) auto minmax(0,1fr) auto; gap: 8px }
header, nav, footer, .cart-heading, li { display: flex; align-items: center; gap: 8px }
header, footer, .cart-heading { justify-content: space-between }
h1, h2, p { margin: 0 }
h1 { font-size: 20px }
h2 { font-size: 16px }
button { min-height: 44px; border: 1px solid #9aada2; border-radius: 8px; padding: 6px 12px; background: white; color: inherit; font: inherit; font-weight: 650; cursor: pointer }
button:disabled { opacity: .55; cursor: default }
.primary { background: #145039; border-color: #145039; color: white }
#ok, #print { flex: 1 }
#pad { display: block; width: 100%; height: 100%; min-height: 0; background: white; border: 1px solid #778e82; border-radius: 10px; touch-action: none; cursor: crosshair }
#cart { min-height: 0; overflow: hidden; display: flex; flex-direction: column; background: white; border: 1px solid #cfddd5; border-radius: 10px; padding: 7px 10px }
#cart button { min-height: 30px; padding: 3px 7px; font-size: 13px }
#visible-lines { min-height: 0; overflow: hidden }
ul { list-style: none; padding: 0; margin: 0 }
li { align-items: flex-start; padding: 5px; border-radius: 5px }
li > div { min-width: 0; flex: 1; overflow-wrap: anywhere }
li small { display: block; color: #325747 }
.latest { background: #d7f4e1 }
.help { font-size: 13px; color: #325747; overflow-wrap: anywhere }
#status { margin: 0 0 4px; flex: 0 0 auto; max-height: 3em; overflow: auto }
footer { padding-bottom: env(safe-area-inset-bottom) }
dialog { width: min(94vw, 38rem); max-height: 85dvh; border: 1px solid #778e82; border-radius: 12px; color: inherit }
dialog form { margin-top: 10px }
#sheet { display: none }
@media print {
 body { background: white; color: black }
 main { display: none }
 #sheet { display: block }
 #sheet li { break-inside: avoid }
}
</style>
</head>
<body>
<main>
<header><h1>Manuell bestilling</h1><button id="setup" type="button" aria-label="Tilkobling">Tilkobling</button></header>
<canvas id="pad" aria-label="Skriv bestillingen med penn eller finger"></canvas>
<nav aria-label="Håndskrift">
<button id="undo" type="button">Angre</button>
<button id="clear" type="button">Tøm feltet</button>
<button id="ok" class="primary" type="button">OK</button>
</nav>
<section id="cart">
<div class="cart-heading"><h2>Bestilling</h2><button id="all" type="button" hidden>Vis alle</button></div>
<p id="status" class="help" role="status">Skriv med penn eller finger.</p>
<ul id="visible-lines"></ul>
</section>
<footer><span id="count">0 stk</span><button id="print" class="primary" type="button" disabled>Skriv ut</button></footer>
</main>
<dialog id="order-dialog"><h2>Alle varer</h2><ul id="all-lines"></ul><form method="dialog"><button>Lukk</button></form></dialog>
<dialog id="setup-dialog"><h2>MyScript</h2><p id="connection" class="help"></p><p class="help">Forhåndsvis eksempelbestillinger uten MyScript.</p><button id="demo" type="button">Vis eksempelbestilling</button><form method="dialog"><button>Lukk</button></form></dialog>
<section id="sheet"><h2>Kjøkkenbestilling</h2><ul id="print-lines"></ul></section>
<script>
'use strict';
const byId = id => document.getElementById(id);
const pad = byId('pad');
const ctx = pad.getContext('2d');
const status = byId('status');
const strokes = [];
const cart = [];
const aliases = [
  [/^(?:k\.?\s*rull|kebab rull|kr)(?=$|[\s,.×+]|x\s*\d)/iu, 'Kebab Rull'],
  [/^(?:k\.?\s*tall|kebab tallerken)(?=$|[\s,.×+]|x\s*\d)/iu, 'Kebab Tallerken'],
  [/^(?:stor kebab\s*pizza|kebab\s*pizza\s*(?:st\.?|stor))(?=$|[\s,.×+]|x\s*\d)/iu, 'Stor Kebabpizza'],
  [/^kebab\s*pizza(?=$|[\s,.×+]|x\s*\d)/iu, 'Kebabpizza'],
  [/^(?:st\.?\s*pep|stor pepperoni)(?=$|[\s,.×+]|x\s*\d)/iu, 'Stor Pepperoni']
];
let activePointer = null;
let pending = false;
let editing = null;
let latest = null;
let demoCart = false;
let config = {};
try {
  const settings = new URLSearchParams(location.hash.slice(1));
  if (settings.has('endpoint') || settings.has('token')) {
    const url = new URL(settings.get('endpoint'));
    const token = settings.get('token');
    if (url.protocol !== 'https:' || url.username || url.password || !token) throw Error('Invalid connection');
    config = { endpoint: url.href, token };
    sessionStorage.setItem('bestilling-recognition', JSON.stringify(config));
  } else {
    config = JSON.parse(sessionStorage.getItem('bestilling-recognition') || '{}');
  }
} catch {
  status.textContent = 'Tilkoblingen kunne ikke lagres eller leses.';
} finally {
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
}

function parseOrder(text) {
  const clean = text.normalize('NFKC').replace(/\s+/g, ' ').trim();
  const prefix = clean.match(/^(\d{1,2})\s*[x×]\s*/iu);
  const productText = prefix ? clean.slice(prefix[0].length) : clean;
  const product = aliases.find(([pattern]) => pattern.test(productText));
  if (!product) return null;
  let tail = productText.replace(product[0], '').trim();
  const saucePattern = /^(medium(?:\s+(?:sos|saus))?|med\.?|sterk(?:\s+saus)?|acı|aci)(?=$|[\s,×]|x\s*\d)/iu;
  const sauce = tail.match(saucePattern);
  if (sauce) tail = tail.slice(sauce[0].length).trim();
  const suffix = tail.match(/^[x×]\s*(\d{1,2})(?!\d)(?=$|[\s,;+])/iu);
  if (prefix && suffix && Number(prefix[1]) !== Number(suffix[1])) return null;
  const quantity = Number(prefix?.[1] || suffix?.[1] || 1);
  if (quantity < 1) return null;
  if (suffix) tail = tail.slice(suffix[0].length).trim();
  if (tail && !/^(?:[,;+]|(?:\d{1,2}\s*[x×]\s*)?(?:uten\b|ingen\b|ekstra\b)|(?:soğansız|sogansiz)\b)/iu.test(tail)) return null;
  const notes = [];
  if (sauce) notes.push(/^med/iu.test(sauce[0]) ? 'Medium sos' : 'Sterk saus');
  for (const raw of tail.split(/[,;+]/u).map(value => value.trim()).filter(Boolean)) {
    const note = raw.match(/^(?:(\d{1,2})\s*[x×]\s*)?(uten\s+løk|soğansız|sogansiz)(?:\s*[x×]\s*(\d{1,2}))?$/iu);
    if (note) {
      if (note[1] && note[3] && Number(note[1]) !== Number(note[3])) return null;
      const count = Number(note[1] || note[3] || quantity);
      if (count < 1 || count > quantity) return null;
      if (notes.some(value => /uten løk$/u.test(value))) return null;
      notes.push((count < quantity ? count + ' ' : '') + 'uten løk');
    } else {
      if (/[x×]\s*\d|^\d|\b(?:rull|pizza|pepperoni|tallerken)\b/iu.test(raw)) return null;
      notes.push(raw.replace(/^ingen\s+/iu, 'uten '));
    }
  }
  return { name: product[1], quantity, notes };
}

function draw() {
  const width = pad.clientWidth;
  const height = pad.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  const pixelWidth = Math.round(width * ratio);
  const pixelHeight = Math.round(height * ratio);
  if (pad.width !== pixelWidth || pad.height !== pixelHeight) {
    pad.width = pixelWidth;
    pad.height = pixelHeight;
  }
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.strokeStyle = ctx.fillStyle = '#2058bc';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = ctx.lineCap = 'round';
  for (const stroke of strokes) {
    const [start, ...rest] = stroke;
    ctx.beginPath();
    if (!rest.length) {
      ctx.arc(start.x * width, start.y * height, 1.25, 0, 2 * Math.PI);
      ctx.fill();
      continue;
    }
    ctx.moveTo(start.x * width, start.y * height);
    for (const point of rest) ctx.lineTo(point.x * width, point.y * height);
    ctx.stroke();
  }
}

function point(event) {
  const rect = pad.getBoundingClientRect();
  const inside = value => Math.max(0, Math.min(1, value));
  return { x: inside((event.clientX - rect.left) / rect.width), y: inside((event.clientY - rect.top) / rect.height), t: Math.round(event.timeStamp) };
}

pad.addEventListener('pointerdown', event => {
  if (pending || activePointer !== null || !event.isPrimary || event.button !== 0) return;
  event.preventDefault();
  activePointer = event.pointerId;
  pad.setPointerCapture(event.pointerId);
  strokes.push([point(event)]);
  draw();
});
pad.addEventListener('pointermove', event => {
  if (event.pointerId !== activePointer) return;
  const events = event.getCoalescedEvents?.();
  for (const sample of events?.length ? events : [event]) strokes.at(-1).push(point(sample));
  draw();
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  pad.addEventListener(type, event => {
    if (event.pointerId !== activePointer) return;
    activePointer = null;
    if (type === 'pointercancel') strokes.pop();
    draw();
  });
}
new ResizeObserver(draw).observe(pad);
function clearInk() { strokes.length = 0; activePointer = null; draw(); }

function receiptItem(row, controls) {
  const item = document.createElement('li');
  const copy = document.createElement('div');
  const title = document.createElement('strong');
  title.textContent = row.quantity + '× ' + row.name;
  copy.append(title);
  if (row.notes.length) {
    const note = document.createElement('small');
    note.textContent = row.notes.join(' · ');
    copy.append(note);
  }
  item.append(copy);
  if (controls && !demoCart) {
    const edit = document.createElement('button');
    edit.textContent = 'Endre';
    edit.onclick = () => {
      if (pending) return;
      if (byId('order-dialog').open) byId('order-dialog').close();
      editing = row;
      clearInk();
      status.textContent = 'Skriv hele varelinjen på nytt og trykk OK.';
    };
    item.append(edit);
    if (controls === 'all') {
      const remove = document.createElement('button');
      remove.textContent = 'Fjern';
      remove.onclick = () => {
        if (pending) return;
        cart.splice(cart.indexOf(row), 1);
        if (editing === row) editing = null;
        render();
      };
      item.append(remove);
    }
  }
  if (controls === 'preview' && row === latest) item.className = 'latest';
  return item;
}

function render() {
  const ordered = [...cart].reverse();
  byId('visible-lines').replaceChildren(...ordered.slice(0, 2).map(row => receiptItem(row, 'preview')));
  byId('all-lines').replaceChildren(...ordered.map(row => receiptItem(row, 'all')));
  byId('print-lines').replaceChildren(...cart.map(row => receiptItem(row, null)));
  byId('all').hidden = cart.length === 0;
  byId('all').textContent = 'Vis alle (' + cart.length + ')';
  byId('count').textContent = cart.reduce((sum, row) => sum + row.quantity, 0) + ' stk';
  byId('print').disabled = pending || demoCart || cart.length === 0;
  byId('demo').disabled = pending || (cart.length > 0 && !demoCart);
  byId('demo').textContent = demoCart ? 'Fjern eksempler' : 'Vis eksempelbestilling';
}

byId('all').onclick = () => byId('order-dialog').showModal();
byId('setup').onclick = () => {
  byId('connection').textContent = config.endpoint
    ? 'Tilkobling lagret for denne fanen. Kun håndskriften sendes når du trykker OK.'
    : 'Åpne den private tilkoblingslenken for å aktivere MyScript.';
  byId('setup-dialog').showModal();
};
byId('demo').onclick = () => {
  if (pending || (cart.length && !demoCart)) return;
  if (demoCart) {
    cart.length = 0;
    latest = null;
    editing = null;
    demoCart = false;
    status.textContent = 'Skriv med penn eller finger.';
  } else {
    cart.push(parseOrder('K. rull med x 2, 1x uten løk'));
    cart.push(parseOrder('kebab pizza st, ingen salat + chips på toppen'));
    latest = cart.at(-1);
    demoCart = true;
    status.textContent = 'Eksempelbestilling. Ingen håndskrift er sendt.';
  }
  byId('setup-dialog').close();
  render();
};
byId('undo').onclick = () => { if (!pending && activePointer === null) { strokes.pop(); draw(); } };
byId('clear').onclick = () => {
  if (pending) return;
  editing = null;
  clearInk();
  status.textContent = 'Skriv med penn eller finger.';
};
byId('ok').onclick = async () => {
  if (pending || activePointer !== null) return;
  if (!strokes.length) {
    status.textContent = 'Skriv bestillingen i feltet først.';
    return;
  }
  if (demoCart) {
    status.textContent = 'Fjern eksemplene i Tilkobling før du legger til en vare.';
    return;
  }
  if (!config.endpoint) {
    status.textContent = 'MyScript må kobles til. Håndskriften er beholdt.';
    return;
  }
  pending = true;
  byId('ok').disabled = true;
  render();
  status.textContent = 'Leser håndskriften …';
  try {
    const width = pad.clientWidth;
    const height = pad.clientHeight;
    const t0 = strokes[0][0].t;
    const ink = strokes.map(stroke => ({
      x: stroke.map(p => Math.round(p.x * width)),
      y: stroke.map(p => Math.round(p.y * height)),
      t: stroke.map(p => p.t - t0)
    }));
    const response = await fetch(config.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + config.token },
      body: JSON.stringify({ strokes: ink }),
      signal: AbortSignal.timeout(15000)
    });
    if (response.status === 401) throw Error('AUTH');
    if (!response.ok) throw Error('UPSTREAM');
    const result = await response.json();
    const transcript = typeof result.text === 'string' ? result.text.trim().slice(0, 500) : '';
    const row = parseOrder(transcript);
    if (!row) {
      status.textContent = transcript
        ? 'Sjekk håndskriften. Lest: ' + transcript
        : 'Ingen tekst gjenkjent. Skriv litt tydeligere og prøv igjen.';
      return;
    }
    if (editing) cart.splice(cart.indexOf(editing), 1);
    cart.push(row);
    editing = null;
    latest = row;
    clearInk();
    status.textContent = 'Lagt til: ' + row.name + '.';
  } catch (error) {
    status.textContent = error.message === 'AUTH'
      ? 'Tilkoblingen ble avvist. Åpne den private tilkoblingslenken på nytt.'
      : 'Kunne ikke lese nå. Håndskriften er beholdt.';
  } finally {
    pending = false;
    byId('ok').disabled = false;
    render();
  }
};
byId('print').onclick = () => window.print();
render();
</script>
</body>
</html>
