<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a23">
<title>Manuell bestilling</title>
<style>
:root{color-scheme:light;--dark:#102a23;--green:#18563f;--line:#dce5df;--paper:#fff;--muted:#50665b}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;font:15px system-ui,sans-serif;background:var(--dark);color:#162922}
main{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding-bottom:env(safe-area-inset-bottom)}
header,footer,.tools,.dialog-head{display:flex;align-items:center;gap:6px}
header{background:#fff;padding:7px 10px;justify-content:space-between}
header strong{font-size:15px} header small{display:block;color:var(--muted);font-size:12px}
button{font:inherit;font-weight:650;min-height:44px;border:1px solid var(--line);border-radius:9px;padding:6px 11px;background:white;color:inherit;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.42;cursor:default} button:focus-visible{outline:2px solid #c39d50;outline-offset:2px}
.icon{display:grid;place-items:center;min-width:44px;padding:0}
svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;fill:none;pointer-events:none}
.notebook{position:relative;min-height:0;overflow:hidden}
#ink{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.tools{background:#183b30;color:white;padding:5px 7px;justify-content:space-between}
.tools .icon{color:white;background:#244b3c;border-color:#406354}
#page{font-size:12px;color:#e6f0e9;text-align:center;flex:1}
footer{padding:5px 7px;background:#f2f5f3}
#print{background:var(--green);border-color:var(--green);color:white;flex:1;display:flex;justify-content:center;align-items:center;gap:8px}
#new{color:#18563f}
#status{margin:0;background:#f7f9f7;color:#344e41;padding:6px 10px;font-size:13px;overflow-wrap:anywhere}
#status[data-kind=error]{color:#9b2929;background:#fff1ef}
#status[data-kind=ok]{color:#18563f;background:#e3f2e8}
dialog{width:min(96%,460px);max-height:90dvh;border:1px solid #cdd8d1;border-radius:12px;padding:12px;overflow:auto;color:#162922}
dialog::backdrop{background:#0008}.dialog-head{justify-content:space-between;position:sticky;top:-12px;background:white;padding:5px 0;z-index:1}
#preview-image{display:block;width:100%;height:auto;border:1px solid #ddd}
@media(min-width:700px){main{max-width:850px;margin:auto}}
</style>
</head>
<body>
<main>
<header><div><strong>Manuell bestilling</strong><small id="order-label"></small></div><button id="new" type="button">Ny bestilling</button></header>
<div class="notebook"><canvas id="ink" aria-label="Skriv bestillingen for hånd"></canvas></div>
<div class="tools">
<button id="undo" class="icon" type="button" title="Angre siste strek" aria-label="Angre siste strek"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5m-5-5h11a4 4 0 0 1 4 4v2"/></svg></button>
<button id="clear" class="icon" type="button" title="Tøm bestillingen" aria-label="Tøm bestillingen"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button>
<button id="up" class="icon" type="button" title="Bla opp" aria-label="Bla opp"><svg viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></svg></button>
<span id="page"></span>
<button id="down" class="icon" type="button" title="Fortsett nedover" aria-label="Fortsett nedover"><svg viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></svg></button>
</div>
<div>
<p id="status" role="status" aria-live="polite" hidden></p>
<footer><button id="preview" class="icon" type="button" title="Forhåndsvisning" aria-label="Forhåndsvisning"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="print" type="button"><svg viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6zM17 12h1"/></svg><span id="print-label">Skriv ut</span></button></footer>
</div>
</main>
<dialog id="preview-dialog"><div class="dialog-head"><strong>Forhåndsvisning · 80 mm</strong><form method="dialog"><button type="submit">Lukk</button></form></div><img id="preview-image" alt="Forhåndsvisning av kjøkkenlappen"></dialog>
<script>
'use strict';
const byId=id=>document.getElementById(id);
const ink=byId('ink'), pen=ink.getContext('2d');
const WIDTH=560, MAX_Y=18000, GRID=40;
const DRAFT_KEY='bestilling-raw-ink-v1';
const EPSON_DEFAULT={host:'192.168.1.25',scheme:'https',deviceId:'local_printer'};
const EPOS_NS='http://www.epson-pos.com/schemas/2011/03/epos-print';
const RASTER_WIDTH=576;
const formatTime=t=>new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(t));
const formatDate=t=>new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date(t));
function newDraft(){
  const now=Date.now(), date=formatDate(now).replace(/\D/g,'');
  let seq=1;
  try{const key='bestilling-raw-seq-'+date;seq=Number(localStorage.getItem(key)||0)+1;localStorage.setItem(key,String(seq));}catch{}
  return {id:String(seq).padStart(3,'0')+'-'+Math.random().toString(36).slice(2,5).toUpperCase(),created:now,paths:[],printed:false,uncertain:false};
}
function loadDraft(){
  try{
    const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');
    if(d&&typeof d.id==='string'&&Number.isFinite(d.created)&&Array.isArray(d.paths)&&d.paths.every(p=>Array.isArray(p)&&p.length&&p.every(v=>Number.isFinite(v.x)&&Number.isFinite(v.y)&&v.x>=0&&v.x<=WIDTH&&v.y>=0&&v.y<=MAX_Y)))return d;
  }catch{}
  return newDraft();
}
let draft=loadDraft(), pageTop=0, pointer=null, printing=false;
let viewHeight=1, scale=1, storageOK=true;
function persist(){
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));storageOK=true;}
  catch{storageOK=false;}
}
function status(message='',kind=''){
  const el=byId('status');el.textContent=message;el.hidden=!message;el.dataset.kind=kind;
}
function bounds(paths){
  let left=Infinity, right=-Infinity, top=Infinity, bottom=-Infinity;
  for(const path of paths)for(const p of path){left=Math.min(left,p.x);right=Math.max(right,p.x);top=Math.min(top,p.y);bottom=Math.max(bottom,p.y);}
  return {left,right,top,bottom};
}
function trace(ctx,paths,width=3.5){
  ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';
  for(const path of paths){
    const first=path[0];if(!first)continue;
    ctx.beginPath();
    if(path.length===1){ctx.arc(first.x,first.y,width/2,0,Math.PI*2);ctx.fill();continue;}
    ctx.moveTo(first.x,first.y);
    for(let i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);
    ctx.stroke();
  }
}
function redraw(){
  const w=ink.clientWidth,h=ink.clientHeight;if(!w||!h)return;
  const dpr=Math.min(window.devicePixelRatio||1,3);
  scale=w/WIDTH;viewHeight=h/scale;
  if(ink.width!==Math.round(w*dpr))ink.width=Math.round(w*dpr);
  if(ink.height!==Math.round(h*dpr))ink.height=Math.round(h*dpr);
  pen.setTransform(dpr*scale,0,0,dpr*scale,0,-pageTop*dpr*scale);
  pen.fillStyle='#102a23';pen.fillRect(0,pageTop,WIDTH,viewHeight);
  pen.strokeStyle='#365348';pen.lineWidth=1;
  for(let y=Math.ceil(pageTop/GRID)*GRID;y<pageTop+viewHeight;y+=GRID){pen.beginPath();pen.moveTo(0,y);pen.lineTo(WIDTH,y);pen.stroke();}
  pen.strokeStyle=pen.fillStyle='#f5faf6';trace(pen,draft.paths);
  controls();
}
function controls(){
  const busy=printing||pointer!==null, has=draft.paths.length>0;
  for(const id of ['new','clear','undo','up','down','preview','print'])byId(id).disabled=busy;
  byId('clear').disabled=busy||!has||draft.printed||draft.uncertain;
  byId('undo').disabled=busy||!has||draft.printed||draft.uncertain;
  byId('preview').disabled=busy||!has;
  byId('print').disabled=busy||!has;
  byId('up').disabled=busy||pageTop===0;
  byId('down').disabled=busy||!has||pageTop+viewHeight>=MAX_Y;
  byId('new').disabled=busy;
  byId('page').textContent='Linje '+(Math.floor(pageTop/GRID)+1)+' – '+Math.max(1,Math.floor((pageTop+viewHeight)/GRID));
  byId('order-label').textContent='#'+draft.id+' · '+formatTime(draft.created)+(draft.printed?' · Utskrevet':draft.uncertain?' · Ikke bekreftet':'');
  byId('print-label').textContent=printing?'Skriver ut…':draft.printed?'Skriv ut kopi':draft.uncertain?'Prøv igjen':'Skriv ut';
}
function point(e){
  const r=ink.getBoundingClientRect(),clamp=(v,min,max)=>Math.min(max,Math.max(min,v));
  return {x:clamp((e.clientX-r.left)/scale,0,WIDTH),y:clamp((e.clientY-r.top)/scale+pageTop,0,MAX_Y)};
}
ink.addEventListener('pointerdown',e=>{
  if(printing||pointer!==null||!e.isPrimary||e.button!==0)return;
  if(draft.printed||draft.uncertain){status('Velg Ny bestilling for å skrive en ny ordre.');return;}
  e.preventDefault();pointer=e.pointerId;ink.setPointerCapture(pointer);
  draft.paths.push([point(e)]);status();redraw();
});
ink.addEventListener('pointermove',e=>{
  if(e.pointerId!==pointer)return;
  const samples=e.getCoalescedEvents?.();
  for(const sample of samples?.length?samples:[e])draft.paths.at(-1).push(point(sample));
  redraw();
});
function finish(e){
  if(e.pointerId!==pointer)return;
  if(e.type==='pointerup')draft.paths.at(-1).push(point(e));
  pointer=null;persist();redraw();
  if(!storageOK)status('Kunne ikke lagre lokalt. Ikke lukk siden før utskrift.','error');
}
for(const type of ['pointerup','pointercancel','lostpointercapture'])ink.addEventListener(type,finish);
byId('undo').onclick=()=>{if(printing||draft.printed||draft.uncertain)return;draft.paths.pop();if(!draft.paths.length)pageTop=0;persist();redraw();};
byId('clear').onclick=()=>{if(!draft.printed&&!draft.uncertain&&confirm('Tømme hele bestillingen?')){draft.paths=[];pageTop=0;persist();status();redraw();}};
byId('new').onclick=()=>{
  if(draft.paths.length&&!draft.printed&&!confirm(draft.uncertain?'Utskriften er ikke bekreftet. Starte ny bestilling likevel?':'Bestillingen er ikke skrevet ut. Starte på nytt?'))return;
  draft=newDraft();pageTop=0;persist();status();redraw();
};
const pageStep=()=>Math.max(GRID,Math.floor(viewHeight*.72/GRID)*GRID);
byId('up').onclick=()=>{pageTop=Math.max(0,pageTop-pageStep());redraw();};
byId('down').onclick=()=>{pageTop=Math.max(0,Math.min(pageTop+pageStep(),MAX_Y-viewHeight));redraw();};
new ResizeObserver(redraw).observe(ink);
function renderManualReceipt(source,copy=false){
  if(!source.paths.length)throw Error('Skriv bestillingen først.');
  const b=bounds(source.paths), top=Math.max(0,b.top-12), bottom=Math.min(MAX_Y+12,b.bottom+12);
  const inkHeight=Math.ceil(bottom-top), bodyHeight=Math.max(56,inkHeight);
  const header=166, footer=43, contentEnd=header+bodyHeight;
  const canvas=document.createElement('canvas');canvas.width=RASTER_WIDTH;canvas.height=contentEnd+footer;
  if(canvas.height>19000)throw Error('Bestillingen er for lang.');
  const c=canvas.getContext('2d',{willReadFrequently:true});if(!c)throw Error('Kunne ikke lage utskriften.');
  c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);
  c.fillStyle=c.strokeStyle='#000';c.textBaseline='top';c.lineWidth=2;
  const font=(size,bold=false)=>{c.font=(bold?'700 ':'400 ')+size+'px Arial,sans-serif';};
  const center=(s,y,size,bold=false)=>{font(size,bold);c.textAlign='center';c.fillText(s,288,y,550);c.textAlign='left';};
  center(copy?'KOPI · KJØKKEN':'KJØKKENBESTILLING',8,43,true);
  font(31,true);c.fillText('#'+source.id,10,65,270);c.textAlign='right';c.fillText(formatTime(source.created),566,65,220);c.textAlign='left';
  center(formatDate(source.created)+' · Manuell bestilling',106,25);
  c.fillRect(7,139,562,27);c.fillStyle='#fff';font(19,true);c.fillText('BESTILLING',15,142);c.fillStyle='#000';
  c.save();c.beginPath();c.rect(7,header,562,bodyHeight);c.clip();c.translate(8,header-top);trace(c,source.paths,4.2);c.restore();
  c.strokeRect(7,header,562,bodyHeight);
  font(22,true);c.fillText('Kjøkken',10,contentEnd+10);
  font(22);c.textAlign='right';c.fillText('Kontrollert',531,contentEnd+10);c.textAlign='left';c.strokeRect(539,contentEnd+10,23,23);
  return canvas;
}
byId('preview').onclick=()=>{
  try{byId('preview-image').src=renderManualReceipt(draft,draft.printed||draft.uncertain).toDataURL('image/png');byId('preview-dialog').showModal();}
  catch(e){status(e.message,'error');}
};
function packed1BitRaster(canvas) {
  const width = canvas.width;
  const rowBytes = width / 8;
  if (!Number.isInteger(rowBytes)) throw new Error('Bitmap-bredden må deles på åtte.');
  const context = canvas.getContext('2d', { willReadFrequently: true });
  const chunkHeight = 320; // Keep each ePOS image chunk reasonably small.
  const images = [];

  for (let top = 0; top < canvas.height; top += chunkHeight) {
    const height = Math.min(chunkHeight, canvas.height - top);
    const rgba = context.getImageData(0, top, width, height).data;
    const bytes = new Uint8Array(rowBytes * height);
    for (let yy = 0; yy < height; yy++) {
      const row = yy * width;
      const packedRow = yy * rowBytes;
      for (let xx = 0; xx < width; xx++) {
        const i = (row + xx) * 4;
        const luminance = (rgba[i] * 299 + rgba[i + 1] * 587 + rgba[i + 2] * 114) / 1000;
        // Black = 1, white = 0. Anti-aliasing is thresholded for thermal printing.
        if (rgba[i + 3] > 128 && luminance < 170) {
          bytes[packedRow + (xx >> 3)] |= 0x80 >> (xx & 7);
        }
      }
    }
    // ePOS-Print XML <image> requires base64 of packed raster bytes,
    // not base64 of a PNG/JPEG file.
    let binary = '';
    for (let i = 0; i < bytes.length; i += 8192) {
      binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
    }
    images.push('<image width="' + width + '" height="' + height +
      '" color="color_1" mode="mono" align="center">' + btoa(binary) + '</image>');
  }
  return images.join('') + '<feed line="3"/><cut type="feed"/>';
}

function printerSettings() {
  let host = EPSON_DEFAULT.host;
  let scheme = EPSON_DEFAULT.scheme;
  let deviceId = EPSON_DEFAULT.deviceId;
  // Reuse values set on the independent demo printer test page when available.
  try {
    host = localStorage.getItem('kol_test_printer_ip') || host;
    scheme = localStorage.getItem('kol_test_printer_scheme') || scheme;
    deviceId = localStorage.getItem('kol_test_printer_device') || deviceId;
  } catch {}
  if (!/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host) || host.split('.').some(part => Number(part) > 255)) {
    throw new Error('Ugyldig IP-adresse for kvitteringsskriver.');
  }
  if (!['http', 'https'].includes(scheme) || !/^[\w-]{1,48}$/.test(deviceId)) {
    throw new Error('Ugyldige skriverinnstillinger.');
  }
  return { host, scheme, deviceId };
}

async function printManualTicket(canvas) {
  const config = printerSettings();
  const endpoint = config.scheme + '://' + config.host +
    '/cgi-bin/epos/service.cgi?devid=' + encodeURIComponent(config.deviceId) + '&timeout=10000';
  const content = packed1BitRaster(canvas);
  // Epson TM-T20II ePOS-Print 5.0: send SOAP directly to the configured printer.
  const body = '<?xml version="1.0" encoding="UTF-8"?>' +
    '<s:Envelope xmlns:s="http://schemas.xmlsoap.org/soap/envelope/"><s:Body>' +
    '<epos-print xmlns="' + EPOS_NS + '">' + content +
    '</epos-print></s:Body></s:Envelope>';

  const controller = new AbortController();
  const timer = window.setTimeout(() => controller.abort(), 15000);
  let response;
  try {
    response = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/xml; charset=utf-8', SOAPAction: '""' },
      body,
      cache: 'no-store',
      signal: controller.signal
    });
    if (!response.ok) throw new Error('HTTP ' + response.status + ' fra Epson.');
    const returned = await response.text();
    const documentXml = new DOMParser().parseFromString(returned, 'text/xml');
    if (documentXml.querySelector('parsererror')) throw new Error('Ugyldig svar fra Epson.');
    const responses = documentXml.getElementsByTagNameNS(EPOS_NS, 'response');
    const node = responses[0] || documentXml.getElementsByTagName('response')[0];
    if (!node) throw new Error('Ingen ePOS-bekreftelse fra skriveren.');
    if (!['true', '1'].includes(String(node.getAttribute('success')))) {
      throw new Error('Epson-feil: ' + (node.getAttribute('code') || 'Ukjent skriverfeil'));
    }
    return true;
  } catch (error) {
    if (error.name === 'AbortError') throw new Error('Tidsavbrudd: Sjekk om lappen ble skrevet ut før du prøver igjen.');
    if (error instanceof TypeError) throw new Error('Utskrift ikke bekreftet. Sjekk Epson, samme Wi-Fi, IP og HTTPS før du prøver igjen.');
    throw error;
  } finally {
    clearTimeout(timer);
  }
}





byId('print').onclick=async()=>{
  if(printing||pointer!==null||!draft.paths.length)return;
  const copy=!!(draft.printed||draft.uncertain);
  if(copy&&!confirm(draft.uncertain?'Sjekk om første utskrift kom. Skrive ut en merket kopi?':'Skrive ut en kopi av bestillingen?'))return;
  let canvas;
  try{canvas=renderManualReceipt(draft,copy);}
  catch(e){status(e.message,'error');return;}
  printing=true;
  // Persist uncertain state before transmitting: reload cannot silently resend.
  if(!draft.printed)draft.uncertain=true;
  persist();controls();status('Sender til Epson…');
  try{
    await printManualTicket(canvas);
    draft.printed=true;draft.uncertain=false;persist();
    status('Utskrift bekreftet av Epson. Velg Ny bestilling.','ok');
  }catch(e){
    persist();status((e.message||'Utskrift ikke bekreftet.')+' Bestillingen er beholdt.','error');
  }finally{printing=false;controls();}
};
persist();redraw();
if(draft.uncertain)status('Forrige utskrift ble ikke bekreftet. Kontroller skriveren før du prøver igjen.','error');
</script>
</body>
</html>
