<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuell bestilling</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#edf3f0;color:#142b23;font:16px system-ui,sans-serif}
main{max-width:42rem;margin:auto;height:100dvh;display:grid;grid-template-rows:auto minmax(0,1.7fr) auto minmax(0,1fr) auto;gap:6px;padding:8px}
h1,h2,p{margin:0}h1{font-size:20px}h2{font-size:16px}
textarea{width:100%;height:100%;min-height:0;resize:none;border:1px solid #879d91;border-radius:10px;padding:12px;background:white;color:inherit;font:20px system-ui,sans-serif}
nav,footer,.heading,li{display:flex;align-items:center;gap:6px}
.heading{justify-content:space-between}
button{min-height:44px;padding:6px 12px;border:1px solid #879d91;border-radius:8px;background:white;color:inherit;font:inherit;font-weight:650;cursor:pointer}
button:disabled{opacity:.55}
.primary{background:#145039;border-color:#145039;color:white;flex:1}
#cart{min-height:0;overflow:hidden;padding:6px 8px;border:1px solid #c8d7ce;border-radius:9px;background:white}
#status,#suggestion{font-size:13px;margin:3px 0;overflow-wrap:anywhere}
#suggestion{color:#245841;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{color:#744117}
ul{list-style:none;padding:0;margin:0}
li{padding:4px;overflow-wrap:anywhere}
li>div{flex:1;min-width:0}
li small{display:block}
#latest li{background:#d7f4e1;border-radius:7px}
.icon{font-size:20px;min-width:44px;padding:2px}
.remove{color:#8c2525}
#all{font-size:13px;min-height:32px;padding:3px 6px}
dialog{width:min(94vw,38rem);max-height:82dvh;border:1px solid #879d91;border-radius:10px}
footer{padding-bottom:env(safe-area-inset-bottom)}
#sheet{display:none}
@media print{main,dialog{display:none!important}body{color:black;background:white}#sheet{display:block}#sheet li{break-inside:avoid}}
</style>
</head>
<body>
<main>
<h1><label for="order">Manuell bestilling</label></h1>
<textarea id="order" inputmode="none" autocomplete="off" spellcheck="false" placeholder="Skriv med S Pen: k rull med x 2, 1x -løk"></textarea>
<nav><button id="clear" type="button">Tøm felt</button><button id="ok" class="primary" type="button">OK</button></nav>
<section id="cart">
<div class="heading"><h2>Bestilling</h2><button id="all" type="button" hidden>Vis alle</button></div>
<p id="suggestion" aria-live="polite" hidden></p>
<p id="status" role="status" hidden></p>
<ul id="latest"></ul>
</section>
<footer><span id="total">0 stk</span><button id="print" class="primary" type="button" disabled>Skriv ut</button></footer>
</main>
<dialog id="basket"><h2>Alle varer</h2><ul id="basket-lines"></ul><form method="dialog"><button>Lukk</button></form></dialog>
<section id="sheet"><h2>Kjøkkenbestilling</h2><ul id="print-lines"></ul></section>
<script>
'use strict';
const catalog = {"products": [{"id": "gf_item_17777927", "name": "1. Classico", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17777930", "name": "2. Capri", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17777931", "name": "3. Al Capone", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782816", "name": "4. Parma", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782817", "name": "5. Sjefens favoritt", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782818", "name": "6. Torino", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782819", "name": "7. Mexican Style", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782820", "name": "8. Kebabpizza", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782821", "name": "9. Kyllingpizza", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782822", "name": "10. Alfredo", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782823", "name": "11. Calzone (innbakt pizza)", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782824", "name": "12. Ciao Ciao", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782825", "name": "13. Pollo Marina", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17782826", "name": "14. Bianca", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_19838139", "name": "15. Fantasia", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_19838148", "name": "16. Diavola", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_18111705", "name": "17. Lag din egen pizza", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17785864", "name": "Hvitløksdressing", "sizes": ["Standard"]}, {"id": "gf_item_17785865", "name": "Béarnaisesaus", "sizes": ["Standard"]}, {"id": "gf_item_17788540", "name": "Kebab i pita", "sizes": ["Standard"]}, {"id": "gf_item_17788543", "name": "Kyllingkebab i pita", "sizes": ["Standard"]}, {"id": "gf_item_17788668", "name": "Kebabrull", "sizes": ["Standard"]}, {"id": "gf_item_17788669", "name": "Kyllingkebabrull", "sizes": ["Standard"]}, {"id": "gf_item_17788670", "name": "Kebabtallerken", "sizes": ["Standard"]}, {"id": "gf_item_17788673", "name": "Kyllingkebabtallerken", "sizes": ["Standard"]}, {"id": "gf_item_19766893", "name": "Dobbel burger", "sizes": ["200gr + 200gr"]}, {"id": "gf_item_18046629", "name": "Hamburger Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17783145", "name": "Cheeseburger Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17786621", "name": "BBQ Bacon Cheese Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17786623", "name": "BlåmuggostBurger Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17786627", "name": "Nachosburger Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17786630", "name": "Parmaburger Tallerken", "sizes": ["Standard"]}, {"id": "gf_item_17996124", "name": "Pommes frites", "sizes": ["Standard"]}, {"id": "gf_item_17786657", "name": "Søtpotetfries", "sizes": ["Standard"]}, {"id": "gf_item_17786658", "name": "Mozzarellasticks (5 stk.)", "sizes": ["Standard"]}, {"id": "gf_item_17786659", "name": "Løkringer (6 stk.)", "sizes": ["Standard"]}, {"id": "gf_item_17787022", "name": "Biffsnadder", "sizes": ["Standard"]}, {"id": "gf_item_24764648", "name": "Kyllingsnadder", "sizes": ["Standard"]}, {"id": "gf_item_19838227", "name": "Hvitløksnadder", "sizes": ["Standard"]}, {"id": "gf_item_19838277", "name": "Fish and chips", "sizes": ["Standard"]}, {"id": "gf_item_19838316", "name": "Løvstek", "sizes": ["Standard"]}, {"id": "gf_item_19838323", "name": "Kyllingsalat", "sizes": ["Standard"]}, {"id": "gf_item_19838325", "name": "Skinkesalat", "sizes": ["Standard"]}, {"id": "gf_item_17820969", "name": "Vegetarburger", "sizes": ["Standard"]}, {"id": "gf_item_17820970", "name": "Vegetarpizza", "sizes": ["Medium", "Stor"]}, {"id": "gf_item_17994559", "name": "Pommes frites", "sizes": ["Standard"]}, {"id": "gf_item_17816461", "name": "Søtpotetfries", "sizes": ["Standard"]}, {"id": "gf_item_17816463", "name": "Mozzarellasticks (5 stk.)", "sizes": ["Standard"]}, {"id": "gf_item_17816465", "name": "Løkringer (6 stk.)", "sizes": ["Standard"]}, {"id": "gf_item_17820962", "name": "Barneburger", "sizes": ["Standard"]}, {"id": "gf_item_17820963", "name": "Barnepizza", "sizes": ["Standard"]}, {"id": "gf_item_17994561", "name": "Pommes frites", "sizes": ["Standard"]}, {"id": "gf_item_19838407", "name": "Kyllingnuggets (5 stk.)", "sizes": ["Standard"]}, {"id": "gf_item_17786784", "name": "Mineralvann 0,5 l", "sizes": ["Standard"]}, {"id": "gf_item_17786787", "name": "Mineralvann 1,5 l", "sizes": ["Standard"]}], "sizes": ["Medium", "Stor", "Standard", "200gr + 200gr"], "extras": ["Biffkjøtt", "Kyllingkjøtt", "Kebabkjøtt", "Bacon", "Skinke", "Pepperoni", "Parmaskinke", "Jalapeño", "Paprika", "Sopp", "Løk", "Mais", "Ekstra ost", "Chips på toppen"], "sauces": ["Hvitløkssaus", "Béarnaisesaus"]};
const byId = id => document.getElementById(id);
const order = byId('order');
const cart = [];
let editing = null;
let composing = false;
const normalize = value => value.normalize('NFKC').trim().toLocaleLowerCase('nb').replace(/\s+/g,' ');
const nameOf = product => product.name.replace(/^\d+\.\s*/u,'');
const shortcuts = [
  [/^(?:k\.?\s*rull|kr)(?=$|[\s,+−-]|[x×]\s*\d)/u,'Kebabrull'],
  [/^k\.?\s*tall\b/u,'Kebabtallerken'],
  [/^kylling\s*(?:k\.?\s*)?rull\b/u,'Kyllingkebabrull'],
  [/^kebab\s*pizza\b/u,'Kebabpizza']
];
const products = [...catalog.products].sort((a,b) => nameOf(b).length-nameOf(a).length);

function matchProduct(text) {
  for (const [pattern,name] of shortcuts) {
    const match = text.match(pattern);
    const product = products.find(item => normalize(nameOf(item))===normalize(name));
    if (match && product) return {product, tail:text.slice(match[0].length).trim()};
  }
  for (const product of products) {
    for (const key of new Set([normalize(product.name),normalize(nameOf(product))])) {
      if (!text.startsWith(key) || !/^(?:$|[\s,+−-]|[x×]\s*\d)/u.test(text.slice(key.length))) continue;
      return {product, tail:text.slice(key.length).trim()};
    }
  }
  return null;
}

function parseLine(source) {
  let text = normalize(source);
  const firstCount = text.match(/^(\d{1,2})\s*[x×]\s*/u);
  if (firstCount) text = text.slice(firstCount[0].length);
  const firstSize = text.match(/^(stor|medium)\s+/u);
  const match = matchProduct(firstSize ? text.slice(firstSize[0].length) : text);
  if (!match) return null;
  const {product} = match;
  let tail = match.tail;
  let size = firstSize?.[1] || '';
  const lastSize = tail.match(/^(st\.?|stor|medium(?!\s+(?:sos|saus)\b))(?=$|[\s,+−-]|[x×]\s*\d)/u);
  if (lastSize) {
    const value = lastSize[1].startsWith('st') ? 'stor' : 'medium';
    if (size && size !== value) return null;
    size = value;
    tail = tail.slice(lastSize[0].length).trim();
  }
  const menuSize = product.sizes.find(option => normalize(option) === size);
  if (size && !menuSize) return null;
  const notes = [];
  const sauce = tail.match(/^(med(?:ium(?:\s+(?:sos|saus))?)?|sterk(?:\s+saus)?|mild(?:\s+saus)?)(?=$|[\s,+−-]|[x×]\s*\d)/u);
  if (sauce) {
    notes.push(sauce[1].startsWith('med') ? 'Medium sos' : sauce[1].startsWith('sterk') ? 'Sterk saus' : 'Mild saus');
    tail = tail.slice(sauce[0].length).trim();
  }
  const lastCount = tail.match(/^[x×]\s*(\d{1,2})(?=$|[\s,+−-])/u);
  if (firstCount && lastCount && Number(firstCount[1]) !== Number(lastCount[1])) return null;
  const quantity = Number(firstCount?.[1] || lastCount?.[1] || 1);
  if (quantity < 1) return null;
  if (lastCount) tail = tail.slice(lastCount[0].length).trim();
  if (tail && !/^(?:[,;+−-]|\d{1,2}\s*[x×]|uten\b|ingen\b|ekstra\b)/u.test(tail)) return null;
  const pieces = tail.split(/[,;]|\s+(?=\+\s*(?:løk|chips|pommes)\b)/u).map(note=>note.trim()).filter(Boolean);
  const onion = new Map();
  for (const piece of pieces) {
    const m = piece.match(/^(?:(\d{1,2})\s*[x×]\s*)?([+−-]\s*løk|(?:ingen|uten|ekstra)\s+løk)(?:\s*[x×]\s*(\d{1,2}))?$/u);
    if (m) {
      if (m[1] && m[3] && Number(m[1])!==Number(m[3])) return null;
      const count = Number(m[1] || m[3] || quantity);
      const extra = m[2].startsWith('+') || m[2].startsWith('ekstra');
      if (!count || count > quantity || onion.has(extra) || count+(onion.get(!extra)||0)>quantity) return null;
      onion.set(extra,count);
      notes.push((count < quantity ? count + ' ' : '') + (extra ? 'Ekstra løk' : 'Uten løk'));
    } else {
      if (/\d\s*[x×]|[x×]\s*\d|^[−-]\s*$|^\+\s*$/u.test(piece)) return null;
      const note = piece.replace(/^\+\s*/u,'').replace(/^ingen\s+/u,'uten ');
      notes.push(note.replace(/^chips på toppen$/u,'pommes frites på toppen'));
    }
  }
  return { source, quantity, name: [menuSize,nameOf(product)].filter(Boolean).join(' '), notes };
}

function displaySuggestion() {
  const text = order.value.trim();
  const candidate = text && !text.includes('\n') ? parseLine(text) : null;
  const suggestion = byId('suggestion');
  suggestion.hidden = !candidate;
  suggestion.textContent = candidate ? 'Forslag: ' + candidate.quantity + '× ' + candidate.name + (candidate.notes.length ? ' · ' + candidate.notes.join(' · ') : '') : '';
  byId('status').hidden = true;
}
function showStatus(message) {
  const status = byId('status');
  status.textContent = message;
  status.hidden = !message;
}
order.addEventListener('compositionstart', () => { composing = true; });
order.addEventListener('compositionend', () => { composing = false; displaySuggestion(); });
order.addEventListener('input', displaySuggestion);

function resetEditor() {
  editing = null;
  order.value = '';
  byId('ok').textContent = 'OK';
  displaySuggestion();
}
byId('clear').onclick = resetEditor;
byId('ok').onclick = () => {
  if (composing) { showStatus('Vent til håndskriften er lest.'); return; }
  const lines = order.value.split(/\r?\n/u).map(line=>line.trim()).filter(Boolean);
  if (!lines.length) { showStatus('Skriv bestillingen med S Pen først.'); return; }
  if (editing && lines.length !== 1) { showStatus('Skriv én varelinje når du redigerer.'); return; }
  const rows = lines.map(parseLine);
  const unknown = rows.indexOf(null);
  if (unknown >= 0) { showStatus('Kontroller linje ' + (unknown+1) + ': ' + lines[unknown]); return; }
  if (editing) cart.splice(cart.indexOf(editing),1,rows[0]);
  else cart.push(...rows);
  latest = rows.at(-1);
  resetEditor();
  render();
};

let latest = null;
function makeItem(row, actionable) {
  const li = document.createElement('li');
  const content = document.createElement('div');
  const title = document.createElement('strong');
  title.textContent = row.quantity + '× ' + row.name;
  content.append(title);
  if (row.notes.length) {
    const notes = document.createElement('small');
    notes.textContent = row.notes.join(' · ');
    content.append(notes);
  }
  li.append(content);
  if (!actionable) return li;
  for (const [icon,label,css,action] of [
    ['✎','Endre','',() => {
      if (byId('basket').open) byId('basket').close();
      editing = row;
      order.value = row.source;
      byId('ok').textContent = 'Lagre';
      displaySuggestion();
      order.focus({preventScroll:true});
    }],
    ['×','Fjern','remove',() => {
      cart.splice(cart.indexOf(row),1);
      if (editing === row) resetEditor();
      if (latest === row) latest = cart.at(-1) || null;
      render();
    }]
  ]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon ' + css;
    button.textContent = icon;
    button.setAttribute('aria-label',label+' '+row.name);
    button.onclick = action;
    li.append(button);
  }
  return li;
}
function render() {
  byId('latest').replaceChildren(...(latest ? [makeItem(latest,true)] : []));
  byId('basket-lines').replaceChildren(...[...cart].reverse().map(row=>makeItem(row,true)));
  byId('print-lines').replaceChildren(...cart.map(row=>makeItem(row,false)));
  byId('all').hidden = !cart.length;
  byId('all').textContent = 'Vis alle (' + cart.length + ')';
  byId('total').textContent = cart.reduce((sum,row)=>sum+row.quantity,0) + ' stk';
  byId('print').disabled = !cart.length;
}
byId('all').onclick = () => byId('basket').showModal();
byId('print').onclick = () => window.print();
render();
</script>
</body>
</html>
