<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuell bestilling</title>
<style>
* { box-sizing: border-box }
body { margin: 0; background: #edf3f0; color: #142b23; font: 16px system-ui,sans-serif }
main { max-width: 42rem; height: 100dvh; margin: auto; padding: 8px; display: grid; grid-template-rows: auto minmax(0,1fr) auto; gap: 8px }
h1 { margin: 0; font-size: 20px }
#pad { display: block; width: 100%; height: 100%; background: white; border: 1px solid #778e82; border-radius: 10px; touch-action: none; cursor: crosshair }
nav { display: flex; gap: 8px; padding-bottom: env(safe-area-inset-bottom) }
button { min-height: 44px; border: 1px solid #9aada2; border-radius: 8px; padding: 6px 12px; background: white; color: inherit; font: inherit; font-weight: 650; cursor: pointer }
</style>
</head>
<body>
<main>
<h1>Manuell bestilling</h1>
<canvas id="pad" aria-label="Skriv bestillingen med penn eller finger"></canvas>
<nav aria-label="Håndskrift">
<button id="undo" type="button">Angre</button>
<button id="clear" type="button">Tøm feltet</button>
</nav>
</main>
<script>
'use strict';
const pad = document.getElementById('pad');
const ctx = pad.getContext('2d');
const strokes = [];
let activePointer = null;

function draw() {
  const width = pad.clientWidth;
  const height = pad.clientHeight;
  const ratio = window.devicePixelRatio || 1;
  const pixelWidth = Math.round(width * ratio);
  const pixelHeight = Math.round(height * ratio);
  if (pad.width !== pixelWidth || pad.height !== pixelHeight) {
    pad.width = pixelWidth;
    pad.height = pixelHeight;
  }
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  ctx.strokeStyle = ctx.fillStyle = '#2058bc';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = ctx.lineCap = 'round';
  for (const stroke of strokes) {
    const [start, ...rest] = stroke;
    ctx.beginPath();
    if (!rest.length) {
      ctx.arc(start.x * width, start.y * height, 1.25, 0, 2 * Math.PI);
      ctx.fill();
      continue;
    }
    ctx.moveTo(start.x * width, start.y * height);
    for (const point of rest) ctx.lineTo(point.x * width, point.y * height);
    ctx.stroke();
  }
}

function point(event) {
  const rect = pad.getBoundingClientRect();
  const inside = value => Math.max(0, Math.min(1, value));
  return { x: inside((event.clientX - rect.left) / rect.width), y: inside((event.clientY - rect.top) / rect.height), t: Math.round(event.timeStamp) };
}

pad.addEventListener('pointerdown', event => {
  if (activePointer !== null || !event.isPrimary || event.button !== 0) return;
  event.preventDefault();
  activePointer = event.pointerId;
  pad.setPointerCapture(event.pointerId);
  strokes.push([point(event)]);
  draw();
});
pad.addEventListener('pointermove', event => {
  if (event.pointerId !== activePointer) return;
  const events = event.getCoalescedEvents?.();
  for (const sample of events?.length ? events : [event]) strokes.at(-1).push(point(sample));
  draw();
});
for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  pad.addEventListener(type, event => {
    if (event.pointerId !== activePointer) return;
    activePointer = null;
    if (type === 'pointercancel') strokes.pop();
    draw();
  });
}
new ResizeObserver(draw).observe(pad);
function clearInk() { strokes.length = 0; activePointer = null; draw(); }


document.getElementById('undo').onclick = () => {
  if (activePointer !== null) return;
  strokes.pop();
  draw();
};
document.getElementById('clear').onclick = clearInk;
</script>
</body>
</html>
