<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manuell bestilling</title>
<style>
:root{color-scheme:light;--page:#eef2ef;--paper:#fff;--ink:#162922;--muted:#52665c;--line:#d9e2dc;--green:#18563f;--dark:#102a23}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font:16px system-ui,sans-serif}
main{width:100%;height:100dvh;margin:auto;padding:0 0 env(safe-area-inset-bottom);display:grid;grid-template-rows:minmax(0,1fr) auto auto;gap:0}
h1,h2,p{margin:0}
h1{font-size:clamp(19px,5vw,24px);letter-spacing:-.035em}
h2{font-size:15px}
header,nav,footer,.heading,li,.sheet-top{display:flex;align-items:center;gap:8px}
header,.heading,footer,.sheet-top{justify-content:space-between}
button{min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:inherit;font:inherit;font-weight:650;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid #bf8b3b;outline-offset:2px}
.primary{flex:1;color:white;background:var(--green);border-color:var(--green);font-size:18px}
.notebook{position:relative;min-height:0;overflow:hidden;background:var(--dark)}
#ink{display:block;width:100%;height:100%;background:repeating-linear-gradient(to bottom,var(--dark) 0 33px,#2b493e 33px 34px)}
#ink{touch-action:none;cursor:crosshair;background-position:0 var(--ink-offset,0px)}
.tools{position:absolute;bottom:8px;left:8px;display:flex;gap:6px}
.tools button,#next-line{display:grid;place-items:center;width:44px;padding:0;color:#f4faf6;background:#214638;border-color:#3c6151}
#next-line{position:absolute;bottom:8px;right:8px;color:var(--dark);background:#d9eddf}
.icon-svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#cart{display:flex;flex-direction:column;gap:3px;min-height:0;max-height:26dvh;padding:4px 6px;background:var(--paper);overflow:auto;scrollbar-width:thin}
#corrections{display:flex;gap:4px;flex-wrap:wrap}
#corrections button{font-size:13px;min-height:38px;padding:4px 8px}
#suggestion,#status{font-size:13px;overflow-wrap:anywhere}
#suggestion{color:var(--muted)}
#status{color:#8a411e}
#all{border:0;min-height:32px;padding:2px 4px;font-size:13px;color:var(--green)}
ul{list-style:none;margin:0;padding:0}
li{padding:6px 7px;overflow-wrap:anywhere}
li>div{flex:1;min-width:0}
li small{display:block;margin-top:2px;color:var(--muted)}
#latest li{background:#e3f1e8;border-radius:9px}
.icon{min-width:44px;padding:0;font-size:20px}
.remove{color:#922f2f}
footer{color:var(--muted);font-size:14px;gap:5px;padding:3px 6px;background:var(--page)}
#ok{display:grid;place-items:center}
#ok[aria-busy=true] svg{opacity:.45}
#total{display:none}
footer .tool-icon{display:grid;place-items:center;width:44px;padding:0}
#total{white-space:nowrap;font-size:12px}
#all{align-self:flex-end}
@media(max-width:340px){#total{display:none}}
footer .print-icon{display:grid;place-items:center;min-width:48px;background:var(--green);border-color:var(--green);color:white}
.ink-preview{display:block;max-width:100%;max-height:90px;object-fit:contain;object-position:left}
dialog{width:min(100% - 16px,38rem);max-height:82dvh;margin:auto auto 8px;border:1px solid var(--line);border-radius:16px;padding:12px;color:var(--ink);background:var(--paper)}
dialog::backdrop{background:#102a2380}
.sheet-top{position:sticky;top:-12px;background:white;z-index:1;padding:4px 0}
.quick,#menu-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
.quick button{text-align:left;background:#e3f1e8;border-color:#c9e1d1}
#menu-list button{text-align:left;font-size:14px}
#sheet{display:none}
@media print{main,dialog{display:none!important}body{color:#000;background:#fff}#sheet{display:block}#sheet li{break-inside:avoid}#sheet .ink-preview{max-height:none}}
</style>
</head>
<body>
<main>
<div class="notebook">
<canvas id="ink" aria-label="Skriv med penn, finger eller mus"></canvas>
<div class="tools"><button id="undo" type="button" aria-label="Angre siste strek" title="Angre siste strek"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5m-5-5h11a4 4 0 0 1 4 4v2"/></svg></button></div>
<button id="next-line" type="button" aria-label="Bla opp og fortsett å skrive" title="Bla opp og fortsett å skrive"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-6 6 6-6 6 6"/></svg></button>
</div>
<section id="cart" aria-label="Bestilling" hidden>
<button id="all" type="button" hidden>Vis alle</button>
<p id="status" role="status" hidden></p>
<div id="corrections" aria-label="Mulige varer" hidden></div>
<ul id="latest"></ul>
</section>
<footer aria-label="Bestillingshandlinger">
<button id="clear" class="tool-icon" type="button" aria-label="Tøm felt" title="Tøm felt"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg></button>
<button id="ok" class="primary" type="button" aria-label="Legg til bestilling" title="Legg til bestilling"><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg></button>
<span id="total" hidden></span><button id="print" class="print-icon" type="button" aria-label="Skriv ut bestillingen" title="Skriv ut bestillingen" disabled><svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6M6 17H3V9h18v8h-3M6 14h12v7H6zM17 12h1"/></svg></button></footer>
</main>
<dialog id="basket"><div class="sheet-top"><h2>Alle varer</h2><form method="dialog"><button aria-label="Lukk bestillingen">×</button></form></div><ul id="basket-lines"></ul></dialog>
<section id="sheet"><h2>Kjøkkenbestilling</h2><ul id="print-lines"></ul></section>

    if (length>bestLength || priority>bestPriority) hits.clear();
    bestLength=length;
    bestPriority=priority;
    hits.set(JSON.stringify([nameOf(product),product.sizes]),product);
  }
  let end=0;
  while (end<text.length && fold(text.slice(0,end)).length<bestLength) end++;
  return [...hits.values()].map(product=>({product,tail:text.slice(end).trim()}));
}
function matchProduct(text) {
  const hits = productMatches(text);
  return hits.length===1 ? hits[0] : null;
}

function parseLine(source) {
  let text = normalize(source)
    .replace(/^((?:\d{1,2}\s*[x×]\s*)?)m\.?\s*(?=\d{1,2}(?!\d)(?:$|[\s,+−-]|[x×]\s*\d))/u,'$1medium ')
    .replace(/^((?:\d{1,2}\s*[x×]\s*)?\d{1,2})\s*m\.?(?=$|[\s,+−-]|[x×]\s*\d)/u,'$1 medium');
  const firstCount = text.match(/^(\d{1,2})\s*[x×]\s*/u);
  if (firstCount) text = text.slice(firstCount[0].length);
  const firstSize = text.match(/^(st\.?|stor|medium)\s+/u);
  const match = matchProduct(firstSize ? text.slice(firstSize[0].length) : text);
  if (!match) return null;
  const {product} = match;
  let tail = match.tail;
  const earlyCount = tail.match(/^[x×]\s*(\d{1,2})(?=$|[\s,+−-])/u);
  if (earlyCount) tail = tail.slice(earlyCount[0].length).trim();
  let size = firstSize?.[1].startsWith('st') ? 'stor' : firstSize?.[1] || '';
  const lastSize = tail.match(/^(st\.?|stor|medium(?!\s+(?:sos|saus)\b))(?=$|[\s,+−-]|[x×]\s*\d)/u);
  if (lastSize) {
    const value = lastSize[1].startsWith('st') ? 'stor' : 'medium';
    if (size && size !== value) return null;
    size = value;
    tail = tail.slice(lastSize[0].length).trim();
  }
  const menuSize = product.sizes.find(option => normalize(option) === size);
  if (size && !menuSize) return null;
  const notes = [];
  const sauce = tail.match(/^(med(?:ium(?:\s+(?:sos|saus))?)?|sterk(?:\s+saus)?|mild(?:\s+saus)?)(?=$|[\s,+−-]|[x×]\s*\d)/u);
  if (sauce) {
    notes.push(sauce[1].startsWith('med') ? 'Medium sos' : sauce[1].startsWith('sterk') ? 'Sterk saus' : 'Mild saus');
    tail = tail.slice(sauce[0].length).trim();
  }
  const lastCount = tail.match(/^[x×]\s*(\d{1,2})(?=$|[\s,+−-])/u);
  const counts = [firstCount,earlyCount,lastCount].filter(Boolean).map(value=>Number(value[1]));
  if (new Set(counts).size > 1) return null;
  const quantity = counts[0] ?? 1;
  if (quantity < 1) return null;
  if (lastCount) tail = tail.slice(lastCount[0].length).trim();
  if (tail && !/^(?:[,;+−-]|\d{1,2}\s*[x×]|uten\b|ingen\b|ekstra\b|soğansız\b|sogansiz\b)/u.test(tail)) return null;
  const pieces = tail.split(/[,;]|(?<![x×])\s+(?=[+−-]\s*\p{L})/u).map(note=>note.trim()).filter(Boolean);
  const onion = new Map();
  for (const piece of pieces) {
    const m = piece.match(/^(?:(\d{1,2})\s*[x×]\s*)?([+−-]\s*l[øo]k|(?:ingen|uten|ekstra)\s+l[øo]k|soğansız|sogansiz)(?:\s*[x×]\s*(\d{1,2}))?$/u);
    if (m) {
      if (m[1] && m[3] && Number(m[1])!==Number(m[3])) return null;
      const count = Number(m[1] || m[3] || quantity);
      const extra = m[2].startsWith('+') || m[2].startsWith('ekstra');
      if (!count || count > quantity || onion.has(extra) || count+(onion.get(!extra)||0)>quantity) return null;
      onion.set(extra,count);
      notes.push((count < quantity ? count + ' ' : '') + (extra ? 'Ekstra løk' : 'Uten løk'));
    } else {
      if (/\d\s*[x×]|[x×]\s*\d|^[−-]\s*$|^\+\s*$/u.test(piece)) return null;
      const note = piece.replace(/^[−-]\s*/u,'uten ').replace(/^\+\s*/u,'').replace(/^ingen\s+/u,'uten ');
      notes.push(note.replace(/^(?:chips|pommes(?: frites)?)(?: på toppen)?$/u,'pommes frites på toppen'));
    }
  }
  return { source, quantity, name: [menuSize,nameOf(product)].filter(Boolean).join(' '), notes };
}

function searchMenuLine(source) {
  if (source.includes('?') || source.length > 120) return null;
  const clean = normalize(source);
  const prefix = clean.match(/^(?:\d{1,2}\s*[x×]\s*)?(?:(?:st\.?|stor|medium)\s+)?/u)[0];
  const remainder = clean.slice(prefix.length);
  if (productMatches(remainder).length > 1) return null;
  const boundary = remainder.search(/[,;+−]|-(?=\s*\p{L})|\s+(?=(?:\d{1,2}\s*[x×]|[x×]\s*\d|st\.?\b|stor\b|medium\b|med\b|mild\b|sterk\b|uten\b|ingen\b|ekstra\b))/u);
  const head = boundary < 0 ? remainder : remainder.slice(0,boundary);
  const tail = boundary < 0 ? '' : remainder.slice(boundary).trim();
  if (!/^[\p{L}.\s]+$/u.test(head)) return null;
  const hints = fold(head).match(/[a-z]+/g) || [];
  if (hints.length < 2 || hints.length > 5 || hints.some(hint=>hint.length < 3)) return null;
  const matches = new Map();
  for (const product of catalog.products) {
    const words = menuWords(nameOf(product));
    const used = new Set();
    if (!hints.map((hint,index)=>index).sort((a,b)=>hints[b].length-hints[a].length).every(index=>{
      const word = words.find(token=>!used.has(token) && token.startsWith(hints[index]));
      if (!word) return false;
      used.add(word);
      return true;
    })) continue;
    const row = parseLine([prefix+product.name,tail].filter(Boolean).join(' '));
    if (row) matches.set(row.name,row);
  }
  return matches.size===1 ? matches.values().next().value : null;
}

function spellingDistance(a,b) {
  let previous = Array.from({length:b.length+1},(_,i)=>i);
  let earlier;
  for (let i=1;i<=a.length;i++) {
    const current = [i];
    for (let j=1;j<=b.length;j++) {
      current[j] = Math.min(previous[j]+1,current[j-1]+1,previous[j-1]+Number(a[i-1]!==b[j-1]));
      if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) {
        current[j] = Math.min(current[j], earlier[j-2]+1);
      }
    }
    earlier=previous;
    previous=current;
  }
  return previous[b.length];
}

function similarOrders(source) {
  const text = source.trim();
  if (!text || text.length>120) return [];
  const clean = normalize(text).replace(/\?+$/u,'').trim();
  // A handwritten 1 can be transcribed as I or l.
  const numeral = clean.match(/^(m\.?|st\.?|stor|medium)\s*[il](?=$|[\s,;+−-])/u);
  const pepperoni = clean.match(/^(m\.?|st\.?|stor|medium)\s*(?:pep\.?|pepperoni)(?=$|[\s,;+−-]|[x×]\s*\d)/u);
  if (numeral || pepperoni) {
    const shorthand = numeral || pepperoni;
    const size = shorthand[1].startsWith('m') ? 'Medium' : 'Stor';
    const rest = clean.slice(shorthand[0].length).trim();
    const replacement = size+' 1'+(rest ? ' '+rest : '')+(pepperoni ? ', bare pepperoni' : '');
    const row = parseLine(replacement);
    if (row) return [{row,replacement}];
  }
  const prefix = text.match(/^(?:(?:\d{1,2}\s*[x×]\s*)?(?:stor|medium)\s+|\d{1,2}\s*[x×]\s*)/iu)?.[0] || '';
  const remainder = text.slice(prefix.length).replace(/\?+$/u,'').trimEnd();
  const candidates = new Map();
  const exact = productMatches(normalize(remainder));
  if (exact.length>1) {
    return exact.map(({product,tail}) => {
      const replacement = [prefix+product.name,tail].filter(Boolean).join(' ');
      return {row:parseLine(replacement),replacement};
    }).filter(item=>item.row);
  }
  for (const word of remainder.matchAll(/[\p{L}]+(?=\s|[,;.+−-]|$)/gu)) {
    const end = word.index+word[0].length;
    const head = remainder.slice(0,end);
    if (!/^[\p{L} .-]+$/u.test(head)) break;
    const key = compactName(head);
    if (key.length<4 || key.length>24) continue;
    const maximum = key.length>=8 ? 2 : 1;
    for (const {product,spelling} of rules) {
      if (!/^[a-z]+$/.test(spelling) || Math.abs(spelling.length-key.length)>maximum) continue;
      const distance = spellingDistance(key,spelling);
      if (distance>maximum) continue;
      const replacement = prefix+product.name+remainder.slice(end);
      const row = parseLine(replacement);
      if (!row) continue;
      const score = distance / Math.max(key.length,spelling.length);
      const label = row.name;
      const other = candidates.get(label);
      if (!other || score<other.score) candidates.set(label,{row,replacement,score});
    }
  }
  return [...candidates.values()].sort((a,b)=>a.score-b.score).slice(0,2);
}

function renderCorrections(source,index) {
  const area = byId('corrections');
  const options = source ? similarOrders(source) : [];
  area.replaceChildren(...options.map(({row,replacement}) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = row.quantity+'× '+row.name+(row.notes.length ? ' · '+row.notes.join(' · ') : '');
    button.onclick = () => {
      if (transcript[index]!==source) return;
      transcript[index]=replacement;
      submitTranscript();
    };
    return button;
  }));
  area.hidden = !options.length;
}

function updateCartVisibility() {
  byId('cart').hidden = !cart.length && byId('status').hidden && byId('corrections').hidden;
}
function showStatus(message) {
  const status = byId('status');
  status.textContent = message;
  status.hidden = !message;
  updateCartVisibility();
}
let transcript = [];
byId('next-line').onclick = () => {
  if (pointer !== null || !strokes.length) return;
  const bottom = strokes.reduce((max,path) => path.reduce((end,p) => Math.max(end,p.y),max),pageTop);
  pageTop = Math.max(pageTop,Math.floor((bottom-44)/34)*34);
  redraw();
};
function clearTranscript() {
  transcript = [];
  renderCorrections('',0);
  showStatus('');
}
function resetEditor() {
  editing = null;
  clearTranscript();
  strokes = [];
  pageTop = 0;
  pointer = null;
  redraw();
}
byId('clear').onclick = resetEditor;
function inkSignature(paths, width, height) {
  const points = paths.flat();
  if (points.length < 2) return null;
  const xs = points.map(([x]) => x * width);
  const ys = points.map(([, y]) => y * height);
  const left = Math.min(...xs);
  const top = Math.min(...ys);
  const spanX = Math.max(...xs) - left;
  const spanY = Math.max(...ys) - top;
  const scale = Math.max(spanX, spanY);
  if (scale < 12) return null;
  const cells = new Set();
  for (const path of paths) {
    let previous;
    for (const [x, y] of path) {
      const current = [(x * width - left) * 23 / scale, (y * height - top) * 23 / scale];
      const start = previous || current;
      const steps = Math.max(1, Math.ceil(Math.hypot(current[0] - start[0], current[1] - start[1])));
      for (let step = 0; step <= steps; step++) {
        const px = Math.round(start[0] + (current[0] - start[0]) * step / steps);
        const py = Math.round(start[1] + (current[1] - start[1]) * step / steps);
        cells.add(px + 24 * py);
      }
      previous = current;
    }
  }
  return [...cells];
}

function inkDistance(first, second) {
  function averageNearest(source, target) {
    let sum = 0;
    for (const cell of source) {
      const x = cell % 24;
      const y = Math.floor(cell / 24);
      let nearest = Infinity;
      for (const other of target) {
        const dx = x - other % 24;
        const dy = y - Math.floor(other / 24);
        nearest = Math.min(nearest, dx * dx + dy * dy);
        if (nearest === 0) break;
      }
      sum += Math.sqrt(nearest);
    }
    return sum / source.length;
  }
  return (averageNearest(first, second) + averageNearest(second, first)) / 2;
}


function storedExamples(key) {
  try {
    const value = JSON.parse(localStorage.getItem(key) || '{}');
    return value && typeof value === 'object' ? value : {};
  } catch { return {}; }
}

function recognizeSavedProduct(paths) {
  const width = ink.clientWidth;
  if (!width) return null;
  const signature = inkSignature(paths.map(path => path.map(({x,y}) => [x,y])),width,1);
  if (!signature) return null;
  const scores = new Map();
  const legacyNames = {roll:'Kebabrull',plate:'Kebabtallerken',pizza:'Stor Pepperoni'};
  const legacy = storedExamples('bestilling-handwriting-v1');
  const modern = storedExamples('bestilling-ink-v2').product || {};
  function compare(product, examples, limit) {
    if (!product || !Array.isArray(examples)) return;
    for (const sample of examples.slice(-8)) {
      if (!Array.isArray(sample) || !sample.length || sample.length > 576 ||
          !sample.every(cell => Number.isInteger(cell) && cell >= 0 && cell < 576)) continue;
      const score = inkDistance(signature, sample);
      if (!scores.has(product) || score < scores.get(product).score) scores.set(product,{product,score,limit});
    }
  }
  for (const [key,name] of Object.entries(legacyNames)) compare(parseLine(name)?.name,legacy[key],2.2);
  for (const product of catalog.products) compare(nameOf(product),modern[product.id],1.8);
  const [best,second] = [...scores.values()].sort((a,b) => a.score-b.score);
  if (!best || best.score > best.limit || (second && second.score-best.score < .45)) return null;
  return {source:best.product,name:best.product,quantity:1,notes:[]};
}

const connection = new URLSearchParams(location.hash.slice(1));
const suppliedEndpoint = connection.get('gemini');
const suppliedToken = connection.get('access');
let recognition = null;
let readingInk = false;
try {
  if (suppliedEndpoint && suppliedToken) {
    const url = new URL(suppliedEndpoint);
    if (url.protocol === 'https:' && url.hostname.endsWith('.workers.dev') && !url.username && !url.password) {
      recognition = {endpoint:url.href,token:suppliedToken};
      sessionStorage.setItem('bestilling-gemini',JSON.stringify(recognition));
      history.replaceState(null,'',location.pathname+location.search);
    }
  } else {
    recognition = JSON.parse(sessionStorage.getItem('bestilling-gemini') || 'null');
  }
} catch {}

async function readInk(paths) {
  readingInk = true;
  const button = byId('ok');
  button.disabled = true;
  button.setAttribute('aria-busy','true');
  try {
    const image = inkImage(paths);
    const response = await fetch(recognition.endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json',Authorization:'Bearer '+recognition.token},
      body:JSON.stringify({image:image.split(',')[1]}),
      signal:AbortSignal.timeout(15000)
    });
    if (!response.ok) throw Error('Recognition failed');
    const {text} = await response.json();
    if (strokes !== paths || inkImage(paths) !== image) return;
    if (typeof text !== 'string' || !text.trim()) { showStatus('Kunne ikke lese håndskriften.'); return; }
    transcript = text.trim().split(/\r?\n/u).map(line=>line.trim()).filter(Boolean);
    submitTranscript();
  } catch {
    if (strokes === paths) showStatus('Kunne ikke lese nå. Håndskriften er beholdt.');
  } finally {
    readingInk = false;
    button.disabled = false;
    button.removeAttribute('aria-busy');
  }
}

function saveRows(rows) {
  if (editing) cart.splice(cart.indexOf(editing),1,rows[0]);
  else cart.push(...rows);
  latest = rows.at(-1);
  resetEditor();
  render();
}
function submitTranscript() {
  if (editing && transcript.length!==1) {
    showStatus('Skriv én varelinje når du redigerer.');
    return;
  }
  const rows = transcript.map(line=>line.includes('?') ? null : parseLine(line) || searchMenuLine(line));
  const unknown = rows.indexOf(null);
  if (unknown>=0) {
    renderCorrections(transcript[unknown],unknown);
    showStatus((byId('corrections').hidden ? 'Skriv linjen på nytt: ' : 'Mente du dette? Linje '+(unknown+1)+': ')+transcript[unknown]);
    return;
  }
  saveRows(rows);
}
byId('ok').onclick = () => {
  if (readingInk || pointer !== null) return;
  if (!strokes.length) { showStatus('Skriv bestillingen først.'); return; }
  if (transcript.length) { submitTranscript(); return; }
  if (recognition) { void readInk(strokes); return; }
  const row = recognizeSavedProduct(strokes);
  if (!row) { showStatus('Ukjent vare. Håndskriften er beholdt.'); return; }
  saveRows([row]);
};

let latest = null;
function makeItem(row, actionable) {
  const li = document.createElement('li');
  const content = document.createElement('div');
  const title = document.createElement('strong');
  title.textContent = row.quantity ? row.quantity + '× ' + row.name : row.name;
  content.append(title);
  if (row.notes.length) {
    const notes = document.createElement('small');
    notes.textContent = row.notes.join(' · ');
    content.append(notes);
  }
  if (row.image) {
    const image = document.createElement('img');
    image.className = 'ink-preview';
    image.alt = 'Håndskrevet merknad';
    image.src = row.image;
    content.append(image);
  }
  li.append(content);
  if (!actionable) return li;
  for (const [icon,label,css,action] of [
    ['✎','Endre','',() => {
      if (byId('basket').open) byId('basket').close();
      editing = row;
      clearTranscript();
      strokes = row.ink ? row.ink.map(path => [...path]) : [];
      pageTop = 0;
      redraw();
      render();
      showStatus('Endrer '+row.quantity+'× '+row.name+(row.notes.length ? ' · '+row.notes.join(' · ') : '')+'. Skriv hele linjen og trykk ✓.');
    }],
    ['×','Fjern','remove',() => {
      cart.splice(cart.indexOf(row),1);
      if (editing === row) resetEditor();
      if (latest === row) latest = cart.at(-1) || null;
      render();
    }]
  ]) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'icon ' + css;
    button.textContent = icon;
    button.setAttribute('aria-label',label+' '+row.name);
    button.onclick = action;
    li.append(button);
  }
  return li;
}
function render() {
  byId('latest').replaceChildren(...(latest ? [makeItem(latest,true)] : []));
  byId('basket-lines').replaceChildren(...[...cart].reverse().map(row=>makeItem(row,true)));
  byId('print-lines').replaceChildren(...cart.map(row=>makeItem(row,false)));
  byId('all').hidden = !cart.length;
  byId('total').hidden = !cart.length;
  updateCartVisibility();
  byId('all').textContent = 'Vis alle (' + cart.length + ')';
  const raw = cart.filter(row=>!row.quantity).length;
  byId('total').textContent = cart.reduce((sum,row)=>sum+row.quantity,0) + ' stk' + (raw ? ' · ' + raw + ' notat' : '');
  byId('print').disabled = !cart.length;
  byId('ok').setAttribute('aria-label',editing ? 'Lagre endring' : 'Legg til bestilling');
}
byId('all').onclick = () => byId('basket').showModal();
byId('print').onclick = () => window.print();
render();
</script>
</body>
